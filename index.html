/* =========================================================
   WORLD SETTINGS
========================================================= */

const CHUNK_SIZE = 240;

const LOAD_RADIUS = 2;

const UNLOAD_RADIUS = 3;

const WORLD_SEED = 72831;

const chunks =
    new Map();


/* =========================================================
   SEEDED RANDOM
========================================================= */

function hash2D(x, z) {

    let h =
        Math.sin(
            x * 127.1 +
            z * 311.7 +
            WORLD_SEED
        ) *
        43758.5453123;

    return h -
        Math.floor(h);
}


function randomRange(
    x,
    z,
    min,
    max
) {

    return min +
        hash2D(x, z) *
        (max - min);
}


/* =========================================================
   SMOOTH NOISE
========================================================= */

function smoothNoise(
    x,
    z
) {

    const x0 =
        Math.floor(x);

    const z0 =
        Math.floor(z);

    const x1 =
        x0 + 1;

    const z1 =
        z0 + 1;


    const sx =
        x - x0;

    const sz =
        z - z0;


    const a =
        hash2D(x0, z0);

    const b =
        hash2D(x1, z0);

    const c =
        hash2D(x0, z1);

    const d =
        hash2D(x1, z1);


    const u =
        sx * sx *
        (3 - 2 * sx);

    const v =
        sz * sz *
        (3 - 2 * sz);


    const top =
        THREE.MathUtils.lerp(
            a,
            b,
            u
        );

    const bottom =
        THREE.MathUtils.lerp(
            c,
            d,
            u
        );


    return THREE.MathUtils.lerp(
        top,
        bottom,
        v
    );
}


/* =========================================================
   TERRAIN HEIGHT
========================================================= */

function terrainHeight(
    x,
    z
) {

    const large =
        smoothNoise(
            x * 0.0017,
            z * 0.0017
        ) * 24;


    const medium =
        smoothNoise(
            x * 0.004,
            z * 0.004
        ) * 9;


    const small =
        smoothNoise(
            x * 0.015,
            z * 0.015
        ) * 2;


    return (
        large +
        medium +
        small
    ) - 12;
}


/* =========================================================
   BIOME
========================================================= */

function getBiome(
    x,
    z
) {

    const distance =
        Math.sqrt(
            x * x +
            z * z
        );


    if (
        distance < 650
    ) {

        return "city";
    }


    const noise =
        smoothNoise(
            x * 0.0008,
            z * 0.0008
        );


    if (
        noise > 0.72
    ) {

        return "mountain";
    }


    if (
        noise < 0.25
    ) {

        return "coast";
    }


    return "countryside";
}


/* =========================================================
   MATERIALS
========================================================= */

const grassMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x526e4a,
        roughness: 1
    });


const countrysideMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x607a4c,
        roughness: 1
    });


const mountainMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x5c625c,
        roughness: 1
    });


const sandMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xb7a36d,
        roughness: 1
    });


const roadMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x25272b,
        roughness: .92,
        metalness: .05
    });


const sidewalkMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x85878a,
        roughness: .95
    });


const whiteLineMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xf4f4ef,
        roughness: .8
    });


const yellowLineMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xe4c23c,
        roughness: .8
    });


/* =========================================================
   ROAD SYSTEM
========================================================= */

function getRoadAt(
    x,
    z
) {

    const distance =
        Math.sqrt(
            x * x +
            z * z
        );


    /*
       CITY ROADS
    */

    if (
        distance < 850
    ) {

        const majorSpacing = 240;


        const majorX =
            Math.abs(
                x -
                Math.round(
                    x / majorSpacing
                ) *
                majorSpacing
            );


        const majorZ =
            Math.abs(
                z -
                Math.round(
                    z / majorSpacing
                ) *
                majorSpacing
            );


        if (
            majorX < 13
        ) {

            return {
                width: 26,
                type: "major",
                axis: "z"
            };
        }


        if (
            majorZ < 13
        ) {

            return {
                width: 26,
                type: "major",
                axis: "x"
            };
        }


        const citySpacing = 80;


        const cityX =
            Math.abs(
                x -
                Math.round(
                    x / citySpacing
                ) *
                citySpacing
            );


        const cityZ =
            Math.abs(
                z -
                Math.round(
                    z / citySpacing
                ) *
                citySpacing
            );


        if (
            cityX < 6.5
        ) {

            return {
                width: 13,
                type: "city",
                axis: "z"
            };
        }


        if (
            cityZ < 6.5
        ) {

            return {
                width: 13,
                type: "city",
                axis: "x"
            };
        }
    }


    /*
       HIGHWAYS
    */

    const highwaySpacing =
        480;


    const highwayX =
        Math.abs(
            x -
            Math.round(
                x / highwaySpacing
            ) *
            highwaySpacing
        );


    const highwayZ =
        Math.abs(
            z -
            Math.round(
                z / highwaySpacing
            ) *
            highwaySpacing
        );


    if (
        highwayX < 8
    ) {

        return {
            width: 18,
            type: "highway",
            axis: "z"
        };
    }


    if (
        highwayZ < 8
    ) {

        return {
            width: 18,
            type: "highway",
            axis: "x"
        };
    }


    return null;
}


/* =========================================================
   ROAD CENTER CHECKS
========================================================= */

function roadExistsOnX(
    z
) {

    const major =
        Math.round(
            z / 240
        ) * 240;


    if (
        Math.abs(
            z - major
        ) < 13
    ) {

        return {
            width: 26,
            type: "major"
        };
    }


    const city =
        Math.round(
            z / 80
        ) * 80;


    if (
        Math.abs(
            z - city
        ) < 6.5
    ) {

        if (
            Math.abs(city) < 850
        ) {

            return {
                width: 13,
                type: "city"
            };
        }
    }


    const highway =
        Math.round(
            z / 480
        ) * 480
    ;


    if (
        Math.abs(
            z - highway
        ) < 8
    ) {

        return {
            width: 18,
            type: "highway"
        };
    }


    return null;
}


function roadExistsOnZ(
    x
) {

    const major =
        Math.round(
            x / 240
        ) * 240;


    if (
        Math.abs(
            x - major
        ) < 13
    ) {

        return {
            width: 26,
            type: "major"
        };
    }


    const city =
        Math.round(
            x / 80
        ) * 80;


    if (
        Math.abs(
            x - city
        ) < 6.5
    ) {

        if (
            Math.abs(city) < 850
        ) {

            return {
                width: 13,
                type: "city"
            };
        }
    }


    const highway =
        Math.round(
            x / 480
        ) * 480
    ;


    if (
        Math.abs(
            x - highway
        ) < 8
    ) {

        return {
            width: 18,
            type: "highway"
        };
    }


    return null;
}


/* =========================================================
   TERRAIN CHUNK
========================================================= */

function createTerrainChunk(
    cx,
    cz
) {

    const group =
        new THREE.Group();


    const geometry =
        new THREE.PlaneGeometry(
            CHUNK_SIZE,
            CHUNK_SIZE,
            24,
            24
        );


    geometry.rotateX(
        -Math.PI / 2
    );


    const positions =
        geometry.attributes.position;


    for (
        let i = 0;
        i < positions.count;
        i++
    ) {

        const lx =
            positions.getX(i);

        const lz =
            positions.getZ(i);


        const wx =
            cx * CHUNK_SIZE +
            lx +
            CHUNK_SIZE / 2;


        const wz =
            cz * CHUNK_SIZE +
            lz +
            CHUNK_SIZE / 2;


        positions.setY(
            i,
            terrainHeight(
                wx,
                wz
            )
        );
    }


    geometry.computeVertexNormals();


    const centerX =
        cx * CHUNK_SIZE +
        CHUNK_SIZE / 2;


    const centerZ =
        cz * CHUNK_SIZE +
        CHUNK_SIZE / 2;


    const biome =
        getBiome(
            centerX,
            centerZ
        );


    let material =
        grassMaterial;


    if (
        biome === "countryside"
    ) {

        material =
            countrysideMaterial;
    }


    if (
        biome === "mountain"
    ) {

        material =
            mountainMaterial;
    }


    if (
        biome === "coast"
    ) {

        material =
            sandMaterial;
    }


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.receiveShadow = true;


    group.add(
        mesh
    );


    return group;
}


/* =========================================================
   ROAD SURFACE
========================================================= */

function createRoadSurface(
    group,
    centerX,
    centerZ,
    axis,
    width,
    length
) {

    /*
       The road geometry uses WORLD coordinates.

       This is important because all chunks are kept at
       the origin. The terrain itself also uses world
       coordinates inside its geometry.
    */

    const geometry =
        new THREE.PlaneGeometry(
            axis === "x"
                ? length
                : width,

            axis === "x"
                ? width
                : length,

            24,
            8
        );


    geometry.rotateX(
        -Math.PI / 2
    );


    const positions =
        geometry.attributes.position;


    for (
        let i = 0;
        i < positions.count;
        i++
    ) {

        const lx =
            positions.getX(i);

        const lz =
            positions.getZ(i);


        /*
           Convert local road coordinates
           into actual world coordinates.
        */

        const wx =
            centerX + lx;

        const wz =
            centerZ + lz;


        positions.setX(
            i,
            wx
        );


        positions.setZ(
            i,
            wz
        );


        positions.setY(
            i,
            terrainHeight(
                wx,
                wz
            ) +
            0.18
        );
    }


    geometry.computeVertexNormals();


    const mesh =
        new THREE.Mesh(
            geometry,
            roadMaterial
        );


    mesh.receiveShadow = true;


    group.add(
        mesh
    );


    return mesh;
}


/* =========================================================
   ROAD LINE
========================================================= */

function addRoadLine(
    group,
    centerX,
    centerZ,
    axis,
    offset,
    length,
    thickness,
    material
) {

    const geometry =
        new THREE.PlaneGeometry(
            axis === "x"
                ? length
                : thickness,

            axis === "x"
                ? thickness
                : length
        );


    geometry.rotateX(
        -Math.PI / 2
    );


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    let x =
        centerX;

    let z =
        centerZ;


    if (
        axis === "x"
    ) {

        z += offset;

    } else {

        x += offset;
    }


    mesh.position.set(
        x,
        terrainHeight(
            x,
            z
        ) +
        0.29,
        z
    );


    group.add(
        mesh
    );
}


/* =========================================================
   DASHED CENTER LINE
========================================================= */

function addDashedLine(
    group,
    centerX,
    centerZ,
    axis,
    length,
    thickness,
    material
) {

    const dashLength = 5;

    const gapLength = 9;


    for (
        let p = -length / 2;
        p < length / 2;
        p += dashLength + gapLength
    ) {

        let x =
            centerX;

        let z =
            centerZ;


        if (
            axis === "x"
        ) {

            x +=
                p +
                dashLength / 2;

        } else {

            z +=
                p +
                dashLength / 2;
        }


        const geometry =
            new THREE.PlaneGeometry(
                axis === "x"
                    ? dashLength
                    : thickness,

                axis === "x"
                    ? thickness
                    : dashLength
            );


        geometry.rotateX(
            -Math.PI / 2
        );


        const mesh =
            new THREE.Mesh(
                geometry,
                material
            );


        mesh.position.set(
            x,
            terrainHeight(
                x,
                z
            ) +
            0.31,
            z
        );


        group.add(
            mesh
        );
    }
}


/* =========================================================
   SIDEWALK
========================================================= */

function createSidewalk(
    group,
    centerX,
    centerZ,
    axis,
    roadWidth,
    length
) {

    const sidewalkWidth =
        3.5;


    const sideOffset =
        roadWidth / 2 +
        sidewalkWidth / 2;


    for (
        const side of [-1, 1]
    ) {

        let x =
            centerX;

        let z =
            centerZ;


        if (
            axis === "x"
        ) {

            z +=
                side *
                sideOffset;

        } else {

            x +=
                side *
                sideOffset;
        }


        const geometry =
            new THREE.BoxGeometry(

                axis === "x"
                    ? length
                    : sidewalkWidth,

                0.22,

                axis === "x"
                    ? sidewalkWidth
                    : length
            );


        const mesh =
            new THREE.Mesh(
                geometry,
                sidewalkMaterial
            );


        mesh.position.set(
            x,
            terrainHeight(
                x,
                z
            ) +
            0.25,
            z
        );


        mesh.receiveShadow = true;


        group.add(
            mesh
        );
    }
}


/* =========================================================
   COMPLETE ROAD
========================================================= */

function createRoad(
    group,
    centerX,
    centerZ,
    axis,
    width,
    length,
    type
) {

    createRoadSurface(
        group,
        centerX,
        centerZ,
        axis,
        width,
        length
    );


    const edgeOffset =
        width / 2 -
        0.8;


    addRoadLine(
        group,
        centerX,
        centerZ,
        axis,
        -edgeOffset,
        length,
        0.3,
        whiteLineMaterial
    );


    addRoadLine(
        group,
        centerX,
        centerZ,
        axis,
        edgeOffset,
        length,
        0.3,
        whiteLineMaterial
    );


    if (
        type === "major" ||
        type === "highway"
    ) {

        addDashedLine(
            group,
            centerX -
            (
                axis === "z"
                    ? 0.55
                    : 0
            ),
            centerZ -
            (
                axis === "x"
                    ? 0.55
                    : 0
            ),
            axis,
            length,
            0.35,
            yellowLineMaterial
        );


        addDashedLine(
            group,
            centerX +
            (
                axis === "z"
                    ? 0.55
                    : 0
            ),
            centerZ +
            (
                axis === "x"
                    ? 0.55
                    : 0
            ),
            axis,
            length,
            0.35,
            yellowLineMaterial
        );
    }


    if (
        type === "city"
    ) {

        addDashedLine(
            group,
            centerX,
            centerZ,
            axis,
            length,
            0.25,
            yellowLineMaterial
        );


        createSidewalk(
            group,
            centerX,
            centerZ,
            axis,
            width,
            length
        );
    }
}


/* =========================================================
   CHUNK ROAD GENERATION
========================================================= */

function generateRoads(
    group,
    cx,
    cz
) {

    const minX =
        cx * CHUNK_SIZE;

    const minZ =
        cz * CHUNK_SIZE;


    const maxX =
        minX +
        CHUNK_SIZE;

    const maxZ =
        minZ +
        CHUNK_SIZE;


    /*
       HORIZONTAL ROADS
    */

    const firstHorizontal =
        Math.floor(
            minZ / 80
        ) * 80;


    for (
        let z = firstHorizontal;
        z <= maxZ + 80;
        z += 80
    ) {

        const info =
            roadExistsOnX(
                z
            );


        if (
            !info
        ) {
            continue;
        }


        if (
            z < minZ - 80 ||
            z > maxZ + 80
        ) {
            continue;
        }


        createRoad(
            group,
            minX +
            CHUNK_SIZE / 2,
            z,
            "x",
            info.width,
            CHUNK_SIZE + 40,
            info.type
        );
    }


    /*
       VERTICAL ROADS
    */

    const firstVertical =
        Math.floor(
            minX / 80
        ) * 80;


    for (
        let x = firstVertical;
        x <= maxX + 80;
        x += 80
    ) {

        const info =
            roadExistsOnZ(
                x
            );


        if (
            !info
        ) {
            continue;
        }


        if (
            x < minX - 80 ||
            x > maxX + 80
        ) {
            continue;
        }


        createRoad(
            group,
            x,
            minZ +
            CHUNK_SIZE / 2,
            "z",
            info.width,
            CHUNK_SIZE + 40,
            info.type
        );
    }
}


/* =========================================================
   BUILDINGS
========================================================= */

const buildingFiles = [

    "large-building.glb",
    "store.glb",
    "apartment.glb",
    "large-building-2.glb",
    "bank.glb"

];


const buildingTemplates = [];

let buildingsReady = false;


/* =========================================================
   LOAD BUILDINGS
========================================================= */

async function loadBuildings() {

    for (
        const file of buildingFiles
    ) {

        try {

            const gltf =
                await loader.loadAsync(
                    "./assets/buildings/" +
                    file
                );


            const root =
                gltf.scene;


            root.traverse(
                object => {

                    if (
                        object.isMesh
                    ) {

                        object.castShadow =
                            true;

                        object.receiveShadow =
                            true;
                    }
                }
            );


            const box =
                new THREE.Box3()
                    .setFromObject(
                        root
                    );


            const size =
                new THREE.Vector3();


            const center =
                new THREE.Vector3();


            box.getSize(
                size
            );


            box.getCenter(
                center
            );


            root.position.x -=
                center.x;


            root.position.z -=
                center.z;


            root.position.y -=
                box.min.y;


            const maxDimension =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );


            let targetHeight =
                18;


            if (
                file.includes("large")
            ) {

                targetHeight =
                    28;

            } else if (
                file.includes("apartment")
            ) {

                targetHeight =
                    22;
            }


            const scale =
                targetHeight /
                maxDimension;


            root.scale.setScalar(
                scale
            );


            const scaledWidth =
                size.x *
                scale;


            const scaledDepth =
                size.z *
                scale;


            const scaledHeight =
                size.y *
                scale;


            buildingTemplates.push({

                model: root,
                width: scaledWidth,
                depth: scaledDepth,
                height: scaledHeight

            });

        }

        catch (
            error
        ) {

            console.warn(
                "Could not load building:",
                file,
                error
            );
        }
    }


    buildingsReady =
        true;
}


/* =========================================================
   BUILDING ROAD CHECK
========================================================= */

function buildingTouchesRoad(
    x,
    z,
    halfX,
    halfZ,
    rotation
) {

    const projectedX =
        halfX *
        Math.abs(
            Math.cos(rotation)
        ) +

        halfZ *
        Math.abs(
            Math.sin(rotation)
        );


    const projectedZ =
        halfX *
        Math.abs(
            Math.sin(rotation)
        ) +

        halfZ *
        Math.abs(
            Math.cos(rotation)
        );


    const sample =
        15;


    for (
        let dx = -sample;
        dx <= sample;
        dx += 5
    ) {

        for (
            let dz = -sample;
            dz <= sample;
            dz += 5
        ) {

            const road =
                getRoadAt(
                    x + dx,
                    z + dz
                );


            if (
                !road
            ) {
                continue;
            }


            if (
                road.axis === "x"
            ) {

                if (
                    Math.abs(z + dz) <
                    road.width / 2 +
                    projectedZ +
                    3
                ) {

                    return true;
                }

            } else {

                if (
                    Math.abs(x + dx) <
                    road.width / 2 +
                    projectedX +
                    3
                ) {

                    return true;
                }
            }
        }
    }


    return false;
}


/* =========================================================
   ADD BUILDING
========================================================= */

function addBuilding(
    group,
    template,
    x,
    z,
    scale,
    rotation
) {

    const building =
        template.model.clone(
            true
        );


    building.scale.multiplyScalar(
        scale
    );


    building.rotation.y =
        rotation;


    building.position.set(
        x,
        terrainHeight(
            x,
            z
        ),
        z
    );


    group.add(
        building
    );
}


/* =========================================================
   GENERATE BUILDINGS
========================================================= */

function generateBuildings(
    group,
    cx,
    cz
) {

    if (
        !buildingsReady ||
        buildingTemplates.length === 0
    ) {

        return;
    }


    const centerX =
        cx * CHUNK_SIZE +
        CHUNK_SIZE / 2;


    const centerZ =
        cz * CHUNK_SIZE +
        CHUNK_SIZE / 2;


    const biome =
        getBiome(
            centerX,
            centerZ
        );


    let count =
        biome === "city"
            ? 9
            : 2;


    if (
        biome === "mountain"
    ) {

        count = 0;
    }


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const seedX =
            cx * 1000 +
            i * 71 +
            17;


        const seedZ =
            cz * 1000 +
            i * 113 +
            29;


        const x =
            cx * CHUNK_SIZE +
            randomRange(
                seedX,
                seedZ,
                18,
                CHUNK_SIZE - 18
            );


        const z =
            cz * CHUNK_SIZE +
            randomRange(
                seedZ,
                seedX,
                18,
                CHUNK_SIZE - 18
            );


        const template =
            buildingTemplates[
                Math.floor(
                    hash2D(
                        seedX,
                        seedZ
                    ) *
                    buildingTemplates.length
                )
            ];


        if (
            !template
        ) {
            continue;
        }


        const rotations = [
            0,
            Math.PI / 2,
            Math.PI,
            Math.PI * 1.5
        ];


        const rotation =
            rotations[
                Math.floor(
                    hash2D(
                        seedX + 50,
                        seedZ + 80
                    ) *
                    rotations.length
                )
            ];


        const scale =
            0.75 +
            hash2D(
                seedX + 100,
                seedZ + 120
            ) *
            0.5;


        const halfX =
            template.width *
            scale /
            2;


        const halfZ =
            template.depth *
            scale /
            2;


        if (
            buildingTouchesRoad(
                x,
                z,
                halfX,
                halfZ,
                rotation
            )
        ) {

            continue;
        }


        addBuilding(
            group,
            template,
            x,
            z,
            scale,
            rotation
        );
    }
}


/* =========================================================
   TREES
========================================================= */

function createTree(
    group,
    x,
    z,
    scale
) {

    const trunk =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .18 * scale,
                .28 * scale,
                2.5 * scale,
                7
            ),

            new THREE.MeshStandardMaterial({
                color: 0x5b3e29,
                roughness: 1
            })
        );


    trunk.position.set(
        x,
        terrainHeight(
            x,
            z
        ) +
        1.25 * scale,
        z
    );


    trunk.castShadow =
        true;


    group.add(
        trunk
    );


    const leaves =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                1.5 * scale,
                8,
                6
            ),

            new THREE.MeshStandardMaterial({
                color: 0x355c35,
                roughness: 1
            })
        );


    leaves.position.set(
        x,
        terrainHeight(
            x,
            z
        ) +
        3.1 * scale,
        z
    );


    leaves.castShadow =
        true;


    group.add(
        leaves
    );
}


/* =========================================================
   GENERATE TREES
========================================================= */

function generateTrees(
    group,
    cx,
    cz
) {

    const startX =
        cx * CHUNK_SIZE;


    const startZ =
        cz * CHUNK_SIZE;


    const biome =
        getBiome(
            startX +
            CHUNK_SIZE / 2,
            startZ +
            CHUNK_SIZE / 2
        );


    let amount =
        biome === "city"
            ? 8
            : 18;


    if (
        biome === "mountain"
    ) {

        amount = 12;
    }


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const sx =
            cx * 200 +
            cz * 37 +
            i * 71;


        const sz =
            cz * 200 +
            cx * 43 +
            i * 29;


        const x =
            startX +
            randomRange(
                sx,
                sz,
                5,
                CHUNK_SIZE - 5
            );


        const z =
            startZ +
            randomRange(
                sz,
                sx,
                5,
                CHUNK_SIZE - 5
            );


        if (
            getRoadAt(
                x,
                z
            )
        ) {

            continue;
        }


        if (
            biome === "city" &&
            hash2D(
                sx,
                sz
            ) > .35
        ) {

            continue;
        }


        const scale =
            0.7 +
            hash2D(
                sx + 100,
                sz + 100
            ) *
            1.1;


        createTree(
            group,
            x,
            z,
            scale
        );
    }
}


/* =========================================================
   MOUNTAINS
========================================================= */

function generateMountains(
    group,
    cx,
    cz
) {

    const centerX =
        cx * CHUNK_SIZE +
        CHUNK_SIZE / 2;


    const centerZ =
        cz * CHUNK_SIZE +
        CHUNK_SIZE / 2;


    if (
        getBiome(
            centerX,
            centerZ
        ) !== "mountain"
    ) {

        return;
    }


    for (
        let i = 0;
        i < 3;
        i++
    ) {

        const x =
            cx * CHUNK_SIZE +
            randomRange(
                cx * 80 + i,
                cz * 90 + i,
                15,
                CHUNK_SIZE - 15
            );


        const z =
            cz * CHUNK_SIZE +
            randomRange(
                cz * 80 + i,
                cx * 90 + i,
                15,
                CHUNK_SIZE - 15
            );


        const height =
            30 +
            hash2D(
                x,
                z
            ) *
            70;


        const radius =
            20 +
            hash2D(
                z,
                x
            ) *
            35;


        const mountain =
            new THREE.Mesh(

                new THREE.ConeGeometry(
                    radius,
                    height,
                    8
                ),

                mountainMaterial
            );


        mountain.position.set(
            x,
            terrainHeight(
                x,
                z
            ) +
            height / 2,
            z
        );


        mountain.castShadow =
            true;

        mountain.receiveShadow =
            true;


        group.add(
            mountain
        );
    }
}


/* =========================================================
   WATER
========================================================= */

function generateWater(
    group,
    cx,
    cz
) {

    const centerX =
        cx * CHUNK_SIZE +
        CHUNK_SIZE / 2;


    const centerZ =
        cz * CHUNK_SIZE +
        CHUNK_SIZE / 2;


    const coast =
        Math.sin(
            centerX *
            .0007
        ) +

        Math.cos(
            centerZ *
            .0006
        );


    if (
        coast < 1.55
    ) {

        return;
    }


    const waterMaterial =
        new THREE.MeshStandardMaterial({

            color: 0x3e83a5,

            roughness: .2,

            metalness: .1,

            transparent: true,

            opacity: .88
        });


    const water =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                CHUNK_SIZE,
                CHUNK_SIZE
            ),

            waterMaterial
        );


    water.rotation.x =
        -Math.PI / 2;


    water.position.set(
        centerX,
        0,
        centerZ
    );


    group.add(
        water
    );
}


/* =========================================================
   GENERATE CHUNK
========================================================= */

function generateChunk(
    cx,
    cz
) {

    const key =
        cx + "," + cz;


    if (
        chunks.has(key)
    ) {

        return;
    }


    const group =
        new THREE.Group();


    group.userData.cx =
        cx;

    group.userData.cz =
        cz;


    /*
       TERRAIN
    */

    group.add(
        createTerrainChunk(
            cx,
            cz
        )
    );


    /*
       ROADS
    */

    generateRoads(
        group,
        cx,
        cz
    );


    /*
       BUILDINGS
    */

    generateBuildings(
        group,
        cx,
        cz
    );


    /*
       TREES
    */

    generateTrees(
        group,
        cx,
        cz
    );


    /*
       MOUNTAINS
    */

    generateMountains(
        group,
        cx,
        cz
    );


    /*
       WATER
    */

    generateWater(
        group,
        cx,
        cz
    );


    scene.add(
        group
    );


    chunks.set(
        key,
        group
    );
}


/* =========================================================
   DISPOSE CHUNK
========================================================= */

function disposeGroup(
    group
) {

    group.traverse(
        object => {

            if (
                object.geometry
            ) {

                object.geometry.dispose();
            }
        }
    );
}


/* =========================================================
   UNLOAD FAR CHUNKS
========================================================= */

function unloadFarChunks(
    playerX,
    playerZ
) {

    const playerCX =
        Math.floor(
            playerX /
            CHUNK_SIZE
        );


    const playerCZ =
        Math.floor(
            playerZ /
            CHUNK_SIZE
        );


    for (
        const [
            key,
            group
        ]
        of chunks
    ) {

        const dx =
            Math.abs(
                group.userData.cx -
                playerCX
            );


        const dz =
            Math.abs(
                group.userData.cz -
                playerCZ
            );


        if (
            dx >
            UNLOAD_RADIUS ||
            dz >
            UNLOAD_RADIUS
        ) {

            scene.remove(
                group
            );


            disposeGroup(
                group
            );


            chunks.delete(
                key
            );
        }
    }
}


/* =========================================================
   WORLD STREAMING
========================================================= */

let lastChunkX =
    null;

let lastChunkZ =
    null;


function updateWorldStreaming() {

    const playerX =
        carRoot.position.x;


    const playerZ =
        carRoot.position.z;


    const cx =
        Math.floor(
            playerX /
            CHUNK_SIZE
        );


    const cz =
        Math.floor(
            playerZ /
            CHUNK_SIZE
        );


    if (
        cx === lastChunkX &&
        cz === lastChunkZ
    ) {

        return;
    }


    lastChunkX =
        cx;

    lastChunkZ =
        cz;


    const required = [];


    for (
        let x = -LOAD_RADIUS;
        x <= LOAD_RADIUS;
        x++
    ) {

        for (
            let z = -LOAD_RADIUS;
            z <= LOAD_RADIUS;
            z++
        ) {

            required.push({

                cx:
                    cx + x,

                cz:
                    cz + z,

                distance:
                    Math.abs(x) +
                    Math.abs(z)

            });
        }
    }


    required.sort(
        (a, b) =>
            a.distance -
            b.distance
    );


    for (
        const chunk of required
    ) {

        generateChunk(
            chunk.cx,
            chunk.cz
        );
    }


    unloadFarChunks(
        playerX,
        playerZ
    );
}


/* =========================================================
   CAR
========================================================= */

let carRoot =
    new THREE.Group();


scene.add(
    carRoot
);


let carModel =
    null;


let carLoaded =
    false;


const carURL =
    "https://jaiveginati-creator.github.io/Horizon/electric-car.glb";


/* =========================================================
   LOAD CAR
========================================================= */

async function loadCar() {

    try {

        const gltf =
            await loader.loadAsync(
                carURL
            );


        carModel =
            gltf.scene;


        carModel.traverse(
            object => {

                if (
                    object.isMesh
                ) {

                    object.castShadow =
                        true;

                    object.receiveShadow =
                        true;
                }
            }
        );


        const box =
            new THREE.Box3()
                .setFromObject(
                    carModel
                );


        const size =
            new THREE.Vector3();


        box.getSize(
            size
        );


        const maxDimension =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        const scale =
            4.9 /
            maxDimension;


        carModel.scale.setScalar(
            scale
        );


        const correctedBox =
            new THREE.Box3()
                .setFromObject(
                    carModel
                );


        const center =
            new THREE.Vector3();


        correctedBox.getCenter(
            center
        );


        carModel.position.x -=
            center.x;


        carModel.position.z -=
            center.z;


        carModel.position.y -=
            correctedBox.min.y;


        carModel.rotation.y =
            Math.PI / 2;


        carRoot.add(
            carModel
        );


        carLoaded =
            true;


        /*
           Start on the major road.

           The root is lifted above the terrain so the
           bottom of the car does not spawn underneath
           the road surface.
        */

        const startX =
            0;

        const startZ =
            40;


        carRoot.position.set(
            startX,
            terrainHeight(
                startX,
                startZ
            ) +
            0.55,
            startZ
        );

    }

    catch (
        error
    ) {

        console.error(
            "CAR LOAD ERROR",
            error
        );
    }
}


/* =========================================================
   INPUT
========================================================= */

const keys = {};


window.addEventListener(
    "keydown",
    event => {

        keys[
            event.key.toLowerCase()
        ] = true;


        if (
            event.key.toLowerCase()
            === "n"
        ) {

            toggleNight();
        }
    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[
            event.key.toLowerCase()
        ] = false;
    }
);


/* =========================================================
   DRIVING
========================================================= */

let speed = 0;

let steering = 0;


const MAX_SPEED =
    0.75;

const MAX_REVERSE =
    0.28;

const ACCELERATION =
    0.008;

const REVERSE_ACCELERATION =
    0.005;

const BRAKE_POWER =
    0.035;

const FRICTION =
    0.006;

const MAX_STEERING =
    0.55;

const STEERING_RESPONSE =
    0.14;

const TURN_RATE =
    0.035;


/* =========================================================
   UPDATE CAR
========================================================= */

function updateCar() {

    if (
        !carLoaded
    ) {

        return;
    }


    /*
       ACCELERATION
    */

    if (
        keys["w"] ||
        keys["arrowup"]
    ) {

        speed +=
            ACCELERATION;

    }

    else if (
        keys["s"] ||
        keys["arrowdown"]
    ) {

        if (
            speed > 0
        ) {

            speed -=
                BRAKE_POWER;

        }

        else {

            speed -=
                REVERSE_ACCELERATION;
        }

    }

    else {

        if (
            speed > 0
        ) {

            speed -=
                FRICTION;


            if (
                speed < 0
            ) {

                speed = 0;
            }

        }

        else if (
            speed < 0
        ) {

            speed +=
                FRICTION;


            if (
                speed > 0
            ) {

                speed = 0;
            }
        }
    }


    speed =
        THREE.MathUtils.clamp(
            speed,
            -MAX_REVERSE,
            MAX_SPEED
        );


    /*
       STEERING
    */

    let targetSteering =
        0;


    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {

        targetSteering =
            MAX_STEERING;
    }


    if (
        keys["d"] ||
        keys["arrowright"]
    ) {

        targetSteering =
            -MAX_STEERING;
    }


    steering =
        THREE.MathUtils.lerp(
            steering,
            targetSteering,
            STEERING_RESPONSE
        );


    /*
       TURN
    */

    if (
        Math.abs(speed) >
        0.02
    ) {

        const direction =
            speed >= 0
                ? 1
                : -1;


        carRoot.rotation.y +=
            steering *
            TURN_RATE *
            Math.abs(speed) *
            direction;
    }


    /*
       MOVEMENT
    */

    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    forward.applyQuaternion(
        carRoot.quaternion
    );


    carRoot.position.addScaledVector(
        forward,
        speed
    );


    /*
       TERRAIN FOLLOWING
    */

    const ground =
        terrainHeight(
            carRoot.position.x,
            carRoot.position.z
        );


    /*
       Keep the car above the terrain/road.
    */

    carRoot.position.y =
        THREE.MathUtils.lerp(
            carRoot.position.y,
            ground +
            0.55,
            0.25
        );


    /*
       HUD
    */

    document.getElementById(
        "speed"
    ).textContent =

        Math.round(
            Math.abs(speed) *
            55
        ) +

        " KM/H";
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera() {

    const offset =
        new THREE.Vector3(
            0,
            4.2,
            10.5
        );


    offset.applyQuaternion(
        carRoot.quaternion
    );


    const desired =
        carRoot.position
            .clone()
            .add(
                offset
            );


    camera.position.lerp(
        desired,
        0.075
    );


    const lookAt =
        carRoot.position
            .clone();


    lookAt.y +=
        1.4;


    camera.lookAt(
        lookAt
    );
}


/* =========================================================
   DAY / NIGHT
========================================================= */

let night =
    false;


function toggleNight() {

    night =
        !night;


    if (
        night
    ) {

        scene.background =
            new THREE.Color(
                0x080b18
            );


        scene.fog.color =
            new THREE.Color(
                0x080b18
            );


        hemisphere.intensity =
            0.35;


        sun.intensity =
            0.45;


        sun.color.set(
            0x8fa8ff
        );

    }

    else {

        scene.background =
            new THREE.Color(
                0x8fb4d9
            );


        scene.fog.color =
            new THREE.Color(
                0x8fb4d9
            );


        hemisphere.intensity =
            1.6;


        sun.intensity =
            2.5;


        sun.color.set(
            0xfff1d0
        );
    }
}


/* =========================================================
   INITIAL WORLD
========================================================= */

async function startGame() {

    /*
       BUILDINGS
    */

    await loadBuildings();


    /*
       CAR
    */

    await loadCar();


    /*
       INITIAL WORLD
    */

    for (
        let x = -LOAD_RADIUS;
        x <= LOAD_RADIUS;
        x++
    ) {

        for (
            let z = -LOAD_RADIUS;
            z <= LOAD_RADIUS;
            z++
        ) {

            generateChunk(
                x,
                z
            );
        }
    }


    lastChunkX =
        0;

    lastChunkZ =
        0;


    /*
       HIDE LOADING SCREEN
    */

    const loading =
        document.getElementById(
            "loading"
        );


    loading.style.opacity =
        "0";


    setTimeout(
        () => {

            loading.style.display =
                "none";

        },
        900
    );
}


/* =========================================================
   ANIMATION
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    updateCar();

    updateWorldStreaming();

    updateCamera();


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =========================================================
   START
========================================================= */

startGame();

animate();

</script>
