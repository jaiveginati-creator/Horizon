<script type="module">


// ============================================================
// IMPORTS
// ============================================================

import * as THREE from "three";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";

import {
    DRACOLoader
} from "three/addons/loaders/DRACOLoader.js";

import {
    MeshoptDecoder
} from "three/addons/libs/meshopt_decoder.module.js";



// ============================================================
// SCENE
// ============================================================

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x8bb8d8
    );


scene.fog =
    new THREE.Fog(
        0x8bb8d8,
        550,
        2100
    );



// ============================================================
// CAMERA
// ============================================================

const camera =
    new THREE.PerspectiveCamera(

        65,

        window.innerWidth /
        window.innerHeight,

        0.1,

        3000

    );


camera.position.set(
    0,
    5,
    12
);



// ============================================================
// RENDERER
// ============================================================

const renderer =
    new THREE.WebGLRenderer({

        antialias: true,

        powerPreference:
            "high-performance"

    });


renderer.setSize(

    window.innerWidth,

    window.innerHeight

);


renderer.setPixelRatio(

    Math.min(
        window.devicePixelRatio,
        1.7
    )

);


renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    1.15;


document.body.appendChild(
    renderer.domElement
);



// ============================================================
// LOADERS
// ============================================================

const loader =
    new GLTFLoader();


const dracoLoader =
    new DRACOLoader();


dracoLoader.setDecoderPath(

    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/draco/"

);


loader.setDRACOLoader(
    dracoLoader
);


loader.setMeshoptDecoder(
    MeshoptDecoder
);



// ============================================================
// WORLD SETTINGS
// ============================================================

const WORLD_SIZE =
    2400;



// ============================================================
// TERRAIN
// ============================================================

function terrainHeight(
    x,
    z
) {

    const hills =

        Math.sin(
            x * 0.008
        ) * 3

        +

        Math.cos(
            z * 0.006
        ) * 4

        +

        Math.sin(
            (x + z) * 0.012
        ) * 2;


    const smallHills =

        Math.sin(
            x * 0.022 +
            z * 0.013
        ) * 0.8

        +

        Math.cos(
            z * 0.018
        ) * 0.7;


    const cityFlatten =

        Math.exp(

            -(
                x * x +
                z * z
            ) / 180000

        );


    return (

        hills +
        smallHills

    )

    *

    (

        1 -
        cityFlatten * 0.85

    );

}



// ============================================================
// TERRAIN MESH
// ============================================================

function createTerrain() {

    const geometry =
        new THREE.PlaneGeometry(

            WORLD_SIZE,
            WORLD_SIZE,

            140,
            140

        );


    geometry.rotateX(
        -Math.PI / 2
    );


    const position =
        geometry.attributes.position;


    for (

        let i = 0;

        i < position.count;

        i++

    ) {

        const x =
            position.getX(i);


        const z =
            position.getZ(i);


        position.setY(

            i,

            terrainHeight(
                x,
                z
            )

        );

    }


    geometry.computeVertexNormals();


    const material =
        new THREE.MeshStandardMaterial({

            color:
                0x405b3d,

            roughness:
                1

        });


    const terrain =
        new THREE.Mesh(

            geometry,
            material

        );


    terrain.receiveShadow =
        true;


    scene.add(
        terrain
    );

}


createTerrain();



// ============================================================
// ROAD DEFINITIONS
// ============================================================

/*
    IMPORTANT:

    Every road that exists in the world is stored here.

    The previous version missed the city-grid roads,
    which allowed buildings to spawn directly on them.
*/

const roadDefinitions = [];



// ============================================================
// ADD ROAD DEFINITION
// ============================================================

function addRoadDefinition(

    x,
    z,
    width,
    length,
    rotation

) {

    roadDefinitions.push({

        x:
            x,

        z:
            z,

        width:
            width,

        length:
            length,

        rotation:
            rotation

    });

}



// ============================================================
// MAIN ROADS
// ============================================================

addRoadDefinition(
    0,
    0,
    30,
    1900,
    0
);


addRoadDefinition(
    0,
    0,
    30,
    1900,
    Math.PI / 2
);



// ============================================================
// MAJOR ROADS
// ============================================================

addRoadDefinition(
    330,
    0,
    20,
    1700,
    0
);


addRoadDefinition(
    -330,
    0,
    20,
    1700,
    0
);


addRoadDefinition(
    0,
    360,
    20,
    1700,
    Math.PI / 2
);


addRoadDefinition(
    0,
    -360,
    20,
    1700,
    Math.PI / 2
);



// ============================================================
// CITY GRID ROADS
// ============================================================

for (

    let x = -420;

    x <= 420;

    x += 105

) {

    if (
        Math.abs(x) >= 50
    ) {

        addRoadDefinition(

            x,
            0,
            9,
            850,
            0

        );

    }

}



for (

    let z = -420;

    z <= 420;

    z += 105

) {

    if (
        Math.abs(z) >= 50
    ) {

        addRoadDefinition(

            0,
            z,
            9,
            850,
            Math.PI / 2

        );

    }

}



// ============================================================
// ROAD DISTANCE
// ============================================================

function distanceToRoad(

    px,
    pz,
    road

) {

    const dx =
        px - road.x;


    const dz =
        pz - road.z;


    const cos =
        Math.cos(
            road.rotation
        );


    const sin =
        Math.sin(
            road.rotation
        );


    const localX =

        dx * cos +
        dz * sin;


    const localZ =

        -dx * sin +
        dz * cos;


    const halfWidth =
        road.width / 2;


    const halfLength =
        road.length / 2;


    const outsideX =

        Math.max(

            Math.abs(localX) -
            halfWidth,

            0

        );


    const outsideZ =

        Math.max(

            Math.abs(localZ) -
            halfLength,

            0

        );


    return Math.sqrt(

        outsideX * outsideX +

        outsideZ * outsideZ

    );

}



// ============================================================
// ROAD HEIGHT
// ============================================================

const ROAD_HEIGHT =
    0.22;


const ROAD_MARKING_HEIGHT =
    0.025;



function roadHeight(
    x,
    z
) {

    return (

        terrainHeight(
            x,
            z
        ) +

        ROAD_HEIGHT

    );

}



// ============================================================
// ROAD POINT
// ============================================================

function roadPoint(

    x,
    z,
    distance,
    rotation

) {

    return {

        x:

            x +

            Math.sin(
                rotation
            ) *

            distance,


        z:

            z +

            Math.cos(
                rotation
            ) *

            distance

    };

}



// ============================================================
// ROAD CREATION
// ============================================================

function createRoad(

    x,
    z,
    width,
    length,
    rotation

) {


    const segments =
        Math.max(

            180,

            Math.floor(
                length / 4
            )

        );


    /*
        More segments across the width too.
        This helps the road conform to hills.
    */

    const widthSegments =
        6;


    const geometry =
        new THREE.PlaneGeometry(

            width,
            length,

            widthSegments,

            segments

        );


    geometry.rotateX(
        -Math.PI / 2
    );


    const position =
        geometry.attributes.position;


    const cos =
        Math.cos(
            rotation
        );


    const sin =
        Math.sin(
            rotation
        );



    for (

        let i = 0;

        i < position.count;

        i++

    ) {


        const localX =
            position.getX(i);


        const localZ =
            position.getZ(i);


        const worldX =

            x +

            localX * cos -

            localZ * sin;


        const worldZ =

            z +

            localX * sin +

            localZ * cos;


        position.setY(

            i,

            roadHeight(
                worldX,
                worldZ
            )

        );

    }


    geometry.computeVertexNormals();



    const material =
        new THREE.MeshStandardMaterial({

            color:
                0x202124,

            roughness:
                0.95,

            side:
                THREE.DoubleSide

        });


    const road =
        new THREE.Mesh(

            geometry,
            material

        );


    road.position.set(

        x,

        0,

        z

    );


    road.rotation.y =
        rotation;


    road.receiveShadow =
        true;


    scene.add(
        road
    );



    createRoadMarkings(

        x,
        z,
        width,
        length,
        rotation

    );

}



// ============================================================
// ROAD MARKINGS
// ============================================================

function createRoadMarkings(

    x,
    z,
    width,
    length,
    rotation

) {


    const whiteMaterial =
        new THREE.MeshStandardMaterial({

            color:
                0xd9d9d9,

            roughness:
                0.85

        });



    // --------------------------------------------------------
    // CENTER LINE
    // --------------------------------------------------------

    for (

        let d =
            -length / 2 + 15;

        d <
            length / 2 - 5;

        d += 24

    ) {


        const p =
            roadPoint(

                x,
                z,
                d,
                rotation

            );


        const y =

            roadHeight(
                p.x,
                p.z
            )

            +

            ROAD_MARKING_HEIGHT;



        const geometry =
            new THREE.BoxGeometry(

                0.28,

                0.035,

                9

            );


        const dash =
            new THREE.Mesh(

                geometry,
                whiteMaterial

            );


        dash.position.set(

            p.x,

            y,

            p.z

        );


        dash.rotation.y =
            rotation;


        scene.add(
            dash
        );

    }



    // --------------------------------------------------------
    // EDGE LINES
    // --------------------------------------------------------

    const edgeOffset =
        width / 2 - 0.8;



    for (

        const side
        of [-1, 1]

    ) {


        for (

            let d =
                -length / 2;

            d <
                length / 2;

            d += 14

        ) {


            const p =
                roadPoint(

                    x,
                    z,
                    d,
                    rotation

                );



            const px =

                p.x +

                Math.cos(
                    rotation
                ) *

                edgeOffset *

                side;



            const pz =

                p.z -

                Math.sin(
                    rotation
                ) *

                edgeOffset *

                side;



            const y =

                roadHeight(
                    px,
                    pz
                )

                +

                ROAD_MARKING_HEIGHT;



            const geometry =
                new THREE.BoxGeometry(

                    0.22,

                    0.025,

                    12

                );


            const edge =
                new THREE.Mesh(

                    geometry,
                    whiteMaterial

                );


            edge.position.set(

                px,

                y,

                pz

            );


            edge.rotation.y =
                rotation;


            scene.add(
                edge
            );

        }

    }

}



// ============================================================
// CREATE ALL ROADS
// ============================================================

for (

    const road
    of roadDefinitions

) {

    createRoad(

        road.x,

        road.z,

        road.width,

        road.length,

        road.rotation

    );

}



// ============================================================
// CROSSWALK
// ============================================================

function createCrosswalk(

    x,
    z,
    rotation

) {


    for (

        let i = -4;

        i <= 4;

        i++

    ) {


        const offset =
            i * 2.1;


        const px =

            x +

            Math.cos(
                rotation
            ) *

            offset;


        const pz =

            z -

            Math.sin(
                rotation
            ) *

            offset;


        const geometry =
            new THREE.BoxGeometry(

                1.2,

                0.035,

                8

            );


        const material =
            new THREE.MeshStandardMaterial({

                color:
                    0xd8d8d8

            });


        const stripe =
            new THREE.Mesh(

                geometry,
                material

            );


        stripe.position.set(

            px,

            roadHeight(
                px,
                pz
            ) + 0.025,

            pz

        );


        stripe.rotation.y =
            rotation;


        scene.add(
            stripe
        );

    }

}



// ============================================================
// INTERSECTIONS
// ============================================================

const intersections = [

    [105, 105],
    [105, -105],
    [-105, 105],
    [-105, -105],

    [210, 210],
    [210, -210],
    [-210, 210],
    [-210, -210],

    [315, 315],
    [315, -315],
    [-315, 315],
    [-315, -315]

];



for (

    const [x, z]
    of intersections

) {


    createCrosswalk(
        x,
        z,
        0
    );


    createCrosswalk(
        x,
        z,
        Math.PI / 2
    );

}



// ============================================================
// PARKING LOTS
// ============================================================

const parkingLots = [

    {
        x: 65,
        z: 65,
        width: 55,
        depth: 70,
        rotation: 0
    },

    {
        x: -65,
        z: -65,
        width: 55,
        depth: 70,
        rotation: 0
    },

    {
        x: 275,
        z: 275,
        width: 55,
        depth: 70,
        rotation: Math.PI / 2
    },

    {
        x: -275,
        z: -275,
        width: 55,
        depth: 70,
        rotation: Math.PI / 2
    }

];



// ============================================================
// PARKING LOT CREATION
// ============================================================

function createParkingLot(
    lot
) {


    const geometry =
        new THREE.PlaneGeometry(

            lot.width,
            lot.depth

        );


    geometry.rotateX(
        -Math.PI / 2
    );


    const material =
        new THREE.MeshStandardMaterial({

            color:
                0x303235,

            roughness:
                0.95

        });


    const mesh =
        new THREE.Mesh(

            geometry,
            material

        );


    mesh.position.set(

        lot.x,

        terrainHeight(
            lot.x,
            lot.z
        ) + 0.21,

        lot.z

    );


    mesh.rotation.y =
        lot.rotation;


    mesh.receiveShadow =
        true;


    scene.add(
        mesh
    );



    for (

        let i = -4;

        i <= 4;

        i++

    ) {


        const localX =
            i * 5;


        const px =

            lot.x +

            localX *

            Math.cos(
                lot.rotation
            );


        const pz =

            lot.z +

            localX *

            Math.sin(
                lot.rotation
            );


        const line =
            new THREE.Mesh(

                new THREE.BoxGeometry(

                    0.1,

                    0.025,

                    lot.depth - 8

                ),

                new THREE.MeshStandardMaterial({

                    color:
                        0xbdbdbd

                })

            );


        line.position.set(

            px,

            terrainHeight(
                px,
                pz
            ) + 0.25,

            pz

        );


        line.rotation.y =
            lot.rotation;


        scene.add(
            line
        );

    }

}



// Create lots

for (

    const lot
    of parkingLots

) {

    createParkingLot(
        lot
    );

}



// ============================================================
// BUILDING SYSTEM
// ============================================================

const buildingFiles = [

    "assets/buildings/large-building.glb",

    "assets/buildings/store.glb",

    "assets/buildings/apartment.glb",

    "assets/buildings/large-building-2.glb",

    "assets/buildings/bank.glb"

];


const buildingTemplates = [];

const placedBuildings = [];



// ============================================================
// BUILDING ROAD BUFFER
// ============================================================

/*
    This is deliberately generous.

    A building must stay this far from the
    actual edge of a road.

    This prevents buildings from appearing
    visually on the road even when the GLB
    has an unusual shape.
*/

const ROAD_BUILDING_BUFFER =
    16;



// ============================================================
// BUILDING ROAD CHECK
// ============================================================

function isBuildingOnRoad(

    x,
    z,
    halfX,
    halfZ

) {


    /*
        Test several points around the building
        footprint rather than only its center.
    */

    const points = [

        [x, z],

        [x - halfX, z],
        [x + halfX, z],

        [x, z - halfZ],
        [x, z + halfZ],

        [x - halfX, z - halfZ],
        [x + halfX, z - halfZ],

        [x - halfX, z + halfZ],
        [x + halfX, z + halfZ]

    ];



    for (

        const road
        of roadDefinitions

    ) {


        for (

            const point
            of points

        ) {


            const distance =

                distanceToRoad(

                    point[0],

                    point[1],

                    road

                );



            if (

                distance <

                ROAD_BUILDING_BUFFER

            ) {

                return true;

            }

        }

    }


    return false;

}



// ============================================================
// BUILDING-TO-BUILDING CHECK
// ============================================================

function buildingTooClose(

    x,
    z,
    halfX,
    halfZ

) {


    for (

        const building
        of placedBuildings

    ) {


        const gap =
            6;



        const separatedX =

            Math.abs(
                x - building.x
            )

            >

            (

                halfX +

                building.halfX +

                gap

            );



        const separatedZ =

            Math.abs(
                z - building.z
            )

            >

            (

                halfZ +

                building.halfZ +

                gap

            );



        if (

            !separatedX &&
            !separatedZ

        ) {

            return true;

        }

    }


    return false;

}



// ============================================================
// PARKING LOT CHECK
// ============================================================

function isInsideParkingLot(

    x,
    z,
    halfX,
    halfZ

) {


    for (

        const lot
        of parkingLots

    ) {


        const buffer =
            4;



        const overlapsX =

            Math.abs(
                x - lot.x
            )

            <

            (

                lot.width / 2 +

                halfX +

                buffer

            );



        const overlapsZ =

            Math.abs(
                z - lot.z
            )

            <

            (

                lot.depth / 2 +

                halfZ +

                buffer

            );



        if (

            overlapsX &&
            overlapsZ

        ) {

            return true;

        }

    }


    return false;

}



// ============================================================
// LOAD BUILDINGS
// ============================================================

async function loadBuildings() {


    console.log(
        "Loading Horizon buildings..."
    );



    for (

        const file
        of buildingFiles

    ) {


        try {


            const gltf =
                await loader.loadAsync(
                    file
                );


            const model =
                gltf.scene;



            // ------------------------------------------------
            // NORMALIZE
            // ------------------------------------------------

            const originalBox =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const originalSize =
                new THREE.Vector3();


            originalBox.getSize(
                originalSize
            );


            const largest =
                Math.max(

                    originalSize.x,

                    originalSize.y,

                    originalSize.z

                );



            if (
                largest > 0
            ) {

                model.scale.setScalar(

                    30 /
                    largest

                );

            }



            // ------------------------------------------------
            // CENTER X/Z
            // ------------------------------------------------

            const centeredBox =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const center =
                new THREE.Vector3();


            centeredBox.getCenter(
                center
            );


            model.position.x -=
                center.x;


            model.position.z -=
                center.z;



            // ------------------------------------------------
            // GROUND MODEL
            // ------------------------------------------------

            const groundBox =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            model.position.y -=
                groundBox.min.y;



            // ------------------------------------------------
            // MATERIALS
            // ------------------------------------------------

            model.traverse(

                child => {


                    if (
                        child.isMesh
                    ) {


                        child.castShadow =
                            true;


                        child.receiveShadow =
                            true;



                        if (
                            child.material
                        ) {


                            child.material.side =
                                THREE.DoubleSide;


                            child.material.roughness =
                                0.85;

                        }

                    }

                }

            );



            // ------------------------------------------------
            // ACTUAL FOOTPRINT
            // ------------------------------------------------

            const finalBox =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const finalSize =
                new THREE.Vector3();


            finalBox.getSize(
                finalSize
            );



            /*
                Store actual half dimensions.

                We use these when deciding whether
                a building can spawn.
            */

            const halfX =
                Math.max(
                    finalSize.x / 2,
                    4
                );


            const halfZ =
                Math.max(
                    finalSize.z / 2,
                    4
                );



            buildingTemplates.push({

                model:
                    model,

                halfX:
                    halfX,

                halfZ:
                    halfZ

            });



            console.log(
                "Loaded building:",
                file
            );

        }

        catch (
            error
        ) {


            console.error(

                "Failed to load:",

                file,

                error

            );

        }

    }



    console.log(

        "Building templates:",

        buildingTemplates.length

    );



    if (

        buildingTemplates.length > 0

    ) {

        generateCityBuildings();

    }

}



// ============================================================
// ADD BUILDING
// ============================================================

function addBuilding(

    template,
    x,
    z,
    scale

) {


    const building =
        template.model.clone(true);



    // --------------------------------------------------------
    // SCALE
    // --------------------------------------------------------

    building.scale.multiplyScalar(
        scale
    );



    // --------------------------------------------------------
    // ROTATION
    // --------------------------------------------------------

    const rotation =

        Math.floor(

            Math.random() * 4

        )

        *

        Math.PI / 2;


    building.rotation.y =
        rotation;



    // --------------------------------------------------------
    // POSITION
    // --------------------------------------------------------

    building.position.set(

        x,

        terrainHeight(
            x,
            z
        ),

        z

    );



    // --------------------------------------------------------
    // SHADOWS
    // --------------------------------------------------------

    building.traverse(

        child => {


            if (
                child.isMesh
            ) {


                child.castShadow =
                    true;


                child.receiveShadow =
                    true;

            }

        }

    );



    // --------------------------------------------------------
    // ADD
    // --------------------------------------------------------

    scene.add(
        building
    );



    // --------------------------------------------------------
    // SAVE ACTUAL FOOTPRINT
    // --------------------------------------------------------

    placedBuildings.push({

        x:
            x,

        z:
            z,

        halfX:
            template.halfX *
            scale,

        halfZ:
            template.halfZ *
            scale

    });

}



// ============================================================
// GENERATE CITY
// ============================================================

function generateCityBuildings() {


    console.log(
        "Generating city..."
    );


    placedBuildings.length =
        0;



    // ========================================================
    // DOWNTOWN GRID
    // ========================================================

    for (

        let x = -455;

        x <= 455;

        x += 72

    ) {


        for (

            let z = -455;

            z <= 455;

            z += 72

        ) {


            for (

                let attempt = 0;

                attempt < 18;

                attempt++

            ) {


                const bx =

                    x +

                    (

                        Math.random() -
                        0.5

                    )

                    *

                    35;



                const bz =

                    z +

                    (

                        Math.random() -
                        0.5

                    )

                    *

                    35;



                const template =

                    buildingTemplates[

                        Math.floor(

                            Math.random() *

                            buildingTemplates.length

                        )

                    ];



                const scale =

                    0.55 +

                    Math.random() *
                    0.42;



                const halfX =

                    template.halfX *
                    scale;



                const halfZ =

                    template.halfZ *
                    scale;



                // --------------------------------------------
                // ROAD
                // --------------------------------------------

                if (

                    isBuildingOnRoad(

                        bx,

                        bz,

                        halfX,

                        halfZ

                    )

                ) {

                    continue;

                }



                // --------------------------------------------
                // PARKING
                // --------------------------------------------

                if (

                    isInsideParkingLot(

                        bx,

                        bz,

                        halfX,

                        halfZ

                    )

                ) {

                    continue;

                }



                // --------------------------------------------
                // OTHER BUILDINGS
                // --------------------------------------------

                if (

                    buildingTooClose(

                        bx,

                        bz,

                        halfX,

                        halfZ

                    )

                ) {

                    continue;

                }



                // --------------------------------------------
                // PLACE
                // --------------------------------------------

                addBuilding(

                    template,

                    bx,

                    bz,

                    scale

                );


                break;

            }

        }

    }



    // ========================================================
    // OUTSKIRTS
    // ========================================================

    for (

        let i = 0;

        i < 120;

        i++

    ) {


        for (

            let attempt = 0;

            attempt < 18;

            attempt++

        ) {


            const angle =

                Math.random() *

                Math.PI *

                2;



            const distance =

                540 +

                Math.random() *
                450;



            const bx =

                Math.cos(angle) *
                distance;



            const bz =

                Math.sin(angle) *
                distance;



            const template =

                buildingTemplates[

                    Math.floor(

                        Math.random() *

                        buildingTemplates.length

                    )

                ];



            const scale =

                0.45 +

                Math.random() *
                0.4;



            const halfX =

                template.halfX *
                scale;



            const halfZ =

                template.halfZ *
                scale;



            if (

                isBuildingOnRoad(

                    bx,

                    bz,

                    halfX,

                    halfZ

                )

            ) {

                continue;

            }



            if (

                buildingTooClose(

                    bx,

                    bz,

                    halfX,

                    halfZ

                )

            ) {

                continue;

            }



            addBuilding(

                template,

                bx,

                bz,

                scale

            );


            break;

        }

    }



    console.log(

        "Buildings placed:",

        placedBuildings.length

    );

}

// ============================================================
// NEAREST ROAD
// ============================================================

function distanceToNearestRoad(

    x,
    z

) {


    let closest =
        Infinity;


    for (

        const road
        of roadDefinitions

    ) {


        closest =

            Math.min(

                closest,

                distanceToRoad(

                    x,

                    z,

                    road

                )

            );

    }


    return closest;

}

const CAR_FILE =

    "https://jaiveginati-creator.github.io/Horizon/electric-car.glb";



// ============================================================
// LOAD CAR
// ============================================================

async function loadCar() {


    try {


        const gltf =
            await loader.loadAsync(
                CAR_FILE
            );


        carModel =
            gltf.scene;



        const box =
            new THREE.Box3()
                .setFromObject(
                    carModel
                );


        const size =
            new THREE.Vector3();


        box.getSize(
            size
        );


        const largest =
            Math.max(

                size.x,

                size.y,

                size.z

            );



        if (
            largest > 0
        ) {

            carModel.scale.setScalar(

                4.9 /
                largest

            );

        }



        const centerBox =
            new THREE.Box3()
                .setFromObject(
                    carModel
                );


        const center =
            new THREE.Vector3();


        centerBox.getCenter(
            center
        );


        carModel.position.x -=
            center.x;


        carModel.position.z -=
            center.z;


        carModel.rotation.y =
            Math.PI / 2;



        const finalBox =
            new THREE.Box3()
                .setFromObject(
                    carModel
                );


        carModel.position.y -=

            finalBox.min.y -
            0.05;



        carModel.traverse(

            child => {


                if (
                    child.isMesh
                ) {


                    child.castShadow =
                        true;


                    child.receiveShadow =
                        true;

                }

            }

        );



        car.add(
            carModel
        );



        car.position.set(

            0,

            terrainHeight(
                0,
                80
            ),

            80

        );



        document.getElementById(
            "loading"
        ).style.display =
            "none";



    }

    catch (
        error
    ) {


        console.error(
            "CAR ERROR:",
            error
        );


        document.getElementById(
            "loading"
        ).textContent =
            "CAR FAILED TO LOAD";

    }

}

// ============================================================
// DRIVING
// ============================================================

const MAX_SPEED =
    0.75;


const MAX_REVERSE =
    0.28;


const ACCELERATION =
    0.008;


const REVERSE_ACCELERATION =
    0.005;


const BRAKE_POWER =
    0.035;


const FRICTION =
    0.006;


const MAX_STEERING =
    0.55;


const STEERING_RESPONSE =
    0.14;


const TURN_RATE =
    0.035;



let speed =
    0;


let steering =
    0;



// ============================================================
// CAR UPDATE
// ============================================================

function updateCar() {


    if (
        !carModel
    ) {

        return;

    }



    const accelerating =

        keys["w"] ||
        keys["arrowup"];



    const braking =

        keys["s"] ||
        keys["arrowdown"];



    const left =

        keys["a"] ||
        keys["arrowleft"];



    const right =

        keys["d"] ||
        keys["arrowright"];



    if (
        accelerating
    ) {


        if (
            speed <
            MAX_SPEED
        ) {

            speed +=
                ACCELERATION;

        }

    }

    else if (
        braking
    ) {


        if (
            speed > 0.05
        ) {

            speed -=
                BRAKE_POWER;

        }

        else {

            speed -=
                REVERSE_ACCELERATION;

        }

    }

    else {


        if (
            speed > 0
        ) {

            speed -=
                FRICTION;

        }

        else if (
            speed < 0
        ) {

            speed +=
                FRICTION;

        }

    }



    speed =
        THREE.MathUtils.clamp(

            speed,

            -MAX_REVERSE,

            MAX_SPEED

        );



    let targetSteering =
        0;



    if (
        left
    ) {

        targetSteering =
            MAX_STEERING;

    }



    if (
        right
    ) {

        targetSteering =
            -MAX_STEERING;

    }



    steering +=

        (

            targetSteering -
            steering

        )

        *

        STEERING_RESPONSE;



    if (

        Math.abs(speed) >
        0.01

    ) {


        car.rotation.y +=

            steering *

            TURN_RATE *

            (

                speed >= 0
                    ? 1
                    : -1

            );

    }



    const forward =
        new THREE.Vector3(

            0,
            0,
            -1

        );


    forward.applyQuaternion(
        car.quaternion
    );


    car.position.add(

        forward.multiplyScalar(
            speed
        )

    );



    car.position.y =

        terrainHeight(

            car.position.x,

            car.position.z

        );



    const limit =
        WORLD_SIZE / 2 - 80;



    car.position.x =

        THREE.MathUtils.clamp(

            car.position.x,

            -limit,

            limit

        );



    car.position.z =

        THREE.MathUtils.clamp(

            car.position.z,

            -limit,

            limit

        );



    document.getElementById(
        "speed"
    ).textContent =

        Math.round(

            Math.abs(speed) *
            55

        );

}



// ============================================================
// CAMERA
// ============================================================

const cameraTarget =
    new THREE.Vector3();


function updateCamera() {


    if (
        !carModel
    ) {

        return;

    }



    const offset =
        new THREE.Vector3(

            0,
            4.2,
            10.5

        );


    offset.applyQuaternion(
        car.quaternion
    );



    const desired =

        car.position.clone()
            .add(
                offset
            );



    camera.position.lerp(

        desired,

        0.075

    );



    cameraTarget.copy(
        car.position
    );


    cameraTarget.y +=
        1.3;


    camera.lookAt(
        cameraTarget
    );

}

}

}
