const WORLD_SIZE = 2400;
const TERRAIN_SEGMENTS = 120;


function terrainHeight(x, z) {

    const hills =
        Math.sin(x * 0.008) * 3 +
        Math.cos(z * 0.006) * 4 +
        Math.sin((x + z) * 0.012) * 2;

    const cityFlatten =
        Math.exp(
            -(x * x + z * z) / 180000
        );

    return hills * (1 - cityFlatten * 0.85);
}


const terrainGeometry = new THREE.PlaneGeometry(
    WORLD_SIZE,
    WORLD_SIZE,
    TERRAIN_SEGMENTS,
    TERRAIN_SEGMENTS
);

for (

    i++
) {

    const x = terrainPositions.getX(i);
    const z = terrainPositions.getZ(i);

    terrainPositions.setY(
        i,
        terrainHeight(x, z)
    );
}

terrainGeometry.computeVertexNormals();

function createRoad(
    x,
    z,
    width,
    length,
    rotation = 0
) {

    const group = new THREE.Group();

    group.position.set(
        x,
        0.04,
        z
    );

    group.rotation.y = rotation;


    const roadGeometry =
        new THREE.PlaneGeometry(

    roadGeometry.rotateX(-Math.PI / 2);


    const roadMaterial =
        new THREE.MeshStandardMaterial({

        });

        new THREE.Mesh(
            roadGeometry,
            roadMaterial
        );

    group.add(road);


    // ROAD EDGE

        new THREE.MeshBasicMaterial({
            color: 0xb5b5a8
        });


    const edgeGeometry =
        new THREE.PlaneGeometry(
            0.35,
            length
        );

    edgeGeometry.rotateX(-Math.PI / 2);

    group.add(edge1);
    group.add(edge2);


    // CENTER LINE

        new THREE.MeshBasicMaterial({
            color: 0xe2e0c5
        });


    for (

        i < length / 2;
        i += 14

                lineMaterial
            );

        line.position.y = 0.035;
        line.position.z = i;

        group.add(line);
    }


    scene.add(group);

    return group;
}

function createBuilding(

    z,
    width,
    height,
    depth
) {

    const group =
        new THREE.Group();


    const material =
        buildingMaterials[
            Math.floor(

            )
        ];


    const bodyGeometry =
        new THREE.BoxGeometry(

    body.position.y =

    body.receiveShadow = true;

    // Horizontal windows

        Math.max(

            Math.floor(height / 7)
        );


    for (
        let floor = 1;
        floor < floors;
        floor++
    ) {

        const y =
            floor *
            (height / floors);

            );

        );

function createStreetLight(x, z) {

const car =
    new THREE.Group();

scene.add(car);

car.position.set(
    0,
    terrainHeight(0, 80),
    80
);


// Car model

const loader =
    new GLTFLoader();


const dracoLoader =
    new DRACOLoader();

dracoLoader.setDecoderPath(
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/draco/"
);

loader.setDRACOLoader(
    dracoLoader
);

loader.setMeshoptDecoder(
    MeshoptDecoder
);


let carModel = null;
let wheels = [];
let steeringWheels = [];


loader.load(
    "https://jaiveginati-creator.github.io/Horizon/electric-car.glb",

    function(gltf) {

        carModel =
            gltf.scene;


        // Find size

        const box =
            new THREE.Box3()
                .setFromObject(carModel);

        const size =
            new THREE.Vector3();

        box.getSize(size);


        const largest =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        const scale =
            4.9 / largest;


        carModel.scale.setScalar(
            scale
        );


        // Center model

        const centeredBox =
            new THREE.Box3()
                .setFromObject(carModel);

        const center =
            new THREE.Vector3();

        centeredBox.getCenter(center);

        carModel.position.x -= center.x;
        carModel.position.z -= center.z;


        carModel.rotation.y =
            Math.PI / 2;


        carModel.traverse(
            function(obj) {

                if (!obj.isMesh)
                    return;


                obj.castShadow = true;
                obj.receiveShadow = true;


                if (obj.material) {

                    obj.material =
                        obj.material.clone();

                    obj.material.envMapIntensity =
                        1.5;
                }


                const name =
                    obj.name.toLowerCase();


                if (
                    name.includes("wheel") ||
                    name.includes("tire") ||
                    name.includes("tyre") ||
                    name.includes("rim")
                ) {

                    wheels.push(obj);
                }


                if (
                    name.includes("steer") ||
                    name.includes("frontwheel") ||
                    name.includes("front_wheel")
                ) {

                    steeringWheels.push(obj);
                }
            }
        );


        car.add(carModel);

        document.getElementById(
            "loading"
        ).style.display = "none";
    },

    undefined,

    function(error) {

        console.error(
            "Car loading error:",
            error
        );

        document.getElementById(
            "loading"
        ).innerText =
            "CAR FAILED TO LOAD";

    }
);


// ============================================================
// DRIVING
// ============================================================

// MUCH SLOWER CAR

let speed = 0;

let steering = 0;


// Maximum forward speed

const MAX_SPEED = 0.75;


// Maximum reverse speed

const MAX_REVERSE = 0.28;


// Acceleration

const ACCELERATION = 0.008;

const REVERSE_ACCELERATION = 0.005;


// Braking

const BRAKE_POWER = 0.035;


// Natural slowdown

const FRICTION = 0.006;


// Steering

const MAX_STEERING = 0.55;

const STEERING_RESPONSE = 0.14;

const TURN_RATE = 0.035;


const keys = {};


window.addEventListener(
    "keydown",
    function(e) {

        keys[
            e.key.toLowerCase()
        ] = true;


        if (
            e.key === " "
        ) {
            e.preventDefault();
        }


        if (
            e.key.toLowerCase() === "n"
        ) {

            toggleNight();
        }
    }
);


window.addEventListener(
    "keyup",
    function(e) {

        keys[
            e.key.toLowerCase()
        ] = false;
    }
);


// ============================================================
// DAY / NIGHT
// ============================================================

let night = false;


function toggleNight() {

    night = !night;


    if (night) {

        scene.background =
            new THREE.Color(
                0x07101c
            );

        scene.fog.color =
            new THREE.Color(
                0x07101c
            );

        hemisphere.intensity =
            0.45;

        sun.intensity =
            0.35;

    } else {

        scene.background =
            new THREE.Color(
                0x91a2b1
            );

        scene.fog.color =
            new THREE.Color(
                0x91a2b1
            );

        hemisphere.intensity =
            2.2;

        sun.intensity =
            4;
    }
}


// ============================================================
// GAME LOOP
// ============================================================

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );


    // ----------------------------------------
    // ACCELERATION
    // ----------------------------------------

    if (
        keys["w"] ||
        keys["arrowup"]
    ) {

        speed +=
            ACCELERATION;

    }


    // ----------------------------------------
    // BRAKE / REVERSE
    // ----------------------------------------

    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {

        if (speed > 0) {

            speed -=
                BRAKE_POWER;

        } else {

            speed -=
                REVERSE_ACCELERATION;
        }
    }


    // ----------------------------------------
    // SPACE BRAKE
    // ----------------------------------------

    if (keys[" "]) {

        if (speed > 0) {

            speed -=
                BRAKE_POWER * 1.5;

        } else if (speed < 0) {

            speed +=
                BRAKE_POWER * 1.5;
        }
    }


    // ----------------------------------------
    // FRICTION
    // ----------------------------------------

    if (
        !keys["w"] &&
        !keys["arrowup"] &&
        !keys["s"] &&
        !keys["arrowdown"]
    ) {

        if (speed > 0) {

            speed =
                Math.max(
                    0,
                    speed - FRICTION
                );

        } else if (speed < 0) {

            speed =
                Math.min(
                    0,
                    speed + FRICTION
                );
        }
    }


    // ----------------------------------------
    // LIMIT SPEED
    // ----------------------------------------

    speed =
        THREE.MathUtils.clamp(
            speed,
            -MAX_REVERSE,
            MAX_SPEED
        );


    // ----------------------------------------
    // STEERING
    // ----------------------------------------

    let steeringTarget = 0;


    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {

        steeringTarget =
            MAX_STEERING;
    }


    if (
        keys["d"] ||
        keys["arrowright"]
    ) {

        steeringTarget =
            -MAX_STEERING;
    }


    steering +=
        (
            steeringTarget -
            steering
        ) *
        STEERING_RESPONSE;


    // ----------------------------------------
    // TURN
    // ----------------------------------------

    if (
        Math.abs(speed) > 0.01
    ) {

        car.rotation.y +=
            steering *
            TURN_RATE *
            (speed / MAX_SPEED);
    }


    // ----------------------------------------
    // MOVE CAR
    // ----------------------------------------

    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    forward.applyQuaternion(
        car.quaternion
    );


    car.position.addScaledVector(
        forward,
        speed
    );


    // ----------------------------------------
    // KEEP CAR ON TERRAIN
    // ----------------------------------------

    car.position.y =
        terrainHeight(
            car.position.x,
            car.position.z
        );


    // ----------------------------------------
    // WHEEL ROTATION
    // ----------------------------------------

    for (
        const wheel of wheels
    ) {

        wheel.rotation.x -=
            speed * 3.5;
    }


    // ----------------------------------------
    // FRONT WHEEL STEERING
    // ----------------------------------------

    for (
        const wheel of steeringWheels
    ) {

        wheel.rotation.y =
            steering;
    }


    // ----------------------------------------
    // CAMERA
    // ----------------------------------------

    const cameraOffset =
        new THREE.Vector3(
            0,
            4.1,
            10.5
        );


    cameraOffset.applyQuaternion(
        car.quaternion
    );


    const desiredCamera =
        car.position.clone()
            .add(cameraOffset);


    camera.position.lerp(
        desiredCamera,
        0.075
    );


    const lookTarget =
        car.position.clone();

    lookTarget.y += 1.25;


    camera.lookAt(
        lookTarget
    );


    // ----------------------------------------
    // HUD
    // ----------------------------------------

    const displayedSpeed =
        Math.round(
            Math.abs(speed) * 55
        );


    document.getElementById(
        "speed"
    ).innerText =
        displayedSpeed;


    renderer.render(
        scene,
        camera
    );
}


animate();

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>
