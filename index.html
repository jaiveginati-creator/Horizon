const WORLD_SIZE =

// ============================================================
// TERRAIN
// ============================================================

function terrainHeight(
    x,
    z
) {

    const hills =

        Math.sin(
            x * 0.008
        ) * 3

        +

        Math.cos(
            z * 0.006
        ) * 4

        +

        Math.sin(
            (x + z) * 0.012
        ) * 2;


    const smallerHills =

        Math.sin(
            x * 0.022 +
            z * 0.013
        ) * 0.8

        +

        Math.cos(
            z * 0.018
        ) * 0.7;


    const cityFlatten =
        Math.exp(
            -(
                x * x +
                z * z
            ) / 180000
        );


    return (

        hills +
        smallerHills

    ) *

    (

        1 -
        cityFlatten *
        0.85

    );
}


// ============================================================
// TERRAIN MESH
// ============================================================

function createTerrain() {

    const geometry =
        new THREE.PlaneGeometry(

            WORLD_SIZE,
            WORLD_SIZE,

            140,
            140

        );


    geometry.rotateX(
        -Math.PI / 2
    );


    const position =
        geometry.attributes.position;


    for (
        let i = 0;
        i < position.count;
        i++
    ) {

        const x =
            position.getX(i);


        const z =
            position.getZ(i);


        position.setY(
            i,
            terrainHeight(
                x,
                z
            )
        );
    }


    geometry.computeVertexNormals();


    const material =
        new THREE.MeshStandardMaterial({

            color: 0x405b3d,

            roughness: 1

        });


    const terrain =
        new THREE.Mesh(
            geometry,
            material
        );


    terrain.receiveShadow =
        true;


    scene.add(
        terrain
    );
}


createTerrain();


// ============================================================
// ROAD SYSTEM
// ============================================================

function createRoad(
    x,
    z,
    width,
    length,
    rotation = 0
) {

    const segments =
        Math.max(
            20,
            Math.floor(
                length / 10
            )
        );


    const geometry =
        new THREE.PlaneGeometry(

            width,
            length,

            1,
            segments

        );


    geometry.rotateX(
        -Math.PI / 2
    );


    const position =
        geometry.attributes.position;


    const cos =
        Math.cos(
            rotation
        );


    const sin =
        Math.sin(
            rotation
        );


    for (
        let i = 0;
        i < position.count;
        i++
    ) {

        const localX =
            position.getX(i);


        const localZ =
            position.getZ(i);


        const worldX =

            x +

            localX * cos -

            localZ * sin;


        const worldZ =

            z +

            localX * sin +

            localZ * cos;


        position.setX(
            i,
            worldX - x
        );


        position.setZ(
            i,
            worldZ - z
        );


        position.setY(
            i,

            terrainHeight(
                worldX,
                worldZ
            ) + 0.14

        );
    }


    geometry.computeVertexNormals();


    const material =
        new THREE.MeshStandardMaterial({

            color: 0x202124,

            roughness: 0.92

        });


    const road =
        new THREE.Mesh(
            geometry,
            material
        );


    road.position.set(
        x,
        0,
        z
    );


    road.receiveShadow =
        true;


    scene.add(
        road
    );


    createRoadMarkings(
        x,
        z,
        width,
        length,
        rotation
    );
}


// ============================================================
// ROAD POINT
// ============================================================

function roadPoint(
    x,
    z,
    distance,
    rotation
) {

    return {

        x:
            x +
            Math.sin(rotation) *
            distance,

        z:
            z +
            Math.cos(rotation) *
            distance

    };
}


// ============================================================
// ROAD MARKINGS
// ============================================================

function createRoadMarkings(
    x,
    z,
    width,
    length,
    rotation
) {

    // CENTER DASHES

    for (
        let d = -length / 2 + 12;

        d < length / 2;

        d += 22
    ) {

        const p =
            roadPoint(
                x,
                z,
                d,
                rotation
            );


        const y =
            terrainHeight(
                p.x,
                p.z
            ) + 0.22;


        const geometry =
            new THREE.BoxGeometry(
                0.32,
                0.035,
                9
            );


        const material =
            new THREE.MeshStandardMaterial({

                color:
                    0xe5dfba,

                roughness:
                    0.8

            });


        const dash =
            new THREE.Mesh(
                geometry,
                material
            );


        dash.position.set(
            p.x,
            y,
            p.z
        );


        dash.rotation.y =
            rotation;


        scene.add(
            dash
        );
    }


    // ROAD EDGES

    const edgeOffset =
        width / 2 - 0.7;


    for (
        const side
        of [-1, 1]
    ) {

        for (
            let d = -length / 2;

            d < length / 2;

            d += 12
        ) {

            const p =
                roadPoint(
                    x,
                    z,
                    d,
                    rotation
                );


            const px =

                p.x +

                Math.cos(rotation) *
                edgeOffset *
                side;


            const pz =

                p.z -

                Math.sin(rotation) *
                edgeOffset *
                side;


            const y =
                terrainHeight(
                    px,
                    pz
                ) + 0.19;


            const geometry =
                new THREE.BoxGeometry(
                    0.25,
                    0.025,
                    10
                );


            const material =
                new THREE.MeshStandardMaterial({

                    color:
                        0xc9c9c9,

                    roughness:
                        0.9

                });


            const edge =
                new THREE.Mesh(
                    geometry,
                    material
                );


            edge.position.set(
                px,
                y,
                pz
            );


            edge.rotation.y =
                rotation;


            scene.add(
                edge
            );
        }
    }
}

// ============================================================
// CROSSWALKS
// ============================================================

function createCrosswalk(
    x,
    z,
    rotation
) {

    for (
        let i = -4;
        i <= 4;
        i++
    ) {

        const offset =
            i * 2.1;


        const px =
            x +

            Math.cos(rotation) *
            offset;


        const pz =
            z -

            Math.sin(rotation) *
            offset;


        const geometry =
            new THREE.BoxGeometry(
                1.2,
                0.035,
                8
            );


        const material =
            new THREE.MeshStandardMaterial({

                color:
                    0xe0e0e0

            });


        const stripe =
            new THREE.Mesh(
                geometry,
                material
            );


        stripe.position.set(

            px,

            terrainHeight(
                px,
                pz
            ) + 0.24,

            pz

        );


        stripe.rotation.y =
            rotation;


        scene.add(
            stripe
        );
    }
}


const intersections = [

    [105, 105],
    [105, -105],

    [-105, 105],
    [-105, -105],

    [210, 210],
    [210, -210],

    [-210, 210],
    [-210, -210],

    [315, 315],
    [315, -315],

    [-315, 315],
    [-315, -315]

];


for (
    const [
        x,
        z
    ]
    of intersections
) {

    createCrosswalk(
        x,
        z,
        0
    );


    createCrosswalk(
        x,
        z,
        Math.PI / 2
    );
}


// ============================================================
// PARKING LOTS
// ============================================================

function createParkingLot(
    x,
    z,
    width,
    depth,
    rotation = 0
) {

    const geometry =
        new THREE.PlaneGeometry(
            width,
            depth
        );


    geometry.rotateX(
        -Math.PI / 2
    );


    const material =
        new THREE.MeshStandardMaterial({

            color:
                0x303235,

            roughness:
                0.95

        });


    const lot =
        new THREE.Mesh(
            geometry,
            material
        );


    lot.position.set(

        x,

        terrainHeight(
            x,
            z
        ) + 0.12,

        z

    );


    lot.rotation.y =
        rotation;


    lot.receiveShadow =
        true;


    scene.add(
        lot
    );


    // Parking lines

    for (
        let i = -4;
        i <= 4;
        i++
    ) {

        const geometry =
            new THREE.BoxGeometry(
                0.12,
                0.025,
                depth - 8
            );


        const material =
            new THREE.MeshStandardMaterial({

                color:
                    0xbdbdbd

            });


        const line =
            new THREE.Mesh(
                geometry,
                material
            );


        const localX =
            i * 5;


        const px =
            x +

            localX *
            Math.cos(rotation);


        const pz =
            z +

            localX *
            Math.sin(rotation);


        line.position.set(

            px,

            terrainHeight(
                px,
                pz
            ) + 0.18,

            pz

        );


        line.rotation.y =
            rotation;


        scene.add(
            line
        );
    }
}


createParkingLot(

createParkingLot(

// ============================================================
// BUILDINGS
// ============================================================

const buildingFiles = [

    "assets/buildings/large-building.glb",

    "assets/buildings/store.glb",

    "assets/buildings/apartment.glb",

    "assets/buildings/large-building-2.glb",

    "assets/buildings/bank.glb"

];


const buildingTemplates = [];

const placedBuildings = [];


// ============================================================
// ROAD COLLISION
// ============================================================

function isBuildingOnRoad(
    x,
    z,
    radius = 58
) {

    // MAIN HIGHWAYS

    if (
        Math.abs(x) <
        15 + radius
    ) {

        return true;
    }


    if (
        Math.abs(z) <
        15 + radius
    ) {

        return true;
    }


    // MAJOR VERTICAL ROADS

    if (
        Math.abs(x - 330) <
        10 + radius
    ) {

        return true;
    }


    if (
        Math.abs(x + 330) <
        10 + radius
    ) {

        return true;
    }


    // MAJOR HORIZONTAL ROADS

    if (
        Math.abs(z - 360) <
        10 + radius
    ) {

        return true;
    }


    if (
        Math.abs(z + 360) <
        10 + radius
    ) {

        return true;
    }


    // CITY GRID

    for (
        let road = -420;

        road <= 420;

        road += 105
    ) {

        if (
            Math.abs(road) < 50
        ) {

            continue;
        }


        // Vertical road

        if (
            Math.abs(x - road) <
            4.5 + radius
        ) {

            return true;
        }


        // Horizontal road

        if (
            Math.abs(z - road) <
            4.5 + radius
        ) {

            return true;
        }
    }


    return false;
}


// ============================================================
// BUILDING COLLISION
// ============================================================

function buildingTooClose(
    x,
    z,
    radius
) {

    for (
        const building
        of placedBuildings
    ) {

        const dx =
            x -
            building.x;


        const dz =
            z -
            building.z;


        const distance =
            Math.sqrt(

                dx * dx +
                dz * dz

            );


        if (
            distance <
            radius +
            building.radius
        ) {

            return true;
        }
    }


    return false;
}


// ============================================================
// SOLID BUILDING CORE
// ============================================================

function addSolidBuildingCore(
    building
) {

    const box =
        new THREE.Box3()
            .setFromObject(
                building
            );


    const size =
        new THREE.Vector3();


    box.getSize(
        size
    );


    const coreWidth =
        Math.max(
            1,
            size.x * 0.72
        );


    const coreDepth =
        Math.max(
            1,
            size.z * 0.72
        );


    const coreHeight =
        Math.max(
            2,
            size.y * 0.92
        );


    const geometry =
        new THREE.BoxGeometry(

            coreWidth,
            coreHeight,
            coreDepth

        );


    const material =
        new THREE.MeshStandardMaterial({

            color:
                0x24262a,

            roughness:
                0.95,

            metalness:
                0

        });


    const core =
        new THREE.Mesh(
            geometry,
            material
        );


    core.position.y =
        coreHeight / 2 +
        0.15;


    core.castShadow =
        true;


    core.receiveShadow =
        true;


    building.add(
        core
    );
}


// ============================================================
// LOAD BUILDINGS
// ============================================================

async function loadBuildings() {

    for (
        const file
        of buildingFiles
    ) {

        try {

            const gltf =
                await loader.loadAsync(
                    file
                );


            const model =
                gltf.scene;


            // Normalize size

            const box =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const size =
                new THREE.Vector3();


            box.getSize(
                size
            );


            const largest =
                Math.max(

                    size.x,
                    size.y,
                    size.z

                );


            if (
                largest > 0
            ) {

                model.scale.setScalar(
                    32 / largest
                );
            }


            // Center model

            const centerBox =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const center =
                new THREE.Vector3();


            centerBox.getCenter(
                center
            );


            model.position.x -=
                center.x;


            model.position.z -=
                center.z;


            // Ground model

            const groundBox =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            model.position.y -=
                groundBox.min.y;


            // Materials

            model.traverse(
                child => {

                    if (
                        child.isMesh
                    ) {

                        child.castShadow =
                            true;

                        child.receiveShadow =
                            true;


                        if (
                            child.material
                        ) {

                            child.material.side =
                                THREE.DoubleSide;


                            child.material.roughness =
                                0.82;
                        }
                    }
                }
            );


            // SOLID INTERIOR

            addSolidBuildingCore(
                model
            );


            // Calculate actual footprint

            const finalBox =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const finalSize =
                new THREE.Vector3();


            finalBox.getSize(
                finalSize
            );


            const footprintRadius =
                Math.max(

                    finalSize.x,
                    finalSize.z

                ) * 0.55;


            buildingTemplates.push({

                model:
                    model,

                radius:
                    footprintRadius

            });


        } catch (
            error
        ) {

            console.warn(

                "Could not load building:",
                file,
                error

            );
        }
    }


    generateFinalCity();
}


// ============================================================
// ADD BUILDING
// ============================================================

function addBuilding(
    template,
    x,
    z,
    scale
) {

    const building =
        template.model.clone(
            true
        );


    building.scale.multiplyScalar(
        scale
    );


    building.rotation.y =
        Math.random() *
        Math.PI *
        2;


    building.position.set(

        x,

        terrainHeight(
            x,
            z
        ),

        z

    );


    building.traverse(
        child => {

            if (
                child.isMesh
            ) {

                child.castShadow =
                    true;

                child.receiveShadow =
                    true;
            }
        }
    );


    scene.add(
        building
    );


    placedBuildings.push({

        x:
            x,

        z:
            z,

        radius:
            template.radius *
            scale

    });
}


// ============================================================
// FINAL CITY
// ============================================================

function generateFinalCity() {

    if (
        buildingTemplates.length === 0
    ) {

        console.warn(
            "No building models loaded."
        );

        return;
    }


    // ========================================================
    // DOWNTOWN
    // ========================================================

    for (
        let x = -455;

        x <= 455;

        x += 70
    ) {

        for (
            let z = -455;

            z <= 455;

            z += 70
        ) {

            const bx =
                x +

                (
                    Math.random() -
                    0.5
                ) * 18;


            const bz =
                z +

                (
                    Math.random() -
                    0.5
                ) * 18;


            // HARD ROAD CHECK

            if (
                isBuildingOnRoad(
                    bx,
                    bz,
                    58
                )
            ) {

                continue;
            }


            // Parking lot clearance

            if (

                Math.abs(
                    bx - 65
                ) < 55 &&

                Math.abs(
                    bz - 65
                ) < 65

            ) {

                continue;
            }


            if (

                Math.abs(
                    bx + 65
                ) < 55 &&

                Math.abs(
                    bz + 65
                ) < 65

            ) {

                continue;
            }


            if (

                Math.abs(
                    bx - 275
                ) < 55 &&

                Math.abs(
                    bz - 275
                ) < 65

            ) {

                continue;
            }


            if (

                Math.abs(
                    bx + 275
                ) < 55 &&

                Math.abs(
                    bz + 275
                ) < 65

            ) {

                continue;
            }


            // Choose model

            const template =
                buildingTemplates[

                    Math.floor(

                        Math.random() *
                        buildingTemplates.length

                    )

                ];


            // Building size

            const scale =
                0.72 +

                Math.random() *
                0.58;


            const radius =
                template.radius *
                scale;


            // ACTUAL FOOTPRINT ROAD CHECK

            if (
                isBuildingOnRoad(
                    bx,
                    bz,
                    radius + 15
                )
            ) {

                continue;
            }


            // Building collision

            if (
                buildingTooClose(
                    bx,
                    bz,
                    radius + 8
                )
            ) {

                continue;
            }


            addBuilding(
                template,
                bx,
                bz,
                scale
            );
        }
    }


    // ========================================================
    // OUTSKIRTS
    // ========================================================

    for (
        let i = 0;

        i < 120;

        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;


        const distance =
            500 +

            Math.random() *
            500;


        const x =
            Math.cos(angle) *
            distance;


        const z =
            Math.sin(angle) *
            distance;


        if (
            isBuildingOnRoad(
                x,
                z,
                60
            )
        ) {

            continue;
        }


        const template =
            buildingTemplates[

                Math.floor(

                    Math.random() *
                    buildingTemplates.length

                )

            ];


        const scale =
            0.45 +

            Math.random() *
            0.45;


        const radius =
            template.radius *
            scale;


        if (
            isBuildingOnRoad(
                x,
                z,
                radius + 15
            )
        ) {

            continue;
        }


        if (
            buildingTooClose(
                x,
                z,
                radius + 10
            )
        ) {

            continue;
        }


        addBuilding(
            template,
            x,
            z,
            scale
        );
    }
}

let carModel =
    null;


const CAR_FILE =
    "https://jaiveginati-creator.github.io/Horizon/electric-car.glb";


async function loadCar() {

    try {

        const gltf =
            await loader.loadAsync(
                CAR_FILE
            );


        carModel =
            gltf.scene;


        // Scale

        const box =
            new THREE.Box3()
                .setFromObject(
                    carModel
                );


        const size =
            new THREE.Vector3();


        box.getSize(
            size
        );


        const largest =
            Math.max(

                size.x,
                size.y,
                size.z

            );


        if (
            largest > 0
        ) {

            carModel.scale.setScalar(
                4.9 / largest
            );
        }


        // Center X/Z

        const centerBox =
            new THREE.Box3()
                .setFromObject(
                    carModel
                );


        const center =
            new THREE.Vector3();


        centerBox.getCenter(
            center
        );


        carModel.position.x -=
            center.x;


        carModel.position.z -=
            center.z;


        // Rotate BEFORE calculating bottom

        carModel.rotation.y =
            Math.PI / 2;


        // Put wheels on ground

        const finalBox =
            new THREE.Box3()
                .setFromObject(
                    carModel
                );


        carModel.position.y -=
            finalBox.min.y -
            0.05;


        carModel.traverse(
            child => {

                if (
                    child.isMesh
                ) {

                    child.castShadow =
                        true;

                    child.receiveShadow =
                        true;
                }
            }
        );


        car.add(
            carModel
        );


        car.position.set(

            0,

            terrainHeight(
                0,
                80
            ),

            80

        );


        document.getElementById(
            "loading"
        ).style.display =
            "none";


    } catch (
        error
    ) {

        console.error(
            "CAR ERROR:",
            error
        );


        document.getElementById(
            "loading"
        ).textContent =
            "CAR FAILED TO LOAD";
    }
}

// ============================================================
// DRIVING SETTINGS
// ============================================================

const MAX_SPEED =
    0.75;


const MAX_REVERSE =
    0.28;


const ACCELERATION =
    0.008;


const REVERSE_ACCELERATION =
    0.005;


const BRAKE_POWER =
    0.035;


const FRICTION =
    0.006;


const MAX_STEERING =
    0.55;


const STEERING_RESPONSE =
    0.14;


const TURN_RATE =
    0.035;


let speed =
    0;


let steering =
    0;


// ============================================================
// CAR UPDATE
// ============================================================

function updateCar() {

    if (
        !carModel
    ) {

        return;
    }


    const accelerating =

        keys["w"] ||
        keys["arrowup"];


    const braking =

        keys["s"] ||
        keys["arrowdown"];


    const left =

        keys["a"] ||
        keys["arrowleft"];


    const right =

        keys["d"] ||
        keys["arrowright"];


    // ACCELERATE

    if (
        accelerating
    ) {

        if (
            speed <
            MAX_SPEED
        ) {

            speed +=
                ACCELERATION;
        }
    }


    // BRAKE / REVERSE

    else if (
        braking
    ) {

        if (
            speed > 0.05
        ) {

            speed -=
                BRAKE_POWER;

        } else {

            speed -=
                REVERSE_ACCELERATION;
        }
    }


    // FRICTION

    else {

        if (
            speed > 0
        ) {

            speed -=
                FRICTION;

        }

        else if (
            speed < 0
        ) {

            speed +=
                FRICTION;
        }
    }


    speed =
        THREE.MathUtils.clamp(

            speed,

            -MAX_REVERSE,

            MAX_SPEED

        );


    // STEERING

    let targetSteering =
        0;


    if (
        left
    ) {

        targetSteering =
            MAX_STEERING;
    }


    if (
        right
    ) {

        targetSteering =
            -MAX_STEERING;
    }


    steering +=

        (
            targetSteering -
            steering
        )

        *

        STEERING_RESPONSE;


    if (
        Math.abs(speed) >
        0.01
    ) {

        car.rotation.y +=

            steering *
            TURN_RATE *

            (
                speed >= 0
                    ? 1
                    : -1
            );
    }


    // FORWARD VECTOR

    const forward =
        new THREE.Vector3(

            0,
            0,
            -1

        );


    forward.applyQuaternion(
        car.quaternion
    );


    car.position.add(
        forward.multiplyScalar(
            speed
        )
    );


    // Terrain following

    car.position.y =
        terrainHeight(

            car.position.x,
            car.position.z

        );


    // World boundary

    const limit =
        WORLD_SIZE / 2 -
        80;


    car.position.x =
        THREE.MathUtils.clamp(

            car.position.x,

            -limit,
            limit

        );


    car.position.z =
        THREE.MathUtils.clamp(

            car.position.z,

            -limit,
            limit

        );


    // Speedometer

    document.getElementById(
        "speed"
    ).textContent =

        Math.round(

            Math.abs(speed) *
            55

        );
}


// ============================================================
// CAMERA
// ============================================================

const cameraTarget =
    new THREE.Vector3();


function updateCamera() {

    if (
        !carModel
    ) {

        return;
    }


    const offset =
        new THREE.Vector3(

            0,
            4.2,
            10.5

        );


    offset.applyQuaternion(
        car.quaternion
    );


    const desired =
        car.position.clone()
            .add(
                offset
            );


    camera.position.lerp(

        desired,

        0.075

    );


    cameraTarget.copy(
        car.position
    );


    cameraTarget.y +=
        1.3;


    camera.lookAt(
        cameraTarget
    );
}

let night =

function toggleNight() {

    night =

        scene.fog.color =

        sun.intensity =

        ambient.intensity =
            0.55;

        scene.background =
            new THREE.Color(
                0x8bb8d8
            );


        scene.fog.color =
            new THREE.Color(
                0x8bb8d8
            );


        sun.intensity =

    }
}

function animate() {

    requestAnimationFrame(

    updateCar();


    updateCamera();

    );
}
