let loadingProgress = 0;

function setLoading(text, progress) {

/* =========================================================
   SEEDED RANDOM
========================================================= */

function hash2D(x, z, seed = WORLD_SEED) {

    let h =
        Math.sin(
            x * 127.1 +
            z * 311.7 +
            seed * 74.7
        ) * 43758.5453;

    return h - Math.floor(h);
}

function randomRange(x, z, min, max, offset = 0) {

    return min +
        hash2D(
            x + offset * 17.3,
            z - offset * 29.7
        ) *
        (max - min);
}

/* =========================================================
   SMOOTH NOISE
========================================================= */

function smooth(t) {

    return t * t * (3 - 2 * t);
}

function noise2D(x, z, scale = 1) {

    x /= scale;
    z /= scale;

    const x0 = Math.floor(x);
    const z0 = Math.floor(z);

    const x1 = x0 + 1;
    const z1 = z0 + 1;

    const sx = smooth(x - x0);
    const sz = smooth(z - z0);

    const n00 = hash2D(x0, z0);
    const n10 = hash2D(x1, z0);
    const n01 = hash2D(x0, z1);
    const n11 = hash2D(x1, z1);

    const nx0 = THREE.MathUtils.lerp(
        n00,
        n10,
        sx
    );

    const nx1 = THREE.MathUtils.lerp(
        n01,
        n11,
        sx
    );

    return THREE.MathUtils.lerp(
        nx0,
        nx1,
        sz
    );
}

/* =========================================================
   TERRAIN
========================================================= */

function terrainHeight(x, z) {

    const distance =
        Math.sqrt(x * x + z * z);

    const broad =
        noise2D(x, z, 420);

    const medium =
        noise2D(x + 100, z - 200, 160);

    const small =
        noise2D(x - 500, z + 300, 55);

    let height =
        (broad - 0.5) * 28 +
        (medium - 0.5) * 9 +
        (small - 0.5) * 2.5;

    /*
        Keep the central city relatively flat.
    */

    const cityBlend =
        1 -
        THREE.MathUtils.smoothstep(
            350,
            CITY_LIMIT,
            distance
        );

    height *= 1 - cityBlend * 0.72;

    /*
        Coastline.
    */

    const coastNoise =
        noise2D(
            x + 800,
            z - 500,
            600
        );

    const coastZone =
        coastNoise < 0.28 &&
        distance > 700;

    if (coastZone) {

        height =
            Math.max(
                height,
                -2.5
            );
    }

    return height;
}

/* =========================================================
   BIOMES
========================================================= */

function getBiome(x, z) {

    const d =
        Math.sqrt(x * x + z * z);

    const n =
        noise2D(x + 1000, z - 400, 520);

    const n2 =
        noise2D(x - 700, z + 900, 250);

    if (d < 350)
        return "downtown";

    if (
        d < 720 &&
        n2 > 0.58
    )
        return "suburbs";

    if (
        d < 900 &&
        n2 < 0.24
    )
        return "industrial";

    if (
        d > 700 &&
        n < 0.23
    )
        return "coast";

    if (
        n > 0.74
    )
        return "mountain";

    if (
        n2 > 0.72
    )
        return "forest";

    return "countryside";
}

/* =========================================================
   ROAD SYSTEM
========================================================= */

function roadCandidatesAlongZ(z) {

    const result = [];

    const major =
        Math.round(z / 240) * 240;

    if (
        Math.abs(major) <= CITY_LIMIT
    ) {

        result.push({
            center: major,
            width: 26,
            type: "major"
        });
    }

    const local =
        Math.round(z / 80) * 80;

    if (
        Math.abs(local) <= CITY_LIMIT
    ) {

        result.push({
            center: local,
            width: 13,
            type: "local"
        });
    }

    const highway =
        Math.round(z / 480) * 480;

    result.push({
        center: highway,
        width: 20,
        type: "highway"
    });

    return result;
}

function roadCandidatesAlongX(x) {

    const result = [];

    const major =
        Math.round(x / 240) * 240;

    if (
        Math.abs(major) <= CITY_LIMIT
    ) {

        result.push({
            center: major,
            width: 26,
            type: "major"
        });
    }

    const local =
        Math.round(x / 80) * 80;

    if (
        Math.abs(local) <= CITY_LIMIT
    ) {

        result.push({
            center: local,
            width: 13,
            type: "local"
        });
    }

    const highway =
        Math.round(x / 480) * 480;

    result.push({
        center: highway,
        width: 20,
        type: "highway"
    });

    return result;
}

function getRoadAt(x, z) {

    let best = null;

    const horizontal =
        roadCandidatesAlongZ(z);

    for (const r of horizontal) {

        const distance =
            Math.abs(z - r.center);

        if (
            distance <= r.width / 2
        ) {

            if (
                !best ||
                r.width > best.width
            ) {

                best = {
                    axis: "horizontal",
                    center: r.center,
                    width: r.width,
                    type: r.type
                };
            }
        }
    }

    const vertical =
        roadCandidatesAlongX(x);

    for (const r of vertical) {

        const distance =
            Math.abs(x - r.center);

        if (
            distance <= r.width / 2
        ) {

            if (
                !best ||
                r.width > best.width
            ) {

                best = {
                    axis: "vertical",
                    center: r.center,
                    width: r.width,
                    type: r.type
                };
            }
        }
    }

    return best;
}

function roadClearance(x, z) {

    let best = Infinity;

    for (
        const r of roadCandidatesAlongZ(z)
    ) {

        best = Math.min(
            best,
            Math.abs(z - r.center) -
            r.width / 2
        );
    }

    for (
        const r of roadCandidatesAlongX(x)
    ) {

        best = Math.min(
            best,
            Math.abs(x - r.center) -
            r.width / 2
        );
    }

    return best;
}

function isRoadClear(x, z, radius = 3) {

    return roadClearance(x, z) > radius;
}

/* =========================================================
   WORLD ROAD STRIPS
========================================================= */

function createWorldStrip(
    centerX,
    centerZ,
    axis,
    width,
    length,
    lift,
    material
) {

    const across = 2;
    const along = 18;

    const geometry =
        new THREE.PlaneGeometry(
            width,
            length,
            across,
            along
        );

    geometry.rotateX(-Math.PI / 2);

    const pos =
        geometry.attributes.position;

    for (
        let i = 0;
        i < pos.count;
        i++
    ) {

        let lx = pos.getX(i);
        let lz = pos.getZ(i);

        let wx;
        let wz;

        if (
            axis === "horizontal"
        ) {

            wx = centerX + lz;
            wz = centerZ + lx;

        } else {

            wx = centerX + lx;
            wz = centerZ + lz;
        }

        pos.setXYZ(
            i,
            wx,
            terrainHeight(wx, wz) + lift,
            wz
        );
    }

    pos.needsUpdate = true;

    geometry.computeVertexNormals();

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.receiveShadow = true;

    mesh.userData.worldGenerated = true;

    return mesh;
}

========================================================= */

const roadMaterial =

/* =========================================================
   ROAD CREATION
========================================================= */

function addRoadSegment(
    group,
    centerX,
    centerZ,
    axis,
    width,
    length,
    type
) {

    /*
        Slightly wider foundation prevents terrain/grass
        from showing through the road edges.
    */

    const shoulder =
        createWorldStrip(
            centerX,
            centerZ,
            axis,
            width + 2.5,
            length + 3,
            ROAD_LIFT - 0.06,
            roadShoulderMaterial
        );

    group.add(shoulder);

    const road =
        createWorldStrip(
            centerX,
            centerZ,
            axis,
            width,
            length,
            ROAD_LIFT,
            roadMaterial
        );

    group.add(road);

    /*
        Center marking.
    */

    const lineWidth =
        type === "highway"
            ? 0.25
            : 0.18;

    const centerLine =
        createWorldStrip(
            centerX,
            centerZ,
            axis,
            lineWidth,
            length,
            ROAD_MARK_LIFT,
            lineMaterial
        );

    group.add(centerLine);

    /*
        Edge markings.
    */

    if (type !== "local") {

        const edge1 =
            createWorldStrip(
                centerX,
                centerZ,
                axis,
                0.14,
                length,
                ROAD_MARK_LIFT + 0.015,
                whiteLineMaterial
            );

        const edge2 =
            createWorldStrip(
                centerX,
                centerZ,
                axis,
                0.14,
                length,
                ROAD_MARK_LIFT + 0.015,
                whiteLineMaterial
            );

        /*
            Move edges sideways from the road center.
        */

        if (axis === "horizontal") {

            edge1.position.z =
                -width / 2 + 1;

            edge2.position.z =
                width / 2 - 1;

        } else {

            edge1.position.x =
                -width / 2 + 1;

            edge2.position.x =
                width / 2 - 1;
        }

        group.add(edge1);
        group.add(edge2);
    }
}

/* =========================================================
   ROAD GENERATION
========================================================= */

function generateRoads(group, cx, cz) {

    const minX =
        cx * CHUNK_SIZE;

    const maxX =
        minX + CHUNK_SIZE;

    const minZ =
        cz * CHUNK_SIZE;

    const maxZ =
        minZ + CHUNK_SIZE;

    /*
        Horizontal roads.

        IMPORTANT:
        We extend the search beyond the chunk edges so
        roads continue correctly between chunks.
    */

    const zStart =
        Math.floor(
            (minZ - ROAD_MAX_WIDTH) / 80
        ) * 80;

    const zEnd =
        maxZ + ROAD_MAX_WIDTH;

    for (
        let z = zStart;
        z <= zEnd;
        z += 80
    ) {

        const candidates =
            roadCandidatesAlongZ(z);

        for (const r of candidates) {

            if (
                Math.abs(z - r.center) >
                ROAD_MAX_WIDTH
            )
                continue;

            /*
                Local road candidate only exists when its
                center is this candidate.
            */

            if (
                Math.abs(
                    r.center - z
                ) > 0.1
            )
                continue;

            addRoadSegment(
                group,
                (minX + maxX) / 2,
                r.center,
                "horizontal",
                r.width,
                CHUNK_SIZE + ROAD_OVERLAP,
                r.type
            );
        }
    }

    /*
        Vertical roads.
    */

    const xStart =
        Math.floor(
            (minX - ROAD_MAX_WIDTH) / 80
        ) * 80;

    const xEnd =
        maxX + ROAD_MAX_WIDTH;

    for (
        let x = xStart;
        x <= xEnd;
        x += 80
    ) {

        const candidates =
            roadCandidatesAlongX(x);

        for (const r of candidates) {

            if (
                Math.abs(x - r.center) >
                ROAD_MAX_WIDTH
            )
                continue;

            if (
                Math.abs(
                    r.center - x
                ) > 0.1
            )
                continue;

            addRoadSegment(
                group,
                r.center,
                (minZ + maxZ) / 2,
                "vertical",
                r.width,
                CHUNK_SIZE + ROAD_OVERLAP,
                r.type
            );
        }
    }
}

/* =========================================================
   TREES
========================================================= */

function createTree(
    x,
    y,
    z,
    scale = 1,
    variant = 0
) {

    const tree =
        new THREE.Group();

    const trunk =
        new THREE.Mesh(
            trunkGeometry,
            trunkMaterial
        );

    trunk.position.y = 1.2;

    trunk.scale.setScalar(scale);

    trunk.castShadow = true;

    trunk.userData.sharedGeometry = true;

    tree.add(trunk);

    const leaves =
        new THREE.Mesh(
            leafGeometry,
            leafMaterials[
                variant %
                leafMaterials.length
            ]
        );

    leaves.position.y =
        3.0 * scale;

    leaves.scale.setScalar(scale);

    leaves.castShadow = true;

    leaves.userData.sharedGeometry = true;

    tree.add(leaves);

    tree.position.set(
        x,
        y,
        z
    );

    tree.rotation.y =
        randomRange(
            Math.floor(x),
            Math.floor(z),
            0,
            Math.PI * 2,
            4
        );

    return tree;
}

/* =========================================================
   BUILDING ASSETS
========================================================= */

const buildingTemplates = [];

const BUILDING_PATHS = [

    "./assets/buildings/large-building.glb",
    "./assets/buildings/store.glb",
    "./assets/buildings/apartment.glb",
    "./assets/buildings/large-building-2.glb",
    "./assets/buildings/bank.glb"
];

async function loadBuilding(path) {

    try {

        const gltf =
            await loader.loadAsync(path);

        const root =
            gltf.scene;

        root.traverse(obj => {

            if (obj.isMesh) {

                obj.castShadow = true;
                obj.receiveShadow = true;

                obj.userData.sharedGeometry = true;
            }
        });

        /*
            Normalize building to sit on ground.
        */

        const box =
            new THREE.Box3()
                .setFromObject(root);

        const size =
            new THREE.Vector3();

        box.getSize(size);

        const center =
            new THREE.Vector3();

        box.getCenter(center);

        root.position.x -= center.x;
        root.position.z -= center.z;
        root.position.y -= box.min.y;

        const maxDimension =
            Math.max(
                size.x,
                size.y,
                size.z
            );

        if (maxDimension > 40) {

            root.scale.setScalar(
                35 / maxDimension
            );
        }

        root.userData.sharedBuilding = true;

        return root;

    } catch (error) {

        console.warn(
            "Building failed:",
            path,
            error
        );

        return null;
    }
}

async function loadBuildings() {

    setLoading(
        "LOADING BUILDINGS...",
        10
    );

    for (
        let i = 0;
        i < BUILDING_PATHS.length;
        i++
    ) {

        const model =
            await loadBuilding(
                BUILDING_PATHS[i]
            );

        if (model) {

            buildingTemplates.push(
                model
            );
        }

        setLoading(
            "LOADING BUILDINGS...",
            10 + i * 8
        );
    }
}

    const colors = [
        0xb8b5ad,
        0x8e969e,
        0xc5a88d,
        0x737c83,
        0x9c9a92
    ];

    const width =
        type === 0 ? 12 :
        type === 1 ? 18 :
        type === 2 ? 9 :
        15;

    const depth =
        type === 0 ? 12 :
        type === 1 ? 16 :
        type === 2 ? 10 :
        14;

    const height =
        type === 0 ? 12 :
        type === 1 ? 22 :
        type === 2 ? 8 :
        16;

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:
                colors[
                    type %
                    colors.length
                ],
            roughness: 0.85
        });

    const body =
        new THREE.Mesh(
            geometry,
            material
        );

    body.position.y =
        height / 2;

    body.castShadow = true;
    body.receiveShadow = true;

    body.userData.sharedGeometry = false;

    group.add(body);

    /*
        Roof.
    */

    if (type === 2) {

        const roof =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    width + 0.5,
                    0.6,
                    depth + 0.5
                ),
                material
            );

        roof.position.y =
            height + 0.3;

        roof.castShadow = true;

        group.add(roof);
    }

    return group;
}

/* =========================================================
   BUILDING ROAD COLLISION
========================================================= */

function buildingTouchesRoad(
    x,
    z,
    halfX,
    halfZ,
    rotation
) {

    const cos =
        Math.abs(
            Math.cos(rotation)
        );

    const sin =
        Math.abs(
            Math.sin(rotation)
        );

    const projectedX =
        halfX * cos +
        halfZ * sin;

    const projectedZ =
        halfX * sin +
        halfZ * cos;

    const extra = 4;

    for (
        const r of roadCandidatesAlongZ(z)
    ) {

        if (
            Math.abs(
                z - r.center
            ) <
            r.width / 2 +
            projectedZ +
            extra
        ) {

            return true;
        }
    }

    for (
        const r of roadCandidatesAlongX(x)
    ) {

        if (
            Math.abs(
                x - r.center
            ) <
            r.width / 2 +
            projectedX +
            extra
        ) {

            return true;
        }
    }

    return false;
}

/* =========================================================
   BUILDINGS
========================================================= */

function generateBuildings(
    group,
    cx,
    cz,
    biome
) {

    let amount = 0;

    if (biome === "downtown")
        amount = 13;

    else if (biome === "suburbs")
        amount = 9;

    else if (biome === "industrial")
        amount = 7;

    else if (biome === "countryside")
        amount = 3;

    else if (biome === "coast")
        amount = 3;

    else
        amount = 1;

    const lots = [];

    group.userData.buildingLots = lots;

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const sx =
            cx * 100 +
            i * 31;

        const sz =
            cz * 100 +
            i * 47;

        let placed = false;

        for (
            let attempt = 0;
            attempt < 18 && !placed;
            attempt++
        ) {

            const x =
                cx * CHUNK_SIZE +
                randomRange(
                    sx + attempt,
                    sz,
                    18,
                    CHUNK_SIZE - 18,
                    1
                );

            const z =
                cz * CHUNK_SIZE +
                randomRange(
                    sx,
                    sz + attempt,
                    18,
                    CHUNK_SIZE - 18,
                    2
                );

            const rotation =
                randomRange(
                    sx + attempt,
                    sz + attempt,
                    0,
                    Math.PI * 2,
                    3
                );

            let halfX = 7;
            let halfZ = 7;

            if (
                biome === "downtown"
            ) {

                halfX = 8;
                halfZ = 8;

            } else if (
                biome === "industrial"
            ) {

                halfX = 13;
                halfZ = 10;

            } else if (
                biome === "suburbs"
            ) {

                halfX = 6;
                halfZ = 6;
            }

            if (
                buildingTouchesRoad(
                    x,
                    z,
                    halfX,
                    halfZ,
                    rotation
                )
            )
                continue;

            /*
                Avoid extreme terrain.
            */

            const y =
                terrainHeight(x, z);

            if (
                y < -1.5 ||
                y > 18
            )
                continue;

            /*
                Avoid existing buildings.
            */

            let overlaps = false;

            for (const lot of lots) {

                const dx =
                    x - lot.x;

                const dz =
                    z - lot.z;

                const minDistance =
                    lot.radius +
                    Math.max(
                        halfX,
                        halfZ
                    ) +
                    5;

                if (
                    dx * dx +
                    dz * dz <
                    minDistance *
                    minDistance
                ) {

                    overlaps = true;
                    break;
                }
            }

            if (overlaps)
                continue;

            let building;

            if (
                buildingTemplates.length > 0
            ) {

                const index =
                    Math.floor(
                        randomRange(
                            sx,
                            sz,
                            0,
                            buildingTemplates.length,
                            7
                        )
                    );

                const template =
                    buildingTemplates[
                        Math.min(
                            index,
                            buildingTemplates.length - 1
                        )
                    ];

                building =
                    template.clone(true);

                const scale =
                    biome === "downtown"
                        ? randomRange(
                            sx,
                            sz,
                            0.85,
                            1.45,
                            8
                        )
                        : randomRange(
                            sx,
                            sz,
                            0.7,
                            1.15,
                            8
                        );

                building.scale.multiplyScalar(
                    scale
                );

            } else {

                let type = 0;

                if (
                    biome === "industrial"
                )
                    type = 1;

                else if (
                    biome === "suburbs"
                )
                    type = 2;

                else if (
                    biome === "downtown"
                )
                    type = 3;

                building =
                    createFallbackBuilding(
                        type
                    );
            }

            building.position.set(
                x,
                y,
                z
            );

            building.rotation.y =
                rotation;

            group.add(building);

            lots.push({
                x,
                z,
                radius:
                    Math.max(
                        halfX,
                        halfZ
                    )
            });

            placed = true;
        }
    }
}

/* =========================================================
   TREES / VEGETATION
========================================================= */

function generateVegetation(
    group,
    cx,
    cz,
    biome
) {

    let count;

    switch (biome) {

        case "forest":
            count = 30;
            break;

        case "countryside":
            count = 18;
            break;

        case "suburbs":
            count = 11;
            break;

        case "coast":
            count = 10;
            break;

        case "mountain":
            count = 12;
            break;

        case "downtown":
            count = 5;
            break;

        case "industrial":
            count = 4;
            break;

        default:
            count = 10;
    }

    const lots =
        group.userData.buildingLots ||
        [];

    for (
        let i = 0;
        i < count;
        i++
    ) {

        const x =
            cx * CHUNK_SIZE +
            randomRange(
                cx * 19 + i,
                cz * 37,
                10,
                CHUNK_SIZE - 10,
                20
            );

        const z =
            cz * CHUNK_SIZE +
            randomRange(
                cx * 53,
                cz * 71 + i,
                10,
                CHUNK_SIZE - 10,
                21
            );

        const treeRadius =
            biome === "forest"
                ? 4
                : 3;

        /*
            This is the important part:
            trees can NEVER be placed on roads.
        */

        if (
            !isRoadClear(
                x,
                z,
                treeRadius
            )
        )
            continue;

        let nearBuilding = false;

        for (const lot of lots) {

            const dx =
                x - lot.x;

            const dz =
                z - lot.z;

            if (
                dx * dx +
                dz * dz <
                Math.pow(
                    lot.radius + 5,
                    2
                )
            ) {

                nearBuilding = true;
                break;
            }
        }

        if (nearBuilding)
            continue;

        const y =
            terrainHeight(x, z);

        if (
            y < -1.5 ||
            y > 30
        )
            continue;

        const scale =
            randomRange(
                x,
                z,
                0.65,
                biome === "forest"
                    ? 1.35
                    : 1.05,
                22
            );

        const tree =
            createTree(
                x,
                y,
                z,
                scale,
                Math.floor(
                    randomRange(
                        x,
                        z,
                        0,
                        3,
                        23
                    )
                )
            );

        group.add(tree);
    }

    /*
        Bushes.
    */

    const bushCount =
        biome === "forest"
            ? 18
            : biome === "countryside"
                ? 12
                : 5;

    for (
        let i = 0;
        i < bushCount;
        i++
    ) {

        const x =
            cx * CHUNK_SIZE +
            randomRange(
                cx * 91 + i,
                cz * 41,
                8,
                CHUNK_SIZE - 8,
                30
            );

        const z =
            cz * CHUNK_SIZE +
            randomRange(
                cx * 27,
                cz * 83 + i,
                8,
                CHUNK_SIZE - 8,
                31
            );

        if (
            !isRoadClear(
                x,
                z,
                3
            )
        )
            continue;

        const bush =
            new THREE.Mesh(
                bushGeometry,
                bushMaterials[
                    i %
                    bushMaterials.length
                ]
            );

        bush.position.set(
            x,
            terrainHeight(x, z) + 0.45,
            z
        );

        bush.scale.set(
            randomRange(
                x,
                z,
                0.6,
                1.2,
                32
            ),
            randomRange(
                x,
                z,
                0.5,
                0.9,
                33
            ),
            randomRange(
                x,
                z,
                0.6,
                1.2,
                34
            )
        );

        bush.castShadow = true;

        bush.userData.sharedGeometry = true;

        group.add(bush);
    }
}

/* =========================================================
   CHUNK GENERATION
========================================================= */

function generateChunk(
    cx,
    cz
) {

    const key =
        `${cx},${cz}`;

    if (
        chunks.has(key)
    )
        return;

    const group =
        new THREE.Group();

    group.name =
        `Chunk_${cx}_${cz}`;

    group.userData.cx = cx;
    group.userData.cz = cz;

    const centerX =
        cx * CHUNK_SIZE +
        CHUNK_SIZE / 2;

    const centerZ =
        cz * CHUNK_SIZE +
        CHUNK_SIZE / 2;

    const biome =
        getBiome(
            centerX,
            centerZ
        );

    group.userData.biome =
        biome;

    /*
        =====================================================
        GROUND
        =====================================================

        Every single chunk gets a ground mesh.

        This is what fixes the "grass stops after spawn"
        problem.
    */

    const groundGeometry =
        new THREE.PlaneGeometry(
            CHUNK_SIZE + 4,
            CHUNK_SIZE + 4,
            18,
            18
        );

    groundGeometry.rotateX(
        -Math.PI / 2
    );

    const pos =
        groundGeometry.attributes.position;

    for (
        let i = 0;
        i < pos.count;
        i++
    ) {

        const lx =
            pos.getX(i);

        const lz =
            pos.getZ(i);

        const wx =
            centerX + lx;

        const wz =
            centerZ + lz;

        pos.setY(
            i,
            terrainHeight(
                wx,
                wz
            )
        );
    }

    pos.needsUpdate = true;

    groundGeometry.computeVertexNormals();

    const grassColors = {

        downtown: 0x5b714c,
        suburbs: 0x628052,
        industrial: 0x59684d,
        countryside: 0x708955,
        forest: 0x45663d,
        mountain: 0x65705c,
        coast: 0x789064
    };

    const groundMaterial =
        new THREE.MeshStandardMaterial({
            color:
                grassColors[biome] ||
                0x63784e,
            roughness: 1,
            metalness: 0
        });

    const ground =
        new THREE.Mesh(
            groundGeometry,
            groundMaterial
        );

    ground.receiveShadow = true;

    group.add(ground);

    /*
        Add world features.
    */

    generateWater(
        group,
        cx,
        cz,
        biome
    );

    generateRoads(
        group,
        cx,
        cz
    );

    generateBuildings(
        group,
        cx,
        cz,
        biome
    );

    generateVegetation(
        group,
        cx,
        cz,
        biome
    );

    generateRocks(
        group,
        cx,
        cz,
        biome
    );

    generateMountains(
        group,
        cx,
        cz,
        biome
    );

    generateStreetLights(
        group,
        cx,
        cz,
        biome
    );

    scene.add(group);

    chunks.set(
        key,
        group
    );
}

/* =========================================================
   DISPOSAL
========================================================= */

function disposeGroup(group) {

    group.traverse(obj => {

        if (
            !obj.isMesh
        )
            return;

        /*
            Building and nature geometry is shared.

            NEVER dispose it here.
        */

        if (
            obj.userData.sharedGeometry
        )
            return;

        if (
            obj.geometry
        ) {

            obj.geometry.dispose();
        }

        /*
            Only dispose materials that were
            created specifically for this object.
        */

        if (
            obj.material &&
            obj.userData.ownedMaterial
        ) {

            if (
                Array.isArray(
                    obj.material
                )
            ) {

                obj.material.forEach(
                    m => m.dispose()
                );

            } else {

                obj.material.dispose();
            }
        }
    });
}

/* =========================================================
   UNLOAD
========================================================= */

function unloadChunk(
    cx,
    cz
) {

    const key =
        `${cx},${cz}`;

    const chunk =
        chunks.get(key);

    if (!chunk)
        return;

    scene.remove(chunk);

    disposeGroup(chunk);

    chunks.delete(key);
}

/* =========================================================
   STREAM WORLD
========================================================= */

function updateWorldStreaming(
    carX,
    carZ,
    force = false
) {

    const cx =
        Math.floor(
            carX / CHUNK_SIZE
        );

    const cz =
        Math.floor(
            carZ / CHUNK_SIZE
        );

    if (
        !force &&
        cx === lastChunkX &&
        cz === lastChunkZ
    )
        return;

    lastChunkX = cx;
    lastChunkZ = cz;

    /*
        Generate surrounding chunks.
    */

    for (
        let x = cx - LOAD_RADIUS;
        x <= cx + LOAD_RADIUS;
        x++
    ) {

        for (
            let z = cz - LOAD_RADIUS;
            z <= cz + LOAD_RADIUS;
            z++
        ) {

            generateChunk(
                x,
                z
            );
        }
    }

    /*
        Unload distant chunks.
    */

    for (
        const [key, chunk]
        of chunks
    ) {

        const dx =
            chunk.userData.cx -
            cx;

        const dz =
            chunk.userData.cz -
            cz;

        if (
            Math.abs(dx) >
                UNLOAD_RADIUS ||
            Math.abs(dz) >
                UNLOAD_RADIUS
        ) {

            unloadChunk(
                chunk.userData.cx,
                chunk.userData.cz
            );
        }
    }
}

/* =========================================================
   SURFACE HEIGHT
========================================================= */

function getSurfaceHeight(
    x,
    z
) {

    const terrain =
        terrainHeight(
            x,
            z
        );

    const road =
        getRoadAt(
            x,
            z
        );

    if (road) {

        return terrain +
            ROAD_LIFT;
    }

    return terrain;
}

let carRoot = null;

let carLoadedFromGLB = false;

const carGroup =
    new THREE.Group();

scene.add(carGroup);

const CAR_MODEL_PATHS = [

    "./assets/car.glb",
    "./assets/golden-hour-coastal-supercar.glb",
    "./assets/golden-hour-coastal-supercar/GG.glb"
];

function createFallbackCar() {

    const car =
        new THREE.Group();

    const bodyMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xd98a38,
            metalness: 0.75,
            roughness: 0.25
        });

    const darkMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x111317,
            metalness: 0.5,
            roughness: 0.3
        });

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.4,
                0.48,
                4.8
            ),
            bodyMaterial
        );

    body.position.y =
        0.65;

    body.castShadow = true;

    car.add(body);

    const cabin =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.75,
                0.55,
                2
            ),
            darkMaterial
        );

    cabin.position.set(
        0,
        1.02,
        -0.15
    );

    cabin.castShadow = true;

    car.add(cabin);

    const wheelGeometry =
        new THREE.CylinderGeometry(
            0.42,
            0.42,
            0.28,
            16
        );

    for (
        const x of [-1.05, 1.05]
    ) {

        for (
            const z of [-1.55, 1.55]
        ) {

            const wheel =
                new THREE.Mesh(
                    wheelGeometry,
                    darkMaterial
                );

            wheel.rotation.z =
                Math.PI / 2;

            wheel.position.set(
                x,
                0.42,
                z
            );

            wheel.castShadow = true;

            car.add(wheel);
        }
    }

    return car;
}

async function loadCar() {

    setLoading(
        "LOADING GOLDEN HOUR SUPERCAR...",
        60
    );

    for (
        const path of CAR_MODEL_PATHS
    ) {

        try {

            const gltf =
                await loader.loadAsync(path);

            carRoot =
                gltf.scene;

            carLoadedFromGLB =
                true;

            carRoot.traverse(
                obj => {

                    if (
                        obj.isMesh
                    ) {

                        obj.castShadow = true;
                        obj.receiveShadow = true;
                    }
                }
            );

            /*
                Normalize the model.
            */

            const box =
                new THREE.Box3()
                    .setFromObject(
                        carRoot
                    );

            const size =
                new THREE.Vector3();

            box.getSize(size);

            const maxSize =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );

            if (
                maxSize > 0
            ) {

                carRoot.scale.setScalar(
                    5.0 / maxSize
                );
            }

            /*
                Recalculate after scale.
            */

            const scaledBox =
                new THREE.Box3()
                    .setFromObject(
                        carRoot
                    );

            carRoot.position.y -=
                scaledBox.min.y;

            carGroup.add(
                carRoot
            );

            document.getElementById(
                "carStatus"
            ).textContent =
                "GOLDEN HOUR COASTAL SUPERCAR";

            console.log(
                "REAL CAR MODEL LOADED:",
                path
            );

            return;

        } catch (error) {

            console.warn(
                "Car model failed:",
                path
            );
        }
    }

    /*
        Only reaches here if every path failed.
    */

    console.warn(
        "REAL CAR MODEL NOT FOUND. USING FALLBACK."
    );

    carRoot =
        createFallbackCar();

    carGroup.add(
        carRoot
    );

    document.getElementById(
        "carStatus"
    ).textContent =
        "CAR MODEL NOT FOUND — FALLBACK";

}

/* =========================================================
   CAR PHYSICS
========================================================= */

const keys = {};

let speed = 0;

let steering = 0;

const MAX_SPEED =
    1.55;

const REVERSE_SPEED =
    -0.65;

const ACCELERATION =
    0.035;

const BRAKE_FORCE =
    0.075;

const DRAG =
    0.012;

const STEERING_SPEED =
    0.055;

window.addEventListener(
    "keydown",
    event => {

        keys[
            event.key.toLowerCase()
        ] = true;

        if (
            [
                "arrowup",
                "arrowdown",
                "arrowleft",
                "arrowright",
                " "
            ].includes(
                event.key.toLowerCase()
            )
        ) {

            event.preventDefault();
        }

        if (
            event.key.toLowerCase() === "n"
        ) {

            toggleNight();
        }
    }
);

window.addEventListener(
    "keyup",
    event => {

        keys[
            event.key.toLowerCase()
        ] = false;
    }
);

window.addEventListener(
    "blur",
    () => {

        for (
            const key in keys
        )
            keys[key] = false;
    }
);

/* =========================================================
   BUILDING COLLISION
========================================================= */

function collidesWithBuildings(
    x,
    z
) {

    const cx =
        Math.floor(
            x / CHUNK_SIZE
        );

    const cz =
        Math.floor(
            z / CHUNK_SIZE
        );

    for (
        let ox = -1;
        ox <= 1;
        ox++
    ) {

        for (
            let oz = -1;
            oz <= 1;
            oz++
        ) {

            const chunk =
                chunks.get(
                    `${cx + ox},${cz + oz}`
                );

            if (!chunk)
                continue;

            const lots =
                chunk.userData.buildingLots ||
                [];

            for (
                const lot of lots
            ) {

                const dx =
                    x - lot.x;

                const dz =
                    z - lot.z;

                const distance =
                    Math.sqrt(
                        dx * dx +
                        dz * dz
                    );

                if (
                    distance <
                    lot.radius + 2.5
                )
                    return true;
            }
        }
    }

    return false;
}

/* =========================================================
   CAR UPDATE
========================================================= */

function updateCar() {

    if (
        !worldReady
    )
        return;

    const accelerating =
        keys["w"] ||
        keys["arrowup"];

    const reversing =
        keys["s"] ||
        keys["arrowdown"];

    const braking =
        keys[" "];

    const turningLeft =
        keys["a"] ||
        keys["arrowleft"];

    const turningRight =
        keys["d"] ||
        keys["arrowright"];

    if (
        accelerating
    ) {

        speed +=
            ACCELERATION;

    } else if (
        reversing
    ) {

        speed -=
            ACCELERATION * 0.75;

    } else {

        if (
            speed > 0
        ) {

            speed -= DRAG;

            if (
                speed < 0
            )
                speed = 0;

        } else if (
            speed < 0
        ) {

            speed += DRAG;

            if (
                speed > 0
            )
                speed = 0;
        }
    }

    if (
        braking
    ) {

        if (
            speed > 0
        )
            speed -= BRAKE_FORCE;

        else if (
            speed < 0
        )
            speed += BRAKE_FORCE;
    }

    speed =
        THREE.MathUtils.clamp(
            speed,
            REVERSE_SPEED,
            MAX_SPEED
        );

    let targetSteering = 0;

    if (
        turningLeft
    )
        targetSteering = 1;

    if (
        turningRight
    )
        targetSteering = -1;

    steering =
        THREE.MathUtils.lerp(
            steering,
            targetSteering,
            0.12
        );

    /*
        Steering becomes stronger at speed.
    */

    const steeringStrength =
        Math.min(
            Math.abs(speed) / MAX_SPEED,
            1
        );

    carGroup.rotation.y +=
        steering *
        STEERING_SPEED *
        steeringStrength *
        (speed >= 0 ? 1 : -1);

    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    forward.applyQuaternion(
        carGroup.quaternion
    );

    const oldX =
        carGroup.position.x;

    const oldZ =
        carGroup.position.z;

    carGroup.position.x +=
        forward.x *
        speed;

    carGroup.position.z +=
        forward.z *
        speed;

    /*
        Prevent driving through buildings.
    */

    if (
        collidesWithBuildings(
            carGroup.position.x,
            carGroup.position.z
        )
    ) {

        carGroup.position.x =
            oldX;

        carGroup.position.z =
            oldZ;

        speed *= -0.15;
    }

    /*
        Stream world BEFORE placing car on surface.
    */

    updateWorldStreaming(
        carGroup.position.x,
        carGroup.position.z
    );

    carGroup.position.y =
        getSurfaceHeight(
            carGroup.position.x,
            carGroup.position.z
        ) +
        0.08;

    /*
        Small visual suspension movement.
    */

    const suspension =
        Math.sin(
            performance.now() * 0.018
        ) *
        Math.min(
            Math.abs(speed) * 0.025,
            0.035
        );

    carGroup.position.y +=
        suspension;

    /*
        HUD.
    */

    document.getElementById(
        "speed"
    ).textContent =
        Math.round(
            Math.abs(speed) * 115
        );

    const cx =
        Math.floor(
            carGroup.position.x /
            CHUNK_SIZE
        );

    const cz =
        Math.floor(
            carGroup.position.z /
            CHUNK_SIZE
        );

    const biome =
        getBiome(
            carGroup.position.x,
            carGroup.position.z
        );

    document.getElementById(
        "location"
    ).textContent =
        `${biome.toUpperCase()}  •  SECTOR ${cx}:${cz}`;
}

/* =========================================================
   CAMERA
========================================================= */

const cameraTarget =
    new THREE.Vector3();

function updateCamera() {

    if (!carRoot)
        return;

    const desired =
        new THREE.Vector3(
            0,
            5.4,
            11
        );

    desired.applyQuaternion(
        carGroup.quaternion
    );

    desired.add(
        carGroup.position
    );

    camera.position.lerp(
        desired,
        0.075
    );

    cameraTarget.copy(
        carGroup.position
    );

    cameraTarget.y += 1.0;

    camera.lookAt(
        cameraTarget
    );
}

/* =========================================================
   DAY / NIGHT
========================================================= */

let night = false;

function toggleNight() {

    night = !night;

    if (night) {

        scene.background =
            new THREE.Color(
                0x07101c
            );

        scene.fog.color =
            new THREE.Color(
                0x07101c
            );

        hemi.intensity =
            0.35;

        sun.intensity =
            0.35;

        ambient.intensity =
            0.1;

        leftHeadlight.intensity =
            3.5;

        rightHeadlight.intensity =
            3.5;

        document.getElementById(
            "carStatus"
        ).textContent =
            "GOLDEN HOUR COASTAL SUPERCAR • NIGHT";

    } else {

        scene.background =
            new THREE.Color(
                0x8fb4d9
            );

        scene.fog.color =
            new THREE.Color(
                0x8fb4d9
            );

        hemi.intensity =
            1.35;

        sun.intensity =
            2.4;

        ambient.intensity =
            0.25;

        leftHeadlight.intensity =
            0;

        rightHeadlight.intensity =
            0;

        document.getElementById(
            "carStatus"
        ).textContent =
            "GOLDEN HOUR COASTAL SUPERCAR";
    }
}

/* =========================================================
   INITIAL WORLD
========================================================= */

function nextFrame() {

    return new Promise(
        resolve =>
            requestAnimationFrame(
                resolve
            )
    );
}

async function buildInitialWorld() {

    setLoading(
        "BUILDING HORIZON...",
        70
    );

    /*
        Generate in rings so the browser doesn't freeze.
    */

    const radius =
        LOAD_RADIUS;

    const positions = [];

    for (
        let ring = 0;
        ring <= radius;
        ring++
    ) {

        for (
            let x = -ring;
            x <= ring;
            x++
        ) {

            positions.push([
                x,
                -ring
            ]);

            if (
                ring !== 0
            )
                positions.push([
                    x,
                    ring
                ]);
        }

        for (
            let z = -ring + 1;
            z < ring;
            z++
        ) {

            positions.push([
                -ring,
                z
            ]);

            if (
                ring !== 0
            )
                positions.push([
                    ring,
                    z
                ]);
        }
    }

    const unique =
        new Map();

    for (
        const [x, z]
        of positions
    ) {

        unique.set(
            `${x},${z}`,
            [x, z]
        );
    }

    const list =
        [...unique.values()];

    for (
        let i = 0;
        i < list.length;
        i++
    ) {

        const [x, z] =
            list[i];

        generateChunk(
            x,
            z
        );

        setLoading(
            "BUILDING WORLD...",
            70 +
            (i / list.length) * 22
        );

        /*
            Give browser time between chunks.
        */

        if (
            i % 2 === 0
        )
            await nextFrame();
    }
}

/* =========================================================
   START
========================================================= */

async function start() {

    setLoading(
        "STARTING HORIZON...",
        5
    );

    await Promise.all([
        loadBuildings(),
        loadCar()
    ]);

    setLoading(
        "GENERATING OPEN WORLD...",
        70
    );

    await buildInitialWorld();

    /*
        Spawn near the center on a road.
    */

    carGroup.position.set(
        0,
        getSurfaceHeight(
            0,
            40
        ) + 0.08,
        40
    );

    /*
        Face down the road.
    */

    carGroup.rotation.y =
        Math.PI;

    updateWorldStreaming(
        carGroup.position.x,
        carGroup.position.z,
        true
    );

    worldReady = true;

    setLoading(
        "HORIZON READY",
        100
    );

    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                500
            )
    );

    const loading =
        document.getElementById(
            "loading"
        );

    loading.style.opacity = "0";

    setTimeout(
        () => {
            loading.style.display =
                "none";
        },
        650
    );
}

/* =========================================================
   ANIMATION
========================================================= */

const clock =
    new THREE.Clock();

function animate() {

    requestAnimationFrame(
        animate
    );

    const dt =
        Math.min(
            clock.getDelta(),
            0.05
        );

    worldTime +=
        dt * 0.003;

    updateCar();

    updateCamera();

    renderer.render(
        scene,
        camera
    );
}

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

/* =========================================================
   START EVERYTHING
========================================================= */

animate();

start().catch(
    error => {

        console.error(
            "HORIZON STARTUP ERROR:",
            error
        );

        document.getElementById(
            "loadStatus"
        ).textContent =
            "WORLD ERROR — CHECK CONSOLE";

    }
);

</script>
