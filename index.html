<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* =========================================================
   BASIC SETUP
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x8fb4d9);

scene.fog = new THREE.Fog(

renderer.setPixelRatio(

renderer.shadowMap.enabled = true;

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

document.body.appendChild(renderer.domElement);


/* =========================================================
   LIGHTING
========================================================= */

const hemisphere = new THREE.HemisphereLight(

);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -500;
sun.shadow.camera.right = 500;
sun.shadow.camera.top = 500;
sun.shadow.camera.bottom = -500;

sun.shadow.camera.near = 10;
sun.shadow.camera.far = 1800;

scene.add(sun);


/* =========================================================
   LOADERS
========================================================= */

const loader = new GLTFLoader();

const draco = new DRACOLoader();

draco.setDecoderPath(
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/draco/"
);

loader.setDRACOLoader(draco);
loader.setMeshoptDecoder(MeshoptDecoder);


/* =========================================================
   WORLD CONSTANTS
========================================================= */

const CHUNK_SIZE = 240;

const LOAD_RADIUS = 2;

const UNLOAD_RADIUS = 3;

const WORLD_SEED = 72831;

const chunks = new Map();


/* =========================================================
   SEEDED RANDOM
========================================================= */

function hash2D(x, z) {

    let h =
        Math.sin(
            x * 127.1 +
            z * 311.7 +
            WORLD_SEED
        ) * 43758.5453123;

    return h - Math.floor(h);
}


function randomRange(x, z, min, max) {

    return min + hash2D(x, z) * (max - min);
}


/* =========================================================
   SMOOTH NOISE
========================================================= */

function smoothNoise(x, z) {

    const x0 = Math.floor(x);
    const z0 = Math.floor(z);

    const x1 = x0 + 1;
    const z1 = z0 + 1;

    const sx = x - x0;
    const sz = z - z0;

    const a = hash2D(x0, z0);
    const b = hash2D(x1, z0);
    const c = hash2D(x0, z1);
    const d = hash2D(x1, z1);

    const u = sx * sx * (3 - 2 * sx);
    const v = sz * sz * (3 - 2 * sz);

    const top = THREE.MathUtils.lerp(a, b, u);
    const bottom = THREE.MathUtils.lerp(c, d, u);

    return THREE.MathUtils.lerp(top, bottom, v);
}


/* =========================================================
   TERRAIN
========================================================= */

function terrainHeight(x, z) {

    const large =
        smoothNoise(x * 0.0017, z * 0.0017) * 24;

    const medium =
        smoothNoise(x * 0.004, z * 0.004) * 9;

    const small =
        smoothNoise(x * 0.015, z * 0.015) * 2;

    return (
        large +
        medium +
        small
    ) - 12;
}


/* =========================================================
   BIOME
========================================================= */

function getBiome(x, z) {

    const cityDistance =
        Math.sqrt(x * x + z * z);

    if (cityDistance < 650) {
        return "city";
    }

    const biomeNoise =
        smoothNoise(
            x * 0.0008,
            z * 0.0008
        );

    if (biomeNoise > 0.72) {
        return "mountain";
    }

    if (biomeNoise < 0.25) {
        return "coast";
    }

    return "countryside";
}


/* =========================================================
   GROUND MATERIALS
========================================================= */

const grassMaterial = new THREE.MeshStandardMaterial({
    color: 0x526e4a,
    roughness: 1
});

const countrysideMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x607a4c,
        roughness: 1
    });

const mountainMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x5c625c,
        roughness: 1
    });

const sandMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xb7a36d,
        roughness: 1
    });


/* =========================================================
   ROAD MATERIALS
========================================================= */

const roadMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x25272b,
        roughness: .92,
        metalness: .05
    });

const sidewalkMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x85878a,
        roughness: .95
    });

const curbMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xaaa9a5,
        roughness: 1
    });

const whiteLineMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xf4f4ef,
        roughness: .8
    });

const yellowLineMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xe4c23c,
        roughness: .8
    });


/* =========================================================
   ROAD DEFINITIONS
========================================================= */

function roadInfo(x, z) {

    const cityRadius =
        Math.sqrt(x * x + z * z);

    /*
       Infinite grid-style city network.

       Every chunk calculates its roads
       from its WORLD coordinates.

       This means roads continue forever.
    */

    const majorSpacing = 240;

    const nearX =
        Math.abs(
            x -
            Math.round(x / majorSpacing) *
            majorSpacing
        );

    const nearZ =
        Math.abs(
            z -
            Math.round(z / majorSpacing) *
            majorSpacing
        );

    if (cityRadius < 850) {

        if (nearX < 15) {
            return {
                width: 26,
                type: "major",
                axis: "z"
            };
        }

        if (nearZ < 15) {
            return {
                width: 26,
                type: "major",
                axis: "x"
            };
        }

        const smallSpacing = 80;

        const sx =
            Math.abs(
                x -
                Math.round(x / smallSpacing) *
                smallSpacing
            );

        const sz =
            Math.abs(
                z -
                Math.round(z / smallSpacing) *
                smallSpacing
            );

        if (sx < 6) {
            return {
                width: 13,
                type: "city",
                axis: "z"
            };
        }

        if (sz < 6) {
            return {
                width: 13,
                type: "city",
                axis: "x"
            };
        }
    }


    /*
       Outside the city, occasional highways.
    */

    const highwaySpacing = 480;

    const hx =
        Math.abs(
            x -
            Math.round(x / highwaySpacing) *
            highwaySpacing
        );

    const hz =
        Math.abs(
            z -
            Math.round(z / highwaySpacing) *
            highwaySpacing
        );

    if (hx < 7) {

        return {
            width: 18,
            type: "highway",
            axis: "z"
        };
    }

    if (hz < 7) {

        return {
            width: 18,
            type: "highway",
            axis: "x"
        };
    }

    return null;
}


/* =========================================================
   TERRAIN CHUNK
========================================================= */

function createTerrainChunk(cx, cz) {

    const group = new THREE.Group();

    const size = CHUNK_SIZE;

    const segments = 24;

    const geometry =
        new THREE.PlaneGeometry(
            size,
            size,
            segments,
            segments
        );

    geometry.rotateX(-Math.PI / 2);

    const positions =
        geometry.attributes.position;

    for (
        let i = 0;
        i < positions.count;
        i++
    ) {

        const lx = positions.getX(i);
        const lz = positions.getZ(i);

        const wx =
            cx * CHUNK_SIZE +
            lx +
            CHUNK_SIZE / 2;

        const wz =
            cz * CHUNK_SIZE +
            lz +
            CHUNK_SIZE / 2;

        positions.setY(
            i,
            terrainHeight(wx, wz)
        );
    }

    geometry.computeVertexNormals();


    const centerX =
        cx * CHUNK_SIZE +
        CHUNK_SIZE / 2;

    const centerZ =
        cz * CHUNK_SIZE +
        CHUNK_SIZE / 2;

    const biome =
        getBiome(centerX, centerZ);

    let material = grassMaterial;

    if (biome === "countryside") {
        material = countrysideMaterial;
    }

    if (biome === "mountain") {
        material = mountainMaterial;
    }

    if (biome === "coast") {
        material = sandMaterial;
    }

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.receiveShadow = true;

    group.add(mesh);

    return group;
}


/* =========================================================
   ROAD PIECES
========================================================= */

function createRoad(
    group,
    worldX,
    worldZ,
    axis,
    width,
    length
) {

    const geometry =
        new THREE.PlaneGeometry(
            width,
            length,
            8,
            16
        );

    geometry.rotateX(-Math.PI / 2);

    if (axis === "x") {
        geometry.rotateY(Math.PI / 2);
    }

    const positions =
        geometry.attributes.position;

    for (
        let i = 0;
        i < positions.count;
        i++
    ) {

        let localX =
            positions.getX(i);

        let localZ =
            positions.getZ(i);

        let wx;
        let wz;

        if (axis === "x") {

            wx =
                worldX +
                localX;

            wz =
                worldZ +
                localZ;

        } else {

            wx =
                worldX +
                localX;

            wz =
                worldZ +
                localZ;
        }

        positions.setY(
            i,
            terrainHeight(wx, wz) + 0.22
        );
    }

    geometry.computeVertexNormals();

    const road =
        new THREE.Mesh(
            geometry,
            roadMaterial
        );

    road.receiveShadow = true;

    road.position.set(
        0,
        0,
        0
    );

    /*
       Geometry already contains world-local
       terrain coordinates, so put group at origin.
    */

    road.userData.worldX = worldX;
    road.userData.worldZ = worldZ;

    group.add(road);


    /* -----------------------------------------------------
       EDGE LINES
    ----------------------------------------------------- */

    const edgeOffset =
        width / 2 - 0.8;

    const lineThickness = 0.35;

    if (axis === "x") {

        addRoadLine(
            group,
            worldX,
            worldZ - edgeOffset,
            length,
            lineThickness,
            true,
            whiteLineMaterial
        );

        addRoadLine(
            group,
            worldX,
            worldZ + edgeOffset,
            length,
            lineThickness,
            true,
            whiteLineMaterial
        );

    } else {

        addRoadLine(
            group,
            worldX - edgeOffset,
            worldZ,
            length,
            lineThickness,
            false,
            whiteLineMaterial
        );

        addRoadLine(
            group,
            worldX + edgeOffset,
            worldZ,
            length,
            lineThickness,
            false,
            whiteLineMaterial
        );
    }


    /* -----------------------------------------------------
       CENTER LINE
    ----------------------------------------------------- */

    const centerWidth =
        width >= 20 ? 0.45 : 0.28;

    if (width >= 20) {

        const offset = 0.45;

        if (axis === "x") {

            addDashedLine(
                group,
                worldX,
                worldZ - offset,
                length,
                centerWidth,
                true,
                yellowLineMaterial
            );

            addDashedLine(
                group,
                worldX,
                worldZ + offset,
                length,
                centerWidth,
                true,
                yellowLineMaterial
            );

        } else {

            addDashedLine(
                group,
                worldX - offset,
                worldZ,
                length,
                centerWidth,
                false,
                yellowLineMaterial
            );

            addDashedLine(
                group,
                worldX + offset,
                worldZ,
                length,
                centerWidth,
                false,
                yellowLineMaterial
            );

        }

    } else {

        if (axis === "x") {

            addDashedLine(
                group,
                worldX,
                worldZ,
                length,
                centerWidth,
                true,
                yellowLineMaterial
            );

        } else {

            addDashedLine(
                group,
                worldX,
                worldZ,
                length,
                centerWidth,
                false,
                yellowLineMaterial
            );
        }
    }


    /* -----------------------------------------------------
       SIDEWALKS
    ----------------------------------------------------- */

    if (width <= 15) {

        const sidewalkWidth = 4;

        if (axis === "x") {

            createSidewalk(
                group,
                worldX,
                worldZ -
                width / 2 -
                sidewalkWidth / 2,
                length,
                sidewalkWidth,
                true
            );

            createSidewalk(
                group,
                worldX,
                worldZ +
                width / 2 +
                sidewalkWidth / 2,
                length,
                sidewalkWidth,
                true
            );

        } else {

            createSidewalk(
                group,
                worldX -
                width / 2 -
                sidewalkWidth / 2,
                worldZ,
                sidewalkWidth,
                length,
                false
            );

            createSidewalk(
                group,
                worldX +
                width / 2 +
                sidewalkWidth / 2,
                worldZ,
                sidewalkWidth,
                length,
                false
            );
        }
    }
}


/* =========================================================
   ROAD LINE
========================================================= */

function addRoadLine(
    group,
    x,
    z,
    length,
    thickness,
    alongX,
    material
) {

    const geo =
        new THREE.PlaneGeometry(
            alongX ? length : thickness,
            alongX ? thickness : length
        );

    geo.rotateX(-Math.PI / 2);

    const mesh =
        new THREE.Mesh(
            geo,
            material
        );

    mesh.position.set(
        x,
        terrainHeight(x, z) + 0.32,
        z
    );

    group.add(mesh);
}


/* =========================================================
   DASHED ROAD LINE
========================================================= */

function addDashedLine(
    group,
    x,
    z,
    length,
    thickness,
    alongX,
    material
) {

    const dash = 6;

    const gap = 8;

    for (
        let p = -length / 2;
        p < length / 2;
        p += dash + gap
    ) {

        let px = x;
        let pz = z;

        if (alongX) {
            px += p;
        } else {
            pz += p;
        }

        const geo =
            new THREE.PlaneGeometry(
                alongX ? dash : thickness,
                alongX ? thickness : dash
            );

        geo.rotateX(-Math.PI / 2);

        const mesh =
            new THREE.Mesh(
                geo,
                material
            );

        mesh.position.set(
            px,
            terrainHeight(px, pz) + 0.34,
            pz
        );

        group.add(mesh);
    }
}


/* =========================================================
   SIDEWALK
========================================================= */

function createSidewalk(
    group,
    x,
    z,
    width,
    length,
    alongX
) {

    const geo =
        new THREE.BoxGeometry(
            alongX ? width : length,
            0.25,
            alongX ? length : width
        );

    const mesh =
        new THREE.Mesh(
            geo,
            sidewalkMaterial
        );

    mesh.position.set(
        x,
        terrainHeight(x, z) + 0.28,
        z
    );

    mesh.receiveShadow = true;

    group.add(mesh);
}


/* =========================================================
   BUILDING DATA
========================================================= */

const buildingFiles = [
    "large-building.glb",
    "store.glb",
    "apartment.glb",
    "large-building-2.glb",
    "bank.glb"
];

const buildingTemplates = [];

let buildingsReady = false;


/* =========================================================
   LOAD BUILDINGS
========================================================= */

async function loadBuildings() {

    for (const file of buildingFiles) {

        try {

            const gltf =
                await loader.loadAsync(
                    "./assets/buildings/" + file
                );

            const root = gltf.scene;

            root.traverse(
                obj => {

                    if (obj.isMesh) {

                        obj.castShadow = true;
                        obj.receiveShadow = true;

                    }
                }
            );


            const box =
                new THREE.Box3()
                    .setFromObject(root);

            const size =
                new THREE.Vector3();

            const center =
                new THREE.Vector3();

            box.getSize(size);
            box.getCenter(center);


            /*
               Center model properly.
            */

            root.position.x -= center.x;
            root.position.z -= center.z;

            root.position.y -= box.min.y;


            const maxDimension =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );

            const targetHeight =
                file.includes("large")
                    ? 28
                    : file.includes("apartment")
                        ? 22
                        : 18;

            const scale =
                targetHeight /
                maxDimension;


            root.scale.setScalar(scale);


            const scaledWidth =
                size.x * scale;

            const scaledDepth =
                size.z * scale;

            const scaledHeight =
                size.y * scale;


            /*
               Interior shell.

               This prevents the building from
               looking completely empty through windows.
            */

            const interiorMaterial =
                new THREE.MeshStandardMaterial({
                    color: 0x3c3b38,
                    roughness: 1,
                    metalness: 0,
                    side: THREE.BackSide
                });


            const innerWidth =
                Math.max(
                    2,
                    scaledWidth * 0.88
                );

            const innerDepth =
                Math.max(
                    2,
                    scaledDepth * 0.88
                );

            const innerHeight =
                Math.max(
                    2,
                    scaledHeight * 0.88
                );


            const interior =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        innerWidth,
                        innerHeight,
                        innerDepth
                    ),
                    interiorMaterial
                );


            interior.position.y =
                innerHeight / 2;

            interior.castShadow = false;
            interior.receiveShadow = false;

            root.add(interior);


            buildingTemplates.push({

                model: root,

                width: scaledWidth,

                depth: scaledDepth,

                height: scaledHeight

            });


        } catch (error) {

            console.warn(
                "Could not load building:",
                file,
                error
            );
        }
    }

    buildingsReady = true;
}


/* =========================================================
   BUILDING / ROAD COLLISION CHECK
========================================================= */

function buildingTouchesRoad(
    x,
    z,
    halfX,
    halfZ,
    rotation
) {

    /*
       Check roads around the building.

       We use projected rectangle dimensions
       so rotated buildings don't end up on roads.
    */

    const nearby = 120;

    const spacing = 80;

    for (
        let rx =
            Math.floor(
                (x - nearby) /
                spacing
            ) * spacing;

        rx <= x + nearby;

        rx += spacing
    ) {

        for (
            let rz =
                Math.floor(
                    (z - nearby) /
                    spacing
                ) * spacing;

            rz <= z + nearby;

            rz += spacing
        ) {

            const road =
                roadInfo(rx, rz);

            if (!road) continue;


            let roadX = rx;
            let roadZ = rz;


            const relativeX =
                x - roadX;

            const relativeZ =
                z - roadZ;


            const c =
                Math.cos(rotation);

            const s =
                Math.sin(rotation);


            const projectedX =
                halfX * Math.abs(c) +
                halfZ * Math.abs(s);

            const projectedZ =
                halfX * Math.abs(s) +
                halfZ * Math.abs(c);


            if (
                road.axis === "x"
            ) {

                if (
                    Math.abs(relativeX) <
                    road.width / 2 +
                    projectedX +
                    7
                    &&
                    Math.abs(relativeZ) <
                    45 +
                    projectedZ
                ) {
                    return true;
                }

            } else {

                if (
                    Math.abs(relativeX) <
                    45 +
                    projectedX
                    &&
                    Math.abs(relativeZ) <
                    road.width / 2 +
                    projectedZ +
                    7
                ) {
                    return true;
                }
            }
        }
    }

    return false;
}


/* =========================================================
   ADD BUILDING
========================================================= */

function addBuilding(
    group,
    template,
    x,
    z,
    scale,
    rotation
) {

    const building =
        template.model.clone(true);


    building.scale.multiplyScalar(
        scale
    );


    building.rotation.y =
        rotation;


    building.position.set(
        x,
        terrainHeight(x, z),
        z
    );


    group.add(building);
}


/* =========================================================
   CITY BUILDINGS
========================================================= */

function generateBuildings(
    group,
    cx,
    cz
) {

    if (!buildingsReady) return;

    const startX =
        cx * CHUNK_SIZE;

    const startZ =
        cz * CHUNK_SIZE;


    /*
       Each chunk gets a deterministic
       set of buildings.
    */

    const count =
        4 +
        Math.floor(
            hash2D(cx, cz) * 6
        );


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const seedX =
            cx * 100 +
            i * 17 +
            3;

        const seedZ =
            cz * 100 +
            i * 31 +
            9;


        const x =
            startX +
            randomRange(
                seedX,
                seedZ,
                20,
                CHUNK_SIZE - 20
            );

        const z =
            startZ +
            randomRange(
                seedZ,
                seedX,
                20,
                CHUNK_SIZE - 20
            );


        const template =
            buildingTemplates[
                Math.floor(
                    hash2D(
                        seedX,
                        seedZ
                    ) *
                    buildingTemplates.length
                )
            ];


        const rotationOptions = [
            0,
            Math.PI / 2,
            Math.PI,
            Math.PI * 1.5
        ];


        const rotation =
            rotationOptions[
                Math.floor(
                    hash2D(
                        seedX + 40,
                        seedZ + 50
                    ) *
                    rotationOptions.length
                )
            ];


        const scale =
            0.75 +
            hash2D(
                seedX + 70,
                seedZ + 80
            ) * 0.55;


        const halfX =
            template.width *
            scale /
            2;

        const halfZ =
            template.depth *
            scale /
            2;


        if (
            buildingTouchesRoad(
                x,
                z,
                halfX,
                halfZ,
                rotation
            )
        ) {
            continue;
        }


        addBuilding(
            group,
            template,
            x,
            z,
            scale,
            rotation
        );
    }
}


/* =========================================================
   TREES
========================================================= */

function createTree(
    group,
    x,
    z,
    scale
) {

    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .18 * scale,
                .28 * scale,
                2.5 * scale,
                7
            ),
            new THREE.MeshStandardMaterial({
                color: 0x5b3e29,
                roughness: 1
            })
        );

    trunk.position.set(
        x,
        terrainHeight(x, z) +
        1.25 * scale,
        z
    );

    trunk.castShadow = true;

    group.add(trunk);


    const leaves =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                1.5 * scale,
                8,
                6
            ),
            new THREE.MeshStandardMaterial({
                color: 0x355c35,
                roughness: 1
            })
        );

    leaves.position.set(
        x,
        terrainHeight(x, z) +
        3.1 * scale,
        z
    );

    leaves.castShadow = true;

    group.add(leaves);
}


/* =========================================================
   GENERATE TREES
========================================================= */

function generateTrees(
    group,
    cx,
    cz
) {

    const startX =
        cx * CHUNK_SIZE;

    const startZ =
        cz * CHUNK_SIZE;


    for (
        let i = 0;
        i < 12;
        i++
    ) {

        const sx =
            cx * 200 +
            cz * 37 +
            i * 71;

        const sz =
            cz * 200 +
            cx * 43 +
            i * 29;


        const x =
            startX +
            randomRange(
                sx,
                sz,
                5,
                CHUNK_SIZE - 5
            );

        const z =
            startZ +
            randomRange(
                sz,
                sx,
                5,
                CHUNK_SIZE - 5
            );


        const road =
            roadInfo(x, z);


        if (road) continue;


        const biome =
            getBiome(x, z);


        if (
            biome === "city" &&
            hash2D(sx, sz) > .25
        ) {
            continue;
        }


        const scale =
            0.7 +
            hash2D(
                sx + 100,
                sz + 100
            ) * 1.1;


        createTree(
            group,
            x,
            z,
            scale
        );
    }
}


/* =========================================================
   MOUNTAINS
========================================================= */

function generateMountains(
    group,
    cx,
    cz
) {

    const centerX =
        cx * CHUNK_SIZE +
        CHUNK_SIZE / 2;

    const centerZ =
        cz * CHUNK_SIZE +
        CHUNK_SIZE / 2;


    if (
        getBiome(
            centerX,
            centerZ
        ) !== "mountain"
    ) {
        return;
    }


    for (
        let i = 0;
        i < 3;
        i++
    ) {

        const x =
            cx * CHUNK_SIZE +
            randomRange(
                cx * 80 + i,
                cz * 90 + i,
                10,
                CHUNK_SIZE - 10
            );

        const z =
            cz * CHUNK_SIZE +
            randomRange(
                cz * 80 + i,
                cx * 90 + i,
                10,
                CHUNK_SIZE - 10
            );


        const height =
            30 +
            hash2D(
                x,
                z
            ) * 70;


        const radius =
            20 +
            hash2D(
                z,
                x
            ) * 35;


        const mountain =
            new THREE.Mesh(
                new THREE.ConeGeometry(
                    radius,
                    height,
                    8
                ),
                mountainMaterial
            );


        mountain.position.set(
            x,
            terrainHeight(x, z) +
            height / 2,
            z
        );


        mountain.castShadow = true;

        mountain.receiveShadow = true;

        group.add(mountain);
    }
}


/* =========================================================
   WATER
========================================================= */

function generateWater(
    group,
    cx,
    cz
) {

    const centerX =
        cx * CHUNK_SIZE +
        CHUNK_SIZE / 2;

    const centerZ =
        cz * CHUNK_SIZE +
        CHUNK_SIZE / 2;


    /*
       Deterministic distant coast.
    */

    const coast =
        Math.sin(centerX * .0007) +
        Math.cos(centerZ * .0006);


    if (coast < 1.55) {
        return;
    }


    const waterMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x3e83a5,
            roughness: .2,
            metalness: .1,
            transparent: true,
            opacity: .88
        });


    const water =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                CHUNK_SIZE,
                CHUNK_SIZE
            ),
            waterMaterial
        );


    water.rotation.x =
        -Math.PI / 2;


    water.position.set(
        centerX,
        0,
        centerZ
    );


    group.add(water);
}


/* =========================================================
   CHUNK GENERATION
========================================================= */

function generateChunk(
    cx,
    cz
) {

    const key =
        cx + "," + cz;


    if (chunks.has(key)) {
        return;
    }


    const group =
        new THREE.Group();


    group.userData.cx = cx;
    group.userData.cz = cz;


    /*
       Terrain
    */

    const terrain =
        createTerrainChunk(
            cx,
            cz
        );

    group.add(terrain);


    /*
       Roads

       We create the road network based
       on world coordinates.
    */

    const minX =
        cx * CHUNK_SIZE;

    const minZ =
        cz * CHUNK_SIZE;


    const maxX =
        minX + CHUNK_SIZE;

    const maxZ =
        minZ + CHUNK_SIZE;


    const roadSpacing = 80;


    /*
       Sample enough positions to discover
       all roads crossing this chunk.
    */

    for (
        let x =
            Math.floor(
                minX / roadSpacing
            ) *
            roadSpacing;

        x <= maxX;

        x += roadSpacing
    ) {

        for (
            let z =
                Math.floor(
                    minZ / roadSpacing
                ) *
                roadSpacing;

            z <= maxZ;

            z += roadSpacing
        ) {

            const road =
                roadInfo(
                    x,
                    z
                );


            if (!road) continue;


            /*
               Only generate roads that actually
               cross the current chunk.
            */

            if (
                road.axis === "x"
            ) {

                if (
                    z >= minZ - 80 &&
                    z <= maxZ + 80
                ) {

                    createRoad(
                        group,
                        minX + CHUNK_SIZE / 2,
                        z,
                        "x",
                        road.width,
                        CHUNK_SIZE + 40
                    );
                }

            } else {

                if (
                    x >= minX - 80 &&
                    x <= maxX + 80
                ) {

                    createRoad(
                        group,
                        x,
                        minZ + CHUNK_SIZE / 2,
                        "z",
                        road.width,
                        CHUNK_SIZE + 40
                    );
                }
            }
        }
    }


    /*
       Buildings
    */

    generateBuildings(
        group,
        cx,
        cz
    );


    /*
       Trees
    */

    generateTrees(
        group,
        cx,
        cz
    );


    /*
       Mountains
    */

    generateMountains(
        group,
        cx,
        cz
    );


    /*
       Water
    */

    generateWater(
        group,
        cx,
        cz
    );


    scene.add(group);

    chunks.set(
        key,
        group
    );
}


/* =========================================================
   CHUNK UNLOADING
========================================================= */

function unloadFarChunks(
    playerX,
    playerZ
) {

    const playerCX =
        Math.floor(
            playerX / CHUNK_SIZE
        );

    const playerCZ =
        Math.floor(
            playerZ / CHUNK_SIZE
        );


    for (
        const [key, group]
        of chunks
    ) {

        const dx =
            Math.abs(
                group.userData.cx -
                playerCX
            );

        const dz =
            Math.abs(
                group.userData.cz -
                playerCZ
            );


        if (
            dx > UNLOAD_RADIUS ||
            dz > UNLOAD_RADIUS
        ) {

            scene.remove(group);

            disposeGroup(group);

            chunks.delete(key);
        }
    }
}


/* =========================================================
   DISPOSE
========================================================= */

function disposeGroup(
    group
) {

    group.traverse(
        obj => {

            if (obj.geometry) {
                obj.geometry.dispose();
            }

            if (
                obj.material &&
                !Array.isArray(obj.material)
            ) {

                /*
                   Don't dispose shared materials.
                */
            }
        }
    );
}


/* =========================================================
   STREAM WORLD
========================================================= */

let lastChunkX = null;
let lastChunkZ = null;


function updateWorldStreaming() {

    const playerX =
        carRoot.position.x;

    const playerZ =
        carRoot.position.z;


    const cx =
        Math.floor(
            playerX / CHUNK_SIZE
        );

    const cz =
        Math.floor(
            playerZ / CHUNK_SIZE
        );


    if (
        cx === lastChunkX &&
        cz === lastChunkZ
    ) {
        return;
    }


    lastChunkX = cx;
    lastChunkZ = cz;


    /*
       Generate surrounding chunks.
    */

    for (
        let x = -LOAD_RADIUS;
        x <= LOAD_RADIUS;
        x++
    ) {

        for (
            let z = -LOAD_RADIUS;
            z <= LOAD_RADIUS;
            z++
        ) {

            generateChunk(
                cx + x,
                cz + z
            );
        }
    }


    unloadFarChunks(
        playerX,
        playerZ
    );
}


/* =========================================================
   CAR
========================================================= */

let carRoot =
    new THREE.Group();

scene.add(carRoot);

let carModel = null;

let carLoaded = false;


const carURL =
    "https://jaiveginati-creator.github.io/Horizon/electric-car.glb";


async function loadCar() {

    try {

        const gltf =
            await loader.loadAsync(
                carURL
            );

        carModel =
            gltf.scene;


        carModel.traverse(
            obj => {

                if (obj.isMesh) {

                    obj.castShadow = true;
                    obj.receiveShadow = true;

                }
            }
        );


        const box =
            new THREE.Box3()
                .setFromObject(
                    carModel
                );


        const size =
            new THREE.Vector3();

        box.getSize(size);


        const maxDimension =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        const scale =
            4.9 /
            maxDimension;


        carModel.scale.setScalar(
            scale
        );


        const correctedBox =
            new THREE.Box3()
                .setFromObject(
                    carModel
                );


        const center =
            new THREE.Vector3();


        correctedBox.getCenter(
            center
        );


        carModel.position.x -=
            center.x;

        carModel.position.z -=
            center.z;

        carModel.position.y -=
            correctedBox.min.y;


        carModel.rotation.y =
            Math.PI / 2;


        carRoot.add(
            carModel
        );


        carLoaded = true;


        /*
           Starting position.
        */

        carRoot.position.set(
            0,
            terrainHeight(0, 40),
            40
        );


    } catch (error) {

        console.error(
            "CAR LOAD ERROR",
            error
        );
    }
}


/* =========================================================
   DRIVING
========================================================= */

const keys = {};

window.addEventListener(
    "keydown",
    e => {

        keys[
            e.key.toLowerCase()
        ] = true;


        if (
            e.key.toLowerCase() === "n"
        ) {

            toggleNight();
        }
    }
);


window.addEventListener(
    "keyup",
    e => {

        keys[
            e.key.toLowerCase()
        ] = false;
    }
);


let speed = 0;

let steering = 0;


const MAX_SPEED = 0.75;

const MAX_REVERSE = 0.28;

const ACCELERATION = 0.008;

const REVERSE_ACCELERATION = 0.005;

const BRAKE_POWER = 0.035;

const FRICTION = 0.006;

const MAX_STEERING = 0.55;

const STEERING_RESPONSE = 0.14;

const TURN_RATE = 0.035;


function updateCar() {

    if (!carLoaded) return;


    /*
       Acceleration
    */

    if (
        keys["w"] ||
        keys["arrowup"]
    ) {

        speed +=
            ACCELERATION;

    } else if (
        keys["s"] ||
        keys["arrowdown"]
    ) {

        if (speed > 0) {

            speed -=
                BRAKE_POWER;

        } else {

            speed -=
                REVERSE_ACCELERATION;
        }

    } else {

        if (speed > 0) {

            speed -= FRICTION;

            if (speed < 0) {
                speed = 0;
            }

        } else if (speed < 0) {

            speed += FRICTION;

            if (speed > 0) {
                speed = 0;
            }
        }
    }


    speed =
        THREE.MathUtils.clamp(
            speed,
            -MAX_REVERSE,
            MAX_SPEED
        );


    /*
       Steering
    */

    let targetSteering = 0;


    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {

        targetSteering =
            MAX_STEERING;

    }


    if (
        keys["d"] ||
        keys["arrowright"]
    ) {

        targetSteering =
            -MAX_STEERING;

    }


    steering =
        THREE.MathUtils.lerp(
            steering,
            targetSteering,
            STEERING_RESPONSE
        );


    /*
       Turn vehicle.
    */

    if (
        Math.abs(speed) >
        0.02
    ) {

        const direction =
            speed >= 0
                ? 1
                : -1;


        carRoot.rotation.y +=
            steering *
            TURN_RATE *
            Math.abs(speed) *
            direction;
    }


    /*
       Move.
    */

    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    forward.applyQuaternion(
        carRoot.quaternion
    );


    carRoot.position.addScaledVector(
        forward,
        speed
    );


    /*
       Follow terrain.
    */

    const ground =
        terrainHeight(
            carRoot.position.x,
            carRoot.position.z
        );


    carRoot.position.y =
        THREE.MathUtils.lerp(
            carRoot.position.y,
            ground,
            0.25
        );


    /*
       Speed HUD.
    */

    document.getElementById(
        "speed"
    ).textContent =
        Math.round(
            Math.abs(speed) * 55
        ) +
        " KM/H";
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera() {

    const offset =
        new THREE.Vector3(
            0,
            4.2,
            10.5
        );


    offset.applyQuaternion(
        carRoot.quaternion
    );


    const desired =
        carRoot.position
            .clone()
            .add(offset);


    camera.position.lerp(
        desired,
        0.075
    );


    const lookAt =
        carRoot.position
            .clone();


    lookAt.y += 1.4;


    camera.lookAt(
        lookAt
    );
}


/* =========================================================
   DAY / NIGHT
========================================================= */

let night = false;


function toggleNight() {

    night = !night;


    if (night) {

        scene.background =
            new THREE.Color(
                0x080b18
            );

        scene.fog.color =
            new THREE.Color(
                0x080b18
            );

        hemisphere.intensity =
            0.35;

        sun.intensity =
            0.45;

        sun.color.set(
            0x8fa8ff
        );

    } else {

        scene.background =
            new THREE.Color(
                0x8fb4d9
            );

        scene.fog.color =
            new THREE.Color(
                0x8fb4d9
            );

        hemisphere.intensity =
            1.6;

        sun.intensity =
            2.5;

        sun.color.set(
            0xfff1d0
        );
    }
}


/* =========================================================
   INITIAL WORLD
========================================================= */

async function startGame() {

    await loadBuildings();

    await loadCar();


    /*
       Initial chunks.
    */

    for (
        let x = -LOAD_RADIUS;
        x <= LOAD_RADIUS;
        x++
    ) {

        for (
            let z = -LOAD_RADIUS;
            z <= LOAD_RADIUS;
            z++
        ) {

            generateChunk(
                x,
                z
            );
        }
    }


    lastChunkX = 0;
    lastChunkZ = 0;


    /*
       Hide loading screen.
    */

    const loading =
        document.getElementById(
            "loading"
        );

    loading.style.opacity = "0";


    setTimeout(
        () => {
            loading.style.display =
                "none";
        },
        900
    );
}


/* =========================================================
   ANIMATION
========================================================= */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    updateCar();

    updateWorldStreaming();

    updateCamera();


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =========================================================
   START
========================================================= */

startGame();

animate();

</script>
