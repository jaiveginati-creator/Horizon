/* =========================================================
   SEEDED RANDOM
========================================================= */

function hash2D(x, z, seed = WORLD_SEED) {

    let h =
        Math.imul(
            Math.floor(x) + seed,
            374761393
        ) ^
        Math.imul(
            Math.floor(z) + seed * 3,
            668265263
        );

    h =
        (h ^ (h >>> 13)) *
        1274126177;

    h ^= h >>> 16;

    return (h >>> 0) / 4294967295;
}


function randomRange(x, z, min, max, salt = 0) {

    return THREE.MathUtils.lerp(
        min,
        max,
        hash2D(
            x + salt * 31.71,
            z - salt * 17.23
        )
    );
}


function smoothNoise(x, z) {

    const x0 = Math.floor(x);
    const z0 = Math.floor(z);

    const x1 = x0 + 1;
    const z1 = z0 + 1;

    const sx = x - x0;
    const sz = z - z0;

    const u = sx * sx * (3 - 2 * sx);
    const v = sz * sz * (3 - 2 * sz);

    const n00 = hash2D(x0, z0);
    const n10 = hash2D(x1, z0);
    const n01 = hash2D(x0, z1);
    const n11 = hash2D(x1, z1);

    const a = THREE.MathUtils.lerp(
        n00,
        n10,
        u
    );

    const b = THREE.MathUtils.lerp(
        n01,
        n11,
        u
    );

    return THREE.MathUtils.lerp(
        a,
        b,
        v
    );
}


/* =========================================================
   TERRAIN
========================================================= */

function terrainHeight(x, z) {

    const n1 =
        smoothNoise(x * .004, z * .004);

    const n2 =
        smoothNoise(x * .012 + 100, z * .012 + 100);

    const n3 =
        smoothNoise(x * .035 + 500, z * .035 + 500);

    let height =
        -7 +
        n1 * 22 +
        n2 * 7 +
        n3 * 1.8;

    const distance =
        Math.sqrt(
            x * x +
            z * z
        );

    /*
       Flatten the central city.
       This is important because buildings and
       roads no longer sit on extreme terrain.
    */

    const cityFlatten =
        1 -
        THREE.MathUtils.smoothstep(
            CITY_RADIUS * .42,
            CITY_RADIUS,
            distance
        );

    height =
        THREE.MathUtils.lerp(
            height,
            -3.2 +
            n2 * 1.1,
            cityFlatten
        );

    return height;
}


/* =========================================================
   BIOMES
========================================================= */

function getBiome(x, z) {

    const distance =
        Math.sqrt(
            x * x +
            z * z
        );

    if (distance < CITY_RADIUS) {
        return "city";
    }

    const n =
        smoothNoise(
            x * .0018,
            z * .0018
        );

    if (n > .74) {
        return "mountain";
    }

    if (n < .27) {
        return "coast";
    }

    return "countryside";
}

/* =========================================================

========================================================= */

const starCount = 1200;

    new Float32Array(

    let i = 0;
    i < starCount;
    i++
) {

    const r = 1700;

    const a =
        hash2D(i, 1, WORLD_SEED) *
        Math.PI * 2;

    const b =
        hash2D(i, 2, WORLD_SEED) *
        Math.PI;

    const x =
        Math.sin(b) *
        Math.cos(a) *
        r;

    const y =
        Math.cos(b) *
        r;

    const z =
        Math.sin(b) *
        Math.sin(a) *
        r;

    starPositions[i * 3] = x;
    starPositions[i * 3 + 1] = y;
    starPositions[i * 3 + 2] = z;
}

/* =========================================================
   ROAD SYSTEM
========================================================= */

function roadCandidates(x, z) {

    const candidates = [];

    const majorZ =
        Math.round(z / 240) * 240;

    if (
        Math.abs(majorZ) <= CITY_RADIUS
    ) {

        candidates.push({
            axis: "x",
            center: majorZ,
            width: 26,
            type: "major",
            priority: 3
        });
    }

    const cityZ =
        Math.round(z / 80) * 80;

    if (
        Math.abs(cityZ) <= CITY_RADIUS
    ) {

        candidates.push({
            axis: "x",
            center: cityZ,
            width: 13,
            type: "city",
            priority: 2
        });
    }

    const highwayZ =
        Math.round(z / 480) * 480;

    candidates.push({
        axis: "x",
        center: highwayZ,
        width: 18,
        type: "highway",
        priority: 1
    });


    const majorX =
        Math.round(x / 240) * 240;

    if (
        Math.abs(majorX) <= CITY_RADIUS
    ) {

        candidates.push({
            axis: "z",
            center: majorX,
            width: 26,
            type: "major",
            priority: 3
        });
    }

    const cityX =
        Math.round(x / 80) * 80;

    if (
        Math.abs(cityX) <= CITY_RADIUS
    ) {

        candidates.push({
            axis: "z",
            center: cityX,
            width: 13,
            type: "city",
            priority: 2
        });
    }

    const highwayX =
        Math.round(x / 480) * 480;

    candidates.push({
        axis: "z",
        center: highwayX,
        width: 18,
        type: "highway",
        priority: 1
    });

    return candidates;
}


function roadExistsOnX(z) {

    const candidates =
        roadCandidates(0, z)
        .filter(r => r.axis === "x")
        .filter(
            r =>
                Math.abs(z - r.center) <=
                r.width / 2
        )
        .sort(
            (a, b) =>
                b.priority - a.priority
        );

    return candidates[0] || null;
}


function roadExistsOnZ(x) {

    const candidates =
        roadCandidates(x, 0)
        .filter(r => r.axis === "z")
        .filter(
            r =>
                Math.abs(x - r.center) <=
                r.width / 2
        )
        .sort(
            (a, b) =>
                b.priority - a.priority
        );

    return candidates[0] || null;
}


function getRoadAt(x, z) {

    const candidates =
        roadCandidates(x, z);

    const valid =
        candidates.filter(r => {

            if (r.axis === "x") {

                return (
                    Math.abs(z - r.center) <=
                    r.width / 2
                );
            }

            return (
                Math.abs(x - r.center) <=
                r.width / 2
            );
        });

    if (!valid.length) {
        return null;
    }

    valid.sort(
        (a, b) => {

            if (
                b.priority !==
                a.priority
            ) {

                return (
                    b.priority -
                    a.priority
                );
            }

            const da =
                a.axis === "x"
                    ? Math.abs(z - a.center)
                    : Math.abs(x - a.center);

            const db =
                b.axis === "x"
                    ? Math.abs(z - b.center)
                    : Math.abs(x - b.center);

            return da - db;
        }
    );

    return valid[0];
}


/*
   Distance from a point to the nearest road edge.

   Positive = clear
   Zero = road edge
   Negative = inside road
*/

function roadClearance(x, z) {

    const candidates =
        roadCandidates(x, z);

    let minimum =
        Infinity;

    for (const road of candidates) {

        const distance =
            road.axis === "x"
                ? Math.abs(z - road.center)
                : Math.abs(x - road.center);

        const clearance =
            distance -
            road.width / 2;

        minimum =
            Math.min(
                minimum,
                clearance
            );
    }

    return minimum;
}


function isClearOfRoad(
    x,
    z,
    radius = 0
) {

    return (
        roadClearance(x, z) >
        radius
    );
}


/*
   Building collision/placement test.
   Uses the actual footprint rather than
   checking only the building's center.
*/

function buildingTouchesRoad(
    x,
    z,
    halfX,
    halfZ,
    rotation
) {

    const cos =
        Math.abs(Math.cos(rotation));

    const sin =
        Math.abs(Math.sin(rotation));

    const projectedX =
        halfX * cos +
        halfZ * sin;

    const projectedZ =
        halfX * sin +
        halfZ * cos;

    const candidates =
        roadCandidates(x, z);

    for (const road of candidates) {

        if (road.axis === "x") {

            if (
                Math.abs(
                    z - road.center
                ) <
                road.width / 2 +
                projectedZ +
                5
            ) {

                return true;
            }

        } else {

            if (
                Math.abs(
                    x - road.center
                ) <
                road.width / 2 +
                projectedX +
                5
            ) {

                return true;
            }
        }
    }

    return false;
}


/* =========================================================
   SURFACE HEIGHT
========================================================= */

function getSurfaceHeight(x, z) {

    const terrain =
        terrainHeight(x, z);

    const road =
        getRoadAt(x, z);

    if (road) {

        return (
            terrain +
            ROAD_LIFT
        );
    }

    return terrain;
}


/* =========================================================
   WORLD STRIPS
========================================================= */

function createWorldStrip(
    centerX,
    centerZ,
    axis,
    length,
    width,
    lift,
    material,
    segmentsLength = 16,
    segmentsWidth = 2
) {

    const geometry =
        axis === "x"
            ? new THREE.PlaneGeometry(
                length,
                width,
                segmentsLength,
                segmentsWidth
            )
            : new THREE.PlaneGeometry(
                width,
                length,
                segmentsWidth,
                segmentsLength
            );

    geometry.rotateX(
        -Math.PI / 2
    );

    const position =
        geometry.attributes.position;

    for (
        let i = 0;
        i < position.count;
        i++
    ) {

        const lx =
            position.getX(i);

        const lz =
            position.getZ(i);

        const wx =
            centerX + lx;

        const wz =
            centerZ + lz;

        position.setX(
            i,
            wx
        );

        position.setZ(
            i,
            wz
        );

        position.setY(
            i,
            terrainHeight(
                wx,
                wz
            ) + lift
        );
    }

    position.needsUpdate = true;

    geometry.computeVertexNormals();

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.receiveShadow = true;

    return mesh;
}


/* =========================================================
   TERRAIN CHUNK
========================================================= */

function createTerrain(
    group,
    cx,
    cz
) {

    const minX =
        cx * CHUNK_SIZE;

    const minZ =
        cz * CHUNK_SIZE;

    const segments = 32;

    const geometry =
        new THREE.PlaneGeometry(
            CHUNK_SIZE,
            CHUNK_SIZE,
            segments,
            segments
        );

    geometry.rotateX(
        -Math.PI / 2
    );

    const position =
        geometry.attributes.position;

    const colors = [];

    for (
        let i = 0;
        i < position.count;
        i++
    ) {

        const wx =
            minX +
            position.getX(i) +
            CHUNK_SIZE / 2;

        const wz =
            minZ +
            position.getZ(i) +
            CHUNK_SIZE / 2;

        const y =
            terrainHeight(
                wx,
                wz
            );

        position.setY(
            i,
            y
        );

        const biome =
            getBiome(
                wx,
                wz
            );

        let c;

        if (biome === "city") {

            c = new THREE.Color(
                0x66735d
            );

        } else if (
            biome === "coast"
        ) {

            c = new THREE.Color(
                0xb3a27b
            );

        } else if (
            biome === "mountain"
        ) {

            c = new THREE.Color(
                0x697068
            );

        } else {

            c = new THREE.Color(
                0x557b4b
            );
        }

        const variation =
            .92 +
            smoothNoise(
                wx * .03,
                wz * .03
            ) * .12;

        c.multiplyScalar(
            variation
        );

        colors.push(
            c.r,
            c.g,
            c.b
        );
    }

    geometry.setAttribute(
        "color",
        new THREE.Float32BufferAttribute(
            colors,
            3
        )
    );

    geometry.computeVertexNormals();

    const material =
        new THREE.MeshStandardMaterial({
            vertexColors: true,
            roughness: 1
        });

    const terrain =
        new THREE.Mesh(
            geometry,
            material
        );

    terrain.receiveShadow = true;

    group.add(
        terrain
    );
}


/* =========================================================
   ROAD SURFACE
========================================================= */

function createRoadSurface(
    group,
    centerX,
    centerZ,
    axis,
    width
) {

    const road =
        createWorldStrip(
            centerX,
            centerZ,
            axis,
            CHUNK_SIZE + 14,
            width,
            ROAD_LIFT,
            roadMaterial,
            24,
            6
        );

    group.add(
        road
    );
}


/* =========================================================
   ROAD MARKINGS
========================================================= */

function addRoadLine(
    group,
    centerX,
    centerZ,
    axis,
    offset,
    length,
    width,
    material
) {

    const x =
        axis === "x"
            ? centerX
            : centerX + offset;

    const z =
        axis === "x"
            ? centerZ + offset
            : centerZ;

    const line =
        createWorldStrip(
            x,
            z,
            axis,
            length,
            width,
            ROAD_LIFT +
            ROAD_MARK_LIFT,
            material,
            12,
            1
        );

    group.add(
        line
    );
}


function addDashedCenterLine(
    group,
    centerX,
    centerZ,
    axis,
    material
) {

    const dashLength = 13;
    const gap = 13;

    for (
        let p = -112;
        p < 112;
        p += dashLength + gap
    ) {

        const x =
            axis === "x"
                ? centerX + p
                : centerX;

        const z =
            axis === "x"
                ? centerZ
                : centerZ + p;

        const dash =
            createWorldStrip(
                x,
                z,
                axis,
                dashLength,
                .28,
                ROAD_LIFT +
                ROAD_MARK_LIFT,
                material,
                2,
                1
            );

        group.add(
            dash
        );
    }
}


/* =========================================================
   SIDEWALKS
========================================================= */

function addSidewalks(
    group,
    centerX,
    centerZ,
    axis,
    roadWidth
) {

    if (
        roadWidth > 18
    ) {

        return;
    }

    const sideOffset =
        roadWidth / 2 + 4;

    for (
        const side of [-1, 1]
    ) {

        const offset =
            sideOffset * side;

        const x =
            axis === "x"
                ? centerX
                : centerX + offset;

        const z =
            axis === "x"
                ? centerZ + offset
                : centerZ;

        const sidewalk =
            createWorldStrip(
                x,
                z,
                axis,
                CHUNK_SIZE + 14,
                5.5,
                SIDEWALK_LIFT,
                sidewalkMaterial,
                16,
                2
            );

        group.add(
            sidewalk
        );

        const curb =
            createWorldStrip(
                x,
                z,
                axis,
                CHUNK_SIZE + 14,
                .45,
                SIDEWALK_LIFT +
                .04,
                curbMaterial,
                16,
                1
            );

        group.add(
            curb
        );
    }
}


/* =========================================================
   HIGHWAY GUARDRAILS
========================================================= */

function addGuardrails(

    centerX,
    centerZ,

) {

    const offset =

    if (axis === "x") {

                centerZ +

            const rail =

            );

            group.add(
                rail

        }

        for (

/* =========================================================
   COMPLETE ROAD
========================================================= */

function createRoad(
    group,
    centerX,
    centerZ,
    axis,
    type,
    width
) {

    createRoadSurface(
        group,
        centerX,
        centerZ,
        axis,
        width
    );

    if (
        type === "highway"
    ) {

        addRoadLine(
            group,
            centerX,
            centerZ,
            axis,
            -(width / 2 - 1.3),
            CHUNK_SIZE + 10,
            .25,
            whiteRoadMaterial
        );

        addRoadLine(
            group,
            centerX,
            centerZ,
            axis,
            width / 2 - 1.3,
            CHUNK_SIZE + 10,
            .25,
            whiteRoadMaterial
        );

        addDashedCenterLine(
            group,
            centerX,
            centerZ,
            axis,
            yellowRoadMaterial
        );

        addGuardrails(
            group,
            centerX,
            centerZ,
            axis,
            width
        );

    } else if (
        type === "major"
    ) {

        addRoadLine(
            group,
            centerX,
            centerZ,
            axis,
            -(width / 2 - 1.5),
            CHUNK_SIZE + 10,
            .3,
            whiteRoadMaterial
        );

        addRoadLine(
            group,
            centerX,
            centerZ,
            axis,
            width / 2 - 1.5,
            CHUNK_SIZE + 10,
            .3,
            whiteRoadMaterial
        );

        addRoadLine(
            group,
            centerX,
            centerZ,
            axis,
            -.55,
            CHUNK_SIZE + 10,
            .18,
            yellowRoadMaterial
        );

        addRoadLine(
            group,
            centerX,
            centerZ,
            axis,
            .55,
            CHUNK_SIZE + 10,
            .18,
            yellowRoadMaterial
        );

        addSidewalks(
            group,
            centerX,
            centerZ,
            axis,
            width
        );

    } else {

        addDashedCenterLine(
            group,
            centerX,
            centerZ,
            axis,
            yellowRoadMaterial
        );

        addSidewalks(
            group,
            centerX,
            centerZ,
            axis,
            width
        );
    }
}


/* =========================================================
   ROAD GENERATION
========================================================= */

function generateRoads(
    group,
    cx,
    cz
) {

    const minX =
        cx * CHUNK_SIZE;

    const maxX =
        minX + CHUNK_SIZE;

    const minZ =
        cz * CHUNK_SIZE;

    const maxZ =
        minZ + CHUNK_SIZE;


    /*
       Horizontal roads.
       Every 80 units is enough because:
       240 and 480 are both multiples of 80.
    */

    const startZ =
        Math.floor(
            minZ / 80
        ) * 80;

    for (
        let z = startZ;
        z < maxZ;
        z += 80
    ) {

        if (
            z < minZ
        ) {
            continue;
        }

        const road =
            roadExistsOnX(z);

        if (!road) {
            continue;
        }

        createRoad(
            group,
            (minX + maxX) / 2,
            road.center,
            "x",
            road.type,
            road.width
        );
    }


    /*
       Vertical roads.
    */

    const startX =
        Math.floor(
            minX / 80
        ) * 80;

    for (
        let x = startX;
        x < maxX;
        x += 80
    ) {

        if (
            x < minX
        ) {
            continue;
        }

        const road =
            roadExistsOnZ(x);

        if (!road) {
            continue;
        }

        createRoad(
            group,
            road.center,
            (minZ + maxZ) / 2,
            "z",
            road.type,
            road.width
        );
    }
}

function generateStreetLights(
    group,
    cx,
    cz
) {

    const minX =
        cx * CHUNK_SIZE;

    const maxX =
        minX + CHUNK_SIZE;

    const minZ =
        cz * CHUNK_SIZE;

    const maxZ =
        minZ + CHUNK_SIZE;


    const startZ =
        Math.floor(
            minZ / 80
        ) * 80;

    for (
        let z = startZ;
        z < maxZ;
        z += 80
    ) {

        const road =
            roadExistsOnX(z);

        if (
            !road ||
            road.type === "highway"
        ) {
            continue;
        }

        for (
            const p of [-75, 75]
        ) {

            const x =
                (minX + maxX) / 2 +
                p;

            const side =
                p > 0 ? 1 : -1;

            const offset =
                road.width / 2 + 4;

            createStreetLight(
                group,
                x,
                z + offset * side
            );
        }
    }


    const startX =
        Math.floor(
            minX / 80
        ) * 80;

    for (
        let x = startX;
        x < maxX;
        x += 80
    ) {

        const road =
            roadExistsOnZ(x);

        if (
            !road ||
            road.type === "highway"
        ) {
            continue;
        }

        for (
            const p of [-75, 75]
        ) {

            const z =
                (minZ + maxZ) / 2 +
                p;

            const side =
                p > 0 ? 1 : -1;

            const offset =
                road.width / 2 + 4;

            createStreetLight(
                group,
                x + offset * side,
                z
            );
        }
    }
}


/* =========================================================
   BUILDING ASSETS
========================================================= */

const buildingFiles = [
    "./assets/buildings/large-building.glb",
    "./assets/buildings/store.glb",
    "./assets/buildings/apartment.glb",
    "./assets/buildings/large-building-2.glb",
    "./assets/buildings/bank.glb"
];

const buildingTemplates = [];


async function loadBuildings() {

    for (
        const file of buildingFiles
    ) {

        try {

            const gltf =
                await gltfLoader.loadAsync(
                    file
                );

            const root =
                gltf.scene;

            root.updateMatrixWorld(
                true
            );

            const box =
                new THREE.Box3()
                .setFromObject(root);

            const size =
                box.getSize(
                    new THREE.Vector3()
                );

            const height =
                Math.max(
                    size.y,
                    .001
                );

            /*
               Normalize every building
               so the original GLB can be
               any size.
            */

            const targetHeight =
                18 +
                Math.random() * 18;

            const scale =
                targetHeight /
                height;

            root.scale.setScalar(
                scale
            );

            root.updateMatrixWorld(
                true
            );

            const correctedBox =
                new THREE.Box3()
                .setFromObject(root);

            root.position.y -=
                correctedBox.min.y;

            root.updateMatrixWorld(
                true
            );

            root.traverse(
                child => {

                    if (
                        child.isMesh
                    ) {

                        child.castShadow =
                            true;

                        child.receiveShadow =
                            true;

                        child.userData.sharedGeometry =
                            true;
                    }
                }
            );

            const finalBox =
                new THREE.Box3()
                .setFromObject(root);

            const finalSize =
                finalBox.getSize(
                    new THREE.Vector3()
                );

            buildingTemplates.push({
                root,
                width: finalSize.x,
                depth: finalSize.z
            });

        } catch (error) {

            console.warn(
                "Building failed:",
                file,
                error
            );
        }
    }
}

========================================================= */

function createFallbackBuilding(
    group,
    x,
    z,
    width,
    depth,
    height,
    rotation
) {

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:
                0x767b82,
            roughness: .85
        });

    const building =
        new THREE.Mesh(
            geometry,
            material
        );

    building.position.set(
        x,
        terrainHeight(
            x,
            z
        ) +
        height / 2,
        z
    );

    building.rotation.y =
        rotation;

    building.castShadow =
        true;

    building.receiveShadow =
        true;

    group.add(
        building
    );
}


/* =========================================================
   BUILDINGS
========================================================= */

function generateBuildings(
    group,
    cx,
    cz
) {

    const lots = [];

    const centerX =
        cx * CHUNK_SIZE +
        CHUNK_SIZE / 2;

    const centerZ =
        cz * CHUNK_SIZE +
        CHUNK_SIZE / 2;

    const biome =
        getBiome(
            centerX,
            centerZ
        );

    let targetCount = 0;

    if (
        biome === "city"
    ) {

        targetCount = 13;

    } else if (
        biome === "countryside"
    ) {

        targetCount = 2;
    }

    if (
        targetCount === 0
    ) {

        group.userData.buildingLots =
            lots;

        return;
    }


    let attempts = 0;

    while (
        lots.length <
        targetCount &&
        attempts <
        targetCount * 12
    ) {

        attempts++;

        const x =
            centerX +
            randomRange(
                cx * 17 + attempts,
                cz * 23 + attempts,
                -102,
                102,
                1
            );

        const z =
            centerZ +
            randomRange(
                cx * 29 + attempts,
                cz * 31 + attempts,
                -102,
                102,
                2
            );

        /*
           Never put buildings on
           grass directly beside a road.
        */

        if (
            buildingTouchesRoad(
                x,
                z,
                8,
                8,
                0
            )
        ) {

            continue;
        }

        const rotation =
            randomRange(
                x,
                z,
                -0.12,
                0.12,
                8
            );

        let template = null;

        if (
            buildingTemplates.length
        ) {

            const index =
                Math.floor(
                    randomRange(
                        x,
                        z,
                        0,
                        buildingTemplates.length,
                        9
                    )
                );

            template =
                buildingTemplates[
                    Math.min(
                        index,
                        buildingTemplates.length - 1
                    )
                ];
        }

        let width = 15;
        let depth = 15;

        if (template) {

            width =
                template.width;

            depth =
                template.depth;
        } else {

            width =
                randomRange(
                    x,
                    z,
                    10,
                    22,
                    10
                );

            depth =
                randomRange(
                    x,
                    z,
                    10,
                    22,
                    11
                );
        }

        const halfX =
            width / 2;

        const halfZ =
            depth / 2;

        if (
            buildingTouchesRoad(
                x,
                z,
                halfX,
                halfZ,
                rotation
            )
        ) {

            continue;
        }


        /*
           Keep buildings away from
           each other.
        */

        let overlaps =
            false;

        const radius =
            Math.max(
                halfX,
                halfZ
            );

        for (
            const lot of lots
        ) {

            const dx =
                x - lot.x;

            const dz =
                z - lot.z;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dz * dz
                );

            if (
                distance <
                radius +
                lot.radius +
                8
            ) {

                overlaps = true;
                break;
            }
        }

        if (
            overlaps
        ) {

            continue;
        }


        const y =
            terrainHeight(
                x,
                z
            );


        if (template) {

            const building =
                template.root.clone(
                    true
                );

            building.position.set(
                x,
                y,
                z
            );

            building.rotation.y =
                rotation;

            building.traverse(
                child => {

                    if (
                        child.isMesh
                    ) {

                        child.castShadow =
                            true;

                        child.receiveShadow =
                            true;

                        child.userData.sharedGeometry =
                            true;
                    }
                }
            );

            group.add(
                building
            );

        } else {

            const height =
                randomRange(
                    x,
                    z,
                    12,
                    32,
                    15
                );

            createFallbackBuilding(
                group,
                x,
                z,
                width,
                depth,
                height,
                rotation
            );
        }


        lots.push({
            x,
            z,
            radius
        });
    }

    group.userData.buildingLots =
        lots;
}

function createTree(
    group,
    x,
    z,
    scale
) {

    const y =
        terrainHeight(

            z
        );

    const tree =
        new THREE.Group();

    const trunk =
        new THREE.Mesh(
            treeTrunkGeometry,
            treeTrunkMaterial
        );

    trunk.userData.sharedGeometry =
        true;

    trunk.position.y =
        1.2;

    trunk.castShadow =
        true;

    trunk.receiveShadow =
        true;

    tree.add(
        trunk
    );


    const leaves =
        new THREE.Mesh(
            treeLeafGeometry,
            treeLeafMaterial
        );

    leaves.userData.sharedGeometry =
        true;

    leaves.position.y =
        2.7;

    leaves.scale.set(
        1.15,
        1.35,
        1.15
    );

    leaves.castShadow =
        true;

    leaves.receiveShadow =
        true;

    tree.add(

    );

    tree.position.set(
        x,

    );

    tree.scale.setScalar(

    );

    );
}


function generateTrees(
    group,
    cx,
    cz
) {

    const centerX =
        cx * CHUNK_SIZE +
        CHUNK_SIZE / 2;

    const centerZ =
        cz * CHUNK_SIZE +
        CHUNK_SIZE / 2;

    const biome =
        getBiome(
            centerX,
            centerZ
        );

    let amount = 0;

    if (
        biome === "city"
    ) {

        amount = 7;

    } else if (
        biome === "countryside"
    ) {

        amount = 22;

    } else if (
        biome === "coast"
    ) {

        amount = 8;

    } else {

        amount = 14;
    }


    const lots =
        group.userData.buildingLots ||
        [];


    let attempts = 0;
    let created = 0;

    while (
        created < amount &&
        attempts < amount * 10
    ) {

        attempts++;

        const x =
            centerX +
            randomRange(
                cx * 37 + attempts,
                cz * 41 + attempts,
                -112,
                112,
                20
            );

        const z =
            centerZ +
            randomRange(
                cx * 43 + attempts,
                cz * 47 + attempts,
                -112,
                112,
                21
            );


        /*
           THIS is the important fix.

           Trees are not allowed within a
           generous radius of ANY road.
        */

        if (
            !isClearOfRoad(
                x,
                z,
                7
            )
        ) {

            continue;
        }


        let nearBuilding =
            false;

        for (
            const lot of lots
        ) {

            const dx =
                x - lot.x;

            const dz =
                z - lot.z;

            if (
                Math.sqrt(
                    dx * dx +
                    dz * dz
                ) <
                lot.radius + 7
            ) {

                nearBuilding = true;
                break;
            }
        }

        if (
            nearBuilding
        ) {

            continue;
        }


        const scale =
            randomRange(
                x,
                z,
                .75,
                1.35,
                22
            );

        createTree(
            group,
            x,
            z,
            scale
        );

        created++;
    }
}

            );

                    Math.PI,

                ),

                    z,
                    0,
                    Math.PI,

                ),

        const z =
            centerZ +
            randomRange(
                cx * 83 + i,
                cz * 89 + i,
                -100,
                100,
                41
            );

        const radius =
            randomRange(
                x,
                z,
                20,
                65,
                42
            );

        const height =
            randomRange(
                x,
                z,
                40,
                120,
                43
            );

        const mountain =
            new THREE.Mesh(
                mountainGeometry,
                mountainMaterial
            );

        mountain.userData.sharedGeometry =
            true;

        mountain.scale.set(
            radius,
            height,
            radius
        );

        mountain.position.set(
            x,
            terrainHeight(
                x,
                z
            ) +
            height / 2,
            z
        );

        mountain.castShadow =
            true;

        mountain.receiveShadow =
            true;

        group.add(
            mountain
        );
    }
}


/* =========================================================
   WATER
========================================================= */

function generateWater(
    group,
    cx,
    cz
) {

    const centerX =
        cx * CHUNK_SIZE +
        CHUNK_SIZE / 2;

    const centerZ =
        cz * CHUNK_SIZE +
        CHUNK_SIZE / 2;

    const biome =
        getBiome(
            centerX,
            centerZ
        );

    if (
        biome !== "coast"
    ) {

        return;
    }


    const centerTerrain =
        terrainHeight(
            centerX,
            centerZ
        );

    /*
       Keep water BELOW the terrain
       so it can never cover roads.
    */

    const waterY =
        Math.min(
            WATER_LEVEL,
            centerTerrain - .3
        );


    const water =
        new THREE.Mesh(
            waterGeometry,
            waterMaterial
        );

    water.userData.sharedGeometry =
        true;

    water.rotation.x =
        -Math.PI / 2;

    water.scale.set(
        CHUNK_SIZE * 1.15,
        CHUNK_SIZE * 1.15,
        1
    );

    water.position.set(
        centerX,
        waterY,
        centerZ
    );

    water.receiveShadow =
        true;

    group.add(
        water
    );
}


/* =========================================================
   INTERSECTION DETAILS
========================================================= */

function createIntersectionDetails(
    group,
    x,
    z
) {

    if (
        Math.abs(x) >
        CITY_RADIUS ||
        Math.abs(z) >
        CITY_RADIUS
    ) {

        return;
    }

    const road =
        getRoadAt(
            x,
            z
        );

    if (!road) {
        return;
    }


    /*
       Small central island/reflector
       only on major intersections.
    */

    const majorX =
        Math.abs(
            x / 240 -
            Math.round(x / 240)
        ) < .001;

    const majorZ =
        Math.abs(
            z / 240 -
            Math.round(z / 240)
        ) < .001;

    if (
        !majorX ||
        !majorZ
    ) {

        return;
    }


    const surface =
        getSurfaceHeight(
            x,
            z
        );

    const islandGeometry =
        new THREE.CylinderGeometry(
            2.5,
            2.7,
            .12,
            20
        );

    const islandMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x777a76,
            roughness: 1
        });

    const island =
        new THREE.Mesh(
            islandGeometry,
            islandMaterial
        );

    island.position.set(
        x,
        surface + .08,
        z
    );

    island.receiveShadow =
        true;

    group.add(
        island
    );
}


/* =========================================================
   CHUNK GENERATION
========================================================= */

function generateChunk(
    cx,
    cz
) {

    const key =
        `${cx},${cz}`;

    if (
        chunks.has(key)
    ) {

        return;
    }


    const group =
        new THREE.Group();

    group.name =
        `Chunk_${cx}_${cz}`;


    /*
       TERRAIN FIRST
    */

    createTerrain(
        group,
        cx,
        cz
    );


    /*
       ROAD SECOND.

       Roads physically sit ABOVE
       the terrain and grass.
    */

    generateRoads(
        group,
        cx,
        cz
    );


    /*
       ROAD LIGHTS / DETAILS
    */

    generateStreetLights(
        group,
        cx,
        cz
    );


    /*
       BUILDINGS BEFORE TREES.

       Trees are given building positions
       so they cannot spawn inside buildings.
    */

    generateBuildings(
        group,
        cx,
        cz
    );


    generateTrees(
        group,
        cx,
        cz
    );


    generateNatureProps(
        group,
        cx,
        cz
    );


    generateMountains(
        group,
        cx,
        cz
    );


    generateWater(
        group,
        cx,
        cz
    );


    /*
       Add intersection detail if the
       chunk contains one.
    */

    const minX =
        cx * CHUNK_SIZE;

    const minZ =
        cz * CHUNK_SIZE;

    const intersectionX =
        Math.ceil(
            minX / 240
        ) * 240;

    const intersectionZ =
        Math.ceil(
            minZ / 240
        ) * 240;

    if (
        intersectionX <
        minX + CHUNK_SIZE &&
        intersectionZ <
        minZ + CHUNK_SIZE
    ) {

        createIntersectionDetails(
            group,
            intersectionX,
            intersectionZ
        );
    }


    scene.add(
        group
    );

    chunks.set(
        key,
        {
            group,
            cx,
            cz
        }
    );
}


/* =========================================================
   CHUNK DISPOSAL
========================================================= */

function disposeGroup(
    group
) {

    group.traverse(
        object => {

            if (
                object.isMesh &&
                object.geometry &&
                !object.userData.sharedGeometry
            ) {

                object.geometry.dispose();
            }
        }
    );
}


function unloadFarChunks(
    currentCX,
    currentCZ
) {

    for (
        const [key, chunk]
        of chunks
    ) {

        const dx =
            Math.abs(
                chunk.cx -
                currentCX
            );

        const dz =
            Math.abs(
                chunk.cz -
                currentCZ
            );

        if (
            dx > UNLOAD_RADIUS ||
            dz > UNLOAD_RADIUS
        ) {

            scene.remove(
                chunk.group
            );

            disposeGroup(
                chunk.group
            );

            chunks.delete(
                key
            );
        }
    }
}


/* =========================================================
   WORLD STREAMING
========================================================= */

function updateWorldStreaming(
    force = false
) {

    if (
        !worldReady ||
        !carRoot
    ) {

        return;
    }

    const cx =
        Math.floor(
            carRoot.position.x /
            CHUNK_SIZE
        );

    const cz =
        Math.floor(
            carRoot.position.z /
            CHUNK_SIZE
        );


    if (
        !force &&
        cx === lastChunkX &&
        cz === lastChunkZ
    ) {

        return;
    }


    lastChunkX = cx;
    lastChunkZ = cz;


    /*
       Generate closest chunks first.
    */

    const required = [];

    for (
        let x = -LOAD_RADIUS;
        x <= LOAD_RADIUS;
        x++
    ) {

        for (
            let z = -LOAD_RADIUS;
            z <= LOAD_RADIUS;
            z++
        ) {

            required.push({
                cx: cx + x,
                cz: cz + z,
                distance:
                    Math.abs(x) +
                    Math.abs(z)
            });
        }
    }

    required.sort(
        (a, b) =>
            a.distance -
            b.distance
    );


    for (
        const item of required
    ) {

        generateChunk(
            item.cx,
            item.cz
        );
    }


    unloadFarChunks(
        cx,
        cz
    );
}


/* =========================================================
   CAR
========================================================= */

let carRoot =
    new THREE.Group();

scene.add(
    carRoot
);

let carModel = null;

let carLoaded = false;

let carSpeed = 0;

let steering = 0;

let targetSteering = 0;

let nightMode = false;

const keys = {};


/* =========================================================
   CAR FALLBACK
========================================================= */

function createFallbackCar() {

    const root =
        new THREE.Group();


    const bodyMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xb66c35,
            metalness: .55,
            roughness: .25
        });

    const darkMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x171b20,
            metalness: .4,
            roughness: .2
        });


    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.25,
                .55,
                4.8
            ),
            bodyMaterial
        );

    body.position.y =
        .65;

    body.castShadow =
        true;

    root.add(
        body
    );


    const roof =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.7,
                .5,
                2.1
            ),
            darkMaterial
        );

    roof.position.set(
        0,
        1.02,
        .15
    );

    roof.castShadow =
        true;

    root.add(
        roof
    );


    const wheelGeometry =
        new THREE.CylinderGeometry(
            .4,
            .4,
            .28,
            16
        );

    for (
        const x of [-1.05, 1.05]
    ) {

        for (
            const z of [-1.55, 1.55]
        ) {

            const wheel =
                new THREE.Mesh(
                    wheelGeometry,
                    darkMaterial
                );

            wheel.rotation.z =
                Math.PI / 2;

            wheel.position.set(
                x,
                .4,
                z
            );

            wheel.castShadow =
                true;

            root.add(
                wheel
            );
        }
    }


    root.position.y = 0;

    return root;
}


/* =========================================================
   HEADLIGHTS
========================================================= */

const headlights = [];


function createHeadlights() {

    const headlightMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xffffff,
            emissive: 0xffffff,
            emissiveIntensity: 4
        });

    for (
        const x of [-.72, .72]
    ) {

        const lightMesh =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    .11,
                    8,
                    8
                ),
                headlightMaterial
            );

        lightMesh.position.set(
            x,
            .72,
            -2.25
        );

        carRoot.add(
            lightMesh
        );


        const light =
            new THREE.SpotLight(
                0xddeeff,
                nightMode ? 4 : 0,
                45,
                .3,
                .55,
                1.2
            );

        light.position.set(
            x,
            .75,
            -2.2
        );

        const target =
            new THREE.Object3D();

        target.position.set(
            x,
            .55,
            -14
        );

        carRoot.add(
            target
        );

        light.target =
            target;

        carRoot.add(
            light
        );

        headlights.push(
            light
        );
    }
}


function updateHeadlights() {

    for (
        const light of headlights
    ) {

        light.intensity =
            nightMode
                ? 4
                : 0;
    }
}


/* =========================================================
   LOAD CAR
========================================================= */

async function loadCar() {

    try {

        const gltf =
            await gltfLoader.loadAsync(
                "./assets/golden-hour-coastal-supercar.glb"
            );

        carModel =
            gltf.scene;

        carModel.updateMatrixWorld(
            true
        );


        const box =
            new THREE.Box3()
            .setFromObject(
                carModel
            );

        const size =
            box.getSize(
                new THREE.Vector3()
            );

        const largest =
            Math.max(
                size.x,
                size.y,
                size.z
            );

        const desired =
            5.2;

        const scale =
            desired /
            largest;

        carModel.scale.setScalar(
            scale
        );

        carModel.updateMatrixWorld(
            true
        );


        const correctedBox =
            new THREE.Box3()
            .setFromObject(
                carModel
            );

        carModel.position.y -=
            correctedBox.min.y;


        carModel.rotation.y =
            Math.PI / 2;


        carModel.traverse(
            child => {

                if (
                    child.isMesh
                ) {

                    child.castShadow =
                        true;

                    child.receiveShadow =
                        true;
                }
            }
        );


        carRoot.add(
            carModel
        );

    } catch (error) {

        console.warn(
            "Supercar failed to load. Using fallback.",
            error
        );

        carModel =
            createFallbackCar();

        carRoot.add(
            carModel
        );
    }


    carLoaded = true;

    createHeadlights();

    positionCarAtStart();
}


/* =========================================================
   CAR START
========================================================= */

function positionCarAtStart() {

    carRoot.position.set(
        0,
        getSurfaceHeight(
            0,
            40
        ) +
        CAR_GROUND_OFFSET,
        40
    );

    carRoot.rotation.y =
        0;
}


/* =========================================================
   INPUT
========================================================= */

window.addEventListener(
    "keydown",
    event => {

        keys[event.code] =
            true;

        if (
            [
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight",
                "Space"
            ].includes(event.code)
        ) {

            event.preventDefault();
        }


        if (
            event.code === "KeyN" &&
            !event.repeat
        ) {

            toggleNight();
        }
    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[event.code] =
            false;
    }
);


window.addEventListener(
    "blur",
    () => {

        for (
            const key in keys
        ) {

            keys[key] =
                false;
        }
    }
);


/* =========================================================
   NIGHT MODE
========================================================= */

function toggleNight() {

    nightMode =
        !nightMode;

    if (
        nightMode
    ) {

        scene.background =
            new THREE.Color(
                0x07101d
            );

        scene.fog.color =
            new THREE.Color(
                0x07101d
            );

        hemiLight.intensity =
            .35;

        sun.intensity =
            .35;

        ambientLight.intensity =
            .12;

        starMaterial.opacity =
            .85;

        document.getElementById(
            "nightIndicator"
        ).textContent =
            "NIGHT";

    } else {

        scene.background =
            new THREE.Color(
                0x91b7dc
            );

        scene.fog.color =
            new THREE.Color(
                0x91b7dc
            );

        hemiLight.intensity =
            1.8;

        sun.intensity =
            3.2;

        ambientLight.intensity =
            .22;

        starMaterial.opacity =
            0;

        document.getElementById(
            "nightIndicator"
        ).textContent =
            "DAY";
    }

    updateHeadlights();
}


/* =========================================================
   BUILDING COLLISION
========================================================= */

function carHitsBuilding(
    x,
    z
) {

    const cx =
        Math.floor(
            x /
            CHUNK_SIZE
        );

    const cz =
        Math.floor(
            z /
            CHUNK_SIZE
        );


    for (
        let dx = -1;
        dx <= 1;
        dx++
    ) {

        for (
            let dz = -1;
            dz <= 1;
            dz++
        ) {

            const chunk =
                chunks.get(
                    `${cx + dx},${cz + dz}`
                );

            if (
                !chunk
            ) {
                continue;
            }

            const lots =
                chunk.group
                    .userData
                    .buildingLots ||
                [];


            for (
                const lot of lots
            ) {

                const distance =
                    Math.sqrt(
                        (x - lot.x) *
                        (x - lot.x) +
                        (z - lot.z) *
                        (z - lot.z)
                    );

                if (
                    distance <
                    lot.radius +
                    2.2
                ) {

                    return true;
                }
            }
        }
    }

    return false;
}


/* =========================================================
   CAR PHYSICS
========================================================= */

function updateCar() {

    if (
        !carLoaded
    ) {

        return;
    }


    const accelerating =
        keys["KeyW"] ||
        keys["ArrowUp"];

    const reversing =
        keys["KeyS"] ||
        keys["ArrowDown"];

    const braking =
        keys["Space"];


    if (
        accelerating
    ) {

        carSpeed += .018;

    } else if (
        reversing
    ) {

        carSpeed -= .014;

    } else {

        carSpeed *= .975;
    }


    if (
        braking
    ) {

        carSpeed *= .90;
    }


    carSpeed =
        THREE.MathUtils.clamp(
            carSpeed,
            -.42,
            1.05
        );


    targetSteering = 0;

    if (
        keys["KeyA"] ||
        keys["ArrowLeft"]
    ) {

        targetSteering =
            -1;

    } else if (
        keys["KeyD"] ||
        keys["ArrowRight"]
    ) {

        targetSteering =
            1;
    }


    steering =
        THREE.MathUtils.lerp(
            steering,
            targetSteering,
            .14
        );


    const speedFactor =
        THREE.MathUtils.clamp(
            Math.abs(carSpeed),
            0,
            1
        );


    carRoot.rotation.y -=
        steering *
        .032 *
        speedFactor *
        Math.sign(
            carSpeed ||
            1
        );


    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    forward.applyQuaternion(
        carRoot.quaternion
    );


    const oldX =
        carRoot.position.x;

    const oldZ =
        carRoot.position.z;


    carRoot.position.x +=
        forward.x *
        carSpeed;

    carRoot.position.z +=
        forward.z *
        carSpeed;


    /*
       Building collision.
    */

    if (
        carHitsBuilding(
            carRoot.position.x,
            carRoot.position.z
        )
    ) {

        carRoot.position.x =
            oldX;

        carRoot.position.z =
            oldZ;

        carSpeed *=
            -.18;
    }


    const ground =
        getSurfaceHeight(
            carRoot.position.x,
            carRoot.position.z
        );


    carRoot.position.y =
        THREE.MathUtils.lerp(
            carRoot.position.y,
            ground +
            CAR_GROUND_OFFSET,
            .3
        );


    /*
       Keep the car stable.
    */

    carRoot.rotation.x =
        THREE.MathUtils.lerp(
            carRoot.rotation.x,
            0,
            .12
        );

    carRoot.rotation.z =
        THREE.MathUtils.lerp(
            carRoot.rotation.z,
            -steering *
            .025 *
            speedFactor,
            .12
        );
}


/* =========================================================
   CAMERA
========================================================= */

const cameraTarget =
    new THREE.Vector3();

function updateCamera() {

    if (
        !carLoaded
    ) {

        return;
    }


    const cameraOffset =
        new THREE.Vector3(
            0,
            4.8,
            11
        );

    cameraOffset.applyQuaternion(
        carRoot.quaternion
    );

    const desired =
        carRoot.position
            .clone()
            .add(
                cameraOffset
            );


    camera.position.lerp(
        desired,
        .085
    );


    cameraTarget
        .copy(
            carRoot.position
        )
        .add(
            new THREE.Vector3(
                0,
                1.4,
                0
            )
        );


    camera.lookAt(
        cameraTarget
    );
}


/* =========================================================
   HUD
========================================================= */

let hudTimer = 0;

function updateHUD() {

    hudTimer++;

    if (
        hudTimer < 8
    ) {

        return;
    }

    hudTimer = 0;


    const speed =
        Math.round(
            Math.abs(
                carSpeed
            ) * 52
        );


    document.getElementById(
        "speed"
    ).textContent =
        speed;


    const cx =
        Math.floor(
            carRoot.position.x /
            CHUNK_SIZE
        );

    const cz =
        Math.floor(
            carRoot.position.z /
            CHUNK_SIZE
        );


    const biome =
        getBiome(
            carRoot.position.x,
            carRoot.position.z
        );


    document.getElementById(
        "worldInfo"
    ).textContent =
        `${biome.toUpperCase()}  •  SECTOR ${cx}, ${cz}`;
}


/* =========================================================
   STARTUP
========================================================= */

async function startGame() {

    const loadingFill =
        document.getElementById(
            "loadingFill"
        );


    loadingFill.style.width =
        "20%";


    await loadBuildings();


    loadingFill.style.width =
        "45%";


    await loadCar();


    loadingFill.style.width =
        "60%";


    /*
       Prevent the animation loop from
       attempting streaming while the
       starting world is being built.
    */

    worldReady = false;


    /*
       Build the initial 5x5 world.
    */

    const initialChunks = [];

    for (
        let x = -LOAD_RADIUS;
        x <= LOAD_RADIUS;
        x++
    ) {

        for (
            let z = -LOAD_RADIUS;
            z <= LOAD_RADIUS;
            z++
        ) {

            initialChunks.push({
                cx: x,
                cz: z,
                d:
                    Math.abs(x) +
                    Math.abs(z)
            });
        }
    }

    initialChunks.sort(
        (a, b) =>
            a.d - b.d
    );


    for (
        let i = 0;
        i < initialChunks.length;
        i++
    ) {

        const item =
            initialChunks[i];

        generateChunk(
            item.cx,
            item.cz
        );


        const progress =
            60 +
            (
                i /
                initialChunks.length
            ) *
            35;

        loadingFill.style.width =
            `${progress}%`;


        /*
           Give the browser a frame every
           few chunks so the loading screen
           remains responsive.
        */

        if (
            i % 2 === 0
        ) {

            await new Promise(
                resolve =>
                    requestAnimationFrame(
                        resolve
                    )
            );
        }
    }


    lastChunkX = 0;
    lastChunkZ = 0;

    worldReady = true;


    loadingFill.style.width =
        "100%";


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                350
            )
    );


    const loading =
        document.getElementById(
            "loading"
        );

    loading.style.opacity =
        "0";


    setTimeout(
        () => {

            loading.style.display =
                "none";

        },
        850
    );
}


/* =========================================================
   MAIN LOOP
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    updateCar();

    updateCamera();

    updateWorldStreaming();

    updateHUD();


    /*
       Keep stars around the player
       so the sky feels infinite.
    */

    if (
        carLoaded
    ) {

        stars.position.copy(
            carRoot.position
        );
    }


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                1.5
            )
        );
    }
);


/* =========================================================
   START
========================================================= */

startGame();

animate();

</script>
