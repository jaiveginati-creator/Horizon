// ============================================================

// ============================================================

scene.background =

    );


scene.fog =

loader.setDRACOLoader(

// ============================================================
// WORLD
// ============================================================

const WORLD_SIZE =
    2400;



// ============================================================
// TERRAIN HEIGHT
// ============================================================

function terrainHeight(
    x,
    z
) {


    const hills =

        Math.sin(
            x * 0.008
        ) * 3

        +

        Math.cos(
            z * 0.006
        ) * 4

        +

        Math.sin(
            (x + z) * 0.012
        ) * 2;



    const smallHills =

        Math.sin(
            x * 0.022 +
            z * 0.013
        ) * 0.8

        +

        Math.cos(
            z * 0.018
        ) * 0.7;



    const cityFlatten =

        Math.exp(

            -(
                x * x +
                z * z
            ) / 180000

        );



    return (

        hills +
        smallHills

    )

    *

    (

        1 -
        cityFlatten * 0.85

    );

}



// ============================================================
// TERRAIN
// ============================================================

function createTerrain() {


    const geometry =
        new THREE.PlaneGeometry(

            WORLD_SIZE,
            WORLD_SIZE,

            140,
            140

        );


    geometry.rotateX(
        -Math.PI / 2
    );


    const position =
        geometry.attributes.position;



    for (

        let i = 0;

        i < position.count;

        i++

    ) {


        const x =
            position.getX(i);


        const z =
            position.getZ(i);


        position.setY(

            i,

            terrainHeight(
                x,
                z
            )

        );

    }



    geometry.computeVertexNormals();



    const material =
        new THREE.MeshStandardMaterial({

            color:
                0x405b3d,

            roughness:
                1

        });



    const terrain =
        new THREE.Mesh(

            geometry,
            material

        );


    terrain.receiveShadow =
        true;


    scene.add(
        terrain
    );

}


createTerrain();

// ROAD DEFINITIONS
// ============================================================

const roadDefinitions = [

    {

// ============================================================
// CITY ROAD DEFINITIONS

for (

}



for (

            z: z,

            width: 9,

            length: 850,

}



// ============================================================
// ROAD POINT
// ============================================================

function roadPoint(

    x,
    z,
    distance,
    rotation

) {


    return {

        x:

            x +

            Math.sin(
                rotation
            ) *

            distance,


        z:

            z +

            Math.cos(
                rotation
            ) *

            distance

    };

}



// ============================================================
// ROAD MARKINGS
// ============================================================

function createRoadMarkings(

    x,
    z,
    width,
    length,
    rotation

) {


    // CENTER DASHES

    for (

        let d =
            -length / 2 + 12;

        d <
            length / 2;

        d += 22

    ) {


        const p =
            roadPoint(

                x,
                z,
                d,
                rotation

            );


        const y =
            terrainHeight(
                p.x,
                p.z
            ) + 0.35;



        const geometry =
            new THREE.BoxGeometry(

                0.32,

                0.035,

                9

            );



        const material =
            new THREE.MeshStandardMaterial({

                color:
                    0xe5dfba,

                roughness:
                    0.8

            });



        const dash =
            new THREE.Mesh(

                geometry,
                material

            );


        dash.position.set(

            p.x,

            y,

            p.z

        );


        dash.rotation.y =
            rotation;


        scene.add(
            dash
        );

    }



    // ROAD EDGES

    const edgeOffset =
        width / 2 - 0.7;



    for (

        const side
        of [-1, 1]

    ) {


        for (

            let d =
                -length / 2;

            d <
                length / 2;

            d += 12

        ) {


            const p =
                roadPoint(

                    x,
                    z,
                    d,
                    rotation

                );


            const px =

                p.x +

                Math.cos(
                    rotation
                ) *

                edgeOffset *

                side;



            const pz =

                p.z -

                Math.sin(
                    rotation
                ) *

                edgeOffset *

                side;



            const y =
                terrainHeight(
                    px,
                    pz
                ) + 0.32;



            const geometry =
                new THREE.BoxGeometry(

                    0.25,

                    0.025,

                    10

                );



            const material =
                new THREE.MeshStandardMaterial({

                    color:
                        0xc9c9c9,

                    roughness:
                        0.9

                });



            const edge =
                new THREE.Mesh(

                    geometry,
                    material

                );


            edge.position.set(

                px,

                y,

                pz

            );


            edge.rotation.y =
                rotation;


            scene.add(
                edge
            );

        }

    }

}



// ============================================================
// ROAD CREATION
// ============================================================

function createRoad(

    x,
    z,
    width,
    length,
    rotation = 0

) {


    const segments =
        Math.max(

            20,

            Math.floor(
                length / 10
            )

        );



    const geometry =
        new THREE.PlaneGeometry(

            width,
            length,

            1,
            segments

        );


    geometry.rotateX(
        -Math.PI / 2
    );


    const position =
        geometry.attributes.position;



    const cos =
        Math.cos(
            rotation
        );


    const sin =
        Math.sin(
            rotation
        );



    for (

        let i = 0;

        i < position.count;

        i++

    ) {


        const localX =
            position.getX(i);


        const localZ =
            position.getZ(i);



        const worldX =

            x +

            localX * cos -

            localZ * sin;



        const worldZ =

            z +

            localX * sin +

            localZ * cos;



        /*
            Keep local X/Z.

            Y is calculated from the actual
            world position.
        */

        position.setY(

            i,

            terrainHeight(
                worldX,
                worldZ
            ) + 0.28

        );

    }



    geometry.computeVertexNormals();



    const material =
        new THREE.MeshStandardMaterial({

            color:
                0x202124,

            roughness:
                0.95

        });



    const road =
        new THREE.Mesh(

            geometry,
            material

        );


    road.position.set(

        x,

        0,

        z

    );


    /*
        This prevents the terrain from
        visually cutting through the road.
    */

    road.renderOrder =
        2;


    road.receiveShadow =
        true;


    scene.add(
        road
    );



    createRoadMarkings(

        x,
        z,
        width,
        length,
        rotation

    );

}

// MAIN ROADS
// ============================================================

createRoad(

    0,
    30,
    1900,
    0

);


createRoad(

    0

createRoad(

    0,

// ============================================================
// CITY GRID ROADS

for (

    let x = -420;

    x += 105

) {

        Math.abs(x) < 50
    ) {

    }


    createRoad(

    ) {

// ============================================================
// CROSSWALKS
// ============================================================

function createCrosswalk(

    x,
    z,
    rotation

) {


    for (

        let i = -4;

        i <= 4;

        i++

    ) {


        const offset =
            i * 2.1;



        const px =

            x +

            Math.cos(
                rotation
            ) *

            offset;



        const pz =

            z -

            Math.sin(
                rotation
            ) *

            offset;



        const geometry =
            new THREE.BoxGeometry(

                1.2,

                0.035,

                8

            );



        const material =
            new THREE.MeshStandardMaterial({

                color:
                    0xe0e0e0

            });



        const stripe =
            new THREE.Mesh(

                geometry,
                material

            );


        stripe.position.set(

            px,

            terrainHeight(
                px,
                pz
            ) + 0.42,

            pz

        );


        stripe.rotation.y =
            rotation;


        stripe.renderOrder =
            3;


        scene.add(
            stripe
        );

    }

}



// ============================================================
// INTERSECTIONS
// ============================================================

const intersections = [

    [105, 105],

    [105, -105],

    [-105, 105],

    [-105, -105],

    [210, 210],

    [210, -210],

    [-210, 210],

    [-210, -210],

    [315, 315],

    [315, -315],

    [-315, 315],

    [-315, -315]

];



for (

    const [x, z]
    of intersections

    createCrosswalk(

        x,
        z,
        0

    createCrosswalk(

        z,

// ============================================================
// PARKING LOTS
// ============================================================

function createParkingLot(

    x,
    z,
    width,
    depth,
    rotation = 0

) {


    const geometry =
        new THREE.PlaneGeometry(

            width,
            depth

        );


    geometry.rotateX(
        -Math.PI / 2
    );


    const material =
        new THREE.MeshStandardMaterial({

            color:
                0x303235,

            roughness:
                0.95

        });



    const lot =
        new THREE.Mesh(

            geometry,
            material

        );


    lot.position.set(

        x,

        terrainHeight(
            x,
            z
        ) + 0.25,

        z

    );


    lot.rotation.y =
        rotation;


    lot.renderOrder =
        2;


    lot.receiveShadow =
        true;


    scene.add(
        lot
    );



    for (

        let i = -4;

        i <= 4;

        i++

    ) {


        const geometry =
            new THREE.BoxGeometry(

                0.12,

                0.025,

                depth - 8

            );


        const material =
            new THREE.MeshStandardMaterial({

                color:
                    0xbdbdbd

            });



        const line =
            new THREE.Mesh(

                geometry,
                material

            );


        const localX =
            i * 5;



        const px =

            x +

            localX *

            Math.cos(
                rotation
            );



        const pz =

            z +

            localX *

            Math.sin(
                rotation
            );



        line.position.set(

            px,

            terrainHeight(
                px,
                pz
            ) + 0.36,

            pz

        );


        line.rotation.y =
            rotation;


        scene.add(
            line
        );

    }

}



createParkingLot(

    65,

    70,

createParkingLot(

    -65,

    70,

createParkingLot(

    -275,
    55,

// ============================================================
// BUILDINGS
// ============================================================

const buildingFiles = [

    "assets/buildings/large-building.glb",

    "assets/buildings/store.glb",

    "assets/buildings/apartment.glb",

    "assets/buildings/large-building-2.glb",

    "assets/buildings/bank.glb"

];


const buildingTemplates = [];

const placedBuildings = [];



// ============================================================
// DISTANCE TO ROAD
// ============================================================

function distanceToRoad(

    px,
    pz,
    road

) {


    const dx =
        px - road.x;


    const dz =
        pz - road.z;



    const cos =
        Math.cos(
            road.rotation
        );


    const sin =
        Math.sin(
            road.rotation
        );



    const localX =

        dx * cos +

        dz * sin;



    const localZ =

        -dx * sin +

        dz * cos;



    const halfWidth =
        road.width / 2;


    const halfLength =
        road.length / 2;



    const outsideX =

        Math.max(

            Math.abs(
                localX
            ) -
            halfWidth,

            0

        );



    const outsideZ =

        Math.max(

            Math.abs(
                localZ
            ) -
            halfLength,

            0

        );



    return Math.sqrt(

        outsideX *
        outsideX

        +

        outsideZ *
        outsideZ

    );

}



// ============================================================
// BUILDING ROAD CHECK
// ============================================================

function isBuildingOnRoad(

    x,
    z,
    radius

) {


    for (

        const road
        of roadDefinitions

    ) {


        const distance =
            distanceToRoad(

                x,
                z,
                road

            );



        if (

            distance <
            radius + 4

        ) {

            return true;

        }

    }


    return false;

}



// ============================================================
// BUILDING COLLISION
// ============================================================

function buildingTooClose(

    x,
    z,
    radius

) {


    for (

        const building
        of placedBuildings

    ) {


        const dx =
            x -
            building.x;


        const dz =
            z -
            building.z;



        const distance =
            Math.sqrt(

                dx * dx +

                dz * dz

            );



        if (

            distance <

            radius +

            building.radius +

            4

        ) {

            return true;

        }

    }


    return false;

}



// ============================================================
// PARKING LOT CHECK
// ============================================================

function isInsideParkingLot(

    x,
    z,
    radius

) {


    const parkingLots = [

        {

            x: 65,

            z: 65,

            width: 55,

            depth: 70

        },

        {

            x: -65,

            z: -65,

            width: 55,

            depth: 70

        },

        {

            x: 275,

            z: 275,

            width: 55,

            depth: 70

        },

        {

            x: -275,

            z: -275,

            width: 55,

            depth: 70

        }

    ];



    for (

        const lot
        of parkingLots

    ) {


        if (

            Math.abs(
                x - lot.x
            )

            <

            lot.width / 2 +
            radius

            &&

            Math.abs(
                z - lot.z
            )

            <

            lot.depth / 2 +
            radius

        ) {

            return true;

        }

    }


    return false;

}



// ============================================================
// LOAD BUILDINGS
// ============================================================

async function loadBuildings() {


    console.log(
        "Loading Horizon buildings..."
    );



    for (

        const file
        of buildingFiles

    ) {


        try {


            const gltf =
                await loader.loadAsync(
                    file
                );


            const model =
                gltf.scene;



            // ------------------------------------------------
            // NORMALIZE SIZE
            // ------------------------------------------------

            const originalBox =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const originalSize =
                new THREE.Vector3();


            originalBox.getSize(
                originalSize
            );


            const largest =
                Math.max(

                    originalSize.x,

                    originalSize.y,

                    originalSize.z

                );



            if (
                largest > 0
            ) {

                model.scale.setScalar(

                    30 /
                    largest

                );

            }



            // ------------------------------------------------
            // CENTER MODEL
            // ------------------------------------------------

            const centeredBox =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const center =
                new THREE.Vector3();


            centeredBox.getCenter(
                center
            );


            model.position.x -=
                center.x;


            model.position.z -=
                center.z;



            // ------------------------------------------------
            // GROUND MODEL
            // ------------------------------------------------

            const groundBox =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            model.position.y -=
                groundBox.min.y;



            // ------------------------------------------------
            // MATERIALS
            // ------------------------------------------------

            model.traverse(

                child => {


                    if (
                        child.isMesh
                    ) {


                        child.castShadow =
                            true;


                        child.receiveShadow =
                            true;


                        if (
                            child.material
                        ) {


                            child.material.side =
                                THREE.DoubleSide;


                            child.material.roughness =
                                0.85;

                        }

                    }

                }

            );



            // ------------------------------------------------
            // FOOTPRINT
            // ------------------------------------------------

            const finalBox =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const finalSize =
                new THREE.Vector3();


            finalBox.getSize(
                finalSize
            );


            const radius =

                Math.max(

                    finalSize.x,

                    finalSize.z

                )

                *

                0.42;



            buildingTemplates.push({

                model:
                    model,

                radius:
                    radius

            });



            console.log(
                "Loaded:",
                file
            );


        }

        catch (
            error
        ) {


            console.error(

                "Failed to load:",
                file,

                error

            );

        }

    }



    console.log(

// ============================================================
// ADD BUILDING
// ============================================================

function addBuilding(

    template,

    x,

    z,

    scale

) {


    const building =
        template.model.clone(
            true
        );


    building.scale.multiplyScalar(
        scale
    );



    // Rotate by 90 degree increments

    building.rotation.y =

        Math.floor(

            Math.random() * 4

        )

        *

        Math.PI / 2;



    building.position.set(

        x,

        terrainHeight(
            x,
            z
        ),

        z

    );



    building.traverse(

        child => {


            if (
                child.isMesh
            ) {


                child.castShadow =
                    true;


                child.receiveShadow =
                    true;

            }

        }

    );



    // ========================================================
    // INTERIOR FILL
    // ========================================================

    /*
        The original GLB buildings are exterior shells.

        This small interior volume sits INSIDE the building.
        It is deliberately smaller than the exterior so it
        cannot create the black rectangles seen previously.
    */


    const buildingBox =
        new THREE.Box3()
            .setFromObject(
                building
            );


    const buildingSize =
        new THREE.Vector3();


    buildingBox.getSize(
        buildingSize
    );



    const innerWidth =

        buildingSize.x *
        0.62;


    const innerDepth =

        buildingSize.z *
        0.62;


    const innerHeight =

        buildingSize.y *
        0.78;



    if (

        innerWidth > 1 &&

        innerDepth > 1 &&

        innerHeight > 1

    ) {


        const interiorGeometry =
            new THREE.BoxGeometry(

                innerWidth,

                innerHeight,

                innerDepth

            );



        const interiorMaterial =
            new THREE.MeshStandardMaterial({

                color:
                    0x44464a,

                roughness:
                    1,

                metalness:
                    0,

                side:
                    THREE.FrontSide

            });



        const interior =
            new THREE.Mesh(

                interiorGeometry,

                interiorMaterial

            );


        /*
            Position inside the building.

            The bottom is slightly above the ground
            and the top remains below the roof.
        */

        interior.position.y =

            innerHeight / 2 +

            0.15;



        interior.castShadow =
            false;


        interior.receiveShadow =
            true;



        building.add(
            interior
        );

    }



    scene.add(
        building
    );



    placedBuildings.push({

        x:
            x,

        z:
            z,

        radius:

            template.radius *
            scale

    });

}



// ============================================================
// CITY GENERATOR
// ============================================================

function generateCityBuildings() {


    console.log(
        "Generating city..."
    );


    placedBuildings.length =
        0;



    // ========================================================
    // DOWNTOWN
    // ========================================================

    for (

        let x = -455;

        x <= 455;

        x += 70

    ) {


        for (

            let z = -455;

            z <= 455;

            z += 70

        ) {


            for (

                let attempt = 0;

                attempt < 10;

                attempt++

            ) {


                const bx =

                    x +

                    (

                        Math.random() -
                        0.5

                    )

                    *

                    38;



                const bz =

                    z +

                    (

                        Math.random() -
                        0.5

                    )

                    *

                    38;



                const template =

                    buildingTemplates[

                        Math.floor(

                            Math.random() *

                            buildingTemplates.length

                        )

                    ];



                const scale =

                    0.65 +

                    Math.random() *
                    0.45;



                const radius =

                    template.radius *
                    scale;



                // Road

                if (

                    isBuildingOnRoad(

                        bx,

                        bz,

                        radius

                    )

                ) {

                    continue;

                }



                // Parking

                if (

                    isInsideParkingLot(

                        bx,

                        bz,

                        radius

                    )

                ) {

                    continue;

                }



                // Other buildings

                if (

                    buildingTooClose(

                        bx,

                        bz,

                        radius

                    )

                ) {

                    continue;

                }



                // Place

                addBuilding(

                    template,

                    bx,

                    bz,

                    scale

                );


                break;

            }

        }

    }



    // ========================================================
    // OUTSKIRTS
    // ========================================================

    for (

        let i = 0;

        i < 140;

        i++

    ) {


        for (

            let attempt = 0;

            attempt < 10;

            attempt++

        ) {


            const angle =

                Math.random() *

                Math.PI *

                2;



            const distance =

                520 +

                Math.random() *
                470;



            const x =

                Math.cos(angle) *
                distance;



            const z =

                Math.sin(angle) *
                distance;



            const template =

                buildingTemplates[

                    Math.floor(

                        Math.random() *

                        buildingTemplates.length

                    )

                ];



            const scale =

                0.45 +

                Math.random() *
                0.45;



            const radius =

                template.radius *
                scale;



            if (

                isBuildingOnRoad(

                    x,

                    z,

                    radius

                )

            ) {

                continue;

            }



            if (

                buildingTooClose(

                    x,

                    z,

                    radius

                )

            ) {

                continue;

            }



            addBuilding(

                template,

                x,

                z,

                scale

            );


            break;

        }

    }



    console.log(

        "Buildings placed:",

        placedBuildings.length

    );

}

    "https://jaiveginati-creator.github.io/Horizon/electric-car.glb";



// ============================================================
// LOAD CAR
// ============================================================

async function loadCar() {


    try {


        const gltf =
            await loader.loadAsync(
                CAR_FILE
            );


        carModel =
            gltf.scene;



        // Scale car

        const box =
            new THREE.Box3()
                .setFromObject(
                    carModel
                );


        const size =
            new THREE.Vector3();


        box.getSize(
            size
        );


        const largest =
            Math.max(

                size.x,

                size.y,

                size.z

            );


        if (
            largest > 0
        ) {

            carModel.scale.setScalar(

                4.9 /
                largest

            );

        }



        // Center X/Z

        const centerBox =
            new THREE.Box3()
                .setFromObject(
                    carModel
                );


        const center =
            new THREE.Vector3();


        centerBox.getCenter(
            center
        );


        carModel.position.x -=
            center.x;


        carModel.position.z -=
            center.z;



        // Rotate

        carModel.rotation.y =
            Math.PI / 2;



        // Ground correction

        const finalBox =
            new THREE.Box3()
                .setFromObject(
                    carModel
                );


        carModel.position.y -=

            finalBox.min.y -
            0.05;



        carModel.traverse(

            child => {


                if (
                    child.isMesh
                ) {


                    child.castShadow =
                        true;


                    child.receiveShadow =
                        true;

                }

            }

        );



        car.add(
            carModel
        );



        car.position.set(

            0,

            terrainHeight(
                0,
                80
            ),

            80

        );



        document.getElementById(
            "loading"
        ).style.display =
            "none";



    }

    catch (
        error
    ) {


        console.error(
            "CAR ERROR:",
            error
        );


        document.getElementById(
            "loading"
        ).textContent =
            "CAR FAILED TO LOAD";

    }

}

// ============================================================
// DRIVING SETTINGS
// ============================================================

const MAX_SPEED =
    0.75;


const MAX_REVERSE =
    0.28;


const ACCELERATION =
    0.008;


const REVERSE_ACCELERATION =
    0.005;


const BRAKE_POWER =
    0.035;


const FRICTION =
    0.006;


const MAX_STEERING =
    0.55;


const STEERING_RESPONSE =
    0.14;


const TURN_RATE =
    0.035;



let speed =
    0;


let steering =
    0;



// ============================================================
// CAR UPDATE
// ============================================================

function updateCar() {


    if (
        !carModel
    ) {

        return;

    }



    const accelerating =

        keys["w"] ||
        keys["arrowup"];



    const braking =

        keys["s"] ||
        keys["arrowdown"];



    const left =

        keys["a"] ||
        keys["arrowleft"];



    const right =

        keys["d"] ||
        keys["arrowright"];



    // ACCELERATION

    if (
        accelerating
    ) {


        if (
            speed <
            MAX_SPEED
        ) {


            speed +=
                ACCELERATION;

        }

    }



    // BRAKING / REVERSE

    else if (
        braking
    ) {


        if (
            speed >
            0.05
        ) {


            speed -=
                BRAKE_POWER;


        }

        else {


            speed -=
                REVERSE_ACCELERATION;

        }

    }



    // FRICTION

    else {


        if (
            speed > 0
        ) {


            speed -=
                FRICTION;


        }

        else if (
            speed < 0
        ) {


            speed +=
                FRICTION;

        }

    }



    speed =
        THREE.MathUtils.clamp(

            speed,

            -MAX_REVERSE,

            MAX_SPEED

        );



    // STEERING

    let targetSteering =
        0;



    if (
        left
    ) {

        targetSteering =
            MAX_STEERING;

    }



    if (
        right
    ) {

        targetSteering =
            -MAX_STEERING;

    }



    steering +=

        (

            targetSteering -
            steering

        )

        *

        STEERING_RESPONSE;



    if (

        Math.abs(speed) >
        0.01

    ) {


        car.rotation.y +=

            steering *

            TURN_RATE *

            (

                speed >= 0
                    ? 1
                    : -1

            );

    }



    // FORWARD

    const forward =
        new THREE.Vector3(

            0,

            0,

            -1

        );


    forward.applyQuaternion(
        car.quaternion
    );


    car.position.add(

        forward.multiplyScalar(
            speed
        )

    );



    // Terrain

    car.position.y =

        terrainHeight(

            car.position.x,

            car.position.z

        );



    // World boundary

    const limit =
        WORLD_SIZE / 2 - 80;



    car.position.x =

        THREE.MathUtils.clamp(

            car.position.x,

            -limit,

            limit

        );



    car.position.z =

        THREE.MathUtils.clamp(

            car.position.z,

            -limit,

            limit

        );



    // Speedometer

    document.getElementById(
        "speed"
    ).textContent =

        Math.round(

            Math.abs(speed) *

            55

        );

}



// ============================================================
// CAMERA
// ============================================================

const cameraTarget =
    new THREE.Vector3();


function updateCamera() {


    if (
        !carModel
    ) {

        return;

    }



    const offset =
        new THREE.Vector3(

            0,

            4.2,

            10.5

        );


    offset.applyQuaternion(
        car.quaternion
    );



    const desired =

        car.position.clone()
            .add(
                offset
            );



    camera.position.lerp(

        desired,

        0.075

    );



    cameraTarget.copy(
        car.position
    );


    cameraTarget.y +=
        1.3;



    camera.lookAt(
        cameraTarget
    );

}



// ============================================================
// DAY / NIGHT
// ============================================================

let night =

function toggleNight() {


    night =
        !night;



    if (
        night
    ) {


        scene.background =
            new THREE.Color(
                0x07101c
            );


        scene.fog.color =
            new THREE.Color(
                0x07101c
            );


        sun.intensity =

        ambient.intensity =
            0.55;



    }

    else {


        scene.background =
            new THREE.Color(
                0x8bb8d8
            );


        scene.fog.color =
            new THREE.Color(
                0x8bb8d8
            );


        sun.intensity =
            3.0;


        ambient.intensity =
            1.8;

    }

}



// ============================================================
// WINDOW RESIZE
// ============================================================

window.addEventListener(

    "resize",

    () => {


        camera.aspect =

            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

    }

);



// ============================================================
// GAME LOOP
// ============================================================

function animate() {


    requestAnimationFrame(
        animate
    );


    updateCar();


    updateCamera();


    renderer.render(

        scene,

        camera

    );

}


animate();
