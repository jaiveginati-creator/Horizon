/* =========================================================
   SEEDED RANDOM
========================================================= */

function hash2D(
    x,
    z,
    seed = WORLD_SEED
) {

    let h =
        Math.imul(
            Math.floor(x) + seed,
            374761393
        ) ^
        Math.imul(
            Math.floor(z) + seed * 3,
            668265263
        );

    h =
        (h ^ (h >>> 13)) *
        1274126177;

    h ^= h >>> 16;

    return (
        h >>> 0
    ) / 4294967295;
}


function randomRange(
    x,
    z,
    min,
    max,
    salt = 0
) {

    return THREE.MathUtils.lerp(
        min,
        max,
        hash2D(
            x + salt * 31.71,
            z - salt * 17.23
        )
    );
}


function smoothNoise(
    x,
    z
) {

    const x0 =
        Math.floor(x);

    const z0 =
        Math.floor(z);

    const x1 =
        x0 + 1;

    const z1 =
        z0 + 1;

    const sx =
        x - x0;

    const sz =
        z - z0;

    const u =
        sx * sx *
        (3 - 2 * sx);

    const v =
        sz * sz *
        (3 - 2 * sz);

    const n00 =
        hash2D(x0, z0);

    const n10 =
        hash2D(x1, z0);

    const n01 =
        hash2D(x0, z1);

    const n11 =
        hash2D(x1, z1);

    const a =
        THREE.MathUtils.lerp(
            n00,
            n10,
            u
        );

    const b =
        THREE.MathUtils.lerp(
            n01,
            n11,
            u
        );

    return THREE.MathUtils.lerp(
        a,
        b,
        v
    );
}


/* =========================================================
   TERRAIN
========================================================= */

function terrainHeight(
    x,
    z
) {

    const n1 =
        smoothNoise(
            x * .004,
            z * .004
        );

    const n2 =
        smoothNoise(
            x * .012 + 100,
            z * .012 + 100
        );

    const n3 =
        smoothNoise(
            x * .035 + 500,
            z * .035 + 500
        );

    let height =
        -7 +
        n1 * 22 +
        n2 * 7 +
        n3 * 1.8;


    const distance =
        Math.sqrt(
            x * x +
            z * z
        );


    /*
       Central city is deliberately flatter.
    */

    const flatten =
        1 -
        THREE.MathUtils.smoothstep(
            CITY_RADIUS * .42,
            CITY_RADIUS,
            distance
        );


    height =
        THREE.MathUtils.lerp(
            height,
            -3.2 +
            n2 * 1.1,
            flatten
        );


    return height;
}


/* =========================================================
   BIOMES
========================================================= */

function getBiome(
    x,
    z
) {

    const distance =
        Math.sqrt(
            x * x +
            z * z
        );

    if (
        distance <
        CITY_RADIUS
    ) {

        return "city";
    }


    const n =
        smoothNoise(
            x * .0018,
            z * .0018
        );


    if (
        n > .74
    ) {

        return "mountain";
    }


    if (
        n < .27
    ) {

        return "coast";
    }


    return "countryside";
}

/* =========================================================

const starCount = 1200;

    new Float32Array(
        starCount * 3

    let i = 0;
    i < starCount;
    i++
) {

    const radius = 1700;

    const a =
        hash2D(
            i,
            1
        ) *
        Math.PI * 2;

    const b =
        hash2D(
            i,
            2
        ) *
        Math.PI;

    starPositions[i * 3] =
        Math.sin(b) *
        Math.cos(a) *
        radius;

    starPositions[i * 3 + 1] =
        Math.cos(b) *
        radius;

    starPositions[i * 3 + 2] =
        Math.sin(b) *
        Math.sin(a) *
        radius;
}

/* =========================================================
   ROAD DEFINITIONS
========================================================= */

function getRoadCandidates(
    x,
    z
) {

    const roads = [];


    const majorZ =
        Math.round(
            z / 240
        ) * 240;

    if (
        Math.abs(majorZ) <=
        CITY_RADIUS
    ) {

        roads.push({
            axis: "x",
            center: majorZ,
            width: 26,
            type: "major",
            priority: 3
        });
    }


    const cityZ =
        Math.round(
            z / 80
        ) * 80;

    if (
        Math.abs(cityZ) <=
        CITY_RADIUS
    ) {

        roads.push({
            axis: "x",
            center: cityZ,
            width: 13,
            type: "city",
            priority: 2
        });
    }


    const highwayZ =
        Math.round(
            z / 480
        ) * 480;

    roads.push({
        axis: "x",
        center: highwayZ,
        width: 18,
        type: "highway",
        priority: 1
    });


    const majorX =
        Math.round(
            x / 240
        ) * 240;

    if (
        Math.abs(majorX) <=
        CITY_RADIUS
    ) {

        roads.push({
            axis: "z",
            center: majorX,
            width: 26,
            type: "major",
            priority: 3
        });
    }


    const cityX =
        Math.round(
            x / 80
        ) * 80;

    if (
        Math.abs(cityX) <=
        CITY_RADIUS
    ) {

        roads.push({
            axis: "z",
            center: cityX,
            width: 13,
            type: "city",
            priority: 2
        });
    }


    const highwayX =
        Math.round(
            x / 480
        ) * 480;

    roads.push({
        axis: "z",
        center: highwayX,
        width: 18,
        type: "highway",
        priority: 1
    });


    return roads;
}


/* =========================================================
   ROAD LOOKUP
========================================================= */

function getRoadAt(
    x,
    z
) {

    const candidates =
        getRoadCandidates(
            x,
            z
        );


    const valid =
        candidates.filter(
            road => {

                if (
                    road.axis === "x"
                ) {

                    return (
                        Math.abs(
                            z -
                            road.center
                        ) <=
                        road.width / 2
                    );
                }


                return (
                    Math.abs(
                        x -
                        road.center
                    ) <=
                    road.width / 2
                );
            }
        );


    if (
        valid.length === 0
    ) {

        return null;
    }


    valid.sort(
        (a, b) =>
            b.priority -
            a.priority
    );


    return valid[0];
}


function roadClearance(
    x,
    z
) {

    const candidates =
        getRoadCandidates(
            x,
            z
        );

    let clearance =
        Infinity;


    for (
        const road of candidates
    ) {

        const distance =
            road.axis === "x"
                ? Math.abs(
                    z -
                    road.center
                )
                : Math.abs(
                    x -
                    road.center
                );


        clearance =
            Math.min(
                clearance,
                distance -
                road.width / 2
            );
    }


    return clearance;
}


function isClearOfRoad(
    x,
    z,
    radius = 0
) {

    return (
        roadClearance(
            x,
            z
        ) > radius
    );
}


/* =========================================================
   BUILDING ROAD CHECK
========================================================= */

function buildingTouchesRoad(
    x,
    z,
    halfX,
    halfZ,
    rotation
) {

    const cos =
        Math.abs(
            Math.cos(rotation)
        );

    const sin =
        Math.abs(
            Math.sin(rotation)
        );


    const projectedX =
        halfX * cos +
        halfZ * sin;


    const projectedZ =
        halfX * sin +
        halfZ * cos;


    const roads =
        getRoadCandidates(
            x,
            z
        );


    for (
        const road of roads
    ) {

        if (
            road.axis === "x"
        ) {

            if (
                Math.abs(
                    z -
                    road.center
                ) <
                road.width / 2 +
                projectedZ +
                6
            ) {

                return true;
            }

        } else {

            if (
                Math.abs(
                    x -
                    road.center
                ) <
                road.width / 2 +
                projectedX +
                6
            ) {

                return true;
            }
        }
    }


    return false;
}


/* =========================================================
   SURFACE HEIGHT
========================================================= */

function getSurfaceHeight(
    x,
    z
) {

    const ground =
        terrainHeight(
            x,
            z
        );


    const road =
        getRoadAt(
            x,
            z
        );


    if (
        road
    ) {

        return (
            ground +
            ROAD_LIFT
        );
    }


    return ground;
}


/* =========================================================
   WORLD STRIP
========================================================= */

function createWorldStrip(
    centerX,
    centerZ,
    axis,
    length,
    width,
    lift,
    material,
    lengthSegments = 16,
    widthSegments = 2
) {

    const geometry =
        axis === "x"
            ? new THREE.PlaneGeometry(
                length,
                width,
                lengthSegments,
                widthSegments
            )
            : new THREE.PlaneGeometry(
                width,
                length,
                widthSegments,
                lengthSegments
            );


    geometry.rotateX(
        -Math.PI / 2
    );


    const position =
        geometry.attributes.position;


    for (
        let i = 0;
        i < position.count;
        i++
    ) {

        const localX =
            position.getX(i);

        const localZ =
            position.getZ(i);


        const worldX =
            centerX +
            localX;

        const worldZ =
            centerZ +
            localZ;


        position.setX(
            i,
            worldX
        );

        position.setZ(
            i,
            worldZ
        );

        position.setY(
            i,
            terrainHeight(
                worldX,
                worldZ
            ) +
            lift
        );
    }


    position.needsUpdate =
        true;

    geometry.computeVertexNormals();


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.receiveShadow =
        true;


    return mesh;
}


/* =========================================================
   TERRAIN
========================================================= */

function createTerrain(
    group,
    cx,
    cz
) {

    const centerX =
        cx * CHUNK_SIZE +
        CHUNK_SIZE / 2;

    const centerZ =
        cz * CHUNK_SIZE +
        CHUNK_SIZE / 2;


    const segments = 32;


    const geometry =
        new THREE.PlaneGeometry(
            CHUNK_SIZE,
            CHUNK_SIZE,
            segments,
            segments
        );


    geometry.rotateX(
        -Math.PI / 2
    );


    const position =
        geometry.attributes.position;

    const colors = [];


    for (
        let i = 0;
        i < position.count;
        i++
    ) {

        const worldX =
            centerX +
            position.getX(i);

        const worldZ =
            centerZ +
            position.getZ(i);


        const height =
            terrainHeight(
                worldX,
                worldZ
            );


        position.setY(
            i,
            height
        );


        const biome =
            getBiome(
                worldX,
                worldZ
            );


        let color;


        if (
            biome === "city"
        ) {

            color =
                new THREE.Color(
                    0x66735d
                );

        } else if (
            biome === "coast"
        ) {

            color =
                new THREE.Color(
                    0xb3a27b
                );

        } else if (
            biome === "mountain"
        ) {

            color =
                new THREE.Color(
                    0x697068
                );

        } else {

            color =
                new THREE.Color(
                    0x557b4b
                );
        }


        const variation =
            .92 +
            smoothNoise(
                worldX * .03,
                worldZ * .03
            ) * .12;


        color.multiplyScalar(
            variation
        );


        colors.push(
            color.r,
            color.g,
            color.b
        );
    }


    geometry.setAttribute(
        "color",
        new THREE.Float32BufferAttribute(
            colors,
            3
        )
    );


    geometry.computeVertexNormals();


    const material =
        new THREE.MeshStandardMaterial({
            vertexColors: true,
            roughness: 1
        });


    const terrain =
        new THREE.Mesh(
            geometry,
            material
        );


    terrain.receiveShadow =
        true;


    group.add(
        terrain
    );
}


/* =========================================================
   ROAD
========================================================= */

function createRoadSurface(
    group,
    x,
    z,
    axis,
    width
) {

    const road =
        createWorldStrip(
            x,
            z,
            axis,
            CHUNK_SIZE + 18,
            width,
            ROAD_LIFT,
            roadMaterial,
            24,
            6
        );


    group.add(
        road
    );
}


function addRoadLine(
    group,
    x,
    z,
    axis,
    offset,
    length,
    width,
    material
) {

    const lineX =
        axis === "x"
            ? x
            : x + offset;

    const lineZ =
        axis === "x"
            ? z + offset
            : z;


    const line =
        createWorldStrip(
            lineX,
            lineZ,
            axis,
            length,
            width,
            ROAD_LIFT +
            ROAD_MARK_LIFT,
            material,
            10,
            1

function addDashedLine(
    group,
    x,
    z,
    axis,
    material
) {

    const dashLength = 13;
    const gap = 13;


    for (
        let p = -115;
        p < 115;
        p += dashLength + gap
    ) {

        const dashX =
            axis === "x"
                ? x + p
                : x;

        const dashZ =
            axis === "x"
                ? z
                : z + p;


        const dash =
            createWorldStrip(
                dashX,
                dashZ,
                axis,
                dashLength,
                .28,
                ROAD_LIFT +
                ROAD_MARK_LIFT,
                material,
                2,
                1
            );


        group.add(
            dash
        );
    }
}


/* =========================================================
   SIDEWALK
========================================================= */

function createSidewalks(
    group,
    x,
    z,
    axis,
    roadWidth
) {

    if (
        roadWidth > 18
    ) {

        return;
    }


    const offset =
        roadWidth / 2 + 4;


    for (
        const side of [-1, 1]
    ) {

        const sideOffset =
            offset * side;


        const sidewalkX =
            axis === "x"
                ? x
                : x + sideOffset;

        const sidewalkZ =
            axis === "x"
                ? z + sideOffset
                : z;


        const sidewalk =
            createWorldStrip(
                sidewalkX,
                sidewalkZ,
                axis,
                CHUNK_SIZE + 18,
                5.5,
                SIDEWALK_LIFT,
                sidewalkMaterial,
                16,
                2
            );


        group.add(
            sidewalk
        );
    }
}


/* =========================================================
   GUARDRAILS
========================================================= */

function createGuardrails(
    group,
    x,
    z,
    axis,
    roadWidth
) {

    const offset =
        roadWidth / 2 + 2.2;


    for (
        const side of [-1, 1]
    ) {

        const mesh =
            new THREE.Mesh(
                guardrailGeometry,
                guardrailMaterial
            );


        mesh.userData.sharedGeometry =
            true;


        if (
            axis === "x"
        ) {

            const railZ =
                z +
                side * offset;


            mesh.scale.set(
                CHUNK_SIZE + 18,
                1,
                1
            );


            mesh.position.set(
                x,
                terrainHeight(
                    x,
                    railZ
                ) + 1.15,
                railZ
            );

        } else {

            const railX =
                x +
                side * offset;


            mesh.scale.set(
                1,
                1,
                CHUNK_SIZE + 18
            );


            mesh.position.set(
                railX,
                terrainHeight(
                    railX,
                    z
                ) + 1.15,
                z
            );
        }


        mesh.castShadow =
            true;


        group.add(
            mesh
        );
    }
}

    x,
    z,
    axis,
    type,
    width
) {

    createRoadSurface(
        group,
        x,
        z,
        axis,
        width

    if (
        type === "highway"
    ) {

        addRoadLine(
            group,
            x,
            z,
            axis,
            -(width / 2 - 1.4),
            CHUNK_SIZE + 16,
            .25,
            whiteRoadMaterial
        );


        addRoadLine(
            group,
            x,
            z,
            axis,
            width / 2 - 1.4,
            CHUNK_SIZE + 16,
            .25,
            whiteRoadMaterial
        );


        addDashedLine(

            z,
            axis,
            yellowRoadMaterial
        );


        createGuardrails(
            group,
            x,
            z,
            axis,

        );


    } else if (
        type === "major"
    ) {

        addRoadLine(
            group,

        );


        addRoadLine(

            z,
            axis,
            width / 2 - 1.5,
            CHUNK_SIZE + 16,
            .3,

        );


        addRoadLine(
            group,
            x,
            z,
            axis,
            -.55,
            CHUNK_SIZE + 16,
            .18,
            yellowRoadMaterial
        );


        addRoadLine(
            group,
            x,
            z,
            axis,
            .55,
            CHUNK_SIZE + 16,
            .18,
            yellowRoadMaterial
        );


        createSidewalks(

/* =========================================================
   FIXED ROAD CHUNK STREAMING
========================================================= */

function generateRoads(
    group,
    cx,
    cz
) {

    const minX =
        cx * CHUNK_SIZE;

    const maxX =
        minX + CHUNK_SIZE;

    const minZ =
        cz * CHUNK_SIZE;

    const maxZ =
        minZ + CHUNK_SIZE;


    /*
       HORIZONTAL ROADS

       IMPORTANT:
       The old version only generated a road
       if the road center belonged to the
       current Z chunk.

       That caused roads to disappear at
       chunk borders.

       Now we generate any road whose
       physical width overlaps this chunk.
    */

    const horizontalStart =
        Math.floor(
            (minZ - 20) / 80
        ) * 80;


    for (
        let roadZ = horizontalStart;
        roadZ <= maxZ + 20;
        roadZ += 80
    ) {

        const road =
            getRoadCandidates(
                0,
                roadZ
            )
            .filter(
                r => r.axis === "x"
            )
            .filter(
                r =>
                    Math.abs(
                        roadZ -
                        r.center
                    ) <=
                    r.width / 2
            )
            .sort(
                (a, b) =>
                    b.priority -
                    a.priority
            )[0];


        if (!road) {
            continue;
        }


        /*
           Check whether the road
           physically overlaps this chunk.
        */

        if (
            road.center +
            road.width / 2 <
            minZ
        ) {
            continue;
        }


        if (
            road.center -
            road.width / 2 >
            maxZ
        ) {
            continue;
        }


        createRoad(
            group,
            (minX + maxX) / 2,
            road.center,
            "x",
            road.type,
            road.width
        );
    }


    /*
       VERTICAL ROADS
    */

    const verticalStart =
        Math.floor(
            (minX - 20) / 80
        ) * 80;


    for (
        let roadX = verticalStart;
        roadX <= maxX + 20;
        roadX += 80
    ) {

        const road =
            getRoadCandidates(
                roadX,
                0
            )
            .filter(
                r => r.axis === "z"
            )
            .filter(
                r =>
                    Math.abs(
                        roadX -
                        r.center
                    ) <=
                    r.width / 2
            )
            .sort(
                (a, b) =>
                    b.priority -
                    a.priority
            )[0];


        if (!road) {
            continue;
        }


        if (
            road.center +
            road.width / 2 <
            minX
        ) {
            continue;
        }


        if (
            road.center -
            road.width / 2 >
            maxX
        ) {
            continue;
        }


        createRoad(
            group,
            road.center,
            (minZ + maxZ) / 2,
            "z",
            road.type,
            road.width
        );
    }
}

/* =========================================================
   BUILDINGS
========================================================= */

const buildingFiles = [
    "./assets/buildings/large-building.glb",
    "./assets/buildings/store.glb",
    "./assets/buildings/apartment.glb",
    "./assets/buildings/large-building-2.glb",
    "./assets/buildings/bank.glb"
];

const buildingTemplates = [];


async function loadBuildings() {

    for (
        const file of buildingFiles
    ) {

        try {

            const gltf =
                await gltfLoader.loadAsync(
                    file
                );


            const root =
                gltf.scene;


            root.updateMatrixWorld(
                true
            );


            const box =
                new THREE.Box3()
                .setFromObject(
                    root
                );


            const size =
                box.getSize(
                    new THREE.Vector3()
                );


            const height =
                Math.max(
                    size.y,
                    .001
                );


            const targetHeight =
                randomRange(
                    file.length,
                    file.length * 2,
                    18,
                    38,
                    50
                );


            root.scale.setScalar(
                targetHeight /
                height
            );


            root.updateMatrixWorld(
                true
            );


            const correctedBox =
                new THREE.Box3()
                .setFromObject(
                    root
                );


            root.position.y -=
                correctedBox.min.y;


            root.updateMatrixWorld(
                true
            );


            root.traverse(
                child => {

                    if (
                        child.isMesh
                    ) {

                        child.castShadow =
                            true;

                        child.receiveShadow =
                            true;

                        child.userData.sharedGeometry =
                            true;
                    }
                }
            );


            const finalBox =
                new THREE.Box3()
                .setFromObject(
                    root
                );


            const finalSize =
                finalBox.getSize(
                    new THREE.Vector3()
                );


            buildingTemplates.push({
                root,
                width: finalSize.x,
                depth: finalSize.z
            });


        } catch (error) {

            console.warn(
                "Could not load building:",
                file,
                error
            );
        }
    }
}

function createFallbackBuilding(

    const geometry =
        new THREE.BoxGeometry(

}


/* =========================================================
   BUILDING GENERATION
========================================================= */

function generateBuildings(
    group,
    cx,
    cz
) {

    const centerX =
        cx * CHUNK_SIZE +
        CHUNK_SIZE / 2;

    const centerZ =
        cz * CHUNK_SIZE +
        CHUNK_SIZE / 2;


    const biome =
        getBiome(
            centerX,
            centerZ
        );


    let target =
        0;


    if (
        biome === "city"
    ) {

        target = 13;

    } else if (
        biome === "countryside"
    ) {

        target = 2;
    }


    const lots = [];


    if (
        target === 0
    ) {

        group.userData.buildingLots =
            lots;

        return;
    }


    let attempts = 0;


    while (
        lots.length < target &&
        attempts < target * 15
    ) {

        attempts++;


        const x =
            centerX +
            randomRange(
                cx * 19 + attempts,
                cz * 23 + attempts,
                -105,
                105,
                1
            );


        const z =
            centerZ +
            randomRange(
                cx * 29 + attempts,
                cz * 31 + attempts,
                -105,
                105,
                2
            );


        const rotation =
            randomRange(
                x,
                z,
                -.12,
                .12,
                3
            );


        let template = null;


        if (
            buildingTemplates.length
        ) {

            const index =
                Math.floor(
                    randomRange(
                        x,
                        z,
                        0,
                        buildingTemplates.length,
                        4
                    )
                );


            template =
                buildingTemplates[
                    Math.min(
                        index,
                        buildingTemplates.length - 1
                    )
                ];
        }


        let width = 16;
        let depth = 16;


        if (
            template
        ) {

            width =
                template.width;

            depth =
                template.depth;

        } else {

            width =
                randomRange(
                    x,
                    z,
                    11,
                    23,
                    5
                );

            depth =
                randomRange(
                    x,
                    z,
                    11,
                    23,
                    6
                );
        }


        const halfX =
            width / 2;

        const halfZ =
            depth / 2;


        /*
           First road test.
        */

        if (
            buildingTouchesRoad(
                x,
                z,
                halfX,
                halfZ,
                rotation
            )
        ) {

            continue;
        }


        const radius =
            Math.max(
                halfX,
                halfZ
            );


        /*
           Building-to-building spacing.
        */

        let blocked = false;


        for (
            const lot of lots
        ) {

            const distance =
                Math.hypot(
                    x - lot.x,
                    z - lot.z
                );


            if (
                distance <
                radius +
                lot.radius +
                8
            ) {

                blocked = true;
                break;
            }
        }


        if (
            blocked
        ) {

            continue;
        }


        const y =
            terrainHeight(
                x,
                z
            );


        if (
            template
        ) {

            const building =
                template.root.clone(
                    true
                );


            building.position.set(
                x,
                y,
                z
            );


            building.rotation.y =
                rotation;


            building.traverse(
                child => {

                    if (
                        child.isMesh
                    ) {

                        child.userData.sharedGeometry =
                            true;

                        child.castShadow =
                            true;

                        child.receiveShadow =
                            true;
                    }
                }
            );


            group.add(
                building
            );

        } else {

            const height =
                randomRange(
                    x,
                    z,
                    12,
                    32,
                    7
                );


            createFallbackBuilding(
                group,
                x,
                z,
                width,
                depth,
                height,
                rotation
            );
        }


        lots.push({
            x,
            z,
            radius
        });
    }


    group.userData.buildingLots =
        lots;
}

function generateTrees(
    group,
    cx,
    cz
) {

    const centerX =
        cx * CHUNK_SIZE +
        CHUNK_SIZE / 2;

    const centerZ =
        cz * CHUNK_SIZE +
        CHUNK_SIZE / 2;


    const biome =
        getBiome(
            centerX,
            centerZ
        );


    let amount = 0;


    if (
        biome === "city"
    ) {

        amount = 7;

    } else if (
        biome === "countryside"
    ) {

        amount = 22;

    } else if (
        biome === "coast"
    ) {

        amount = 8;

    } else {

        amount = 14;
    }


    const lots =
        group.userData.buildingLots ||
        [];


    let attempts = 0;
    let created = 0;


    while (
        created < amount &&
        attempts < amount * 15
    ) {

        attempts++;


        const x =
            centerX +
            randomRange(
                cx * 37 + attempts,
                cz * 41 + attempts,
                -112,
                112,
                20
            );


        const z =
            centerZ +
            randomRange(
                cx * 43 + attempts,
                cz * 47 + attempts,
                -112,
                112,
                21
            );


        /*
           Large exclusion radius.
        */

        if (
            !isClearOfRoad(
                x,
                z,
                8
            )
        ) {

            continue;
        }


        let nearBuilding =
            false;


        for (
            const lot of lots
        ) {

            if (
                Math.hypot(
                    x - lot.x,
                    z - lot.z
                ) <
                lot.radius + 8
            ) {

                nearBuilding = true;
                break;
            }
        }


        if (
            nearBuilding
        ) {

            continue;
        }


        createTree(
            group,
            x,
            z,
            randomRange(
                x,
                z,
                .75,
                1.35,
                22
            )
        );


        created++;
    }
}

    cx,
    cz
) {

    const centerX =
        cx * CHUNK_SIZE +
        CHUNK_SIZE / 2;

    const centerZ =
        cz * CHUNK_SIZE +
        CHUNK_SIZE / 2;


    if (
        getBiome(
            centerX,
            centerZ
        ) !== "mountain"
    ) {

        return;
    }


    for (
        let i = 0;
        i < 4;
        i++
    ) {

        const x =
            centerX +
            randomRange(
                cx * 73 + i,
                cz * 79 + i,
                -100,
                100,
                40
            );


        const z =
            centerZ +
            randomRange(
                cx * 83 + i,
                cz * 89 + i,
                -100,
                100,
                41
            );


        const radius =
            randomRange(
                x,
                z,
                20,
                65,
                42
            );


        const height =
            randomRange(
                x,
                z,
                40,
                120,
                43
            );


        const mountain =
            new THREE.Mesh(
                mountainGeometry,
                new THREE.MeshStandardMaterial({
                    color: 0x697068,
                    roughness: 1
                })
            );


        mountain.userData.sharedGeometry =
            true;


        mountain.scale.set(
            radius,
            height,
            radius
        );


        mountain.position.set(
            x,
            terrainHeight(
                x,
                z
            ) +
            height / 2,
            z
        );


        mountain.castShadow =
            true;

        mountain.receiveShadow =
            true;


        group.add(
            mountain
        );
    }
}


/* =========================================================
   WATER
========================================================= */

function generateWater(
    group,
    cx,
    cz
) {

    const centerX =
        cx * CHUNK_SIZE +
        CHUNK_SIZE / 2;

    const centerZ =
        cz * CHUNK_SIZE +
        CHUNK_SIZE / 2;


    if (
        getBiome(
            centerX,
            centerZ
        ) !== "coast"
    ) {

        return;
    }


    const terrain =
        terrainHeight(
            centerX,
            centerZ
        );


    /*
       Never allow the water to sit
       above the ground/road system.
    */

    const waterY =
        Math.min(
            WATER_LEVEL,
            terrain - .35
        );


    const water =
        new THREE.Mesh(
            waterGeometry,
            waterMaterial
        );


    water.userData.sharedGeometry =
        true;


    water.rotation.x =
        -Math.PI / 2;


    water.scale.set(
        CHUNK_SIZE * 1.15,
        CHUNK_SIZE * 1.15,
        1
    );


    water.position.set(
        centerX,
        waterY,
        centerZ
    );


    water.receiveShadow =
        true;


    group.add(
        water
    );
}


/* =========================================================
   INTERSECTION
========================================================= */

function createIntersection(
    group,
    x,
    z
) {

    if (
        Math.abs(x) >
        CITY_RADIUS ||
        Math.abs(z) >
        CITY_RADIUS
    ) {

        return;
    }


    const isXMajor =
        Math.abs(
            x -
            Math.round(x / 240) * 240
        ) < .001;


    const isZMajor =
        Math.abs(
            z -
            Math.round(z / 240) * 240
        ) < .001;


    if (
        !isXMajor ||
        !isZMajor
    ) {

        return;
    }


    const geometry =
        new THREE.CylinderGeometry(
            2.4,
            2.6,
            .12,
            20
        );


    const material =
        new THREE.MeshStandardMaterial({
            color: 0x777a76,
            roughness: 1
        });


    const island =
        new THREE.Mesh(
            geometry,
            material
        );


    island.position.set(
        x,
        getSurfaceHeight(
            x,
            z
        ) + .08,
        z
    );


    island.receiveShadow =
        true;


    group.add(
        island
    );
}


function generateIntersections(
    group,
    cx,
    cz
) {

    const minX =
        cx * CHUNK_SIZE;

    const maxX =
        minX + CHUNK_SIZE;

    const minZ =
        cz * CHUNK_SIZE;

    const maxZ =
        minZ + CHUNK_SIZE;


    const startX =
        Math.ceil(
            minX / 240
        ) * 240;


    const startZ =
        Math.ceil(
            minZ / 240
        ) * 240;


    for (
        let x = startX;
        x <= maxX;
        x += 240
    ) {

        if (
            x < minX ||
            x > maxX
        ) {

            continue;
        }


        for (
            let z = startZ;
            z <= maxZ;
            z += 240
        ) {

            if (
                z < minZ ||
                z > maxZ
            ) {

                continue;
            }


            /*
               Only generate an intersection
               in one deterministic chunk.
            */

            const ownerX =
                Math.floor(
                    x / CHUNK_SIZE
                );

            const ownerZ =
                Math.floor(
                    z / CHUNK_SIZE
                );


            if (
                ownerX !== cx ||
                ownerZ !== cz
            ) {

                continue;
            }


            createIntersection(
                group,
                x,
                z
            );
        }
    }
}


/* =========================================================
   CHUNK GENERATION
========================================================= */

function generateChunk(
    cx,
    cz
) {

    const key =
        `${cx},${cz}`;


    if (
        chunks.has(key)
    ) {

        return;
    }


    const group =
        new THREE.Group();


    group.name =
        `Chunk_${cx}_${cz}`;


    /*
       Correct generation order:

       1. terrain
       2. roads
       3. road details
       4. buildings
       5. trees
       6. nature
       7. mountains
       8. water
    */

    createTerrain(
        group,
        cx,
        cz
    );


    generateRoads(
        group,
        cx,
        cz
    );


    generateStreetLights(
        group,
        cx,
        cz
    );


    generateBuildings(
        group,
        cx,
        cz
    );


    generateTrees(
        group,
        cx,
        cz
    );


    generateNature(
        group,
        cx,
        cz
    );


    generateMountains(
        group,
        cx,
        cz
    );


    generateWater(
        group,
        cx,
        cz
    );


    generateIntersections(
        group,
        cx,
        cz
    );


    scene.add(
        group
    );


    chunks.set(
        key,
        {
            group,
            cx,
            cz
        }
    );
}


/* =========================================================
   DISPOSAL
========================================================= */

function disposeGroup(
    group
) {

    group.traverse(
        object => {

            if (
                object.isMesh &&
                object.geometry &&
                !object.userData.sharedGeometry
            ) {

                object.geometry.dispose();
            }
        }
    );
}


/* =========================================================
   UNLOAD
========================================================= */

function unloadFarChunks(
    cx,
    cz
) {

    for (
        const [
            key,
            chunk
        ] of chunks
    ) {

        const dx =
            Math.abs(
                chunk.cx - cx
            );

        const dz =
            Math.abs(
                chunk.cz - cz
            );


        if (
            dx > UNLOAD_RADIUS ||
            dz > UNLOAD_RADIUS
        ) {

            scene.remove(
                chunk.group
            );


            disposeGroup(
                chunk.group
            );


            chunks.delete(
                key
            );
        }
    }
}


/* =========================================================
   STREAMING
========================================================= */

function updateWorldStreaming(
    force = false
) {

    if (
        !worldReady ||
        !carRoot
    ) {

        return;
    }


    const cx =
        Math.floor(
            carRoot.position.x /
            CHUNK_SIZE
        );


    const cz =
        Math.floor(
            carRoot.position.z /
            CHUNK_SIZE
        );


    if (
        !force &&
        cx === lastChunkX &&
        cz === lastChunkZ
    ) {

        return;
    }


    lastChunkX = cx;
    lastChunkZ = cz;


    const required = [];


    for (
        let x = -LOAD_RADIUS;
        x <= LOAD_RADIUS;
        x++
    ) {

        for (
            let z = -LOAD_RADIUS;
            z <= LOAD_RADIUS;
            z++
        ) {

            required.push({
                cx: cx + x,
                cz: cz + z,
                distance:
                    Math.abs(x) +
                    Math.abs(z)
            });
        }
    }


    required.sort(
        (a, b) =>
            a.distance -
            b.distance
    );


    for (
        const item of required
    ) {

        generateChunk(
            item.cx,
            item.cz
        );
    }


    unloadFarChunks(
        cx,
        cz
    );
}


/* =========================================================
   CAR
========================================================= */

let carRoot =
    new THREE.Group();

scene.add(
    carRoot
);

let carModel = null;

let carLoaded = false;

let carSpeed = 0;

let steering = 0;

let targetSteering = 0;

let nightMode = false;

const keys = {};


/* =========================================================
   FALLBACK CAR
========================================================= */

function createFallbackCar() {

    const root =
        new THREE.Group();


    const bodyMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xb66c35,
            metalness: .55,
            roughness: .25
        });


    const darkMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x171b20,
            metalness: .4,
            roughness: .2
        });


    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.25,
                .55,
                4.8
            ),
            bodyMaterial
        );


    body.position.y =
        .65;


    body.castShadow =
        true;


    root.add(
        body
    );


    const roof =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.7,
                .5,
                2.1
            ),
            darkMaterial
        );


    roof.position.set(
        0,
        1.02,
        .15
    );


    root.add(
        roof
    );


    const wheelGeometry =
        new THREE.CylinderGeometry(
            .4,
            .4,
            .28,
            16
        );


    for (
        const x of [-1.05, 1.05]
    ) {

        for (
            const z of [-1.55, 1.55]
        ) {

            const wheel =
                new THREE.Mesh(
                    wheelGeometry,
                    darkMaterial
                );


            wheel.rotation.z =
                Math.PI / 2;


            wheel.position.set(
                x,
                .4,
                z
            );


            wheel.castShadow =
                true;


            root.add(
                wheel
            );
        }
    }


    return root;
}


/* =========================================================
   HEADLIGHTS
========================================================= */

const headlights = [];


function createHeadlights() {

    for (
        const x of [-.72, .72]
    ) {

        const mesh =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    .11,
                    8,
                    8
                ),
                new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    emissive: 0xffffff,
                    emissiveIntensity: 4
                })
            );


        mesh.position.set(
            x,
            .72,
            -2.25
        );


        carRoot.add(
            mesh
        );


        const light =
            new THREE.SpotLight(
                0xddeeff,
                nightMode ? 4 : 0,
                45,
                .3,
                .55,
                1.2
            );


        light.position.set(
            x,
            .75,
            -2.2
        );


        const target =
            new THREE.Object3D();


        target.position.set(
            x,
            .55,
            -14
        );


        carRoot.add(
            target
        );


        light.target =
            target;


        carRoot.add(
            light
        );


        headlights.push(
            light
        );
    }
}


function updateHeadlights() {

    for (
        const light of headlights
    ) {

        light.intensity =
            nightMode
                ? 4
                : 0;
    }
}


/* =========================================================
   LOAD CAR
========================================================= */

async function loadCar() {

    try {

        const gltf =
            await gltfLoader.loadAsync(
                "./assets/golden-hour-coastal-supercar.glb"
            );


        carModel =
            gltf.scene;


        carModel.updateMatrixWorld(
            true
        );


        const box =
            new THREE.Box3()
            .setFromObject(
                carModel
            );


        const size =
            box.getSize(
                new THREE.Vector3()
            );


        const largest =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        carModel.scale.setScalar(
            5.2 /
            Math.max(
                largest,
                .001
            )
        );


        carModel.updateMatrixWorld(
            true
        );


        const correctedBox =
            new THREE.Box3()
            .setFromObject(
                carModel
            );


        carModel.position.y -=
            correctedBox.min.y;


        carModel.rotation.y =
            Math.PI / 2;


        carModel.traverse(
            child => {

                if (
                    child.isMesh
                ) {

                    child.castShadow =
                        true;

                    child.receiveShadow =
                        true;
                }
            }
        );


        carRoot.add(
            carModel
        );


    } catch (error) {

        console.warn(
            "Car model failed. Using fallback.",
            error
        );


        carModel =
            createFallbackCar();


        carRoot.add(
            carModel
        );
    }


    carLoaded = true;


    createHeadlights();


    positionCar();
}


/* =========================================================
   CAR POSITION
========================================================= */

function positionCar() {

    carRoot.position.set(
        0,
        getSurfaceHeight(
            0,
            40
        ) +
        CAR_GROUND_OFFSET,
        40
    );


    carRoot.rotation.set(
        0,
        0,
        0
    );
}


/* =========================================================
   INPUT
========================================================= */

window.addEventListener(
    "keydown",
    event => {

        keys[event.code] =
            true;


        if (
            [
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight",
                "Space"
            ].includes(
                event.code
            )
        ) {

            event.preventDefault();
        }


        if (
            event.code === "KeyN" &&
            !event.repeat
        ) {

            toggleNight();
        }
    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[event.code] =
            false;
    }
);


window.addEventListener(
    "blur",
    () => {

        for (
            const key in keys
        ) {

            keys[key] = false;
        }
    }
);


/* =========================================================
   NIGHT
========================================================= */

function toggleNight() {

    nightMode =
        !nightMode;


    if (
        nightMode
    ) {

        scene.background =
            new THREE.Color(
                0x07101d
            );

        scene.fog.color =
            new THREE.Color(
                0x07101d
            );

        hemiLight.intensity =
            .35;

        sun.intensity =
            .35;

        ambientLight.intensity =
            .12;

        starMaterial.opacity =
            .85;

        document.getElementById(
            "nightIndicator"
        ).textContent =
            "NIGHT";

    } else {

        scene.background =
            new THREE.Color(
                0x91b7dc
            );

        scene.fog.color =
            new THREE.Color(
                0x91b7dc
            );

        hemiLight.intensity =
            1.8;

        sun.intensity =
            3.2;

        ambientLight.intensity =
            .22;

        starMaterial.opacity =
            0;

        document.getElementById(
            "nightIndicator"
        ).textContent =
            "DAY";
    }


    updateHeadlights();
}


/* =========================================================
   BUILDING COLLISION
========================================================= */

function carHitsBuilding(
    x,
    z
) {

    const cx =
        Math.floor(
            x /
            CHUNK_SIZE
        );


    const cz =
        Math.floor(
            z /
            CHUNK_SIZE
        );


    for (
        let dx = -1;
        dx <= 1;
        dx++
    ) {

        for (
            let dz = -1;
            dz <= 1;
            dz++
        ) {

            const chunk =
                chunks.get(
                    `${cx + dx},${cz + dz}`
                );


            if (!chunk) {
                continue;
            }


            const lots =
                chunk.group
                    .userData
                    .buildingLots ||
                [];


            for (
                const lot of lots
            ) {

                const distance =
                    Math.hypot(
                        x - lot.x,
                        z - lot.z
                    );


                if (
                    distance <
                    lot.radius +
                    2.2
                ) {

                    return true;
                }
            }
        }
    }


    return false;
}


/* =========================================================
   CAR PHYSICS
========================================================= */

function updateCar() {

    if (
        !carLoaded
    ) {

        return;
    }


    const forward =
        keys["KeyW"] ||
        keys["ArrowUp"];


    const reverse =
        keys["KeyS"] ||
        keys["ArrowDown"];


    const brake =
        keys["Space"];


    if (
        forward
    ) {

        carSpeed += .018;

    } else if (
        reverse
    ) {

        carSpeed -= .014;

    } else {

        carSpeed *= .975;
    }


    if (
        brake
    ) {

        carSpeed *= .90;
    }


    carSpeed =
        THREE.MathUtils.clamp(
            carSpeed,
            -.42,
            1.05
        );


    targetSteering = 0;


    if (
        keys["KeyA"] ||
        keys["ArrowLeft"]
    ) {

        targetSteering = -1;

    } else if (
        keys["KeyD"] ||
        keys["ArrowRight"]
    ) {

        targetSteering = 1;
    }


    steering =
        THREE.MathUtils.lerp(
            steering,
            targetSteering,
            .14
        );


    const speedFactor =
        THREE.MathUtils.clamp(
            Math.abs(
                carSpeed
            ),
            0,
            1
        );


    carRoot.rotation.y -=
        steering *
        .032 *
        speedFactor *
        Math.sign(
            carSpeed ||
            1
        );


    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    direction.applyQuaternion(
        carRoot.quaternion
    );


    const oldX =
        carRoot.position.x;

    const oldZ =
        carRoot.position.z;


    carRoot.position.x +=
        direction.x *
        carSpeed;


    carRoot.position.z +=
        direction.z *
        carSpeed;


    if (
        carHitsBuilding(
            carRoot.position.x,
            carRoot.position.z
        )
    ) {

        carRoot.position.x =
            oldX;

        carRoot.position.z =
            oldZ;

        carSpeed *=
            -.18;
    }


    const ground =
        getSurfaceHeight(
            carRoot.position.x,
            carRoot.position.z
        );


    carRoot.position.y =
        THREE.MathUtils.lerp(
            carRoot.position.y,
            ground +
            CAR_GROUND_OFFSET,
            .3
        );


    carRoot.rotation.z =
        THREE.MathUtils.lerp(
            carRoot.rotation.z,
            -steering *
            .025 *
            speedFactor,
            .12
        );


    carRoot.rotation.x =
        THREE.MathUtils.lerp(
            carRoot.rotation.x,
            0,
            .12
        );
}


/* =========================================================
   CAMERA
========================================================= */

const cameraTarget =
    new THREE.Vector3();


function updateCamera() {

    if (
        !carLoaded
    ) {

        return;
    }


    const offset =
        new THREE.Vector3(
            0,
            4.8,
            11
        );


    offset.applyQuaternion(
        carRoot.quaternion
    );


    const desired =
        carRoot.position
            .clone()
            .add(
                offset
            );


    camera.position.lerp(
        desired,
        .085
    );


    cameraTarget.copy(
        carRoot.position
    );


    cameraTarget.y +=
        1.4;


    camera.lookAt(
        cameraTarget
    );
}


/* =========================================================
   HUD
========================================================= */

let hudCounter = 0;


function updateHUD() {

    hudCounter++;


    if (
        hudCounter < 8
    ) {

        return;
    }


    hudCounter = 0;


    const speed =
        Math.round(
            Math.abs(
                carSpeed
            ) * 52
        );


    document.getElementById(
        "speed"
    ).textContent =
        speed;


    const cx =
        Math.floor(
            carRoot.position.x /
            CHUNK_SIZE
        );


    const cz =
        Math.floor(
            carRoot.position.z /
            CHUNK_SIZE
        );


    const biome =
        getBiome(
            carRoot.position.x,
            carRoot.position.z
        );


    document.getElementById(
        "worldInfo"
    ).textContent =
        `${biome.toUpperCase()} • SECTOR ${cx}, ${cz}`;
}


/* =========================================================
   STARTUP
========================================================= */

async function startGame() {

    const fill =
        document.getElementById(
            "loadingFill"
        );


    fill.style.width =
        "15%";


    await loadBuildings();


    fill.style.width =
        "45%";


    await loadCar();


    fill.style.width =
        "60%";


    worldReady = false;


    const initialChunks = [];


    for (
        let x = -LOAD_RADIUS;
        x <= LOAD_RADIUS;
        x++
    ) {

        for (
            let z = -LOAD_RADIUS;
            z <= LOAD_RADIUS;
            z++
        ) {

            initialChunks.push({
                cx: x,
                cz: z,
                distance:
                    Math.abs(x) +
                    Math.abs(z)
            });
        }
    }


    initialChunks.sort(
        (a, b) =>
            a.distance -
            b.distance
    );


    for (
        let i = 0;
        i < initialChunks.length;
        i++
    ) {

        const item =
            initialChunks[i];


        generateChunk(
            item.cx,
            item.cz
        );


        fill.style.width =
            (
                60 +
                (i /
                initialChunks.length) *
                35
            ) + "%";


        if (
            i % 2 === 0
        ) {

            await new Promise(
                resolve =>
                    requestAnimationFrame(
                        resolve
                    )
            );
        }
    }


    lastChunkX = 0;
    lastChunkZ = 0;


    worldReady = true;


    fill.style.width =
        "100%";


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                350
            )
    );


    const loading =
        document.getElementById(
            "loading"
        );


    loading.style.opacity =
        "0";


    setTimeout(
        () => {

            loading.style.display =
                "none";

        },
        850
    );
}


/* =========================================================
   ANIMATION
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    updateCar();

    updateCamera();

    updateWorldStreaming();

    updateHUD();


    if (
        carLoaded
    ) {

        stars.position.copy(
            carRoot.position
        );
    }


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                1.5
            )
        );
    }
);


/* =========================================================
   GO
========================================================= */

startGame();

animate();

</script>
