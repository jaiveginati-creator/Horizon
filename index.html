<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HORIZON</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101318;
    font-family: Arial, Helvetica, sans-serif;
}

canvas {
    display: block;
}

#loading {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: #101318;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    letter-spacing: 4px;
}

#loadingTitle {
    font-size: 38px;
    font-weight: 700;
    margin-bottom: 12px;
}

#loadingText {
    font-size: 12px;
    opacity: .55;
}

#hud {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    color: white;
}

#logo {
    position: absolute;
    top: 24px;
    left: 28px;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 7px;
}

#controls {
    position: absolute;
    top: 27px;
    right: 28px;
    font-size: 11px;
    opacity: .65;
    text-align: right;
    line-height: 1.8;
}

#speedBox {
    position: absolute;
    right: 30px;
    bottom: 25px;
    text-align: right;
}

#speed {
    font-size: 48px;
    font-weight: 700;
    letter-spacing: 2px;
}

#kmh {
    font-size: 11px;
    opacity: .55;
    letter-spacing: 3px;
}

#gear {
    font-size: 18px;
    margin-top: 5px;
    opacity: .75;
}

#status {
    position: absolute;
    bottom: 28px;
    left: 30px;
    font-size: 11px;
    opacity: .55;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<div id="loading">
    <div id="loadingTitle">HORIZON</div>
    <div id="loadingText">LOADING WORLD</div>
</div>

<div id="hud">

    <div id="logo">HORIZON</div>

    <div id="controls">
        W / ↑ &nbsp; ACCELERATE<br>
        S / ↓ &nbsp; BRAKE / REVERSE<br>
        A / ← &nbsp; STEER LEFT<br>
        D / → &nbsp; STEER RIGHT<br>
        SPACE &nbsp; BRAKE<br>
        N &nbsp; DAY / NIGHT
    </div>

    <div id="status">SYSTEM READY</div>

    <div id="speedBox">
        <div id="speed">0</div>
        <div id="kmh">KM/H</div>
        <div id="gear">N</div>
    </div>

</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from "three";

import { GLTFLoader }
    from "three/addons/loaders/GLTFLoader.js";

import { DRACOLoader }
    from "three/addons/loaders/DRACOLoader.js";

import { MeshoptDecoder }
    from "three/addons/libs/meshopt_decoder.module.js";


/* =====================================================
   CAR FILE
===================================================== */

const CAR_FILE =
    "https://jaiveginati-creator.github.io/Horizon/electric-car.glb";


/* =====================================================
   SCENE
===================================================== */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x9aa9b7);

scene.fog =
    new THREE.FogExp2(
        0x9aa9b7,
        0.0017
    );


/* =====================================================
   CAMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        62,
        window.innerWidth /
        window.innerHeight,
        0.1,
        2000
    );

camera.position.set(
    0,
    3.2,
    9
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance"
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.15;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   LIGHTING
===================================================== */

const hemi =
    new THREE.HemisphereLight(
        0xc7dcff,
        0x30343a,
        2
    );

scene.add(hemi);


const sun =
    new THREE.DirectionalLight(
        0xffefcf,
        4.5
    );

sun.position.set(
    -80,
    120,
    70
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;

scene.add(sun);


/* =====================================================
   GROUND
===================================================== */

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            1600,
            1600
        ),
        new THREE.MeshStandardMaterial({
            color: 0x62686b,
            roughness: 0.92
        })
    );

ground.rotation.x =
    -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* =====================================================
   ROAD
===================================================== */

const road =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            16,
            1600
        ),
        new THREE.MeshStandardMaterial({
            color: 0x25282b,
            roughness: 0.82
        })
    );

road.rotation.x =
    -Math.PI / 2;

road.position.y =
    0.012;

road.receiveShadow = true;

scene.add(road);


/* =====================================================
   ROAD EDGES
===================================================== */

const edgeMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x777b7d,
        roughness: 0.85
    });

for (const x of [-8.2, 8.2]) {

    const edge =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.45,
                0.18,
                1600
            ),
            edgeMaterial
        );

    edge.position.set(
        x,
        0.09,
        0
    );

    edge.castShadow = true;

    scene.add(edge);
}


/* =====================================================
   ROAD MARKINGS
===================================================== */

const markingMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xe4e1d4,
        roughness: 0.65
    });

for (
    let z = -790;
    z < 800;
    z += 12
) {

    const line =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.22,
                0.025,
                6
            ),
            markingMaterial
        );

    line.position.set(
        0,
        0.035,
        z
    );

    scene.add(line);
}


/* =====================================================
   SIDE LINES
===================================================== */

for (const x of [-7.5, 7.5]) {

    const line =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.1,
                0.028,
                1600
            ),
            markingMaterial
        );

    line.position.set(
        x,
        0.035,
        0
    );

    scene.add(line);
}


/* =====================================================
   BUILDINGS
===================================================== */

const buildingMaterials = [

    new THREE.MeshStandardMaterial({
        color: 0x555d65,
        roughness: 0.82
    }),

    new THREE.MeshStandardMaterial({
        color: 0x6b7176,
        roughness: 0.8
    }),

    new THREE.MeshStandardMaterial({
        color: 0x454a4f,
        roughness: 0.84
    }),

    new THREE.MeshStandardMaterial({
        color: 0x777a78,
        roughness: 0.78
    })
];


function createBuilding(
    x,
    z,
    width,
    height,
    depth
) {

    const material =
        buildingMaterials[
            Math.floor(
                Math.random() *
                buildingMaterials.length
            )
        ];

    const building =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            material
        );

    building.position.set(
        x,
        height / 2,
        z
    );

    building.castShadow = true;
    building.receiveShadow = true;

    scene.add(building);


    const windowMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x1b2c39,
            roughness: 0.3,
            metalness: 0.25
        });


    for (
        let y = 2;
        y < height - 1;
        y += 3.2
    ) {

        const windows =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    Math.max(
                        0.3,
                        width * 0.65
                    ),
                    0.65,
                    0.04
                ),
                windowMaterial
            );

        windows.position.set(
            x,
            y,
            z - depth / 2 - 0.025
        );

        scene.add(windows);
    }
}


for (
    let z = -760;
    z < 760;
    z += 35
) {

    if (Math.abs(z) < 45)
        continue;

    createBuilding(
        -18 - Math.random() * 18,
        z,
        10 + Math.random() * 9,
        10 + Math.random() * 28,
        16 + Math.random() * 12
    );

    createBuilding(
        18 + Math.random() * 18,
        z + 10,
        10 + Math.random() * 9,
        12 + Math.random() * 32,
        16 + Math.random() * 12
    );
}


/* =====================================================
   TREES
===================================================== */

const trunkMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x4b3628,
        roughness: 1
    });

const leafMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x304c37,
        roughness: 0.95
    });


function createTree(x, z) {

    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.16,
                0.23,
                2.2,
                8
            ),
            trunkMaterial
        );

    trunk.position.set(
        x,
        1.1,
        z
    );

    trunk.castShadow = true;

    scene.add(trunk);


    const leaves =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                1.35,
                12,
                10
            ),
            leafMaterial
        );

    leaves.position.set(
        x,
        2.7,
        z
    );

    leaves.castShadow = true;

    scene.add(leaves);
}


for (
    let z = -760;
    z < 760;
    z += 22
) {

    if (Math.abs(z) < 40)
        continue;

    createTree(
        -10.5 - Math.random() * 4,
        z
    );

    createTree(
        10.5 + Math.random() * 4,
        z + 8
    );
}


/* =====================================================
   STREET LIGHTS
===================================================== */

const poleMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x303337,
        metalness: 0.7,
        roughness: 0.45
    });


function createStreetLight(x, z) {

    const pole =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.07,
                0.1,
                4.7,
                10
            ),
            poleMaterial
        );

    pole.position.set(
        x,
        2.35,
        z
    );

    pole.castShadow = true;

    scene.add(pole);


    const arm =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.1,
                0.07,
                0.07
            ),
            poleMaterial
        );

    arm.position.set(
        x + (x < 0 ? 0.5 : -0.5),
        4.55,
        z
    );

    scene.add(arm);


    const lamp =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.14,
                10,
                10
            ),
            new THREE.MeshStandardMaterial({
                color: 0xffe8aa,
                emissive: 0xffa52f,
                emissiveIntensity: 2
            })
        );

    lamp.position.set(
        x + (x < 0 ? 1 : -1),
        4.48,
        z
    );

    scene.add(lamp);
}


for (
    let z = -760;
    z < 760;
    z += 32
) {

    createStreetLight(
        -7,
        z
    );

    createStreetLight(
        7,
        z + 16
    );
}


/* =====================================================
   PLAYER CAR
===================================================== */

const car =
    new THREE.Group();

car.position.set(
    0,
    0,
    30
);

scene.add(car);


let carModel = null;

let mixer = null;

let wheelObjects = [];

let steeringObjects = [];


/* =====================================================
   GLTF LOADER
===================================================== */

const loader =
    new GLTFLoader();


const dracoLoader =
    new DRACOLoader();

dracoLoader.setDecoderPath(
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/draco/"
);

loader.setDRACOLoader(
    dracoLoader
);

loader.setMeshoptDecoder(
    MeshoptDecoder
);


/* =====================================================
   LOAD CAR
===================================================== */

loader.load(

    CAR_FILE,

    function (gltf) {

        console.log(
            "HORIZON CAR LOADED",
            gltf
        );


        carModel =
            gltf.scene;


        /* =============================================
           SCALE
        ============================================= */

        const box =
            new THREE.Box3()
            .setFromObject(
                carModel
            );

        const size =
            new THREE.Vector3();

        box.getSize(size);


        const largest =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        const scale =
            4.9 / largest;

        carModel.scale.setScalar(
            scale
        );


        /* =============================================
           CENTER
        ============================================= */

        const scaledBox =
            new THREE.Box3()
            .setFromObject(
                carModel
            );

        const center =
            new THREE.Vector3();

        scaledBox.getCenter(
            center
        );

        carModel.position.x -=
            center.x;

        carModel.position.z -=
            center.z;

        carModel.position.y -=
            scaledBox.min.y;


        /*
           IMPORTANT:
           The model's forward axis was sideways.

           Rotating the MODEL by 90 degrees fixes
           the visual orientation without changing
           the actual driving physics.
        */

        carModel.rotation.y =
            Math.PI / 2;


        /* =============================================
           FIND WHEELS
        ============================================= */

        carModel.traverse(
            function (object) {

                if (!object.isMesh)
                    return;


                object.castShadow = true;

                object.receiveShadow = true;


                if (object.material) {

                    const materials =
                        Array.isArray(
                            object.material
                        )
                        ? object.material
                        : [object.material];


                    for (
                        const material
                        of materials
                    ) {

                        if (
                            "envMapIntensity"
                            in material
                        ) {

                            material.envMapIntensity =
                                1.8;
                        }
                    }
                }


                const name =
                    object.name
                    .toLowerCase();


                if (
                    name.includes("wheel") ||
                    name.includes("tire") ||
                    name.includes("tyre") ||
                    name.includes("rim")
                ) {

                    wheelObjects.push(
                        object
                    );
                }


                if (
                    name.includes("steer") ||
                    name.includes("frontwheel") ||
                    name.includes("front_wheel")
                ) {

                    steeringObjects.push(
                        object
                    );
                }
            }
        );


        console.log(
            "WHEELS FOUND:",
            wheelObjects.length
        );


        car.add(
            carModel
        );


        /* =============================================
           ANIMATIONS
        ============================================= */

        if (
            gltf.animations &&
            gltf.animations.length > 0
        ) {

            mixer =
                new THREE.AnimationMixer(
                    carModel
                );


            for (
                const clip
                of gltf.animations
            ) {

                mixer
                    .clipAction(clip)
                    .play();
            }
        }


        document
            .getElementById(
                "loadingText"
            )
            .textContent =
            "WORLD READY";


        setTimeout(
            function () {

                document
                    .getElementById(
                        "loading"
                    )
                    .style.display =
                    "none";

            },
            700
        );

    },


    function (xhr) {

        if (xhr.total) {

            const percent =
                Math.round(
                    xhr.loaded /
                    xhr.total *
                    100
                );

            document
                .getElementById(
                    "loadingText"
                )
                .textContent =
                "LOADING CAR " +
                percent +
                "%";
        }
    },


    function (error) {

        console.error(
            "HORIZON GLB LOAD ERROR:",
            error
        );


        document
            .getElementById(
                "loadingTitle"
            )
            .textContent =
            "CAR LOAD ERROR";


        document
            .getElementById(
                "loadingText"
            )
            .textContent =
            "OPEN BROWSER CONSOLE";


        document
            .getElementById(
                "status"
            )
            .textContent =
            "MODEL ERROR";
    }

);


/* =====================================================
   DRIVING PHYSICS
===================================================== */

/*
   Slowed down significantly for testing.
*/

let speed = 0;

let steering = 0;


/* Maximum speed is now much lower */

const MAX_SPEED = 0.85;

const MAX_REVERSE = 0.35;


/* Acceleration */

const ACCELERATION = 0.012;

const REVERSE_ACCELERATION = 0.008;


/* Braking */

const BRAKE_POWER = 0.035;

const FRICTION = 0.008;


/* Steering */

const MAX_STEERING = 0.62;

const STEERING_RESPONSE = 0.12;

const TURN_RATE = 0.055;


/* =====================================================
   INPUT
===================================================== */

const keys = {};


window.addEventListener(
    "keydown",
    function (event) {

        keys[event.code] = true;


        if (
            [
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight",
                "Space"
            ].includes(event.code)
        ) {

            event.preventDefault();
        }


        if (
            event.code === "KeyN"
        ) {

            toggleNight();
        }

    }
);


window.addEventListener(
    "keyup",
    function (event) {

        keys[event.code] = false;

    }
);


/* =====================================================
   DAY / NIGHT
===================================================== */

let night = false;


function toggleNight() {

    night = !night;


    if (night) {

        scene.background =
            new THREE.Color(
                0x07101d
            );

        scene.fog.color =
            new THREE.Color(
                0x07101d
            );

        hemi.intensity = 0.55;

        sun.intensity = 0.65;


        document
            .getElementById(
                "status"
            )
            .textContent =
            "NIGHT MODE";

    } else {

        scene.background =
            new THREE.Color(
                0x9aa9b7
            );

        scene.fog.color =
            new THREE.Color(
                0x9aa9b7
            );

        hemi.intensity = 2;

        sun.intensity = 4.5;


        document
            .getElementById(
                "status"
            )
            .textContent =
            "DAY MODE";
    }
}


/* =====================================================
   DRIVING
===================================================== */

function updateDriving(delta) {

    const accelerate =
        keys["KeyW"] ||
        keys["ArrowUp"];


    const reverse =
        keys["KeyS"] ||
        keys["ArrowDown"];


    const left =
        keys["KeyA"] ||
        keys["ArrowLeft"];


    const right =
        keys["KeyD"] ||
        keys["ArrowRight"];


    const brake =
        keys["Space"];


    /* =============================================
       ACCELERATE
    ============================================= */

    if (accelerate) {

        speed +=
            ACCELERATION;

        speed =
            Math.min(
                speed,
                MAX_SPEED
            );

    }

    else if (reverse) {

        if (speed > 0) {

            speed -=
                BRAKE_POWER;

        }

        else {

            speed -=
                REVERSE_ACCELERATION;

            speed =
                Math.max(
                    speed,
                    -MAX_REVERSE
                );
        }

    }

    else {

        /* Natural slowdown */

        if (speed > 0) {

            speed -=
                FRICTION;

            speed =
                Math.max(
                    speed,
                    0
                );

        }

        else if (speed < 0) {

            speed +=
                FRICTION;

            speed =
                Math.min(
                    speed,
                    0
                );
        }
    }


    /* =============================================
       SPACE BRAKE
    ============================================= */

    if (brake) {

        if (speed > 0)
            speed -= BRAKE_POWER;

        if (speed < 0)
            speed += BRAKE_POWER;


        if (
            Math.abs(speed) < 0.02
        ) {

            speed = 0;
        }
    }


    /* =============================================
       STEERING
    ============================================= */

    let targetSteering = 0;


    if (left)
        targetSteering =
            -MAX_STEERING;


    if (right)
        targetSteering =
            MAX_STEERING;


    steering +=
        (
            targetSteering -
            steering
        ) *
        STEERING_RESPONSE;


    /* =============================================
       TURN CAR
    ============================================= */

    if (
        Math.abs(speed) > 0.005
    ) {

        const turn =
            steering *
            TURN_RATE *
            (
                Math.abs(speed) /
                MAX_SPEED
            );


        car.rotation.y +=
            turn *
            Math.sign(speed);
    }


    /* =============================================
       FORWARD MOVEMENT
    ============================================= */

    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    forward.applyQuaternion(
        car.quaternion
    );


    car.position.addScaledVector(
        forward,
        speed
    );


    /* =============================================
       ROAD LIMIT
    ============================================= */

    car.position.x =
        THREE.MathUtils.clamp(
            car.position.x,
            -6.7,
            6.7
        );


    /* =============================================
       WHEEL SPIN
    ============================================= */

    for (
        const wheel
        of wheelObjects
    ) {

        /*
           Most vehicle models use X as the
           wheel rotation axis.
        */

        wheel.rotation.x -=
            speed * 5;
    }


    /* =============================================
       FRONT WHEEL STEERING
    ============================================= */

    for (
        const object
        of steeringObjects
    ) {

        object.rotation.y =
            steering * 0.8;
    }


    /* =============================================
       ANIMATIONS
    ============================================= */

    if (mixer) {

        mixer.update(
            delta
        );
    }


    /* =============================================
       SPEEDOMETER
    ============================================= */

    const kmh =
        Math.round(
            Math.abs(speed) * 115
        );


    document
        .getElementById(
            "speed"
        )
        .textContent =
        kmh;


    /* =============================================
       GEAR
    ============================================= */

    if (speed > 0.01) {

        document
            .getElementById(
                "gear"
            )
            .textContent =
            "D";

    }

    else if (speed < -0.01) {

        document
            .getElementById(
                "gear"
            )
            .textContent =
            "R";

    }

    else {

        document
            .getElementById(
                "gear"
            )
            .textContent =
            "N";
    }

}


/* =====================================================
   CAMERA
===================================================== */

const cameraTarget =
    new THREE.Vector3();


function updateCamera() {

    const desired =
        new THREE.Vector3(
            0,
            3.15,
            8
        );


    desired.applyQuaternion(
        car.quaternion
    );


    desired.add(
        car.position
    );


    camera.position.lerp(
        desired,
        0.085
    );


    cameraTarget.copy(
        car.position
    );


    cameraTarget.y += 1;


    camera.lookAt(
        cameraTarget
    );
}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    function () {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =====================================================
   GAME LOOP
===================================================== */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );


    updateDriving(
        delta
    );


    updateCamera();


    renderer.render(
        scene,
        camera
    );
}


animate();

</script>

</body>
</html>
