<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";


/* =====================================================
   CAR
===================================================== */

const CAR_FILE = "https://jaiveginati-creator.github.io/Horizon/electric-car.glb";


/* =====================================================
   SCENE
===================================================== */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x9aa9b7);

scene.fog =
    new THREE.FogExp2(

    );


/* =====================================================
   CAMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        62,
        innerWidth / innerHeight,
        0.1,
        2000
    );

camera.position.set(
    0,
    3.2,
    9
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.15;

document.body.appendChild(

);


/* =====================================================
   LIGHTING
===================================================== */

const hemi =

const sun =

);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;

scene.add(sun);


/* =====================================================
   GROUND
===================================================== */

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            1600,
            1600
        ),
        new THREE.MeshStandardMaterial({

        })

ground.rotation.x =
    -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* =====================================================
   ROAD
===================================================== */

const road =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            16,

        ),
        new THREE.MeshStandardMaterial({
            color:0x25282b,
            roughness:.82
        })
    );

road.rotation.x =
    -Math.PI / 2;

road.position.y =
    .012;

road.receiveShadow = true;

scene.add(road);


/* =====================================================
   ROAD EDGES
===================================================== */

const edgeMaterial =
    new THREE.MeshStandardMaterial({
        color:0x777b7d,
        roughness:.85
    });


for(const x of [-8.2,8.2]){

    const edge =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .45,
                .18,
                1600
            ),
            edgeMaterial
        );

    edge.position.set(
        x,
        .09,
        0
    );

    scene.add(edge);
}


/* =====================================================
   ROAD MARKINGS
===================================================== */

const markingMaterial =
    new THREE.MeshStandardMaterial({
        color:0xe4e1d4,
        roughness:.65
    });


for(
    let z=-790;
    z<800;
    z+=12
){

    const line =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .22,
                .025,
                6
            ),
            markingMaterial
        );

    line.position.set(
        0,
        .035,
        z
    );

    scene.add(line);
}


/* =====================================================
   SIDE LINES
===================================================== */

for(const x of [-7.5,7.5]){

    const line =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .1,
                .028,
                1600
            ),
            markingMaterial
        );

    line.position.set(
        x,
        .035,
        0
    );

    scene.add(line);
}


/* =====================================================
   BUILDINGS
===================================================== */

const buildingMaterials = [

    new THREE.MeshStandardMaterial({
        color:0x555d65,
        roughness:.82
    }),

    new THREE.MeshStandardMaterial({
        color:0x6b7176,
        roughness:.8
    }),

    new THREE.MeshStandardMaterial({
        color:0x454a4f,
        roughness:.84
    }),

    new THREE.MeshStandardMaterial({
        color:0x777a78,
        roughness:.78
    })
];


function createBuilding(
    x,
    z,
    width,
    height,
    depth
){

    const material =
        buildingMaterials[
            Math.floor(
                Math.random() *
                buildingMaterials.length
            )
        ];

    const building =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            material
        );

    building.position.set(
        x,
        height/2,
        z
    );

    building.castShadow = true;
    building.receiveShadow = true;

    scene.add(building);


    const windowMaterial =
        new THREE.MeshStandardMaterial({
            color:0x1b2c39,
            roughness:.3,
            metalness:.25
        });


    for(
        let y=2;
        y<height-1;
        y+=3.2
    ){

        const windows =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    Math.max(
                        .3,
                        width*.65
                    ),
                    .65,
                    .04
                ),
                windowMaterial
            );

        windows.position.set(
            x,
            y,
            z-depth/2-.025
        );

        scene.add(windows);
    }
}


for(
    let z=-760;
    z<760;
    z+=35
){

    if(Math.abs(z)<45)
        continue;


    createBuilding(
        -18-Math.random()*18,
        z,
        10+Math.random()*9,
        10+Math.random()*28,
        16+Math.random()*12
    );


    createBuilding(
        18+Math.random()*18,
        z+10,
        10+Math.random()*9,
        12+Math.random()*32,
        16+Math.random()*12
    );
}


/* =====================================================
   TREES
===================================================== */

const trunkMaterial =
    new THREE.MeshStandardMaterial({
        color:0x4b3628,
        roughness:1
    });

const leafMaterial =
    new THREE.MeshStandardMaterial({
        color:0x304c37,
        roughness:.95
    });


function createTree(x,z){

    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .16,
                .23,
                2.2,
                8
            ),
            trunkMaterial
        );

    trunk.position.set(
        x,
        1.1,
        z
    );

    trunk.castShadow = true;

    const leaves =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                1.35,

            ),

        );

    leaves.position.set(
        x,
        2.7,
        z
    );

    leaves.castShadow = true;

    scene.add(leaves);
}


for(
    let z=-760;
    z<760;
    z+=22
){

    if(Math.abs(z)<40)
        continue;

    createTree(
        -10.5-Math.random()*4,
        z
    );

    createTree(
        10.5+Math.random()*4,
        z+8
    );
}


/* =====================================================
   STREET LIGHTS
===================================================== */

const poleMaterial =
    new THREE.MeshStandardMaterial({
        color:0x303337,
        metalness:.7,
        roughness:.45
    });


function createStreetLight(x,z){

    const pole =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .07,
                .1,
                4.7,
                10
            ),
            poleMaterial
        );

    pole.position.set(
        x,
        2.35,
        z
    );

    pole.castShadow = true;

    scene.add(pole);


    const arm =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.1,
                .07,
                .07
            ),
            poleMaterial
        );

    arm.position.set(
        x+(x<0?.5:-.5),
        4.55,
        z
    );

    scene.add(arm);


    const lamp =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .14,
                10,
                10
            ),
            new THREE.MeshStandardMaterial({
                color:0xffe8aa,
                emissive:0xffa52f,
                emissiveIntensity:2
            })
        );

    lamp.position.set(
        x+(x<0?1:-1),
        4.48,
        z
    );

    scene.add(lamp);
}


for(
    let z=-760;
    z<760;
    z+=32
){

    createStreetLight(
        -7,
        z
    );

    createStreetLight(
        7,
        z+16
    );
}


/* =====================================================
   PLAYER CAR
===================================================== */

const car =
    new THREE.Group();

car.position.set(
    0,
    0,
    30
);

scene.add(car);


let carModel = null;
let mixer = null;

let wheelObjects = [];
let steeringObjects = [];


/* =====================================================
   LOAD GLB
===================================================== */

const loader =
    new GLTFLoader();


loader.load(

    CAR_FILE,

    function(gltf){

        carModel =
            gltf.scene;


        /* SCALE */

        const box =
            new THREE.Box3()
            .setFromObject(
                carModel
            );

        const size =
            new THREE.Vector3();

        box.getSize(size);


        const largest =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        const scale =
            4.9/largest;

        carModel.scale.setScalar(
            scale
        );


        /* CENTER */

        const scaledBox =
            new THREE.Box3()
            .setFromObject(
                carModel
            );

        const center =
            new THREE.Vector3();

        scaledBox.getCenter(
            center
        );

        carModel.position.x -=
            center.x;

        carModel.position.z -=
            center.z;

        carModel.position.y -=
            scaledBox.min.y;


        /* MODEL ORIENTATION */

        carModel.rotation.y =
            Math.PI;


        /* MATERIALS + OBJECT SEARCH */

        carModel.traverse(
            function(object){

                if(!object.isMesh)
                    return;


                object.castShadow = true;
                object.receiveShadow = true;


                if(object.material){

                    const materials =
                        Array.isArray(
                            object.material
                        )
                        ? object.material
                        : [object.material];


                    for(
                        const material
                        of materials
                    ){

                        if(
                            "envMapIntensity"
                            in material
                        ){

                            material.envMapIntensity =
                                1.8;
                        }
                    }
                }


                const name =
                    object.name.toLowerCase();


                if(
                    name.includes("wheel") ||
                    name.includes("tire") ||
                    name.includes("tyre")
                ){

                    wheelObjects.push(
                        object
                    );
                }


                if(
                    name.includes("steer") ||
                    name.includes("frontwheel") ||
                    name.includes("front_wheel")
                ){

                    steeringObjects.push(
                        object
                    );
                }
            }
        );


        car.add(
            carModel
        );


        /* MODEL ANIMATIONS */

        if(
            gltf.animations &&
            gltf.animations.length>0
        ){

            mixer =
                new THREE.AnimationMixer(
                    carModel
                );

            for(
                const clip
                of gltf.animations
            ){

                mixer
                    .clipAction(clip)
                    .play();
            }
        }


        document
            .getElementById(
                "loadingText"
            )
            .textContent =
            "WORLD READY";


        setTimeout(
            function(){

                document
                    .getElementById(
                        "loading"
                    )
                    .style.display =
                    "none";

            },
            800
        );

    },


    undefined,


    function(error){

        console.error(
            "GLB ERROR:",
            error
        );

        document
            .getElementById(
                "loadingTitle"
            )
            .textContent =
            "CAR ERROR";

        document
            .getElementById(
                "loadingText"
            )
            .textContent =
            "electric-car.glb NOT FOUND";
    }
);


/* =====================================================
   PHYSICS
===================================================== */

let speed = 0;

let steering = 0;

const MAX_SPEED = 2.5;
const MAX_REVERSE = .85;

const ACCELERATION = .035;
const REVERSE_ACCELERATION = .02;

const BRAKE_POWER = .09;
const FRICTION = .01;

const MAX_STEERING = .62;

const STEERING_RESPONSE = .13;

const TURN_RATE = .04;


/* =====================================================
   INPUT
===================================================== */

const keys = {};

window.addEventListener(
    "keydown",
    event=>{

        keys[event.code] = true;

        if(
            [
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight",
                "Space"
            ].includes(event.code)
        ){

            event.preventDefault();
        }


        if(
            event.code === "KeyN"
        ){

            toggleNight();
        }
    }
);


window.addEventListener(
    "keyup",
    event=>{

        keys[event.code] = false;
    }
);


/* =====================================================
   DAY NIGHT
===================================================== */

let night = false;


function toggleNight(){

    night = !night;


    if(night){

        scene.background =
            new THREE.Color(
                0x07101d
            );

        scene.fog.color =
            new THREE.Color(
                0x07101d
            );

        hemi.intensity = .55;
        sun.intensity = .65;

        document
            .getElementById(
                "status"
            )
            .textContent =
            "NIGHT MODE";

    }else{

        scene.background =
            new THREE.Color(
                0x9aa9b7
            );

        scene.fog.color =
            new THREE.Color(
                0x9aa9b7
            );

        hemi.intensity = 2;
        sun.intensity = 4.5;

        document
            .getElementById(
                "status"
            )
            .textContent =
            "DAY MODE";
    }
}


/* =====================================================
   DRIVING
===================================================== */

function updateDriving(delta){

    const accelerate =
        keys["KeyW"] ||
        keys["ArrowUp"];

    const reverse =
        keys["KeyS"] ||
        keys["ArrowDown"];

    const left =
        keys["KeyA"] ||
        keys["ArrowLeft"];

    const right =
        keys["KeyD"] ||
        keys["ArrowRight"];

    const brake =
        keys["Space"];


    /* ACCELERATE */

    if(accelerate){

        speed +=
            ACCELERATION;

        speed =
            Math.min(
                speed,
                MAX_SPEED
            );

    }else if(reverse){

        if(speed>0){

            speed -=
                BRAKE_POWER;

        }else{

            speed -=
                REVERSE_ACCELERATION;

            speed =
                Math.max(
                    speed,
                    -MAX_REVERSE
                );
        }

    }else{

        if(speed>0){

            speed -=
                FRICTION;

            speed =
                Math.max(
                    speed,
                    0
                );

        }else if(speed<0){

            speed +=
                FRICTION;

            speed =
                Math.min(
                    speed,
                    0
                );
        }
    }


    /* BRAKE */

    if(brake){

        if(speed>0)
            speed -= BRAKE_POWER;

        if(speed<0)
            speed += BRAKE_POWER;

        if(Math.abs(speed)<.03)
            speed=0;
    }


    /* STEERING */

    let targetSteering = 0;

    if(left)
        targetSteering -= MAX_STEERING;

    if(right)
        targetSteering += MAX_STEERING;


    steering +=
        (
            targetSteering -
            steering
        ) *
        STEERING_RESPONSE;


    /* TURN */

    if(
        Math.abs(speed)>.01
    ){

        const turn =
            steering *
            TURN_RATE *
            (
                Math.abs(speed) /
                MAX_SPEED
            );

        car.rotation.y +=
            turn *
            Math.sign(speed);
    }


    /* MOVE */

    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    forward.applyQuaternion(
        car.quaternion
    );

    car.position.addScaledVector(
        forward,
        speed
    );


    /* ROAD LIMIT */

    car.position.x =
        THREE.MathUtils.clamp(
            car.position.x,
            -6.7,
            6.7
        );


    /* WHEELS */

    for(
        const wheel
        of wheelObjects
    ){

        wheel.rotation.x -=
            speed*2.8;
    }


    /* STEERING PARTS */

    for(
        const object
        of steeringObjects
    ){

        object.rotation.y =
            steering*.8;
    }


    if(mixer)
        mixer.update(delta);


    /* SPEED */

    const kmh =
        Math.round(
            Math.abs(speed)*68
        );

    document
        .getElementById(
            "speed"
        )
        .textContent =
        kmh;


    /* GEAR */

    if(speed>.02){

        document
            .getElementById(
                "gear"
            )
            .textContent =
            "D";

    }else if(speed<-.02){

        document
            .getElementById(
                "gear"
            )
            .textContent =
            "R";

    }else{

        document
            .getElementById(
                "gear"
            )
            .textContent =
            "N";
    }
}


/* =====================================================
   CAMERA
===================================================== */

const cameraTarget =
    new THREE.Vector3();


function updateCamera(){

    const desired =
        new THREE.Vector3(
            0,
            3.15,
            8
        );

    desired.applyQuaternion(
        car.quaternion
    );

    desired.add(
        car.position
    );


    camera.position.lerp(
        desired,
        .085
    );


    cameraTarget.copy(
        car.position
    );

    cameraTarget.y += 1;


    camera.lookAt(
        cameraTarget
    );
}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


/* =====================================================
   GAME LOOP
===================================================== */

const clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    updateDriving(delta);

    updateCamera();


    renderer.render(
        scene,
        camera
    );
}


animate();

</script>

</body>
</html>
