<script type="module">


// ============================================================

} from "three/addons/libs/meshopt_decoder.module.js";



// ============================================================
// SCENE
// ============================================================

const scene =

scene.background =
    new THREE.Color(

    );


scene.fog =

const camera =

camera.position.set(

// ============================================================
// RENDERER
// ============================================================

const renderer =
    new THREE.WebGLRenderer({

        antialias: true,

        powerPreference:
            "high-performance"

    });


renderer.setSize(

    window.innerWidth,

    window.innerHeight

);


renderer.setPixelRatio(

);


renderer.shadowMap.enabled =

renderer.shadowMap.type =

renderer.outputColorSpace =

renderer.toneMapping =

renderer.toneMappingExposure =

document.body.appendChild(
    renderer.domElement
);



// ============================================================
// LOADERS
// ============================================================

const loader =
    new GLTFLoader();


const dracoLoader =
    new DRACOLoader();


dracoLoader.setDecoderPath(

    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/draco/"

);


loader.setDRACOLoader(
    dracoLoader
);


loader.setMeshoptDecoder(
    MeshoptDecoder
);



// ============================================================
// WORLD
// ============================================================

const WORLD_SIZE =
    2400;



// ============================================================
// TERRAIN
// ============================================================

function terrainHeight(
    x,
    z
) {

    const hills =

        Math.sin(
            x * 0.008
        ) * 3

        +

        Math.cos(
            z * 0.006
        ) * 4

        +

        Math.sin(
            (x + z) * 0.012
        ) * 2;


    const smallHills =

        Math.sin(
            x * 0.022 +
            z * 0.013
        ) * 0.8

        +

        Math.cos(
            z * 0.018
        ) * 0.7;


    const cityFlatten =

        Math.exp(

            -(
                x * x +
                z * z
            ) / 180000

        );


    return (

        hills +
        smallHills

    )

    *

    (

        1 -
        cityFlatten * 0.85

    );

}



// ============================================================
// TERRAIN MESH
// ============================================================

function createTerrain() {

    const geometry =
        new THREE.PlaneGeometry(

            WORLD_SIZE,
            WORLD_SIZE,

            140,
            140

        );


    geometry.rotateX(
        -Math.PI / 2
    );


    const position =
        geometry.attributes.position;


    for (

        let i = 0;

        i < position.count;

        i++

    ) {

        const x =
            position.getX(i);


        const z =
            position.getZ(i);


        position.setY(

            i,

            terrainHeight(
                x,
                z
            )

        );

    }


    geometry.computeVertexNormals();


    const material =
        new THREE.MeshStandardMaterial({

            color:
                0x405b3d,

            roughness:
                1

        });


    const terrain =
        new THREE.Mesh(

            geometry,
            material

        );


    terrain.receiveShadow =
        true;


    scene.add(
        terrain
    );

}


createTerrain();



// ============================================================
// ROAD SYSTEM
// ============================================================

/*
    ROAD DESIGN

    Main roads:
        30m wide
        two-way
        yellow center line
        white edge lines
        sidewalks
        curbs

    City roads:
        12m wide
        two-way
        yellow center line
        white edge lines
        sidewalks
        curbs
*/


const roadDefinitions = [];



function addRoad(

    x,
    z,
    width,
    length,
    rotation,
    type = "city"

) {

    roadDefinitions.push({

        x,
        z,
        width,
        length,
        rotation,
        type

    });

}



// ============================================================
// MAIN ROADS
// ============================================================

addRoad(

    0,
    0,
    30,
    1900,
    0,
    "main"

);


addRoad(

    0,
    0,
    30,
    1900,
    Math.PI / 2,
    "main"

);



// ============================================================
// MAJOR ROADS
// ============================================================

addRoad(

    330,
    0,
    22,
    1700,
    0,
    "major"

);


addRoad(

    -330,
    0,
    22,
    1700,
    0,
    "major"

);


addRoad(

    0,
    360,
    22,
    1700,
    Math.PI / 2,
    "major"

);


addRoad(

    0,
    -360,
    22,
    1700,
    Math.PI / 2,

// ============================================================
// CITY GRID
// ============================================================

for (

    let x = -420;

    x += 105

) {

    if (

        addRoad(

            x,

}



for (

    let z = -420;

    z <= 420;

    z += 105

) {

        Math.abs(z) >= 50
    ) {

        addRoad(

            0,

            12,
            850,
            Math.PI / 2,

// ============================================================
// ROAD HEIGHT
// ============================================================

const ROAD_HEIGHT =
    0.24;


function roadHeight(
    x,
    z
) {

    return (

        terrainHeight(
            x,
            z
        ) +

        ROAD_HEIGHT

    );

}



// ============================================================
// ROAD DISTANCE
// ============================================================

function distanceToRoad(

    px,
    pz,
    road

) {

    const dx =
        px - road.x;


    const dz =
        pz - road.z;


    const cos =
        Math.cos(
            road.rotation
        );


    const sin =
        Math.sin(
            road.rotation
        );


    const localX =

        dx * cos +
        dz * sin;


    const localZ =

        -dx * sin +
        dz * cos;


    const halfWidth =
        road.width / 2;


    const halfLength =
        road.length / 2;


    const outsideX =

        Math.max(

            Math.abs(localX) -
            halfWidth,

            0

        );


    const outsideZ =

        Math.max(

            Math.abs(localZ) -
            halfLength,

            0

        );


    return Math.sqrt(

        outsideX * outsideX +

        outsideZ * outsideZ

    );

}



// ============================================================
// ROAD MESH
// ============================================================

function createRoadSurface(
    road
) {


    const segments =
        Math.max(

            180,

            Math.floor(
                road.length / 4
            )

        );


    const geometry =
        new THREE.PlaneGeometry(

            road.width,
            road.length,

            8,
            segments

        );


    geometry.rotateX(
        -Math.PI / 2
    );


    const position =
        geometry.attributes.position;


    const cos =
        Math.cos(
            road.rotation
        );


    const sin =
        Math.sin(
            road.rotation
        );


    for (

        let i = 0;

        i < position.count;

        i++

    ) {


        const localX =
            position.getX(i);


        const localZ =
            position.getZ(i);


        const worldX =

            road.x +

            localX * cos -

            localZ * sin;


        const worldZ =

            road.z +

            localX * sin +

            localZ * cos;


        position.setY(

            i,

            roadHeight(
                worldX,
                worldZ
            )

        );

    }


    geometry.computeVertexNormals();


    const material =
        new THREE.MeshStandardMaterial({

            color:
                0x292a2c,

            roughness:
                0.92,

            metalness:
                0.02

        });


    const mesh =
        new THREE.Mesh(

            geometry,
            material

        );


    mesh.position.set(

        road.x,
        0,
        road.z

    );


    mesh.rotation.y =
        road.rotation;


    mesh.receiveShadow =
        true;


    scene.add(
        mesh
    );

}



// ============================================================
// ROAD POINT
// ============================================================

function roadPoint(

    road,
    distance,
    lateral = 0

) {


    const forwardX =
        Math.sin(
            road.rotation
        );


    const forwardZ =
        Math.cos(
            road.rotation
        );


    const sideX =
        Math.cos(
            road.rotation
        );


    const sideZ =
        -Math.sin(
            road.rotation
        );


    return {

        x:

            road.x +

            forwardX *
            distance +

            sideX *
            lateral,


        z:

            road.z +

            forwardZ *
            distance +

            sideZ *
            lateral

    };

}



// ============================================================
// ROAD STRIP
// ============================================================

function createRoadStrip(

    road,
    lateral,
    width,
    color,
    height = 0.025

) {


    const geometry =
        new THREE.BoxGeometry(

            width,
            height,
            road.length

        );


    const material =
        new THREE.MeshStandardMaterial({

            color:
                color,

            roughness:
                0.8

        });


    const strip =
        new THREE.Mesh(

            geometry,
            material

        );


    const point =
        roadPoint(

            road,
            0,
            lateral

        );


    strip.position.set(

        point.x,

        roadHeight(
            point.x,
            point.z
        ) + 0.035,

        point.z

    );


    strip.rotation.y =
        road.rotation;


    strip.renderOrder =
        5;


    scene.add(
        strip
    );

}



// ============================================================
// ROAD MARKINGS
// ============================================================

function createRoadMarkings(
    road
) {


    const yellow =
        new THREE.MeshStandardMaterial({

            color:
                0xd8b83d,

            roughness:
                0.8

        });


    const white =
        new THREE.MeshStandardMaterial({

            color:
                0xe6e6e6,

            roughness:
                0.8

        });



    // --------------------------------------------------------
    // YELLOW CENTER LINE
    // --------------------------------------------------------

    if (
        road.width >= 20
    ) {


        for (

            const lateral
            of [-0.28, 0.28]

        ) {


            const geometry =
                new THREE.BoxGeometry(

                    0.10,
                    0.025,
                    road.length

                );


            const line =
                new THREE.Mesh(

                    geometry,
                    yellow

                );


            const point =
                roadPoint(

                    road,
                    0,
                    lateral

                );


            line.position.set(

                point.x,

                roadHeight(
                    point.x,
                    point.z
                ) + 0.035,

                point.z

            );


            line.rotation.y =
                road.rotation;


            line.renderOrder =
                6;


            scene.add(
                line
            );

        }

    }

    else {


        for (

            let d =
                -road.length / 2 + 12;

            d <
                road.length / 2 - 5;

            d += 24

        ) {


            const point =
                roadPoint(
                    road,
                    d,
                    0
                );


            const geometry =
                new THREE.BoxGeometry(

                    0.18,
                    0.025,
                    10

                );


            const dash =
                new THREE.Mesh(

                    geometry,
                    yellow

                );


            dash.position.set(

                point.x,

                roadHeight(
                    point.x,
                    point.z
                ) + 0.035,

                point.z

            );


            dash.rotation.y =
                road.rotation;


            dash.renderOrder =
                6;


            scene.add(
                dash
            );

        }

    }



    // --------------------------------------------------------
    // WHITE EDGE LINES
    // --------------------------------------------------------

    const edge =
        road.width / 2 - 1.1;



    for (

        const side
        of [-1, 1]

    ) {


        createRoadStrip(

            road,

            edge * side,

            0.14,

            0xe6e6e6

        );

    }



    // --------------------------------------------------------
    // CITY ROAD LANE DIVIDER
    // --------------------------------------------------------

    if (
        road.width >= 11 &&
        road.width < 20
    ) {


        for (

            let d =
                -road.length / 2 + 12;

            d <
                road.length / 2 - 5;

            d += 24

        ) {


            const point =
                roadPoint(

                    road,
                    d,
                    0

                );


            const geometry =
                new THREE.BoxGeometry(

                    0.18,
                    0.025,
                    8

                );


            const line =
                new THREE.Mesh(

                    geometry,
                    white

                );


            line.position.set(

                point.x,

                roadHeight(
                    point.x,
                    point.z
                ) + 0.037,

                point.z

            );


            line.rotation.y =
                road.rotation;


            line.renderOrder =
                6;


            scene.add(
                line
            );

        }

    }

}



// ============================================================
// CURBS
// ============================================================

function createCurbs(
    road
) {


    const curbWidth =
        0.55;


    const curbHeight =
        0.22;


    const curbMaterial =
        new THREE.MeshStandardMaterial({

            color:
                0x858585,

            roughness:
                0.9

        });


    const lateral =
        road.width / 2 +
        curbWidth / 2;



    for (

        const side
        of [-1, 1]

    ) {


        const geometry =
            new THREE.BoxGeometry(

                curbWidth,

                curbHeight,

                road.length

            );


        const curb =
            new THREE.Mesh(

                geometry,
                curbMaterial

            );


        const point =
            roadPoint(

                road,
                0,
                lateral * side

            );


        curb.position.set(

            point.x,

            roadHeight(
                point.x,
                point.z
            ) +

            curbHeight / 2,

            point.z

        );


        curb.rotation.y =
            road.rotation;


        curb.castShadow =
            true;


        curb.receiveShadow =
            true;


        scene.add(
            curb
        );

    }

}



// ============================================================
// SIDEWALKS
// ============================================================

function createSidewalks(
    road
) {


    const sidewalkWidth =
        road.type === "main"
            ? 7
            : 4.5;


    const sidewalkMaterial =
        new THREE.MeshStandardMaterial({

            color:
                0xa6a6a6,

            roughness:
                0.95

        });


    const lateral =
        road.width / 2 +
        0.55 +
        sidewalkWidth / 2;



    for (

        const side
        of [-1, 1]

    ) {


        const geometry =
            new THREE.BoxGeometry(

                sidewalkWidth,

                0.16,

                road.length

            );


        const sidewalk =
            new THREE.Mesh(

                geometry,
                sidewalkMaterial

            );


        const point =
            roadPoint(

                road,
                0,
                lateral * side

            );


        sidewalk.position.set(

            point.x,

            terrainHeight(
                point.x,
                point.z
            ) +

            0.30,

            point.z

        );


        sidewalk.rotation.y =
            road.rotation;


        sidewalk.receiveShadow =
            true;


        scene.add(
            sidewalk
        );

    }

}



// ============================================================
// ROADS
// ============================================================

for (

    const road
    of roadDefinitions

) {


    createRoadSurface(
        road
    );


    createRoadMarkings(
        road
    );


    createCurbs(
        road
    );


    createSidewalks(
        road
    );

}



// ============================================================
// CROSSWALKS
// ============================================================

function createCrosswalk(

    x,
    z,
    rotation,
    roadWidth = 30

) {


    const whiteMaterial =
        new THREE.MeshStandardMaterial({

            color:
                0xe8e8e8,

            roughness:
                0.85

        });


    for (

        let i = -5;

        i <= 5;

        i++

    ) {


        const lateral =
            i * 2.3;


        const point = {

            x:

                x +

                Math.cos(
                    rotation
                ) *

                lateral,


            z:

                z -

                Math.sin(
                    rotation
                ) *

                lateral

        };


        const geometry =
            new THREE.BoxGeometry(

                1.4,

                0.035,

                9

            );


        const stripe =
            new THREE.Mesh(

                geometry,
                whiteMaterial

            );


        stripe.position.set(

            point.x,

            roadHeight(
                point.x,
                point.z
            ) + 0.045,

            point.z

        );


        stripe.rotation.y =
            rotation;


        stripe.renderOrder =
            7;


        scene.add(
            stripe
        );

    }

}



// ============================================================
// CROSSWALK LOCATIONS
// ============================================================

const intersections = [

    [105, 105],
    [105, -105],
    [-105, 105],
    [-105, -105],

    [210, 210],
    [210, -210],
    [-210, 210],
    [-210, -210]

];



for (

    const [x, z]
    of intersections

) {


    createCrosswalk(

        x,
        z,
        0

    );


    createCrosswalk(

        x,
        z,
        Math.PI / 2

    );

}

// PARKING LOTS

const parkingLots = [

    {
        x: 65,
        z: 65,
        width: 55,
        depth: 70,
        rotation: 0
    },

    {
        x: -65,
        z: -65,
        width: 55,
        depth: 70,
        rotation: 0
    },

    {
        x: 275,
        z: 275,
        width: 55,
        depth: 70,
        rotation: Math.PI / 2
    },

    {
        x: -275,
        z: -275,
        width: 55,
        depth: 70,
        rotation: Math.PI / 2
    }

// ============================================================
// PARKING LOTS
// ============================================================

function createParkingLot(
    lot
) {


    const geometry =
        new THREE.PlaneGeometry(

            lot.width,
            lot.depth

        );


    geometry.rotateX(
        -Math.PI / 2
    );


    const material =
        new THREE.MeshStandardMaterial({

            color:
                0x343638,

            roughness:
                0.95

        });


    const mesh =
        new THREE.Mesh(

            geometry,
            material

        );


    mesh.position.set(

        lot.x,

        terrainHeight(
            lot.x,
            lot.z
        ) + 0.23,

        lot.z

    );


    mesh.rotation.y =
        lot.rotation;


    mesh.receiveShadow =
        true;


    scene.add(
        mesh
    );



    for (

        let i = -4;

        i <= 4;

        i++

    ) {


        const localX =
            i * 5;


        const px =

            lot.x +

            localX *

            Math.cos(
                lot.rotation
            );


        const pz =

            lot.z +

            localX *

            Math.sin(
                lot.rotation
            );


        const line =
            new THREE.Mesh(

                new THREE.BoxGeometry(

                    0.10,
                    0.025,
                    lot.depth - 8

                ),

                new THREE.MeshStandardMaterial({

                    color:
                        0xc4c4c4

                })

            );


        line.position.set(

            px,

            terrainHeight(
                px,
                pz
            ) + 0.27,

            pz

        );


        line.rotation.y =
            lot.rotation;


        scene.add(
            line
        );

    }

}



for (

    const lot
    of parkingLots

) {

    createParkingLot(
        lot
    );

}



// ============================================================
// BUILDINGS
// ============================================================

const buildingFiles = [

    "assets/buildings/large-building.glb",

    "assets/buildings/store.glb",

    "assets/buildings/apartment.glb",

    "assets/buildings/large-building-2.glb",

    "assets/buildings/bank.glb"

];


const buildingTemplates = [];

const placedBuildings = [];



// ============================================================
// BUILDING ROAD BUFFER
// ============================================================

const BUILDING_ROAD_BUFFER =
    20;


const BUILDING_SIDEWALK_BUFFER =
    4;



// ============================================================
// BUILDING TEMPLATE LOADING
// ============================================================

async function loadBuildings() {


    console.log(
        "Loading buildings..."
    );


    for (

        const file
        of buildingFiles

    ) {


        try {


            const gltf =
                await loader.loadAsync(
                    file
                );


            const model =
                gltf.scene;



            // ------------------------------------------------
            // NORMALIZE
            // ------------------------------------------------

            const originalBox =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const originalSize =
                new THREE.Vector3();


            originalBox.getSize(
                originalSize
            );


            const largest =
                Math.max(

                    originalSize.x,
                    originalSize.y,
                    originalSize.z

                );



            if (
                largest > 0
            ) {

                model.scale.setScalar(

                    30 /
                    largest

                );

            }



            // ------------------------------------------------
            // CENTER X/Z
            // ------------------------------------------------

            let box =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const center =
                new THREE.Vector3();


            box.getCenter(
                center
            );


            model.position.x -=
                center.x;


            model.position.z -=
                center.z;



            // ------------------------------------------------
            // GROUND
            // ------------------------------------------------

            box =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            model.position.y -=
                box.min.y;



            // ------------------------------------------------
            // FINAL BOUNDS
            // ------------------------------------------------

            box =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const size =
                new THREE.Vector3();


            box.getSize(
                size
            );



            // ------------------------------------------------
            // SHADOWS
            // ------------------------------------------------

            model.traverse(

                child => {


                    if (
                        child.isMesh
                    ) {


                        child.castShadow =
                            true;


                        child.receiveShadow =
                            true;

                    }

                }

            );



            buildingTemplates.push({

                model:
                    model,

                width:
                    size.x,

                depth:
                    size.z,

                height:
                    size.y

            });



            console.log(
                "Building loaded:",
                file
            );

        }

        catch (
            error
        ) {


            console.error(

                "Could not load:",
                file,

                error

            );

        }

    }



    console.log(

        "Building count:",

        buildingTemplates.length

    );



    if (
        buildingTemplates.length > 0
    ) {

        generateCity();

    }

}



// ============================================================
// ROTATED BUILDING FOOTPRINT
// ============================================================

function rotatedFootprint(

    width,
    depth,
    rotation,
    scale

) {


    const cos =
        Math.abs(
            Math.cos(
                rotation
            )
        );


    const sin =
        Math.abs(
            Math.sin(
                rotation
            )
        );


    return {

        halfX:

            (

                width * cos +

                depth * sin

            )

            *

            scale

            /

            2,


        halfZ:

            (

                width * sin +

                depth * cos

            )

            *

            scale

            /

            2

    };

}



// ============================================================
// BUILDING ROAD TEST
// ============================================================

function buildingTouchesRoad(

    x,
    z,
    halfX,
    halfZ

) {


    const testPoints = [

        [x, z],

        [x - halfX, z],
        [x + halfX, z],

        [x, z - halfZ],
        [x, z + halfZ],

        [x - halfX, z - halfZ],
        [x + halfX, z - halfZ],

        [x - halfX, z + halfZ],
        [x + halfX, z + halfZ]

    ];



    for (

        const road
        of roadDefinitions

    ) {


        for (

            const point
            of testPoints

        ) {


            if (

                distanceToRoad(

                    point[0],
                    point[1],
                    road

                )

                <

                BUILDING_ROAD_BUFFER

            ) {

                return true;

            }

        }

    }


    return false;

}



// ============================================================
// BUILDING COLLISION
// ============================================================

function buildingTouchesBuilding(

    x,
    z,
    halfX,
    halfZ

) {


    for (

        const other
        of placedBuildings

    ) {


        const xOverlap =

            Math.abs(
                x - other.x
            )

            <

            (

                halfX +

                other.halfX +

                5

            );


        const zOverlap =

            Math.abs(
                z - other.z
            )

            <

            (

                halfZ +

                other.halfZ +

                5

            );



        if (
            xOverlap &&
            zOverlap
        ) {

            return true;

        }

    }


    return false;

}



// ============================================================
// PARKING LOT TEST
// ============================================================

function buildingTouchesParking(

    x,
    z,
    halfX,
    halfZ

) {


    for (

        const lot
        of parkingLots

    ) {


        const xOverlap =

            Math.abs(
                x - lot.x
            )

            <

            (

                lot.width / 2 +

                halfX +

                5

            );


        const zOverlap =

            Math.abs(
                z - lot.z
            )

            <

            (

                lot.depth / 2 +

                halfZ +

                5

            );



        if (
            xOverlap &&
            zOverlap
        ) {

            return true;

        }

    }


    return false;

}



// ============================================================
// BUILDING INTERIOR
// ============================================================

function createBuildingInterior(

    width,
    depth,
    height

) {


    /*
        The previous version cloned the entire building.

        That was wrong because the GLB itself is only
        an exterior shell.

        This version creates a SMALL inset volume
        based directly on the actual building dimensions.

        It stays completely inside the exterior.
    */


    const innerWidth =

        Math.max(

            width * 0.72,

            2

        );


    const innerDepth =

        Math.max(

            depth * 0.72,

            2

        );


    const innerHeight =

        Math.max(

            height * 0.78,

            2

        );



    const material =
        new THREE.MeshStandardMaterial({

            color:
                0x45484c,

            roughness:
                0.95,

            metalness:
                0,

            side:
                THREE.FrontSide

        });



    const geometry =
        new THREE.BoxGeometry(

            innerWidth,

            innerHeight,

            innerDepth

        );



    const interior =
        new THREE.Mesh(

            geometry,
            material

        );


    /*
        The building has already been grounded,
        so put the interior safely above the ground.
    */

    interior.position.set(

        0,

        innerHeight / 2,

        0

    );


    interior.castShadow =
        false;


    interior.receiveShadow =
        false;


    /*
        This prevents the interior from becoming
        a giant black object through the exterior.
    */

    interior.renderOrder =
        0;


    return interior;

}



// ============================================================
// ADD BUILDING
// ============================================================

function addBuilding(

    template,
    x,
    z,
    scale

) {


    const building =
        template.model.clone(true);



    const rotation =

        Math.floor(

            Math.random() * 4

        )

        *

        Math.PI / 2;



    // --------------------------------------------------------
    // FOOTPRINT
    // --------------------------------------------------------

    const footprint =

        rotatedFootprint(

            template.width,

            template.depth,

            rotation,

            scale

        );



    // --------------------------------------------------------
    // SCALE
    // --------------------------------------------------------

    building.scale.setScalar(
        scale
    );


    building.rotation.y =
        rotation;



    // --------------------------------------------------------
    // POSITION
    // --------------------------------------------------------

    building.position.set(

        x,

        terrainHeight(
            x,
            z
        ),

        z

    );



    // --------------------------------------------------------
    // SHADOWS
    // --------------------------------------------------------

    building.traverse(

        child => {


            if (
                child.isMesh
            ) {


                child.castShadow =
                    true;


                child.receiveShadow =
                    true;

            }

        }

    );



    // --------------------------------------------------------
    // INTERIOR
    // --------------------------------------------------------

    const interior =

        createBuildingInterior(

            template.width,

            template.depth,

            template.height

        );


    /*
        Interior uses the building's local
        coordinate system, so it scales and
        rotates exactly with the building.
    */

    building.add(
        interior
    );



    // --------------------------------------------------------
    // ADD
    // --------------------------------------------------------

    scene.add(
        building
    );



    // --------------------------------------------------------
    // SAVE FOOTPRINT
    // --------------------------------------------------------

    placedBuildings.push({

        x:
            x,

        z:
            z,

        halfX:
            footprint.halfX,

        halfZ:
            footprint.halfZ

    });

}

async function loadCar() {


    try {


        const gltf =
            await loader.loadAsync(
                CAR_FILE
            );


        carModel =
            gltf.scene;



        const box =
            new THREE.Box3()
                .setFromObject(
                    carModel
                );


        const size =
            new THREE.Vector3();


        box.getSize(
            size
        );


        const largest =
            Math.max(

                size.x,
                size.y,
                size.z

            );



        if (
            largest > 0
        ) {

            carModel.scale.setScalar(

                4.9 /
                largest

            );

        }



        const centerBox =
            new THREE.Box3()
                .setFromObject(
                    carModel
                );


        const center =
            new THREE.Vector3();


        centerBox.getCenter(
            center
        );


        carModel.position.x -=
            center.x;


        carModel.position.z -=
            center.z;


        carModel.rotation.y =
            Math.PI / 2;



        const finalBox =
            new THREE.Box3()
                .setFromObject(
                    carModel
                );


        carModel.position.y -=

            finalBox.min.y -
            0.05;



        carModel.traverse(

            child => {


                if (
                    child.isMesh
                ) {


                    child.castShadow =
                        true;


                    child.receiveShadow =
                        true;

                }

            }

        );



        car.add(
            carModel
        );



        car.position.set(

            0,

            terrainHeight(
                0,
                80
            ),

            80

        );



        document.getElementById(
            "loading"
        ).style.display =
            "none";



    }

    catch (
        error
    ) {


        console.error(
            "CAR ERROR:",
            error
        );


        document.getElementById(
            "loading"
        ).textContent =
            "CAR FAILED TO LOAD";

    }

}

    ) {


        if (
            speed <
            MAX_SPEED
        ) {

            speed +=
                ACCELERATION;

        }

    }

    else if (
        braking
    ) {


        if (
            speed > 0.05
        ) {

            speed -=
                BRAKE_POWER;

        }

        else {

            speed -=
                REVERSE_ACCELERATION;

        }

    }

    else {


        if (
            speed > 0
        ) {

            speed -=
                FRICTION;

        }

        else if (
            speed < 0
        ) {

            speed +=
                FRICTION;

        }

    }



    speed =
        THREE.MathUtils.clamp(

            speed,

            -MAX_REVERSE,

            MAX_SPEED

        );



    let targetSteering =
        0;



    if (
        left
    ) {

        targetSteering =
            MAX_STEERING;

    }



    if (
        right
    ) {

        targetSteering =
            -MAX_STEERING;

    }



    steering +=

        (

            targetSteering -
            steering

        )

        *

        STEERING_RESPONSE;



    if (

        Math.abs(speed) >
        0.01

    ) {


        car.rotation.y +=

            steering *

            TURN_RATE *

            (

                speed >= 0
                    ? 1
                    : -1

            );

    }



    const forward =
        new THREE.Vector3(

            0,
            0,
            -1

        );


    forward.applyQuaternion(
        car.quaternion
    );


    car.position.add(

        forward.multiplyScalar(
            speed
        )

    );



    car.position.y =

        terrainHeight(

            car.position.x,
            car.position.z

        );



    const limit =
        WORLD_SIZE / 2 - 80;



    car.position.x =

        THREE.MathUtils.clamp(

            car.position.x,

            -limit,
            limit

        );



    car.position.z =

        THREE.MathUtils.clamp(

            car.position.z,

            -limit,
            limit

        );



    document.getElementById(
        "speed"
    ).textContent =

        Math.round(

            Math.abs(speed) *
            55

        );

}



// ============================================================
// CAMERA
// ============================================================

const cameraTarget =
    new THREE.Vector3();


function updateCamera() {


    if (
        !carModel
    ) {

        return;

    }



    const offset =
        new THREE.Vector3(

            0,
            4.2,
            10.5

        );


    offset.applyQuaternion(
        car.quaternion
    );



    const desired =

        car.position.clone()
            .add(
                offset
            );



    camera.position.lerp(

        desired,

        0.075

    );



    cameraTarget.copy(
        car.position
    );


    cameraTarget.y +=
        1.3;


    camera.lookAt(
        cameraTarget
    );

}



// ============================================================
// DAY / NIGHT
// ============================================================

let night =
    false;


function toggleNight() {


    night =
        !night;



    if (
        night
    ) {


        scene.background =
            new THREE.Color(
                0x07101c
            );


        scene.fog.color =
            new THREE.Color(
                0x07101c
            );


        sun.intensity =
            0.35;


        ambient.intensity =
            0.55;


    }

    else {


        scene.background =
            new THREE.Color(
                0x8bb8d8
            );


        scene.fog.color =
            new THREE.Color(
                0x8bb8d8
            );


        sun.intensity =
            3.0;


        ambient.intensity =
            1.8;

    }

}



// ============================================================
// RESIZE
// ============================================================

window.addEventListener(

    "resize",

    () => {


        camera.aspect =

            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

    }

);



// ============================================================
// GAME LOOP
// ============================================================

function animate() {


    requestAnimationFrame(
        animate
    );


    updateCar();


    updateCamera();


    renderer.render(

        scene,
        camera

    );

}


animate();


</script>
