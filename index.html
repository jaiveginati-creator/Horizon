<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horizon</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        overflow: hidden;
        background: #05070a;
        font-family: Arial, Helvetica, sans-serif;
        color: white;
    }

    canvas {
        display: block;
    }

    #loading {
        position: fixed;
        inset: 0;
        background: #05070a;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.7s ease;
    }

    #loading h1 {
        margin: 0;
        font-size: 48px;
        letter-spacing: 10px;
        font-weight: 300;
    }

    #loading p {
        opacity: 0.55;
        letter-spacing: 3px;
        font-size: 12px;
    }

    .loadBar {
        width: 300px;
        height: 3px;
        background: #222;
        margin-top: 25px;
        overflow: hidden;
    }

    #loadProgress {
        width: 0%;
        height: 100%;
        background: white;
        transition: width 0.2s;
    }

    #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
    }

    #title {
        position: absolute;
        top: 24px;
        left: 28px;
        font-size: 20px;
        letter-spacing: 5px;
        font-weight: 300;
        text-shadow: 0 2px 8px black;
    }

    #controls {
        position: absolute;
        top: 25px;
        right: 28px;
        text-align: right;
        font-size: 11px;
        line-height: 1.7;
        opacity: 0.7;
        letter-spacing: 1px;
    }

    #speedContainer {
        position: absolute;
        right: 28px;
        bottom: 25px;
        text-align: right;
        text-shadow: 0 3px 10px black;
    }

    #speed {
        font-size: 64px;
        font-weight: 200;
        line-height: 0.9;
    }

    #kmh {
        font-size: 12px;
        letter-spacing: 4px;
        opacity: 0.7;
    }

    #gear {
        font-size: 18px;
        margin-top: 10px;
        opacity: 0.8;
    }

    #night {
        position: absolute;
        bottom: 30px;
        left: 30px;
        font-size: 11px;
        letter-spacing: 2px;
        opacity: 0.6;
    }

    #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 3px;
        height: 3px;
        background: rgba(255,255,255,0.45);
        transform: translate(-50%, -50%);
        border-radius: 50%;
    }

    #error {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 200;
        background: #05070a;
        color: white;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
        padding: 30px;
    }

    #error h2 {
        font-weight: 300;
        letter-spacing: 4px;
    }

    #error p {
        opacity: 0.6;
        max-width: 600px;
        line-height: 1.7;
    }
</style>
</head>

<body>

<div id="loading">
    <h1>HORIZON</h1>
    <p>LOADING WORLD</p>

    <div class="loadBar">
        <div id="loadProgress"></div>
    </div>
</div>

<div id="error">
    <h2>HORIZON</h2>
    <p id="errorText">
        Something went wrong while loading the 3D world.
    </p>
</div>

<div id="hud">
    <div id="title">HORIZON</div>

    <div id="controls">
        W / ↑ &nbsp; ACCELERATE<br>
        S / ↓ &nbsp; BRAKE / REVERSE<br>
        A / ← &nbsp; STEER LEFT<br>
        D / → &nbsp; STEER RIGHT<br>
        SPACE &nbsp; BRAKE<br>
        N &nbsp; DAY / NIGHT
    </div>

    <div id="crosshair"></div>

    <div id="night">
        DAY
    </div>

    <div id="speedContainer">
        <div id="speed">0</div>
        <div id="kmh">KM/H</div>
        <div id="gear">P</div>
    </div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* =========================================================
   HORIZON V2.1
   REAL GLB CAR
   ========================================================= */


/* =========================================================
   LOADING
   ========================================================= */

const loading = document.getElementById("loading");
const progressBar = document.getElementById("loadProgress");
const errorScreen = document.getElementById("error");
const errorText = document.getElementById("errorText");

let fakeProgress = 0;

const loadingTimer = setInterval(() => {

    if (fakeProgress < 88) {
        fakeProgress += Math.random() * 3;
        progressBar.style.width = fakeProgress + "%";
    }

}, 100);


/* =========================================================
   SCENE
   ========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x91a9bb);

scene.fog = new THREE.Fog(
    0x91a9bb,
    90,
    650
);


/* =========================================================
   CAMERA
   ========================================================= */

const camera = new THREE.PerspectiveCamera(
    67,
    window.innerWidth / window.innerHeight,
    0.1,
    1800
);

camera.position.set(
    0,
    4.2,
    8.5
);


/* =========================================================
   RENDERER
   ========================================================= */

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

document.body.appendChild(renderer.domElement);


/* =========================================================
   LIGHTING
   ========================================================= */

const hemiLight = new THREE.HemisphereLight(
    0xcfe5ff,
    0x394047,
    1.8
);

scene.add(hemiLight);


const sun = new THREE.DirectionalLight(
    0xffffff,
    3.2
);

sun.position.set(
    150,
    220,
    100
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -250;
sun.shadow.camera.right = 250;
sun.shadow.camera.top = 250;
sun.shadow.camera.bottom = -250;

sun.shadow.camera.near = 1;
sun.shadow.camera.far = 600;

sun.shadow.bias = -0.00015;

scene.add(sun);


/* =========================================================
   WORLD
   ========================================================= */

const groundMaterial = new THREE.MeshStandardMaterial({
    color: 0x4b5353,
    roughness: 0.92,
    metalness: 0
});

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(1400, 1400),
    groundMaterial
);

ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;

scene.add(ground);


/* =========================================================
   ROADS
   ========================================================= */

function createRoad(
    x,
    z,
    width,
    depth
) {

    const material = new THREE.MeshStandardMaterial({
        color: 0x202427,
        roughness: 0.88,
        metalness: 0
    });

    const road = new THREE.Mesh(
        new THREE.BoxGeometry(
            width,
            0.08,
            depth
        ),
        material
    );

    road.position.set(
        x,
        0.03,
        z
    );

    road.receiveShadow = true;

    scene.add(road);
}


/* Main roads */

createRoad(0, 0, 24, 1200);
createRoad(0, 0, 1200, 24);


/* Smaller roads */

for (let i = -5; i <= 5; i++) {

    if (i === 0) continue;

    createRoad(
        i * 80,
        0,
        15,
        1200
    );

    createRoad(
        0,
        i * 80,
        1200,
        15
    );
}


/* =========================================================
   ROAD MARKINGS
   ========================================================= */

const lineMaterial = new THREE.MeshBasicMaterial({
    color: 0xe5dfb5
});

function createRoadLine(
    x,
    y,
    z,
    width,
    depth
) {

    const line = new THREE.Mesh(
        new THREE.PlaneGeometry(
            width,
            depth
        ),
        lineMaterial
    );

    line.rotation.x = -Math.PI / 2;

    line.position.set(
        x,
        y,
        z
    );

    scene.add(line);
}


/* Main vertical road markings */

for (let z = -580; z < 580; z += 12) {

    createRoadLine(
        0,
        0.085,
        z,
        0.18,
        6
    );
}


/* Main horizontal road markings */

for (let x = -580; x < 580; x += 12) {

    createRoadLine(
        x,
        0.086,
        0,
        6,
        0.18
    );
}


/* =========================================================
   SIDEWALKS
   ========================================================= */

const sidewalkMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x777b7b,
        roughness: 0.9
    });


function createSidewalk(
    x,
    z,
    width,
    depth
) {

    const sidewalk = new THREE.Mesh(
        new THREE.BoxGeometry(
            width,
            0.18,
            depth
        ),
        sidewalkMaterial
    );

    sidewalk.position.set(
        x,
        0.09,
        z
    );

    sidewalk.receiveShadow = true;

    scene.add(sidewalk);
}


/* Around main roads */

createSidewalk(
    -14,
    0,
    4,
    1200
);

createSidewalk(
    14,
    0,
    4,
    1200
);

createSidewalk(
    0,
    -14,
    1200,
    4
);

createSidewalk(
    0,
    14,
    1200,
    4
);


/* =========================================================
   BUILDINGS
   ========================================================= */

const buildingMaterials = [

    new THREE.MeshStandardMaterial({
        color: 0x687078,
        roughness: 0.82
    }),

    new THREE.MeshStandardMaterial({
        color: 0x8b9094,
        roughness: 0.8
    }),

    new THREE.MeshStandardMaterial({
        color: 0x565d63,
        roughness: 0.85
    }),

    new THREE.MeshStandardMaterial({
        color: 0x77706a,
        roughness: 0.84
    })
];


function createBuilding(
    x,
    z,
    width,
    depth,
    height,
    materialIndex
) {

    const material =
        buildingMaterials[
            materialIndex %
            buildingMaterials.length
        ];

    const building = new THREE.Mesh(
        new THREE.BoxGeometry(
            width,
            height,
            depth
        ),
        material
    );

    building.position.set(
        x,
        height / 2,
        z
    );

    building.castShadow = true;
    building.receiveShadow = true;

    scene.add(building);


    /* Roof */

    const roof = new THREE.Mesh(
        new THREE.BoxGeometry(
            width + 0.3,
            0.25,
            depth + 0.3
        ),
        new THREE.MeshStandardMaterial({
            color: 0x34383c,
            roughness: 0.9
        })
    );

    roof.position.set(
        x,
        height + 0.12,
        z
    );

    roof.castShadow = true;

    scene.add(roof);
}


/* City blocks */

for (
    let x = -520;
    x <= 520;
    x += 80
) {

    for (
        let z = -520;
        z <= 520;
        z += 80
    ) {

        if (
            Math.abs(x) < 50 &&
            Math.abs(z) < 50
        ) {
            continue;
        }

        const width =
            35 + Math.random() * 18;

        const depth =
            35 + Math.random() * 18;

        const height =
            18 + Math.random() * 75;

        createBuilding(
            x + (Math.random() - 0.5) * 12,
            z + (Math.random() - 0.5) * 12,
            width,
            depth,
            height,
            Math.floor(Math.random() * 4)
        );
    }
}


/* =========================================================
   TREES
   ========================================================= */

function createTree(x, z) {

    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.22,
            0.3,
            3,
            8
        ),
        new THREE.MeshStandardMaterial({
            color: 0x4b3324,
            roughness: 1
        })
    );

    trunk.position.set(
        x,
        1.5,
        z
    );

    trunk.castShadow = true;

    scene.add(trunk);


    const leaves = new THREE.Mesh(
        new THREE.SphereGeometry(
            2.1,
            12,
            10
        ),
        new THREE.MeshStandardMaterial({
            color: 0x314c32,
            roughness: 1
        })
    );

    leaves.position.set(
        x,
        4,
        z
    );

    leaves.castShadow = true;

    scene.add(leaves);
}


for (let i = 0; i < 100; i++) {

    const side =
        Math.random() > 0.5 ? 1 : -1;

    const x =
        (Math.random() * 520 + 30) * side;

    const z =
        (Math.random() * 520 + 30) *
        (Math.random() > 0.5 ? 1 : -1);

    if (
        Math.abs(x) < 25 ||
        Math.abs(z) < 25
    ) {
        continue;
    }

    createTree(x, z);
}


/* =========================================================
   STREET LIGHTS
   ========================================================= */

const streetLights = [];

function createStreetLight(x, z) {

    const group = new THREE.Group();

    const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.08,
            0.11,
            7,
            8
        ),
        new THREE.MeshStandardMaterial({
            color: 0x25292d,
            roughness: 0.6,
            metalness: 0.7
        })
    );

    pole.position.y = 3.5;

    pole.castShadow = true;

    group.add(pole);


    const arm = new THREE.Mesh(
        new THREE.BoxGeometry(
            1.4,
            0.08,
            0.08
        ),
        pole.material
    );

    arm.position.set(
        0.65,
        6.7,
        0
    );

    group.add(arm);


    const bulb = new THREE.Mesh(
        new THREE.SphereGeometry(
            0.16,
            8,
            8
        ),
        new THREE.MeshStandardMaterial({
            color: 0xffffff,
            emissive: 0xffffdd,
            emissiveIntensity: 2
        })
    );

    bulb.position.set(
        1.25,
        6.55,
        0
    );

    group.add(bulb);


    const light = new THREE.PointLight(
        0xffe5b0,
        0,
        20
    );

    light.position.set(
        1.25,
        6.4,
        0
    );

    group.add(light);

    group.position.set(
        x,
        0,
        z
    );

    scene.add(group);

    streetLights.push({
        group,
        light
    });
}


for (
    let z = -520;
    z <= 520;
    z += 60
) {

    createStreetLight(
        -17,
        z
    );

    createStreetLight(
        17,
        z
    );
}


/* =========================================================
   PLAYER CAR
   ========================================================= */

const car = new THREE.Group();

car.position.set(
    0,
    0,
    30
);

scene.add(car);


/* =========================================================
   REAL GLB CAR
   ========================================================= */

const loader = new GLTFLoader();

const CAR_URL =
    "https://cdn.3dassets.dev/assets/32487/v1/model.glb";

let carModel = null;

let frontLeftWheel = null;
let frontRightWheel = null;
let rearLeftWheel = null;
let rearRightWheel = null;

let steeringPivot = null;

let carLoaded = false;


loader.load(

    CAR_URL,

    (gltf) => {

        carModel = gltf.scene;

        /*
         * The model uses +Z as its forward direction.
         * Horizon uses -Z.
         */
        carModel.rotation.y = Math.PI;

        /*
         * Model is already approximately real-world
         * vehicle scale, so we don't need huge scaling.
         */
        carModel.scale.set(
            1,
            1,
            1
        );

        carModel.position.set(
            0,
            0,
            0
        );


        carModel.traverse((object) => {

            if (object.isMesh) {

                object.castShadow = true;
                object.receiveShadow = true;

                if (object.material) {

                    object.material.envMapIntensity =
                        1.5;
                }
            }
        });


        /* Find actual wheel pivots */

        frontLeftWheel =
            carModel.getObjectByName(
                "wheel-front-left"
            );

        frontRightWheel =
            carModel.getObjectByName(
                "wheel-front-right"
            );

        rearLeftWheel =
            carModel.getObjectByName(
                "wheel-rear-left"
            );

        rearRightWheel =
            carModel.getObjectByName(
                "wheel-rear-right"
            );


        steeringPivot =
            carModel.getObjectByName(
                "steering"
            );


        car.add(carModel);

        carLoaded = true;


        /*
         * Remove fake car if any accidentally exists.
         * We are using ONLY the GLB.
         */

        fakeProgress = 100;
        progressBar.style.width = "100%";

        clearInterval(loadingTimer);

        setTimeout(() => {

            loading.style.opacity = "0";

            setTimeout(() => {
                loading.style.display = "none";
            }, 700);

        }, 400);

    },

    (xhr) => {

        if (xhr.total) {

            const percent =
                (xhr.loaded / xhr.total) * 100;

            fakeProgress =
                Math.max(
                    fakeProgress,
                    Math.min(percent, 100)
                );

            progressBar.style.width =
                fakeProgress + "%";
        }

    },

    (error) => {

        console.error(
            "CAR MODEL ERROR:",
            error
        );

        clearInterval(loadingTimer);

        errorScreen.style.display = "flex";

        errorText.innerHTML =
            "The Horizon car model could not be loaded. Refresh the page and try again.";
    }
);


/* =========================================================
   PLAYER PHYSICS
   ========================================================= */

let speed = 0;

let steering = 0;

const maxSpeed = 2.2;

const reverseSpeed = 0.85;

const acceleration = 0.026;

const reverseAcceleration = 0.018;

const braking = 0.075;

const friction = 0.013;

const maxSteering = 0.55;

const steeringResponse = 0.13;

const turnStrength = 0.036;


/* =========================================================
   INPUT
   ========================================================= */

const keys = {};

window.addEventListener(
    "keydown",
    (event) => {

        keys[
            event.key.toLowerCase()
        ] = true;

        if (
            event.key.toLowerCase() === "n"
        ) {
            toggleNight();
        }

    }
);


window.addEventListener(
    "keyup",
    (event) => {

        keys[
            event.key.toLowerCase()
        ] = false;

    }
);


/* =========================================================
   DAY / NIGHT
   ========================================================= */

let nightMode = false;

const nightLabel =
    document.getElementById("night");


function toggleNight() {

    nightMode = !nightMode;

    if (nightMode) {

        scene.background.set(
            0x050913
        );

        scene.fog.color.set(
            0x050913
        );

        hemiLight.intensity = 0.25;

        sun.intensity = 0.15;

        sun.color.set(
            0x7799cc
        );

        streetLights.forEach(
            (lamp) => {

                lamp.light.intensity = 3.2;

            }
        );

        nightLabel.textContent =
            "NIGHT";

    } else {

        scene.background.set(
            0x91a9bb
        );

        scene.fog.color.set(
            0x91a9bb
        );

        hemiLight.intensity = 1.8;

        sun.intensity = 3.2;

        sun.color.set(
            0xffffff
        );

        streetLights.forEach(
            (lamp) => {

                lamp.light.intensity = 0;

            }
        );

        nightLabel.textContent =
            "DAY";
    }
}


/* =========================================================
   WHEEL HELPERS
   ========================================================= */

function steerWheels(amount) {

    const angle =
        amount * maxSteering;


    if (frontLeftWheel) {

        frontLeftWheel.rotation.y =
            angle;
    }


    if (frontRightWheel) {

        frontRightWheel.rotation.y =
            angle;
    }


    /*
     * The steering animation is not played
     * automatically because we're directly
     * controlling the wheel pivots from the
     * driving physics.
     */
}


function rollWheels(distance) {

    const wheels = [

        frontLeftWheel,
        frontRightWheel,
        rearLeftWheel,
        rearRightWheel

    ];


    wheels.forEach(
        (wheel) => {

            if (!wheel) return;

            wheel.rotation.x -=
                distance * 0.7;

        }
    );
}


/* =========================================================
   DRIVING UPDATE
   ========================================================= */

function updateCar() {

    const forward =
        keys["w"] ||
        keys["arrowup"];

    const backward =
        keys["s"] ||
        keys["arrowdown"];

    const left =
        keys["a"] ||
        keys["arrowleft"];

    const right =
        keys["d"] ||
        keys["arrowright"];

    const brake =
        keys[" "];


    /* ACCELERATION */

    if (forward) {

        speed += acceleration;

    } else if (backward) {

        if (speed > 0.05) {

            speed -= braking;

        } else {

            speed -= reverseAcceleration;

        }

    } else {

        /*
         * Natural rolling resistance
         */

        if (speed > 0) {

            speed -= friction;

        } else if (speed < 0) {

            speed += friction;

        }

        if (
            Math.abs(speed) < friction
        ) {
            speed = 0;
        }
    }


    /* BRAKE */

    if (brake) {

        if (speed > 0) {

            speed -= braking;

        } else if (speed < 0) {

            speed += braking;

        }
    }


    /* LIMIT SPEED */

    speed =
        THREE.MathUtils.clamp(
            speed,
            -reverseSpeed,
            maxSpeed
        );


    /* STEERING INPUT */

    let steeringInput = 0;

    if (left) {
        steeringInput -= 1;
    }

    if (right) {
        steeringInput += 1;
    }


    /* SMOOTH STEERING */

    const targetSteering =
        steeringInput * maxSteering;

    steering +=
        (
            targetSteering -
            steering
        ) *
        steeringResponse;


    /*
     * When stopped, return wheels
     * gradually to center.
     */

    if (!left && !right) {

        steering *= 0.86;

    }


    /* WHEEL STEERING */

    steerWheels(
        steering
    );


    /* TURNING */

    const speedFactor =
        Math.min(
            Math.abs(speed) / maxSpeed,
            1
        );


    if (
        Math.abs(speed) > 0.01
    ) {

        const direction =
            speed >= 0
                ? 1
                : -1;


        car.rotation.y +=
            steering *
            turnStrength *
            speedFactor *
            direction;
    }


    /* MOVE FORWARD */

    const movement =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    movement.applyQuaternion(
        car.quaternion
    );

    movement.multiplyScalar(
        speed
    );

    car.position.add(
        movement
    );


    /* WHEEL ROLL */

    rollWheels(
        speed
    );


    /*
     * Keep car above ground.
     */

    car.position.y = 0;
}


/* =========================================================
   TRAFFIC
   ========================================================= */

const traffic = [];


function createTrafficCar(
    x,
    z,
    color,
    direction
) {

    const group =
        new THREE.Group();


    /*
     * Traffic vehicles remain lightweight
     * so the game doesn't become too heavy.
     */

    const bodyMaterial =
        new THREE.MeshStandardMaterial({
            color: color,
            roughness: 0.5,
            metalness: 0.25
        });


    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3.1,
                0.75,
                5.1
            ),
            bodyMaterial
        );

    body.position.y = 0.7;

    body.castShadow = true;

    group.add(body);


    const cabin =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.6,
                0.75,
                2.4
            ),
            new THREE.MeshStandardMaterial({
                color: 0x22262a,
                roughness: 0.3,
                metalness: 0.15
            })
        );

    cabin.position.set(
        0,
        1.25,
        -0.2
    );

    cabin.castShadow = true;

    group.add(cabin);


    group.position.set(
        x,
        0,
        z
    );


    group.rotation.y =
        direction === 1
            ? 0
            : Math.PI;


    scene.add(group);


    traffic.push({

        object: group,

        speed:
            0.6 +
            Math.random() * 0.8,

        direction

    });
}


/* Spawn traffic */

for (

for (

/* =========================================================
   UPDATE TRAFFIC
   ========================================================= */

function updateTraffic() {

    traffic.forEach(
        (vehicle) => {

            if (
                vehicle.horizontal
            ) {

                vehicle.object.position.x +=
                    vehicle.speed;


                if (
                    vehicle.object.position.x >
                    620
                ) {

                    vehicle.object.position.x =
                        -620;

                }

            } else {

                vehicle.object.position.z +=
                    vehicle.speed *
                    vehicle.direction;


                if (
                    vehicle.object.position.z >
                    620
                ) {

                    vehicle.object.position.z =
                        -620;

                }

                if (
                    vehicle.object.position.z <
                    -620
                ) {

                    vehicle.object.position.z =
                        620;

                }

            }

        }
    );
}


/* =========================================================
   CAMERA
   ========================================================= */

const cameraTarget =
    new THREE.Vector3();


function updateCamera() {

    const cameraOffset =
        new THREE.Vector3(
            0,
            3.5,
            8.2
        );


    cameraOffset.applyQuaternion(
        car.quaternion
    );


    const desiredPosition =
        car.position.clone()
            .add(cameraOffset);


    /*
     * Smooth camera movement
     */

    camera.position.lerp(
        desiredPosition,
        0.075
    );


    cameraTarget.copy(
        car.position
    );


    cameraTarget.y += 1.0;


    camera.lookAt(
        cameraTarget
    );


    /*
     * Small speed-based camera movement
     */

    const shake =
        Math.min(
            Math.abs(speed) / maxSpeed,
            1
        ) * 0.025;


    camera.position.y +=
        Math.sin(
            performance.now() * 0.018
        ) * shake;
}


/* =========================================================
   HUD
   ========================================================= */

const speedDisplay =
    document.getElementById(
        "speed"
    );

const gearDisplay =
    document.getElementById(
        "gear"
    );


function updateHUD() {

    const kmh =
        Math.round(
            Math.abs(speed) * 70
        );


    speedDisplay.textContent =
        kmh;


    if (speed > 0.03) {

        gearDisplay.textContent =
            "D";

    } else if (speed < -0.03) {

        gearDisplay.textContent =
            "R";

    } else {

        gearDisplay.textContent =
            "P";
    }
}


/* =========================================================
   COLLISION-LIKE CITY BOUNDARIES
   ========================================================= */

function keepCarInWorld() {

    const limit = 590;

    car.position.x =
        THREE.MathUtils.clamp(
            car.position.x,
            -limit,
            limit
        );

    car.position.z =
        THREE.MathUtils.clamp(
            car.position.z,
            -limit,
            limit
        );
}


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================================================
   ANIMATION
   ========================================================= */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        clock.getDelta();


    updateCar();

    updateTraffic();

    updateCamera();

    updateHUD();

    keepCarInWorld();


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   START
   ========================================================= */

animate();

</script>
