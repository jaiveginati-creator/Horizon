<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HORIZON — Drive Without Limits</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

canvas {
    display: block;
}

/* =========================
   LOADING
========================= */

#loading {
    position: fixed;
    inset: 0;
    background: #08090b;
    color: white;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    transition: opacity 1s;
}

#loading h1 {
    font-size: 72px;
    letter-spacing: 16px;
}

#loading p {
    margin-top: 15px;
    color: #999;
    letter-spacing: 5px;
    font-size: 13px;
}

#loadingBar {
    width: 250px;
    height: 2px;
    background: #333;
    margin-top: 35px;
}

#loadingProgress {
    width: 0%;
    height: 100%;
    background: white;
}

/* =========================
   HUD
========================= */

#hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    color: white;
    z-index: 10;
}

#brand {
    position: absolute;
    top: 25px;
    left: 30px;
}

#brand h2 {
    font-size: 22px;
    letter-spacing: 7px;
}

#brand span {
    font-size: 9px;
    letter-spacing: 3px;
    color: #aaa;
}

#speedContainer {
    position: absolute;
    bottom: 30px;
    right: 35px;
    text-align: right;
}

#speed {
    font-size: 64px;
    font-weight: 300;
}

#unit {
    font-size: 12px;
    color: #aaa;
    letter-spacing: 3px;
}

#gear {
    margin-top: 5px;
    font-size: 15px;
    color: #ccc;
}

#help {
    position: absolute;
    bottom: 30px;
    left: 30px;
    color: #aaa;
    font-size: 12px;
    line-height: 1.8;
}

#status {
    position: absolute;
    top: 30px;
    right: 30px;
    font-size: 10px;
    letter-spacing: 2px;
    color: #aaa;
}

#weather {
    position: absolute;
    top: 55px;
    right: 30px;
    font-size: 10px;
    color: #aaa;
}

#crosshair {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 3px;
    height: 3px;
    background: rgba(255,255,255,.6);
    transform: translate(-50%, -50%);
}
</style>
</head>

<body>

<div id="loading">
    <h1>HORIZON</h1>
    <p>DRIVE WITHOUT LIMITS</p>

    <div id="loadingBar">
        <div id="loadingProgress"></div>
    </div>
</div>

<div id="hud">

    <div id="brand">
        <h2>HORIZON</h2>
        <span>DRIVE WITHOUT LIMITS</span>
    </div>

    <div id="status">
        FREE ROAM
    </div>

    <div id="weather">
        CLEAR · DAY
    </div>

    <div id="crosshair"></div>

    <div id="help">
        W / S — ACCELERATE / BRAKE<br>
        A / D — STEER<br>
        SPACE — HANDBRAKE<br>
        N — NIGHT
    </div>

    <div id="speedContainer">
        <div id="speed">0</div>
        <div id="unit">KM/H</div>
        <div id="gear">P</div>
    </div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =====================================================
   BASIC SETUP
===================================================== */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x87a9c2);

scene.fog =
    new THREE.Fog(
        0x87a9c2,
        100,
        500
    );


const camera =
    new THREE.PerspectiveCamera(
        70,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1500
    );

camera.position.set(
    0,
    4.2,
    8.5
);


const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.15;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   LIGHTING
===================================================== */

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

sun.position.set(
    150,
    200,
    100
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -200;
sun.shadow.camera.right = 200;
sun.shadow.camera.top = 200;
sun.shadow.camera.bottom = -200;

scene.add(sun);


const skyLight =
    new THREE.HemisphereLight(
        0xbfd8ec,
        0x303030,
        1.5
    );

scene.add(skyLight);


/* =====================================================
   GROUND
===================================================== */

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            1200,
            1200
        ),
        new THREE.MeshStandardMaterial({
            color: 0x3b403c,
            roughness: 1
        })
    );

ground.rotation.x =
    -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* =====================================================
   ROADS
===================================================== */

const roadMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x252525,
        roughness: 0.9
    });


function createRoad(
    x,
    z,
    width,
    length,
    rotation = 0
) {

    const road =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                0.12,
                length
            ),
            roadMaterial
        );

    road.position.set(
        x,
        0.05,
        z
    );

    road.rotation.y =
        rotation;

    road.receiveShadow = true;

    scene.add(road);
}


createRoad(
    0,
    0,
    24,
    1200
);

createRoad(
    0,
    0,
    1200,
    24
);


for (
    let x = -300;
    x <= 300;
    x += 80
) {

    createRoad(
        x,
        0,
        12,
        1200
    );
}


for (
    let z = -300;
    z <= 300;
    z += 80
) {

    createRoad(
        0,
        z,
        1200,
        12
    );
}


/* =====================================================
   ROAD MARKINGS
===================================================== */

const lineMaterial =
    new THREE.MeshBasicMaterial({
        color: 0xd8d8b0
    });


function createLine(
    x,
    z,
    width,
    length
) {

    const line =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                0.025,
                length
            ),
            lineMaterial
        );

    line.position.set(
        x,
        0.12,
        z
    );

    scene.add(line);
}


for (
    let z = -580;
    z < 580;
    z += 14
) {

    createLine(
        0,
        z,
        0.25,
        6
    );
}


/* =====================================================
   BUILDINGS
===================================================== */

const buildingMaterials = [

    new THREE.MeshStandardMaterial({
        color: 0x55585c,
        roughness: .8
    }),

    new THREE.MeshStandardMaterial({
        color: 0x6b6863,
        roughness: .8
    }),

    new THREE.MeshStandardMaterial({
        color: 0x41464b,
        roughness: .8
    }),

    new THREE.MeshStandardMaterial({
        color: 0x72706b,
        roughness: .8
    })

];


function createBuilding(
    x,
    z,
    width,
    depth,
    height
) {

    const material =
        buildingMaterials[
            Math.floor(
                Math.random() *
                buildingMaterials.length
            )
        ];


    const building =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            material
        );

    building.position.set(
        x,
        height / 2,
        z
    );

    building.castShadow = true;
    building.receiveShadow = true;

    scene.add(building);


    const roof =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width + .2,
                .15,
                depth + .2
            ),
            new THREE.MeshStandardMaterial({
                color: 0x292929
            })
        );

    roof.position.set(
        x,
        height + .08,
        z
    );

    roof.castShadow = true;

    scene.add(roof);
}


for (
    let x = -320;
    x <= 320;
    x += 80
) {

    for (
        let z = -320;
        z <= 320;
        z += 80
    ) {

        if (
            Math.abs(x) < 20 ||
            Math.abs(z) < 20
        ) continue;


        const height =
            12 +
            Math.random() * 45;

        const width =
            25 +
            Math.random() * 20;

        const depth =
            25 +
            Math.random() * 20;


        createBuilding(
            x +
            (Math.random() * 15 - 7),

            z +
            (Math.random() * 15 - 7),

            width,
            depth,
            height
        );
    }
}


/* =====================================================
   STREET LIGHTS
===================================================== */

function createStreetLight(
    x,
    z
) {

    const pole =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .08,
                .08,
                6
            ),
            new THREE.MeshStandardMaterial({
                color: 0x202020
            })
        );

    pole.position.set(
        x,
        3,
        z
    );

    pole.castShadow = true;

    scene.add(pole);


    const lamp =
        new THREE.PointLight(
            0xffe8bd,
            0,
            20
        );

    lamp.position.set(
        x,
        6,
        z
    );

    scene.add(lamp);

    pole.userData.lamp =
        lamp;
}


for (
    let x = -300;
    x <= 300;
    x += 40
) {

    createStreetLight(
        x,
        9
    );

    createStreetLight(

        -9
    );
}


/* =====================================================
   HORIZON V2 — SPORTS CAR
===================================================== */

const car =
    new THREE.Group();

scene.add(car);

car.position.set(
    0,
    0.55,

);


/* =====================================================
   MATERIALS
===================================================== */

const paint =
    new THREE.MeshPhysicalMaterial({
        color: 0x9b111e,
        metalness: 0.85,
        roughness: 0.18,
        clearcoat: 1,
        clearcoatRoughness: 0.08
    });


const darkPaint =
    new THREE.MeshStandardMaterial({
        color: 0x08090a,
        metalness: 0.7,
        roughness: 0.2
    });


const glass =
    new THREE.MeshPhysicalMaterial({
        color: 0x101820,
        metalness: 0.15,
        roughness: 0.08,
        transmission: 0.05,
        transparent: true,
        opacity: 0.78
    });


const tireMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x070707,
        roughness: 0.85
    });


const rimMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x8c8c8c,
        metalness: 0.9,
        roughness: 0.18
    });


const headlightMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0xffffff,
        emissiveIntensity: 3
    });


const tailMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x330000,
        emissive: 0xff0000,
        emissiveIntensity: 2
    });


/* =====================================================
   MAIN LOWER BODY
===================================================== */

const body =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            2.35,
            0.52,
            4.55
        ),
        paint
    );

body.position.y = 0;

body.castShadow = true;

car.add(body);


/* =====================================================
   FRONT NOSE
===================================================== */

const nose =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            2.18,
            0.34,
            1.05
        ),
        paint
    );

nose.position.set(
    0,
    -0.02,
    -2.25
);

nose.scale.x = 0.95;

nose.castShadow = true;

car.add(nose);


/* =====================================================
   HOOD
===================================================== */

const hood =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            2.05,
            0.16,
            1.55
        ),
        paint
    );

hood.position.set(
    0,
    0.29,
    -1.45
);

hood.rotation.x =
    -0.035;

hood.castShadow = true;

car.add(hood);


/* =====================================================
   CABIN
===================================================== */

const cabin =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.78,
            0.7,
            2.05
        ),
        darkPaint
    );

cabin.position.set(
    0,
    0.56,
    0.05
);

cabin.castShadow = true;

car.add(cabin);


/* =====================================================
   WINDSHIELD
===================================================== */

const windshield =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.58,
            0.52,
            0.08
        ),
        glass
    );

windshield.position.set(
    0,
    0.72,
    -0.87
);

windshield.rotation.x =
    -0.25;

car.add(windshield);


/* =====================================================
   REAR WINDOW
===================================================== */

const rearWindow =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.58,
            0.48,
            0.08
        ),
        glass
    );

rearWindow.position.set(
    0,
    0.72,
    0.95
);

rearWindow.rotation.x =
    0.25;

car.add(rearWindow);

   SIDE WINDOWS
===================================================== */

        new THREE.Mesh(
            new THREE.BoxGeometry(

            ),

        );

        0.72,

}


createSideWindow(-0.9);
createSideWindow(0.9);


/* =====================================================
   SIDE SKIRTS
===================================================== */

function createSideSkirt(

) {

        new THREE.Mesh(
            new THREE.BoxGeometry(

                3.4
            ),
            darkPaint
        );

    skirt.position.set(
        x,
        -0.23,
        0
    );

    car.add(skirt);
}


createSideSkirt(-1.17);
createSideSkirt(1.17);


/* =====================================================
   FRONT SPLITTER
===================================================== */

const splitter =

        new THREE.BoxGeometry(
            2.25,

        ),

    );

splitter.position.set(
    0,
    -0.27,
    -2.28
);

car.add(splitter);


/* =====================================================
   REAR DIFFUSER
===================================================== */

const diffuser =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            2.1,
            0.14,

        ),

    );

diffuser.position.set(

);

car.add(diffuser);

function createHeadlight(

        new THREE.Mesh(

            ),

createHeadlight(-0.72);
createHeadlight(0.72);


/* =====================================================
   TAILLIGHTS
===================================================== */

function createTaillight(

) {

    const light =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.7,

createTaillight(-0.72);

   SIDE MIRRORS
===================================================== */

function createMirror(

) {

    const mirror =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.18,

/* =====================================================
   SPOILER
===================================================== */

const spoilerWing =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.8,
            0.1,

        ),

    );

spoilerWing.position.set(
    0,
    0.88,
    1.95
);

car.add(spoilerWing);


function createSpoilerSupport(

) {

    const support =
        new THREE.Mesh(
            new THREE.BoxGeometry(

                0.08
            ),
            darkPaint
        );

    support.position.set(

        0.68,
        1.95
    );

    car.add(support);
}

createSpoilerSupport(0.65);


/* =====================================================
   WHEELS
===================================================== */

const wheels = [];

const frontWheels = [];


function createWheel(
    x,
    z,
    isFront
) {

    const wheelGroup =
        new THREE.Group();

    wheelGroup.position.set(
        x,
        -0.28,
        z
    );

    car.add(wheelGroup);


    const tire =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.46,
                0.46,
                0.32,
                32
            ),
            tireMaterial
        );

    tire.rotation.z =
        Math.PI / 2;

    tire.castShadow = true;

    wheelGroup.add(tire);


    const rim =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.27,
                0.27,
                0.34,
                20
            ),
            rimMaterial
        );

    rim.rotation.z =
        Math.PI / 2;

    wheelGroup.add(rim);


    const hub =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.09,
                0.09,
                0.36,
                16
            ),
            darkPaint
        );

    hub.rotation.z =
        Math.PI / 2;

    wheelGroup.add(hub);


    wheels.push({
        group: wheelGroup,
        tire: tire,
        rim: rim
    });


    if (isFront) {
        frontWheels.push(
            wheelGroup
        );
    }
}


/* Front */

createWheel(
    -1.18,
    -1.48,
    true
);

createWheel(
    1.18,
    -1.48,
    true
);


/* Rear */

createWheel(
    -1.18,
    1.48,

);

createWheel(
    1.18,

    false
);

   TRAFFIC
===================================================== */

const traffic = [];


function createTrafficCar(
    x,
    z,
    color
) {

    const vehicle =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.8,
                0.55,
                4
            ),

            })

    vehicle.position.set(

const trafficColors = [
    0xffffff,
    0x111111,
    0x243b55,
    0xaaaaaa,
    0x8b2525,
    0xc2a84c
];


for (
    let i = 0;
    i < 20;
    i++
) {

    createTrafficCar(
        -6,
        -300 +
        Math.random() * 600,

        trafficColors[
            Math.floor(
                Math.random() *
                trafficColors.length
            )
        ]
    );
}


/* =====================================================
   INPUT
===================================================== */

const keys = {};

let nightMode = false;


window.addEventListener(
    "keydown",
    e => {

        keys[
            e.key.toLowerCase()
        ] = true;


        if (
            e.key.toLowerCase() === "n"
        ) {

            nightMode =
                !nightMode;

            updateLighting();
        }

    }
);


window.addEventListener(
    "keyup",
    e => {

        keys[
            e.key.toLowerCase()
        ] = false;

    }
);


/* =====================================================
   DRIVING PHYSICS
===================================================== */

let speed = 0;

let steering = 0;


const maxSpeed = 1.8;

const maxReverseSpeed = 0.65;

const acceleration = 0.025;

const reverseAcceleration = 0.018;

const braking = 0.055;

const friction = 0.012;

const maxSteering = 0.55;

const steeringResponse = 0.12;

const turnStrength = 0.035;


/* =====================================================
   CAR UPDATE
===================================================== */

function updateCar() {

    const accelerating =
        keys["w"] ||
        keys["arrowup"];


    const brakingInput =
        keys["s"] ||
        keys["arrowdown"];


    const left =
        keys["a"] ||
        keys["arrowleft"];


    const right =
        keys["d"] ||
        keys["arrowright"];


    /* Acceleration */

    if (accelerating) {

        if (speed < 0) {

            speed += braking;

        } else {

            speed += acceleration;

        }

    }

    else if (brakingInput) {

        if (speed > 0) {

            speed -= braking;

        } else {

            speed -=
                reverseAcceleration;

        }

    }

    else {

        if (speed > 0) {

            speed -= friction;

        }

        else if (speed < 0) {

            speed += friction;

        }

    }


    /* Handbrake */

    if (keys[" "]) {

        speed *= 0.94;

    }


    /* Clamp */

    speed =
        THREE.MathUtils.clamp(
            speed,
            -maxReverseSpeed,
            maxSpeed
        );


    /* Steering */

    let targetSteering = 0;


    if (left) {

        targetSteering = 1;

    }


    if (right) {

        targetSteering = -1;

    }


    steering +=
        (
            targetSteering -
            steering
        ) *
        steeringResponse;


    /* Front wheels turn */

    const wheelAngle =
        steering *
        maxSteering;


    frontWheels.forEach(
        wheel => {

            wheel.rotation.y =
                wheelAngle;

        }
    );


    /* Car rotation */

    const speedFactor =
        Math.min(
            Math.abs(speed) /
            maxSpeed,
            1
        );


    const direction =
        speed >= 0
            ? 1
            : -1;


    car.rotation.y +=
        steering *
        turnStrength *
        speedFactor *
        direction;


    /* Movement */

    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    forward.applyQuaternion(
        car.quaternion
    );


    car.position.addScaledVector(
        forward,
        speed
    );


    /* Suspension */

    const suspension =
        Math.sin(
            performance.now() *
            0.012
        ) *
        Math.min(
            Math.abs(speed) *
            0.012,
            0.025
        );


    body.position.y =
        suspension;


    /* Wheel rotation */

    wheels.forEach(
        wheel => {

            wheel.tire.rotation.x -=
                speed * 2.8;

            wheel.rim.rotation.x -=
                speed * 2.8;

            wheel.group.position.y =
                -0.28 +
                suspension * 0.4;

        }
    );

}


/* =====================================================
   CAMERA
===================================================== */

function updateCamera() {

    const offset =
        new THREE.Vector3(
            0,
            4.4,
            8.8
        );


    offset.applyQuaternion(
        car.quaternion
    );


    const target =
        car.position
            .clone()
            .add(offset);


    camera.position.lerp(
        target,
        0.08
    );


    const lookAt =
        car.position
            .clone();


    lookAt.y += 0.8;


    camera.lookAt(
        lookAt
    );

}


/* =====================================================
   TRAFFIC
===================================================== */

function updateTraffic() {

    traffic.forEach(
        vehicle => {

            vehicle.mesh.position.z +=
                vehicle.speed;


            if (
                vehicle.mesh.position.z >
                600
            ) {

                vehicle.mesh.position.z =
                    -600;

            }

        }
    );

}


/* =====================================================
   DAY / NIGHT
===================================================== */

function updateLighting() {

    if (nightMode) {

        scene.background =
            new THREE.Color(
                0x050914
            );

        scene.fog.color =
            new THREE.Color(
                0x050914
            );

        sun.intensity =
            0.25;

        skyLight.intensity =
            0.35;


        document.getElementById(
            "weather"
        ).textContent =
            "CLEAR · NIGHT";


        scene.traverse(
            object => {

                if (
                    object.userData &&
                    object.userData.lamp
                ) {

                    object.userData
                        .lamp
                        .intensity = 2;

                }

            }
        );

    }

    else {

        scene.background =
            new THREE.Color(
                0x87a9c2
            );

        scene.fog.color =
            new THREE.Color(
                0x87a9c2
            );

        sun.intensity =
            3;

        skyLight.intensity =
            1.5;


        document.getElementById(
            "weather"
        ).textContent =
            "CLEAR · DAY";


        scene.traverse(
            object => {

                if (
                    object.userData &&
                    object.userData.lamp
                ) {

                    object.userData
                        .lamp
                        .intensity = 0;

                }

            }
        );

    }

}


/* =====================================================
   HUD
===================================================== */

function updateHUD() {

    const kmh =
        Math.round(
            Math.abs(speed) *
            70
        );


    document.getElementById(
        "speed"
    ).textContent =
        kmh;


    let gear = "N";


    if (speed > 0.05)
        gear = "D";


    if (speed < -0.05)
        gear = "R";


    if (
        Math.abs(speed) < 0.02
    )
        gear = "P";


    document.getElementById(
        "gear"
    ).textContent =
        gear;

}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =====================================================
   GAME LOOP
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    updateCar();

    updateCamera();

    updateTraffic();

    updateHUD();


    renderer.render(
        scene,
        camera
    );

}


/* =====================================================
   LOADING
===================================================== */

let progress = 0;


const loadingInterval =
    setInterval(
        () => {

            progress += 5;


            document.getElementById(
                "loadingProgress"
            ).style.width =
                progress + "%";


            if (
                progress >= 100
            ) {

                clearInterval(
                    loadingInterval
                );


                setTimeout(
                    () => {

                        const loading =
                            document.getElementById(
                                "loading"
                            );


                        loading.style.opacity =
                            "0";


                        setTimeout(
                            () => {

                                loading.style.display =
                                    "none";

                            },
                            1000
                        );

                    },
                    300
                );

            }

        },
        60
    );


/* Start */

animate();

</script>

</body>
</html>
