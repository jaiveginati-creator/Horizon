import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";


// ============================================================
// BASIC SETUP
// ============================================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x8bb8d8);

scene.fog = new THREE.Fog(
    0x8bb8d8,
    500,
    1900
);


const camera = new THREE.PerspectiveCamera(
    65,
    window.innerWidth / window.innerHeight,
    0.1,
    3000
);

camera.position.set(0, 5, 12);


const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 1.7)
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

document.body.appendChild(renderer.domElement);


// ============================================================
// LOADERS
// ============================================================

const loader = new GLTFLoader();

const dracoLoader = new DRACOLoader();

dracoLoader.setDecoderPath(
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/draco/"
);

loader.setDRACOLoader(dracoLoader);
loader.setMeshoptDecoder(MeshoptDecoder);


// ============================================================
// WORLD SETTINGS
// ============================================================

const WORLD_SIZE = 2400;


// ============================================================
// TERRAIN
// ============================================================

function terrainHeight(x, z) {

    const hills =
        Math.sin(x * 0.008) * 3 +
        Math.cos(z * 0.006) * 4 +
        Math.sin((x + z) * 0.012) * 2;

    const smallerHills =
        Math.sin(x * 0.022 + z * 0.013) * 0.8 +
        Math.cos(z * 0.018) * 0.7;

    // Flatten central city
    const cityFlatten =
        Math.exp(
            -(x * x + z * z) / 180000
        );

    return (
        (hills + smallerHills) *
        (1 - cityFlatten * 0.85)
    );
}


function createTerrain() {

    const geometry = new THREE.PlaneGeometry(
        WORLD_SIZE,
        WORLD_SIZE,
        140,
        140
    );

    geometry.rotateX(-Math.PI / 2);

    const position =
        geometry.attributes.position;

    for (
        let i = 0;
        i < position.count;
        i++
    ) {

        const x = position.getX(i);
        const z = position.getZ(i);

        position.setY(
            i,
            terrainHeight(x, z)
        );
    }

    geometry.computeVertexNormals();

    const material =
        new THREE.MeshStandardMaterial({
            color: 0x405b3d,
            roughness: 1
        });

    const terrain =
        new THREE.Mesh(
            geometry,
            material
        );

    terrain.receiveShadow = true;

    scene.add(terrain);
}

createTerrain();


// ============================================================
// ROADS
// ============================================================

function createRoad(
    x,
    z,
    width,
    length,
    rotation = 0
) {

    const segments = Math.max(
        20,
        Math.floor(length / 10)
    );

    const geometry =
        new THREE.PlaneGeometry(
            width,
            length,
            1,
            segments
        );

    geometry.rotateX(-Math.PI / 2);

    const position =
        geometry.attributes.position;

    const cos = Math.cos(rotation);
    const sin = Math.sin(rotation);

    for (
        let i = 0;
        i < position.count;
        i++
    ) {

        const localX =
            position.getX(i);

        const localZ =
            position.getZ(i);

        // Rotate local road coordinates
        const worldX =
            x +
            localX * cos -
            localZ * sin;

        const worldZ =
            z +
            localX * sin +
            localZ * cos;

        // Store relative coordinates
        position.setX(
            i,
            worldX - x
        );

        position.setZ(
            i,
            worldZ - z
        );

        position.setY(
            i,
            terrainHeight(
                worldX,
                worldZ
            ) + 0.13
        );
    }

    geometry.computeVertexNormals();

    const material =
        new THREE.MeshStandardMaterial({
            color: 0x202124,
            roughness: 0.92
        });

    const road =
        new THREE.Mesh(
            geometry,
            material
        );

    road.position.set(
        x,
        0,
        z
    );

    road.receiveShadow = true;

    scene.add(road);

    createRoadMarkings(
        x,
        z,
        width,
        length,
        rotation
    );
}


// ============================================================
// ROAD MARKINGS
// ============================================================

function roadPoint(
    x,
    z,
    distance,
    rotation
) {

    return {
        x:
            x +
            Math.sin(rotation) * distance,

        z:
            z +
            Math.cos(rotation) * distance
    };
}


function createRoadMarkings(
    x,
    z,
    width,
    length,
    rotation
) {

    const cos = Math.cos(rotation);
    const sin = Math.sin(rotation);

    // Center dashes
    for (
        let d = -length / 2 + 12;
        d < length / 2;
        d += 22
    ) {

        const p =
            roadPoint(
                x,
                z,
                d,
                rotation
            );

        const y =
            terrainHeight(
                p.x,
                p.z
            ) + 0.22;

        const geometry =
            new THREE.BoxGeometry(
                0.32,
                0.035,
                9
            );

        const material =
            new THREE.MeshStandardMaterial({
                color: 0xe8dfb4,
                roughness: 0.8
            });

        const dash =
            new THREE.Mesh(
                geometry,
                material
            );

        dash.position.set(
            p.x,
            y,
            p.z
        );

        dash.rotation.y =
            rotation;

        scene.add(dash);
    }

    // Road edges
    const edgeOffset =
        width / 2 - 0.7;

    for (
        const side of [-1, 1]
    ) {

        for (
            let d = -length / 2;
            d < length / 2;
            d += 12
        ) {

            const p =
                roadPoint(
                    x,
                    z,
                    d,
                    rotation
                );

            const px =
                p.x +
                Math.cos(rotation) *
                edgeOffset *
                side;

            const pz =
                p.z -
                Math.sin(rotation) *
                edgeOffset *
                side;

            const y =
                terrainHeight(
                    px,
                    pz
                ) + 0.19;

            const geometry =
                new THREE.BoxGeometry(
                    0.28,
                    0.025,
                    10
                );

            const material =
                new THREE.MeshStandardMaterial({
                    color: 0xc7c7c7,
                    roughness: 0.9
                });

            const edge =
                new THREE.Mesh(
                    geometry,
                    material
                );

            edge.position.set(
                px,
                y,
                pz
            );

            edge.rotation.y =
                rotation;

            scene.add(edge);
        }
    }
}

// ============================================================
// BUILDINGS
// ============================================================

const buildingFiles = [

    "assets/buildings/large-building.glb",
    "assets/buildings/store.glb",
    "assets/buildings/apartment.glb",
    "assets/buildings/large-building-2.glb",
    "assets/buildings/bank.glb"

];


const buildingTemplates = [];


async function loadBuildings() {

    for (
        const file of buildingFiles
    ) {

        try {

            const gltf =
                await loader.loadAsync(file);

            const model =
                gltf.scene;

            // Scale model to sensible size
            const box =
                new THREE.Box3()
                    .setFromObject(model);

            const size =
                new THREE.Vector3();

            box.getSize(size);

            const largest =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );

            if (largest > 0) {

                const targetSize =
                    32;

                const scale =
                    targetSize /
                    largest;

                model.scale.setScalar(
                    scale
                );
            }

            // Put bottom at y = 0
            const finalBox =
                new THREE.Box3()
                    .setFromObject(model);

            model.position.y -=
                finalBox.min.y;

            model.traverse(
                child => {

                    if (
                        child.isMesh
                    ) {

                        child.castShadow =
                            true;

                        child.receiveShadow =
                            true;

                        if (
                            child.material
                        ) {

                            child.material.roughness =
                                0.8;
                        }
                    }
                }
            );

            buildingTemplates.push(
                model
            );

        } catch (error) {

            console.warn(
                "Building could not load:",
                file
            );
        }
    }

    generateCityBuildings();
}


function generateCityBuildings() {

    if (
        buildingTemplates.length === 0
    ) {

        console.warn(
            "No building models found."
        );

        return;
    }


    const occupied = [];


    function tooClose(
        x,
        z
    ) {

        for (
            const p of occupied
        ) {

            const dx =
                x - p.x;

            const dz =
                z - p.z;

            if (
                Math.sqrt(
                    dx * dx +
                    dz * dz
                ) < 38
            ) {

                return true;
            }
        }

        return false;
    }


    // Large city grid
    for (
        let x = -470;
        x <= 470;
        x += 70
    ) {

        for (
            let z = -470;
            z <= 470;
            z += 70
        ) {

            // Keep roads clear
            const nearMainRoad =
                Math.abs(x) < 24 ||
                Math.abs(z) < 24;

            const nearMajorRoad =
                Math.abs(x - 330) < 18 ||
                Math.abs(x + 330) < 18 ||
                Math.abs(z - 360) < 18 ||
                Math.abs(z + 360) < 18;

            if (
                nearMainRoad ||
                nearMajorRoad
            ) {

                continue;
            }

            // Random empty spaces
            if (
                Math.random() < 0.18
            ) {

                continue;
            }

            const bx =
                x +
                (Math.random() - 0.5) *
                22;

            const bz =
                z +
                (Math.random() - 0.5) *
                22;

            if (
                tooClose(
                    bx,
                    bz
                )
            ) {

                continue;
            }

            const template =
                buildingTemplates[
                    Math.floor(
                        Math.random() *
                        buildingTemplates.length
                    )
                ];

            const building =
                template.clone(true);

            const scale =
                0.65 +
                Math.random() * 0.7;

            building.scale.multiplyScalar(
                scale
            );

            building.rotation.y =
                Math.random() *
                Math.PI *
                2;

            building.position.set(
                bx,
                terrainHeight(
                    bx,
                    bz
                ),
                bz
            );

            building.traverse(
                child => {

                    if (
                        child.isMesh
                    ) {

                        child.castShadow =
                            true;

                        child.receiveShadow =
                            true;
                    }
                }
            );

            scene.add(building);

            occupied.push({
                x: bx,
                z: bz
            });
        }
    }
}


// Start loading buildings
loadBuildings();


// ============================================================
// TREES
// ============================================================

function createTree(
    x,
    z,
    scale = 1
) {

    const group =
        new THREE.Group();


    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.35 * scale,
                0.5 * scale,
                4 * scale,
                8
            ),
            new THREE.MeshStandardMaterial({
                color: 0x5a3b27
            })
        );

    trunk.position.y =
        2 * scale;

    trunk.castShadow = true;

    group.add(trunk);


    const crown =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                2.4 * scale,
                8,
                8
            ),
            new THREE.MeshStandardMaterial({
                color: 0x315d35,
                roughness: 1
            })
        );

    crown.position.y =
        5 * scale;

    crown.castShadow = true;

    group.add(crown);


    group.position.set(
        x,
        terrainHeight(x, z),
        z
    );

    scene.add(group);
}


for (
    let i = 0;
    i < 450;
    i++
) {

    const x =
        (Math.random() - 0.5) *
        2100;

    const z =
        (Math.random() - 0.5) *
        2100;

    // Keep trees mostly outside city
    if (
        Math.abs(x) < 520 &&
        Math.abs(z) < 520
    ) {

        continue;
    }

    const scale =
        0.7 +
        Math.random() * 1.2;

    createTree(
        x,
        z,
        scale
    );
}


// ============================================================
// MOUNTAINS
// ============================================================

function createMountain(
    x,
    z,
    radius,
    height
) {

    const geometry =
        new THREE.ConeGeometry(
            radius,
            height,
            8
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: 0x4a5750,
            roughness: 1
        });

    const mountain =
        new THREE.Mesh(
            geometry,
            material
        );

    mountain.position.set(
        x,
        terrainHeight(x, z) +
        height / 2,
        z
    );

    mountain.castShadow = true;
    mountain.receiveShadow = true;

    scene.add(mountain);
}


for (
    let i = 0;
    i < 25;

) {

    const angle =

    const distance =

    const x =
        Math.cos(angle) *
        distance;

    const z =
        Math.sin(angle) *
        distance;

    createMountain(
        x,
        z,
        100 +
        Math.random() * 100,
        130 +
        Math.random() * 180
    );
}

// ============================================================
// CAR
// ============================================================

const car =
    new THREE.Group();

scene.add(car);


let carModel = null;


const CAR_FILE =
    "https://jaiveginati-creator.github.io/Horizon/electric-car.glb";


async function loadCar() {

    try {

        const gltf =
            await loader.loadAsync(
                CAR_FILE
            );

        carModel =
            gltf.scene;


        // Scale car
        const box =
            new THREE.Box3()
                .setFromObject(
                    carModel
                );

        const size =
            new THREE.Vector3();

        box.getSize(size);

        const largest =
            Math.max(
                size.x,
                size.y,
                size.z
            );

        if (
            largest > 0
        ) {

            carModel.scale.setScalar(
                4.9 / largest
            );
        }


        // Center X/Z
        const centerBox =
            new THREE.Box3()
                .setFromObject(
                    carModel
                );

        const center =
            new THREE.Vector3();

        centerBox.getCenter(
            center
        );

        carModel.position.x -=
            center.x;

        carModel.position.z -=
            center.z;


        // IMPORTANT:
        // Rotate BEFORE calculating final
        // vertical bounding box.
        carModel.rotation.y =
            Math.PI / 2;


        // Put wheels/model bottom on ground
        const finalBox =
            new THREE.Box3()
                .setFromObject(
                    carModel
                );

        carModel.position.y -=
            finalBox.min.y - 0.05;


        carModel.traverse(
            child => {

                if (
                    child.isMesh
                ) {

                    child.castShadow =
                        true;

                    child.receiveShadow =
                        true;
                }
            }
        );


        car.add(carModel);


        // Starting position
        car.position.set(
            0,
            terrainHeight(
                0,
                80
            ),
            80
        );


        document.getElementById(
            "loading"
        ).style.display = "none";


    } catch (error) {

        console.error(
            "CAR LOAD ERROR:",
            error
        );

        document.getElementById(
            "loading"
        ).textContent =
            "CAR FAILED TO LOAD";

    }
}


loadCar();

    0.006;

const MAX_STEERING =
    0.55;

const STEERING_RESPONSE =
    0.14;

const TURN_RATE =
    0.035;


let speed = 0;

let steering =
    0;


// ============================================================
// DAY / NIGHT
// ============================================================

let night = false;


function toggleNight() {

    night = !night;

    if (night) {

        scene.background =
            new THREE.Color(
                0x07101c
            );

        scene.fog.color =
            new THREE.Color(
                0x07101c
            );

        sun.intensity =
            0.35;

        ambient.intensity =
            0.55;

    } else {

        scene.background =
            new THREE.Color(
                0x8bb8d8
            );

        scene.fog.color =
            new THREE.Color(
                0x8bb8d8
            );

        sun.intensity =
            3.0;

        ambient.intensity =
            1.8;
    }
}


// ============================================================
// DRIVING UPDATE
// ============================================================

function updateCar() {

    if (!carModel)
        return;


    const accelerating =
        keys["w"] ||
        keys["arrowup"];

    const braking =
        keys["s"] ||
        keys["arrowdown"];

    const left =
        keys["a"] ||
        keys["arrowleft"];

    const right =
        keys["d"] ||
        keys["arrowright"];


    // ACCELERATION
    if (accelerating) {

        if (speed < MAX_SPEED) {

            speed +=
                ACCELERATION;
        }

    }


    // REVERSE
    else if (braking) {

        if (speed > 0.05) {

            speed -=
                BRAKE_POWER;

        } else {

            speed -=
                REVERSE_ACCELERATION;

        }

    }


    // FRICTION
    else {

        if (speed > 0) {

            speed -=
                FRICTION;

        } else if (speed < 0) {

            speed +=
                FRICTION;
        }
    }


    // Clamp speed
    speed =
        THREE.MathUtils.clamp(
            speed,
            -MAX_REVERSE,
            MAX_SPEED
        );


    // Steering
    let targetSteering = 0;

    if (left)
        targetSteering =
            MAX_STEERING;

    if (right)
        targetSteering =
            -MAX_STEERING;


    steering +=
        (
            targetSteering -
            steering
        ) *
        STEERING_RESPONSE;


    // Turn only when moving
    if (
        Math.abs(speed) > 0.01
    ) {

        car.rotation.y +=
            steering *
            TURN_RATE *
            (speed >= 0 ? 1 : -1);
    }


    // Forward direction
    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    forward.applyQuaternion(
        car.quaternion
    );


    car.position.add(
        forward.multiplyScalar(
            speed
        )
    );


    // Keep car above terrain
    const groundY =
        terrainHeight(
            car.position.x,
            car.position.z
        );

    car.position.y =
        groundY;


    // World boundary
    const limit =
        WORLD_SIZE / 2 - 80;

    car.position.x =
        THREE.MathUtils.clamp(
            car.position.x,
            -limit,
            limit
        );

    car.position.z =
        THREE.MathUtils.clamp(
            car.position.z,
            -limit,
            limit
        );


    // Speed UI
    document.getElementById(
        "speed"
    ).textContent =
        Math.round(
            Math.abs(speed) * 55
        );
}


// ============================================================
// CAMERA
// ============================================================

const cameraTarget =
    new THREE.Vector3();


function updateCamera() {

    if (!carModel)
        return;


    const desiredOffset =
        new THREE.Vector3(
            0,
            4.2,
            10.5
        );


    desiredOffset.applyQuaternion(
        car.quaternion
    );


    const desiredPosition =
        car.position.clone()
            .add(
                desiredOffset
            );


    camera.position.lerp(
        desiredPosition,
        0.075
    );


    cameraTarget.copy(
        car.position
    );

    cameraTarget.y += 1.3;


    camera.lookAt(
        cameraTarget
    );
}


// ============================================================
// RESIZE
// ============================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


// ============================================================
// GAME LOOP
// ============================================================

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );

    clock.getDelta();

    updateCar();

    updateCamera();

    renderer.render(
        scene,
        camera
    );
}


animate();

</script>

</body>
</html>
